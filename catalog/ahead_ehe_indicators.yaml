years: {start: 2017, end: 2026}
geography: [state, county]
shape: estimate_table
grain: "One row is one state (State totals sheet) or one Ending the HIV Epidemic county or jurisdiction (Jurisdiction totals sheet), one year and one of the six EHE indicators (diagnoses, incidence, knowledge of status, linkage to care, viral suppression, PrEP coverage), with its count, rate or percentage, the denominator AHEAD names for it, and the 95% interval and relative standard error where AHEAD publishes them. All ages 13 and over (16 and over for PrEP), all sexes and races combined; AHEAD's stratified sheets are not read."
