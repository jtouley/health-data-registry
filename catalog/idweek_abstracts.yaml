  - year: 2025
    issn: 2328-8957
    volume: '13'
    issue: Supplement_1
    doi_prefix: 10.1093/ofid/ofaf695.
    from_pub_date: '2026-01-01'
    until_pub_date: '2026-01-31'
    verified: true
    evidence: 'Crossref, read 24 Nov 2026: OFID volume 13, issue Supplement_1 (published January 2026) holds 2,368
      works, all under 10.1093/ofid/ofaf695.*, each title starting with an IDWeek abstract or poster number (e.g.
      568., P-1589.), all CC BY 4.0 with abstract text. Every one has a January 2026 publication date, so the
      window is that month (2,391 OFID works in it). That this supplement is IDWeek 2025 is inferred from its timing and titles
      and is an open question until the maintainer confirms it on OUP''s issue page.'
  enrich_hosts:
  - api.openalex.org
  - www.ebi.ac.uk
codebook_url: https://www.crossref.org/documentation/retrieve-metadata/rest-api/
caveats:
- An abstract is not a peer-reviewed paper; many are never published in full.
- 'Metadata comes from Crossref, OpenAlex and Europe PMC, not the conference: a year holds the abstracts the journal
  supplement published under one DOI each.'
- Abstract text is kept only where its licence is Creative Commons; otherwise read the abstract at its DOI link.
- Condition, design, data-source and geography tags come from fixed word rules over the title and text, not from
  a model; a missing tag doesn't mean the topic is absent.
- Kept in this source's private store only, until the maintainer confirms which parts may be redistributed; never
  in a public release.
