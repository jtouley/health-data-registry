caveats:
  - "Figures are for the ABCs surveillance areas, a catchment of selected counties in some states. They are not figures for the United States and are not keyed to any GBD location."
  - "The surveillance areas, the laboratory isolate collection areas and the methods have changed over time, and the handling of missing data changed in 2010 (to multiple imputation), so CDC says trends should be read with caution."
  - "Each topic is its own measure: case rates, death rates and serotype rates per 100,000, counts of cases and deaths, percents of cases by syndrome, and percents of isolates not susceptible to an antibiotic. They are never added to each other."
  - "Rates are never added. Age groups sit beside Overall, and the serotype groups share serotypes (All Serotypes covers them all), so they are never added either."
  - "Small numbers for some topics can make year-to-year changes hard to read (dataset footnote)."
  - "Figures here may differ from other ABCs publications, which can use different datasets or methods (dataset footnote)."
  - "Whether these rates are for the surveillance areas only or projected to the whole country is not yet confirmed (see the contract's open questions)."
  - "Whether the antibiotic resistance percents count resistant isolates only or all nonsusceptible isolates (resistant plus intermediate) is not yet confirmed; for penicillin the two differ, so read them as not susceptible as CDC reports it."
gbd:
  # No GBD cause yet (hard rules 1 and 3). Invasive pneumococcal disease spans GBD causes (lower respiratory
  # infections, meningitis) and bacteremia without focus, which is not a GBD cause, so no one cause covers a
  # figure here, and get_aligned_with_gbd reads only one cause per condition. get_aligned_with_gbd says the
  # mapping is missing until a maintainer reviews it (see the contract's open questions). No GBD location:
  # location_column is null and every series names the ABCs surveillance areas.
  location_column: null
