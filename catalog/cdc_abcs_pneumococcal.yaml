grain: "One row is one year and one published figure for invasive Streptococcus pneumoniae disease in the ABCs surveillance areas: a case or death rate per 100,000 (overall, by age group or by race), a rate for a group of vaccine serotypes in an age group, a count of cases, deaths or survivals, the percent of cases with a syndrome, or the percent of isolates not susceptible to an antibiotic as CDC reports it (or the number of isolates tested)."
