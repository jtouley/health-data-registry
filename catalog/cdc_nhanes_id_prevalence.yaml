      label: "Herpes simplex virus type 1"
      source: "https://data.cdc.gov/d/iqm3-hbev (FN_NHANESINFECTIOUS11: Herpes simplex virus type 1 (HSV-1) is defined as antibody to herpes simplex virus type 1 from tested sera)"
      review: publisher_codebook
    - alias: "HSV-2"
      label: "Herpes simplex virus type 2"
      source: "https://data.cdc.gov/d/iqm3-hbev (FN_NHANESINFECTIOUS12: Herpes simplex virus type 2 (HSV-2) is defined as antibody to herpes simplex virus type 2 from tested sera)"
      review: publisher_codebook
