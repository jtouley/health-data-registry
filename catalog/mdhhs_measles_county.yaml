  - "Outbreak-associated cases are a subset of all reported cases in the county, never added to them."
  - "MDHHS states no terms for reuse, so this source is read live from MDHHS and never stored or published."
  - "The dashboard's exposure-site lists (sites with street addresses) are never read; only county counts are."
