caveats:
  - "A percent of all emergency department visits, not a case count: it moves with how many people come to the emergency department for anything else."
  - "A county's figures are those of its Health Service Area, reported for each county in it, so several counties carry one shared value. County values are never added up, and two counties of one Health Service Area are not two separate measurements."
  - "Percents, trends and activity levels are never added, across viruses, places or weeks. The combined percent is CDC's own column, not COVID-19 plus influenza plus RSV."
  - "CDC rebuilds the whole table every week (the build number on each row), and a rebuild can change earlier weeks. Each load is kept, with its build number on every row."
  - "'Data Unavailable', 'Limited Data' and 'Sparse' are kept exactly as CDC writes them; what separates them is an open question in the contract, and none of them means zero."
  - "Which emergency departments report to NSSP, and what share of each state's visits they cover, is not in this table (see the contract's open questions)."
  - "State and national answers come from CDC's own state and United States rows, never from adding counties. County rows (each carrying its Health Service Area's figures) are in the table but are read only by asking for them directly."
  - "The activity levels (Very Low to Very High) are CDC's own categories; the cut-points behind them are not in this table and are never worked out here."
