grain: "One row is one week (week ending date) and one place: the United States, a state, or a county. A county row carries the figures of its Health Service Area (HSA), the group of counties that share patterns of care seeking, so every county of one HSA has the same values. Each row holds the percent of emergency department visits for COVID-19, influenza, RSV and the three combined (as observed and smoothed), the trend and the activity level for each virus, and the weekly build the table came from."
