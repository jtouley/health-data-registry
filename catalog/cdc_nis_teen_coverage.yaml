caveats:
  - "These are survey estimates, not counts: each coverage percent is weighted from a sample of teens, and comes with CDC's 95% confidence interval."
  - "CDC writes each 95% confidence interval as one piece of text ('60.3 to 68.3'). It is kept exactly as published and is not yet split into lower and upper numbers, so get_series doesn't show it; query_sql returns it (column ci_95) beside the estimate."
  - "Coverage is published once per survey year, and for some groups only as one estimate pooled over five survey years (2018-2022). A pooled estimate is not the coverage of any single year."
  - "Each row is one population group: the whole age range (13-17 years), younger teens (13-15 years), or one group by insurance, poverty, race and ethnicity or urbanicity. The groups overlap, so percentages are never added or averaged across them."
  - "NA in the publisher's table means the estimate is not applicable (CDC's column description); it is shown as no value, never as zero."
  - "Places include HHS regions and selected cities and counties (for example IL-City of Chicago, TX-Bexar County) beside their states, and 'Rest of state' areas that leave those cities out. Detroit is not one of the local areas."
  - "What counts as up to date differs by vaccine and changed over time (for HPV from 2016); this contract is a draft until a maintainer reads CDC's definitions."
