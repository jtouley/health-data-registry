grain: "One row is one vaccine and dose, place (United States, HHS region, state, territory or selected local area), survey year or pooled survey years, and population group (an age group, or a group by insurance, poverty, race and ethnicity or urbanicity), giving the survey's estimated vaccination coverage with its published 95% confidence interval and the number of teens sampled."
