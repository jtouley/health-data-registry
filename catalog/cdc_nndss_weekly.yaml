codebook_url: https://www.cdc.gov/nndss/docs/Readers-Guide-WONDER-Tables-20210421-508.pdf
caveats:
  - "Counts for the most recent reporting years are provisional and can change in later weeks as jurisdictions send late or corrected reports; each week's table is published as it stood that week."
  - "Cases are assigned to the reporting jurisdiction (state of residence); cases whose usual residence is outside the US are counted under Non-U.S. Residents."
  - "Flag U means the jurisdiction could not send data; N means the condition was not reportable there; NN not nationally notifiable; NP notifiable but not published; NC not calculated."
  - "A flag of '-' with an empty count means no reported cases that week."
  - "The previous 52-week maximum and year-to-date counts cover only the period when the condition was reportable in that jurisdiction, so they can be incomplete."
  - "Year-to-date counts are cumulative: read the latest week of a year, never sum year-to-date values across weeks."
  - "Candida auris clinical cases and screening (colonization) cases are separate series and are not added together."
  - "Case status is not a column, but for some conditions CDC puts it in the condition name: 14 names end in 'Confirmed' and 11 end in 'Probable', each its own series (for example Listeriosis, Confirmed and Listeriosis, Probable), and 5 end in 'Total' (Coccidioidomycosis, spelled two ways, and Novel Influenza A beside their Confirmed and Probable series; Q fever beside Acute and Chronic; CPO with no parts published). Never add a Total to its parts, or Confirmed to Probable. Every other condition name doesn't say which case statuses its count includes: read it as reported cases, and check the condition's case definition at https://ndc.services.cdc.gov/."
  - "New York (state) excludes New York City, which is reported as its own area."
  - "Reporting-area names are upper case for 2022-2024 and title case from 2025 (for example MICHIGAN versus Michigan)."
  - "Total rows include US residents, US territories and non-US residents; US RESIDENTS excludes territories."
