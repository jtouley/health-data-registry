caveats:
  - "The 2008 case definitions counted probable cases for the first time. Before the 2022 definition, several high-incidence states had begun other ways of surveillance whose data were not reportable to CDC (dataset Data Limitations). Years 2022 onward (cdc_lyme_county) and 1992 to 2007 (cdc_lyme_county_1992_2007) are separate sources and are never joined to this one into one trend."
  - "Counts are confirmed and probable cases reported to NNDSS by county of residence. CDC says not every case is reported, some reported cases may be another illness, and a sudden change can reflect a state's capacity to capture and classify cases rather than a true change in disease."
  - "Where fewer than 5 records share a county, state, sex and age group, CDC writes 'Suppressed' in place of those values and keeps the row. Those cases count in the national total (and the state's, when only the county is withheld) but can't be placed in a county; they are never dropped and never spread across places. In an answer that lists every state, rows labelled 'Suppressed' or 'Unknown' are these cases, not a place."
  - "A state's figure adds only the rows whose state column names it; rows with a suppressed or unknown state count only in the national total."
  - "Counts are by reporting year; CDC updates the table once a year after health departments verify the data."
gbd:
  # GBD 2023 has no Lyme disease cause (IHME GBD connector lookup_term, 2026-11-25: no match), so nothing is keyed
  # to a GBD cause. States are written as postal codes, which geo.py resolves to the GBD state names.
  location_column: state
  causes: []
