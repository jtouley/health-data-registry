id: cdc_rsv_adult_coverage
title: "Weekly Cumulative RSV Vaccination Coverage and Intent Among Adults 75 and Older and 50-74 with High-Risk Conditions (NIS-FRVM)"
agency: CDC
publisher: "Centers for Disease Control and Prevention, National Center for Immunization and Respiratory Diseases (NCIRD), National Immunization Survey-Fall Respiratory Virus Module (NIS-FRVM)"
level: federal
country: US
research_areas: [infectious_disease]
id_areas: [respiratory, vaccine_preventable]
years: {start: 2025, end: null}
# National and the 10 HHS regions only: no state row is published although the metadata lists State
# (https://data.cdc.gov/resource/qeq7-f3ir.json, read 2026-11-25).
geography: [nation, region]
shape: estimate_table
grain: "One row is one age group (75 and older, or 50 to 74 with a high-risk condition), one place (the nation or an HHS region), one demographic group, one measure (ever vaccinated against RSV, or a level of vaccination and intent) and one survey week, holding a weighted survey estimate cumulative through that week (published as a proportion from 0 to 1), its 95% confidence interval half width and the unweighted sample size."
refresh: weekly
licence:
  id: public-domain-us-federal
  redistribution: true
  terms_url: https://www.usa.gov/government-works
citation: "National Center for Immunization and Respiratory Diseases, U.S. Centers for Disease Control and Prevention. Weekly Cumulative RSV Vaccination and Intent, by Selected Demographics and Jurisdictions, Among Adults 75 Years and Older and 50-74 Years with High-Risk Conditions Ever Vaccinated with RSV Vaccine, United States. https://data.cdc.gov/d/qeq7-f3ir (accessed <retrieved_at>)."
source:
  portal: socrata
  host: data.cdc.gov
  dataset: qeq7-f3ir
  landing_url: https://data.cdc.gov/d/qeq7-f3ir
  api_url: https://data.cdc.gov/resource/qeq7-f3ir.json
codebook_url: https://www.cdc.gov/rsvvaxview/dashboard/adults-50-coverage-intent.html
caveats:
  - "The estimate is published as a proportion from 0 to 1 (0.41 means about 41%), although CDC's column is labelled %. It is shown exactly as published, never rescaled; the half width beside it is in percentage points."
  - "Vaccination coverage, not RSV disease: the share of adults 75 and older, or 50 to 74 with a high-risk condition, who say they ever received an RSV vaccine, from a weighted cellular telephone survey (NIS-FRVM). It answers vaccination questions only."
  - "National and HHS region figures only: no state figure is published."
  - "Cumulative and recalculated every week from all interviews so far, so an earlier week's figure can change in a later load."
  - "CDC suppresses an estimate when the cumulative sample is under 30 or the week's sample under 5 (intent: the week's sample under 30); a suppressed estimate is empty, never zero, and keeps CDC's flag."
  - "Self-reported vaccination; places, groups and intent categories are never added."
