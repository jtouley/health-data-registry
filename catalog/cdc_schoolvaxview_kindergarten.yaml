caveats:
  - "Coverage and exemptions are reported by each state's school vaccination assessment, not measured by one national survey. Some states count every kindergartner (census); others survey a sample, and the method is shown with each row (survey type). Whether a sample-based state can be set beside a census state is not yet confirmed."
  - "CDC publishes no confidence intervals for these percentages, so none is shown; for sample-based states the sampling error is unknown here."
  - "NA means the estimate is not applicable and NReq that the vaccine is not required by the state for school entry (CDC's column description); both are shown as no value, never as zero. The publisher's own text is kept beside the number."
  - "The footnote symbols (†, ‡, §, ¶, ** and others) are kept exactly as published. CDC uses the same symbols with different meanings for coverage rows and for exemption rows; their meanings are in CDC's footnote key and are not interpreted here."
  - "On exemption rows, CDC's footnote '<' means fewer than 0.1% of kindergartners had the exemption; the percent printed beside it (usually 0.1) is then an upper limit, not an estimate. get_series shows the number without the footnote, so check the footnote with query_sql (column foot_notes) before quoting a very small exemption percent."
  - "There are two national rows: 'United States' and 'U.S. Median'. The median is the middle state's value, not a national estimate."
  - "Exemption percentages count kindergartners with an exemption among those enrolled. Where a state reported exemptions only per vaccine, CDC's footnote says the percent shown is a lower bound."
  - "Each row is one vaccine, dose or exemption type: percentages are never added across them, across states or across school years."
