  # U.S. Government", terms https://www.usa.gov/government-works.
  id: public-domain-us-federal
  redistribution: true
  terms_url: https://www.usa.gov/government-works
citation: "Centers for Disease Control and Prevention, Division of Vector-Borne Diseases. Lyme disease public use aggregated data with geography, 2022 onward. https://data.cdc.gov/d/x5j9-wybp (accessed <retrieved_at>)."
source:
  portal: socrata
  host: data.cdc.gov
  dataset: x5j9-wybp
  landing_url: https://www.cdc.gov/lyme/data-research/facts-stats/surveillance-data-1.html
  api_url: https://data.cdc.gov/resource/x5j9-wybp.json
codebook_url: https://data.cdc.gov/api/views/x5j9-wybp.json
caveats:
  - "From 2022, states with a high incidence of Lyme disease report cases on laboratory evidence alone, without a clinical investigation, so CDC says these years can't be compared with earlier ones. Years before 2022 are separate sources (cdc_lyme_county_2008_2021, cdc_lyme_county_1992_2007) and are never joined to this one into one trend."
  - "Counts are confirmed and probable cases reported to NNDSS by county of residence. CDC says not every case is reported, some reported cases may be another illness, and a sudden change can reflect a state's capacity to capture and classify cases rather than a true change in disease."
  - "Where fewer than 5 records share a county, state, sex and age group, CDC writes 'Suppressed' in place of those values and keeps the row. Those cases count in the national total (and the state's, when only the county is withheld) but can't be placed in a county; they are never dropped and never spread across places."
  - "A state's figure adds only the rows whose state column names it. Some rows have an unknown state but a county code (60 rows, 484 cases, on 2026-11-25); those count only in the national total until a maintainer reviews how to place them."
  - "Connecticut's FIPS codes change from 2023 to its nine planning regions (Federal Register 2022-12063), so its counties don't line up across 2022 and 2023."
  - "Counts are by reporting year; CDC updates the table once a year after health departments verify the data."
gbd:
  # GBD 2023 has no Lyme disease cause (IHME GBD connector lookup_term, 2026-11-25: no match), so nothing is keyed
  # to a GBD cause. States are written as postal codes, which geo.py resolves to the GBD state names.
  location_column: state
  causes: []
conditions:
