id: cdc_lyme_county
title: "Lyme disease public use aggregated data with geography, 2022 onward"
agency: CDC
publisher: "Centers for Disease Control and Prevention, National Center for Emerging and Zoonotic Infectious Diseases, Division of Vector-Borne Diseases (National Notifiable Diseases Surveillance System)"
level: federal
country: US
research_areas: [infectious_disease]
id_areas: [vector_borne]
years: {start: 2022, end: null}
# County of residence (FIPS), state (postal code) and, by adding every row, the nation. A county or state CDC
# suppressed is written 'Suppressed' and stays in the national count only.
geography: [nation, state, county]
shape: frequency_table
grain: "One row is one year, county of residence, case status (confirmed or probable), sex and age group (0-19 or 20+ years), with the number of Lyme disease cases reported to NNDSS for that combination. Where fewer than 5 records shared a combination, CDC wrote 'Suppressed' in place of the county, state, sex or age group, and kept the row and its count."
refresh: annual
