grain: "One row is one vaccine and dose, place (United States, HHS region, state, territory or selected local area), birth year or birth cohort, and population group (the age by which the dose was given, or a group by insurance, poverty, race and ethnicity or urbanicity), giving the survey's estimated childhood vaccination coverage with its published 95% confidence interval and the number of children sampled."
