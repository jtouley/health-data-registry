caveats:
  - "These are survey estimates, not counts: each coverage percent is weighted from a sample of young children, and comes with CDC's 95% confidence interval."
  - "CDC writes each 95% confidence interval as one piece of text ('92.2 to 96.1'). It is kept exactly as published and is not yet split into lower and upper numbers, so get_series doesn't show it; query_sql returns it (column ci_95) beside the estimate."
  - "Periods are birth years, not calendar years of vaccination: coverage for children born in 2021 is measured up to age 35 months, so the newest data are about three years behind (CDC's column description)."
  - "CDC publishes single birth years (e.g. 2021), two-year birth cohorts (e.g. 2020-2021) and four-year cohorts (2014-2017, 2016-2019) side by side. They overlap, so a cohort is never added to or averaged with its single years."
  - "Each row is the coverage reached by one age (e.g. by 24 months, by 35 months), or, for the four-year cohorts only, one group by insurance, poverty, race and ethnicity or urbanicity. Ages and groups overlap, so percentages are never added or averaged across them."
  - "The series read coverage by 24 months for most vaccines, by 8 months for rotavirus and by 3 days for the hepatitis B birth dose; other ages are in the table (describe_dataset lists them)."
  - "NA in the estimate column is shown as no value, never as zero. This dataset's column description doesn't define NA; CDC's teen and kindergarten tables call it 'not applicable'."
  - "Places include HHS regions and selected cities and counties (for example IL-City of Chicago, TX-Bexar County) beside their states, and 'Rest of state' areas that leave those cities out. Detroit is not one of the local areas."
  - "What each dose and series means (e.g. the Combined 7 Series, Hib full series) is defined on ChildVaxView's data source page, not yet read for this draft contract."
