caveats:
  - "A share of emergency department visits, not a case count: it moves with how many people come to the ED for anything else."
  - "The dashboard shows only its most recent weeks (7 weeks on 2026-11-24); older weeks drop off and are not kept here."
  - "Which emergency departments are counted, and whether a visit is placed in Detroit by the patient's residence or the hospital's address, is not stated (see the contract's open questions)."
  - "Shares are never added across diagnoses or weeks."
  - "The Detroit Health Department states no terms for reuse, so this source is read live from the city and never stored or published."
