      (10.1016/j.ijid.2020.11.001), but the abstracts and about 330 regular articles share the DOI stems
      2020.09.* and 2020.11.*, interleave in DOI order and share page numbers, and Crossref gives no issue. No
      filter the catalog can declare separates them; a maintainer-reviewed exclude list or another route is needed.
      CC BY-NC-ND 4.0 (a few CC BY).'
