    - 10.1016/j.ijid.2023.04.006
    from_pub_date: '2023-05-01'
    until_pub_date: '2023-05-31'
    verified: true
    evidence: 'Crossref, read 24 Nov 2026: IJID volume 130 (May 2023) has 384 works on supplement pages; 373 of
      them, DOIs 10.1016/j.ijid.2023.04.010 to .384, are one-abstract works with upper-case titles (e.g. awareness
      of listeriosis among dairy farmers in Malaysia); the other 11 (DOIs 10.1016/j.ijid.2023.02.*, .03.*, .04.001
      and .04.006) are a World TB Day supplement on the same page numbers. That the 373 are ICID 2022 (Kuala Lumpur)
      abstracts is inferred and is an open question until the maintainer confirms it.'
  enrich_hosts:
  - api.openalex.org
  - www.ebi.ac.uk
codebook_url: https://www.crossref.org/documentation/retrieve-metadata/rest-api/
caveats:
- An abstract is not a peer-reviewed paper; many are never published in full.
- 'Metadata comes from Crossref, OpenAlex and Europe PMC, not the conference: a year holds the abstracts the journal
  supplement published under one DOI each.'
- Abstract text is kept only where its licence is Creative Commons; otherwise read the abstract at its DOI link.
- Condition, design, data-source and geography tags come from fixed word rules over the title and text, not from
  a model; a missing tag doesn't mean the topic is absent.
- Kept in this source's private store only for now. CC BY and CC0 abstracts may be shared publicly, always with
  their authors, title, journal, DOI link and licence; other licences never are.
