id: cdc_covid_adult_coverage
title: "COVID-19 Vaccination Coverage Among Adults 18 Years and Older, by Season (NIS-FRVM)"
agency: CDC
publisher: "Centers for Disease Control and Prevention, National Center for Immunization and Respiratory Diseases (NCIRD), National Immunization Survey-Fall Respiratory Virus Module (NIS-FRVM)"
level: federal
country: US
research_areas: [infectious_disease]
id_areas: [respiratory, vaccine_preventable]
years: {start: 2023, end: null}
# National, the 10 HHS regions, states and parts of some states (geographic_level National, Region, State,
# Substate; https://data.cdc.gov/resource/ksfb-ug5d.json, read 2026-11-25). Substate is five cities, Bexar County
# (Texas) and Philadelphia County, each beside its "Rest of State": parts of five states, not a county breakdown,
# so a county question is still told no (no county of any other state, and none in Michigan).
geography: [nation, region, state, city]
shape: estimate_table
grain: "One row is one place (the nation, an HHS region, a state, or a part of a state), one demographic group, one measure (up-to-date COVID-19 vaccination, or a level of vaccination and intent) and one survey week, holding a weighted survey estimate (%) cumulative through that week, its 95% confidence interval half width, and the unweighted sample size."
refresh: weekly
licence:
