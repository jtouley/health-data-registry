  redistribution: true
  terms_url: https://www.usa.gov/government-works
citation: "National Center for Immunization and Respiratory Diseases, U.S. Centers for Disease Control and Prevention. Weekly Cumulative COVID-19 Vaccinations and Intent, by Selected Demographics and Jurisdictions, Among Adults 18 Years and Older, by Season, United States. https://data.cdc.gov/d/ksfb-ug5d (accessed <retrieved_at>)."
source:
  portal: socrata
  host: data.cdc.gov
  dataset: ksfb-ug5d
  landing_url: https://data.cdc.gov/d/ksfb-ug5d
  api_url: https://data.cdc.gov/resource/ksfb-ug5d.json
codebook_url: https://www.cdc.gov/covidvaxview/weekly-dashboard/adult-vaccination-coverage.html
caveats:
  - "Vaccination coverage, not COVID-19 disease: the percent of adults who say they received this season's COVID-19 vaccine, from a weighted cellular telephone survey (NIS-FRVM). It answers vaccination questions only."
  - "Cumulative within a season and recalculated every week from all interviews so far, so an earlier week's figure can change in a later load. Seasons start when that season's vaccine became available and are never added together: a series over a year runs into the next season, where the figure starts again from near zero (the covid_season column in query_sql says which season a week is in)."
  - "CDC publishes a 95% confidence interval as a half width (ci_half_width_95pct) beside each estimate; read it with query_sql or describe_dataset, since get_series can't show it as lower and upper bounds yet."
  - "Self-reported vaccination; CDC notes possible bias from households without cell phones and from who answers the survey."
  - "CDC suppresses an estimate when the cumulative sample is under 30 or the week's sample under 5 (intent: the week's sample under 30); a suppressed estimate is empty, never zero, and keeps CDC's flag."
  - "Parts of five states sit beside the state itself: the cities of Chicago, Houston, Los Angeles, New York and Phoenix, Bexar County (Texas) and Philadelphia County, each with its 'Rest of State' (2026-11-25). They are not a county breakdown; places and groups are never added."
