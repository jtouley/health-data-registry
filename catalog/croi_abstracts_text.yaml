id: croi_abstracts_text
title: CROI conference abstracts (abstract text, private store)
agency: CROI Foundation
publisher: "Conference on Retroviruses and Opportunistic Infections (CROI Foundation; organised with IAS-USA)"
level: international
country: null
research_areas: [infectious_disease, research_landscape]
id_areas: [hiv, stis, hepatitis, tb]
years: {start: 2022, end: null}
geography: [world]
shape: registry
grain: "One row is the text of one CROI abstract in one conference year (abstract number plus year), as shown on its page on CROI's site."
refresh: annual
licence:
  # (c) CROI Foundation: copy or print for personal, non-commercial use only. Private tier only, readable only by
  # the server; never published, never in git.
  id: croi-abstract-text
  redistribution: false
  terms_url: https://www.croiconference.org/
hosting: private
private_store: true
citation: "Conference on Retroviruses and Opportunistic Infections (CROI) <year>, abstract <abstract_number>. Abstract text (c) CROI Foundation. <page_url> (accessed <retrieved_at>)."
# Filled by croi_abstracts_index's crawl (crawl-private croi_abstracts_index): the same pages, read once. This
# entry never crawls on its own; its source block is the same listing, kept equal by a test.
source:
  type: html_table
  host: www.croiconference.org
  dataset: search-abstracts
  landing_url: https://www.croiconference.org/search-abstracts/
  api_url: https://www.croiconference.org/search-abstracts/
  # CROI's robots.txt asks for 120 s between requests (read 24 Nov 2026); the floor here can only slow the crawl,
  # and a longer Crawl-delay there wins. About 47 hours for a year of ~1,400 abstracts, resumed across runs.
  min_interval_s: 120
  scope_paths:
    - '/search-abstracts/(?:page/[0-9]+/)?'
    - '/abstract/[a-z0-9][a-z0-9-]*-20[0-9]{2}(?:-[a-z]+)?/'
  html_table:
    shape: listing
    listing:
      url_template: 'https://{host}/search-abstracts/page/{page}/?aa=&at=&an=&sn=&kw=&yr={year}&st=&q=1'
      years: {first: 2022, last: 2026}
      page_size: 10
      first_page: 1
      max_pages: 300
      item_link_selector: 'h3.entry-title > a'
      item_path_pattern: '/abstract/[a-z0-9][a-z0-9-]*-(20[0-9]{2})(?:-[a-z]+)?/'
      item_year_group: 1
      results_count_selector: 'p.abstract-search-results-count'
      results_count_pattern: '\s*([0-9][0-9,]*)\s+Results?\s*'
      item_number:
        link_text_pattern: '\s*([A-Za-z0-9][A-Za-z0-9.-]*)\s+[–—-]\s+.+'
        field: abstract_number
        field_pattern: '\s*([A-Za-z0-9][A-Za-z0-9.-]*)\s*'
      fields:
        heading: 'h1.entry-title'
        abstract_text: 'article.abstract div.entry-content'
  extensions:
    - name: page_fields
      hook: parse
      args:
        labelled:
          block_selector: 'div.abstract-sidebar-content'
          heading_selector: 'h4'
          value_selector: 'div.abstract-sidebar-text'
          fields: {abstract_number: Abstract Number, session_title: Session Title, authors: Authors}
        links:
          poster_url: {selector: 'a[href]', title: Download Poster}
        class_slugs:
          session_type: {selector: 'article.abstract', prefix: 'abstract-session-type-'}
          category: {selector: 'article.abstract', prefix: 'abstract-category-'}
codebook_url: https://www.croiconference.org/search-abstracts/
caveats:
  - "Abstract text (c) CROI Foundation: copy or print for personal, non-commercial use only. Kept only in this source's private store, readable only by the server, used to match a search and never shown or published: the link opens it on CROI's site."
  - "Poster PDFs and figures are never copied; they are linked on CROI's site."
  - "The maintainer can delete every private copy of this source on its own (private.purge); the tools then fall back to links."
contract: contracts/croi_abstracts_text.odcs.yaml
semantic_model: semantic/croi_abstracts_text.yaml
status: draft
