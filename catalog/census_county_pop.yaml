level: federal
country: US
research_areas: [denominator]
years: {start: 2020, end: 2025}
geography: [nation, state, county]
shape: estimate_table
grain: "One row is one state or county in one year, with the Census Bureau's estimate of the resident population on July 1 of that year (Vintage 2025). Used as the denominator for rates computed here."
refresh: annual
licence:
  id: public-domain-us-federal
  redistribution: true
