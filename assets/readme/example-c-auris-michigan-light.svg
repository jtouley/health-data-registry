<title id="t">Example answer: clinical C. auris cases in Michigan</title>
<desc id="d">Bar chart of clinical Candida auris cases reported in Michigan, from CDC, checked 25 November 2026. All figures are provisional. Count at year end, then CDC's later count from the next year's table: 2022, 27 then 33; 2023, 103 then 110; 2024, 174 then 184; 2025, 178 then 217 by week 45 of 2026.</desc>
