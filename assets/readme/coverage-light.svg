<text x="0" y="76.0" font-size="28" fill="#59636e">From CDC, except where marked</text>
<circle cx="14" cy="122.0" r="13" fill="#0b6b69"/><path d="M8 122.0l4 4 8-8.5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="132.0" font-size="28" fill="#1f2328">Notifiable infections by US state,</text>
<text x="44" y="168.0" font-size="28" fill="#1f2328">from <tspan font-style="italic">C. auris</tspan> to syphilis</text>
