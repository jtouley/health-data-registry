[project]
name = "health-data-registry"
version = "0.0.1"
description = "Ask Claude about public health data (GBD, CDC, WHO and more) in plain English: a read-only MCP server over reviewed dataset contracts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Jason Touleyrou" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "duckdb>=1.4,<3",
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "sqlglot>=26,<31",
]

[project.scripts]
health-data-registry = "health_data_registry.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_data_registry"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "health_data_registry/_registry/catalog"
"contracts" = "health_data_registry/_registry/contracts"
"semantic" = "health_data_registry/_registry/semantic"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["eval/sealed"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits a live publisher (deselected in CI by default)"]

[tool.coverage.run]
source = ["health_data_registry"]
branch = true
