apiVersion: v3.2.0
kind: DataContract
id: cdc_nndss_weekly
name: NNDSS Weekly Data
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "Weekly provisional case counts of selected nationally notifiable infectious diseases reported by US states, New York City, the District of Columbia and territories to CDC's National Notifiable Diseases Surveillance System, 2022 onward."
  usage: "Read the latest MMWR week of a year for year-to-date counts by state and condition. Never add weekly counts across weeks into a year: late reports reach only the year-to-date count. Add weekly counts across reporting areas only after excluding total rows."
  limitations: "Provisional counts that are revised in later weeks; counts by jurisdiction of residence; no rates, no age or sex breakdown, no county."
  authoritativeDefinitions:
    - {type: canonicalUrl, url: "https://data.cdc.gov/d/x9gk-5huc", description: "Publisher dataset page"}
    - {type: businessDefinition, url: "https://data.cdc.gov/api/views/x9gk-5huc.json", description: "Socrata metadata: column names, notes and flag definitions (dataset description)"}
    - {type: businessDefinition, url: "https://www.cdc.gov/nndss/docs/Readers-Guide-WONDER-Tables-20210421-508.pdf", description: "Reader's guide to NNDSS tables, cited by the publisher"}
    - {type: businessDefinition, url: "https://www.cdc.gov/nndss/infectious-disease/notice-to-data-users.html", description: "Notices and errata, cited by the publisher"}
    - {type: businessDefinition, url: "https://ndc.services.cdc.gov/", description: "National surveillance case definitions, cited by the publisher"}
servers:
  - id: data_cdc_gov
    server: data.cdc.gov
    type: api
    location: https://data.cdc.gov/resource/x9gk-5huc.json
    description: "Socrata SODA API; the adapter keeps only the columns listed in the schema (geocode and the :@computed_region_* columns are dropped)."
schema:
  - name: cdc_nndss_weekly
    physicalName: cdc_nndss_weekly
    physicalType: table
    logicalType: object
    description: "One row per reporting area, MMWR year, MMWR week and condition."
    dataGranularityDescription: "reporting area x MMWR year x MMWR week x condition"
    authoritativeDefinitions:
      - {type: businessDefinition, url: "https://data.cdc.gov/api/views/x9gk-5huc.json"}
    customProperties:
      - property: totalRows
        value: "location2 IS NOT NULL AND upper(location2) NOT IN ('NON-US RESIDENTS', 'NON-U.S. RESIDENTS')"
        description: "Summary areas (TOTAL, US RESIDENTS, US TERRITORIES and the nine census divisions) carry location2; single jurisdictions carry location1. Non-U.S. Residents also carries location2 but is its own bucket, not a sum. Structural fact checked live 2026-11-24: for Legionellosis 2024 week 52 the 51 state/DC rows plus New York City (7012 + 249) equal US RESIDENTS (7261), and US RESIDENTS + US TERRITORIES + NON-US RESIDENTS (7261 + 3 + 1) equal TOTAL (7265)."
      - {property: tableShape, value: surveillance_series}
      - property: conformedDimensions
        value:
          place:
            match: state_name
            column: states
            places:
              US RESIDENTS: {key: USA, level: nation}
              Commonwealth of Northern Mariana Islands: {key: US-69}
          time: {year: year, dateBasis: "the MMWR year of the report"}
        description: "A reporting area is matched to dim_place by its name, ignoring case and dots, so MICHIGAN (2022-2024) and Michigan (2025 on) are both US-26 and NEW YORK CITY is US-36/nyc. Two labels don't carry their place's name: US RESIDENTS (U.S. Residents from 2025) is the United States, the 50 states and DC (structural check under totalRows), and Commonwealth of Northern Mariana Islands is the 2025 name of the Northern Mariana Islands (renamedLabels). TOTAL, US TERRITORIES, NON-US RESIDENTS and the census divisions are not places in dim_place."
      - property: idDimensions
        value:
          condition: label
          caseDefinition: null
          caseStatus: null
          organismResistance: null
          period: [year, week]
          provisionalFlag: null
        description: "Condition is the publisher label (no NNDSS event code or ICD-10 code is published in this dataset). Case definitions are not in the data (see openQuestions; https://ndc.services.cdc.gov/). Case status is not a column: counts are published per condition without a confirmed/probable split. Organism is part of the label for Candida auris only; no resistance field. Period is MMWR year and week. Provisional status is by reporting year per the dataset footnote, not a column."
    properties:
      - name: states
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "Reporting area: the US total, a census division, a state, New York City, a territory, US territories combined, or non-US residents. Cases are counted where the patient usually lives. New York excludes New York City (structural check against US RESIDENTS, 2024). Upper case through 2024, title case from 2025 (source: live data, https://data.cdc.gov/resource/x9gk-5huc.json)."
        examples: ["MICHIGAN", "Michigan", "US RESIDENTS", "U.S. Residents", "TOTAL"]
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: states}
          - property: partialPlaces
            value: {"New York": "New York State excluding New York City, which NNDSS reports as its own area; not the whole state GBD models"}
            description: "The one declaration of areas that cover only part of the place of the same name: get_rate and get_trend refuse a rate against the whole place's population, and answers carry the note. From the dataset footnote that New York City is reported separately, and the structural check under totalRows (the 51 state/DC rows plus New York City add up to US RESIDENTS), so New York excludes New York City. Matched ignoring case and dots, so it covers 'NEW YORK' through 2024 and 'New York' from 2025."
          - property: renamedLabels
            value: {"Commonwealth of Northern Mariana Islands": "Northern Mariana Islands"}
            description: "The 2025 tables name the territory by its official title, Commonwealth of the Northern Mariana Islands; 2022-2024 tables call it Northern Mariana Islands. Same jurisdiction, one row per table each year (live data, 2026-11-24)."
      - name: year
        physicalType: BIGINT
        logicalType: integer
        required: true
        description: "MMWR (epidemiological) year of the report."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: year}
      - name: week
        physicalType: BIGINT
        logicalType: integer
        required: true
        description: "MMWR week of the report (1-52, or 53 in 53-week years such as 2025)."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: week}
      - name: label
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "Notifiable condition as named in the NNDSS tables (for example Legionellosis, Candida auris, clinical; Syphilis, Primary and secondary). Case definitions: https://ndc.services.cdc.gov/."
        examples: ["Legionellosis", "Candida auris, clinical", "Candida auris, screening", "Syphilis, Primary and secondary", "Tuberculosis"]
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: label}
          - property: notIncidence
            value: {"Candida auris, screening": "people found to carry C. auris on screening swabs (colonisation), not new cases of disease in the population; for C. auris, the clinical cases take a rate"}
            description: "Labels whose counts are not population incidence, so get_rate, compare_rates and get_trend on rates give no rate per 100,000 people for them; the counts themselves are returned as published. The maintainer's reviewed declaration of 25 Nov 2026 (PR #186). Supporting evidence, from the case-definition site the dataset notes cite (https://ndc.services.cdc.gov/): CDC's Candida auris 2023 case definition (CSTE position statement 22-ID-05, https://ndc.services.cdc.gov/case-definitions/candida-auris-2023/, read 2026-11-25) defines a screening case as a 'Person with confirmatory laboratory evidence from a swab collected for the purpose of screening for C. auris colonization regardless of site swabbed', apart from a clinical case (a specimen 'obtained during the normal course of care for diagnostic or treatment purposes'). The value depends on the exact label 'Candida auris, screening' (see cauris_labels_present)."
        quality:
          - id: cauris_labels_present
            dimension: coverage
            severity: warn
            type: sql
            query: "SELECT COUNT(DISTINCT label) FROM {object} WHERE label IN ('Candida auris, clinical', 'Candida auris, screening')"
            mustBe: 2
            description: "Both C. auris labels the review queue flag_cauris_clinical_screening_swap and the notIncidence declaration read by name are still published (they were in the live data on 2026-11-24); if CDC renames one, the queue would go quiet and screening counts would lose their no-rate declaration without this warning."
      - name: m1
        physicalType: BIGINT
        logicalType: integer
        required: false
        description: "Cases reported for this condition and area in this MMWR week (publisher column 'Current week'). Empty only where the flag column m1_flag holds a code; a count flagged '-' (no reported cases) means not reported (maintainer's declaration, see noCasesCode): it has no number and is never counted as 0."
        customProperties:
          - {property: role, value: measure}
          - {property: sourceField, value: m1}
          - {property: unit, value: "1"}
        quality:
          - id: m1_empty_only_where_flagged
            dimension: consistency
            severity: warn
            type: sql
            query: "SELECT COUNT(*) FROM {object} WHERE m1 IS NULL AND (m1_flag IS NULL OR trim(m1_flag) = '')"
            mustBe: 0
            description: "A count is empty only where the publisher's flag (m1_flag) gives the reason (dataset notes); an empty count with no flag is a read failure, not a gap the publisher left. Checked against the live data on 2026-11-25: no such row (warn until the synthetic test fixtures carry flags; then error). The converse doesn't hold: through 2024 a '-' flag also sits beside a number."
      - name: m1_flag
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Why the current-week count is empty. Codes from the dataset notes: '-' no reported cases; U unavailable; N not reportable in the jurisdiction; NN not nationally notifiable; NP nationally notifiable but not published; NC not calculated. From 2025 the flag is empty when a count is present; through 2024 rows with a count also carry '-', so a flag explains only an empty count. Kept as published, never turned into an empty value."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: m1_flag}
          - {property: flagFor, value: m1}
          - {property: flagCodes, value: {"-": "no reported cases", "U": "unavailable", "N": "not reportable in this jurisdiction", "NN": "not nationally notifiable", "NP": "nationally notifiable but not published", "NC": "not calculated"}}
          - {property: noCasesCode, value: "-", description: "Dataset notes (the publisher's codebook, quoted in flagCodes): '-: No reported cases — The reporting jurisdiction did not submit any cases to CDC.' Meaning, by the maintainer's declaration of 25 Nov 2026 (PR #186; it reverses issue #14's reading as a reported zero): '-' means not reported. A count with this flag is stored and returned as published: it has no number, keeps its flag and meaning, and is never counted as 0 or turned into a rate, and a sum that meets it stops."}
        quality:
          - id: m1_flag_codes
            dimension: conformity
            severity: error
            type: library
            metric: invalidValues
            arguments: {validValues: ["-", "U", "N", "NN", "NP", "NC"]}
            mustBe: 0
            description: "Flag values are the codes listed in the publisher's dataset notes."
      - name: m2
        physicalType: BIGINT
        logicalType: integer
        required: false
        description: "Highest weekly count in the previous 52 weeks for this condition and area, counting only weeks when the condition was reportable there (publisher footnote). A maximum: never add it up."
        customProperties:
          - {property: role, value: measure}
          - {property: sourceField, value: m2}
          - {property: unit, value: "1"}
      - name: m2_flag
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Why the previous 52-week maximum (m2) is empty: the publisher's flag code."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: m2_flag}
          - {property: flagFor, value: m2}
          - {property: flagCodes, value: {"-": "no reported cases", "U": "unavailable", "N": "not reportable in this jurisdiction", "NN": "not nationally notifiable", "NP": "nationally notifiable but not published", "NC": "not calculated"}}
      - name: m3
        physicalType: BIGINT
        logicalType: integer
        required: false
        description: "Cumulative cases so far in this MMWR year up to and including this week (year to date). Cumulative: take the latest week, never sum across weeks. Can be incomplete if the condition was reportable for only part of the year (publisher footnote). Empty only where the flag column m3_flag holds a code; a count flagged '-' (no reported cases) means not reported (maintainer's declaration, see noCasesCode): it has no number and is never counted as 0."
        customProperties:
          - {property: role, value: measure}
          - {property: sourceField, value: m3}
          - {property: unit, value: "1"}
        quality:
          - id: m3_empty_only_where_flagged
            dimension: consistency
            severity: warn
            type: sql
            query: "SELECT COUNT(*) FROM {object} WHERE m3 IS NULL AND (m3_flag IS NULL OR trim(m3_flag) = '')"
            mustBe: 0
            description: "A count is empty only where the publisher's flag (m3_flag) gives the reason (dataset notes); an empty count with no flag is a read failure, not a gap the publisher left. Checked against the live data on 2026-11-25: no such row (warn until the synthetic test fixtures carry flags; then error). The converse doesn't hold: through 2024 a '-' flag also sits beside a number."
      - name: m3_flag
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Why the current-year year-to-date count (m3) is empty: the publisher's flag code."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: m3_flag}
          - {property: flagFor, value: m3}
          - {property: flagCodes, value: {"-": "no reported cases", "U": "unavailable", "N": "not reportable in this jurisdiction", "NN": "not nationally notifiable", "NP": "nationally notifiable but not published", "NC": "not calculated"}}
          - {property: noCasesCode, value: "-", description: "Dataset notes (the publisher's codebook, quoted in flagCodes): '-: No reported cases — The reporting jurisdiction did not submit any cases to CDC.' Meaning, by the maintainer's declaration of 25 Nov 2026 (PR #186; it reverses issue #14's reading as a reported zero): '-' means not reported. A count with this flag is stored and returned as published: it has no number, keeps its flag and meaning, and is never counted as 0 or turned into a rate, and a sum that meets it stops."}
      - name: m4
        physicalType: BIGINT
        logicalType: integer
        required: false
        description: "Cumulative cases in the previous MMWR year up to the same week, as published in this week's table. The codebook doesn't say whether it counts the same thing as that year's own year-to-date (m3); for some conditions the two differ widely (see openQuestions), so it is shown beside m3, never in its place. Empty only where the flag column m4_flag holds a code; a count flagged '-' (no reported cases) means not reported (maintainer's declaration, see noCasesCode): it has no number and is never counted as 0."
        customProperties:
          - {property: role, value: measure}
          - {property: sourceField, value: m4}
          - {property: unit, value: "1"}
        quality:
          - id: m4_empty_only_where_flagged
            dimension: consistency
            severity: warn
            type: sql
            query: "SELECT COUNT(*) FROM {object} WHERE m4 IS NULL AND (m4_flag IS NULL OR trim(m4_flag) = '')"
            mustBe: 0
            description: "A count is empty only where the publisher's flag (m4_flag) gives the reason (dataset notes); an empty count with no flag is a read failure, not a gap the publisher left. Checked against the live data on 2026-11-25: no such row (warn until the synthetic test fixtures carry flags; then error). The converse doesn't hold: through 2024 a '-' flag also sits beside a number."
      - name: m4_flag
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Why the previous-year year-to-date count (m4) is empty: the publisher's flag code."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: m4_flag}
          - {property: flagFor, value: m4}
          - {property: flagCodes, value: {"-": "no reported cases", "U": "unavailable", "N": "not reportable in this jurisdiction", "NN": "not nationally notifiable", "NP": "nationally notifiable but not published", "NC": "not calculated"}}
          - {property: noCasesCode, value: "-", description: "Dataset notes (the publisher's codebook, quoted in flagCodes): '-: No reported cases — The reporting jurisdiction did not submit any cases to CDC.' Meaning, by the maintainer's declaration of 25 Nov 2026 (PR #186; it reverses issue #14's reading as a reported zero): '-' means not reported. A count with this flag is stored and returned as published: it has no number, keeps its flag and meaning, and is never counted as 0 or turned into a rate, and a sum that meets it stops."}
      - name: location1
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Name of a single jurisdiction (state, DC, New York City or territory); empty on summary rows."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: location1}
      - name: location2
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Name of a summary area (TOTAL, US RESIDENTS, US TERRITORIES, NON-US RESIDENTS or a census division); empty on single-jurisdiction rows."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: location2}
      - name: sort_order
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Publisher's row order key (year, week and area position); used only to keep the published table order."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: sort_order}
customProperties:
  - property: coverage
    description: "Which places the weekly tables cover, from the reporting areas the publisher's rows carry (an exact structural fact, hard rule 1). New York State is reported without New York City, which is its own area. A state where a condition is not reportable still has rows, flagged N, so coverage of a place says nothing about a condition there. Read by coverage.py and, through make contracts, by the dbt coverage models."
    value:
      kind: full
      denominator: not_stated
      places:
        - placeKey: USA
          part: whole
          validFrom: 2022
          validTo: null
          basisUrl: "https://data.cdc.gov/resource/x9gk-5huc.json"
          basisQuote: "Structural, checked live 2026-11-27: every year 2022-2026 has the same 70 reporting areas, among them each of the 50 states, DISTRICT OF COLUMBIA and US RESIDENTS (U.S. Residents from 2025); for Legionellosis 2024 week 52 the 51 state and DC rows plus New York City (7012 + 249) equal US RESIDENTS (7261), checked 2026-11-24."
          declaredInVersion: 0.1.0
          declaredAt: 2026-11-27
        - placeKey: US-72
          part: whole
          validFrom: 2022
          validTo: null
          basisUrl: "https://data.cdc.gov/resource/x9gk-5huc.json"
          basisQuote: "Structural, checked live 2026-11-27: PUERTO RICO is a reporting area in every year 2022-2026; it is not in US RESIDENTS."
          declaredInVersion: 0.1.0
          declaredAt: 2026-11-27
        - placeKey: US-60
          part: whole
          validFrom: 2022
          validTo: null
          basisUrl: "https://data.cdc.gov/resource/x9gk-5huc.json"
          basisQuote: "Structural, checked live 2026-11-27: AMERICAN SAMOA is a reporting area in every year 2022-2026 (Commonwealth of Northern Mariana Islands from 2025 for the Northern Mariana Islands); it is not in US RESIDENTS."
          declaredInVersion: 0.1.0
          declaredAt: 2026-11-27
        - placeKey: US-66
          part: whole
          validFrom: 2022
          validTo: null
          basisUrl: "https://data.cdc.gov/resource/x9gk-5huc.json"
          basisQuote: "Structural, checked live 2026-11-27: GUAM is a reporting area in every year 2022-2026 (Commonwealth of Northern Mariana Islands from 2025 for the Northern Mariana Islands); it is not in US RESIDENTS."
          declaredInVersion: 0.1.0
          declaredAt: 2026-11-27
        - placeKey: US-69
          part: whole
          validFrom: 2022
          validTo: null
          basisUrl: "https://data.cdc.gov/resource/x9gk-5huc.json"
          basisQuote: "Structural, checked live 2026-11-27: NORTHERN MARIANA ISLANDS is a reporting area in every year 2022-2026 (Commonwealth of Northern Mariana Islands from 2025 for the Northern Mariana Islands); it is not in US RESIDENTS."
          declaredInVersion: 0.1.0
          declaredAt: 2026-11-27
        - placeKey: US-78
          part: whole
          validFrom: 2022
          validTo: null
          basisUrl: "https://data.cdc.gov/resource/x9gk-5huc.json"
          basisQuote: "Structural, checked live 2026-11-27: U.S. VIRGIN ISLANDS is a reporting area in every year 2022-2026 (Commonwealth of Northern Mariana Islands from 2025 for the Northern Mariana Islands); it is not in US RESIDENTS."
          declaredInVersion: 0.1.0
          declaredAt: 2026-11-27
        - placeKey: US-36
          part: counties
          counties: [US-36001, US-36003, US-36007, US-36009, US-36011, US-36013, US-36015, US-36017, US-36019, US-36021, US-36023, US-36025, US-36027, US-36029, US-36031, US-36033, US-36035, US-36037, US-36039, US-36041, US-36043, US-36045, US-36049, US-36051, US-36053, US-36055, US-36057, US-36059, US-36063, US-36065, US-36067, US-36069, US-36071, US-36073, US-36075, US-36077, US-36079, US-36083, US-36087, US-36089, US-36091, US-36093, US-36095, US-36097, US-36099, US-36101, US-36103, US-36105, US-36107, US-36109, US-36111, US-36113, US-36115, US-36117, US-36119, US-36121, US-36123]
          validFrom: 2022
          validTo: null
          basisUrl: "https://data.cdc.gov/resource/x9gk-5huc.json"
          basisQuote: "Structural, checked 2026-11-24: NEW YORK and NEW YORK CITY are separate reporting areas, and the 51 state and DC rows plus New York City add up to US RESIDENTS, so NEW YORK is New York State without New York City (the counties listed are New York's 62 Census counties less the five boroughs: Bronx 005, Kings 047, New York 061, Queens 081, Richmond 085)."
          declaredInVersion: 0.1.0
          declaredAt: 2026-11-27
        - placeKey: US-36/nyc
          part: whole
          validFrom: 2022
          validTo: null
          basisUrl: "https://data.cdc.gov/resource/x9gk-5huc.json"
          basisQuote: "Structural, checked live 2026-11-27: NEW YORK CITY is a reporting area in every year 2022-2026."
          declaredInVersion: 0.1.0
          declaredAt: 2026-11-27
  - {property: licence, value: public-domain-us-federal}
  - {property: citation, value: "Centers for Disease Control and Prevention. National Notifiable Diseases Surveillance System (NNDSS). NNDSS Weekly Data. https://data.cdc.gov/d/x9gk-5huc"}
  - {property: refresh, value: weekly}
  - property: rawLoad
    value: {mode: snapshot}
    description: "Each refresh stores the complete table as a dated, append-only load. Incremental loading (only rows new or changed since the last load) waits for a reviewed row key and the publisher's update field."
  - {property: geographyBasis, value: "patient residence: cases are assigned to the jurisdiction where the patient usually lives (dataset notes)"}
  - {property: unreliableRule, value: {kind: none, description: "None: the publisher marks no counts as unreliable and publishes no rates. Empty counts carry a flag ('-' no reported cases; U, N, NN, NP, NC)."}}
  - property: openQuestions
    value:
      - "Is next year's prior-year year-to-date (m4) a like-for-like restatement of a year's own year-to-date (m3)? Nothing in the codebook says so, and for Candida auris, clinical they differ widely (m3 at the year's last week vs next year's m4 at its last week, live data 2026-11-24: California 2023 1275 vs 551; Georgia 2023 390 vs 191; Georgia 2024 651 vs 365; Michigan 2023 103 vs 110). Until a domain reviewer answers (semantic resolution_policy: require_domain_review), both are returned as separate observations (year_end_ytd, provisional; subsequent_year_restatement, unverified_restatement) and neither is called final."
      - "Supporting evidence for the reviewer on the m3/m4 question, not a verification: for Michigan 2024, CDC's C. auris tracking page shows 184 clinical cases; NNDSS clinical is 174 at year end (m3) and 184 in the next year's table (m4); NNDSS screening is 643 at year end and 689 restated (spec research, branch claude/cauris-source-contracts, commit 1e4740c, docs/sources/c-auris/; not in this branch, not re-checked here). One matching state-year does not show the two count the same thing, and the California 2023 gap (1275 vs 551) is unexplained, so resolution_policy stays require_domain_review."
      - "Case definition for Candida auris: CSTE position statement 22-ID-05, CDC's 2023 case definition at https://ndc.services.cdc.gov/case-definitions/candida-auris-2023/ (found 2026-11-25 on the case-definition site the dataset notes cite; it defines the clinical and screening subtypes the notIncidence declaration quotes). Maintainer to confirm and add it as an authoritativeDefinitions link. A note, not a blocker: the notIncidence declaration stands on the maintainer's review."
      - "A year-to-date that had a number and later weeks show only '-' (e.g. Minnesota, Candida auris, clinical, 2025: 1 through week 38, '-' for weeks 39-53): withdrawn, reset or missing? Reported as incomplete until answered."
      - "Licence: the Socrata metadata has no licence field for this dataset; public-domain-us-federal is assumed from its being a CDC work. Maintainer to confirm."
      - "The provisional footnote names reporting years 2024 and 2025; the provisional status of 2026 and the finalization date of earlier years are not stated in the dataset metadata."
      - "Should the adapter normalize the 2025+ title-case reporting-area names to the 2022-2024 upper-case form, or the reverse? Filters on states are case-sensitive today."
      - "Mapping Candida auris screening (colonization) to GBD Candida spp. / Other infectious diseases is a coarse pairing; colonization is not disease. Keep, or map screening to no GBD cause?"
      - "Three conditions are published under two spellings ('Salmonella Paratyphi infection' / 'SalmonellaParatyphi infection'; 'Hepatitis B, acute' / 'Hepatitis, B, acute'; 'Coccidioidomycosis, total' / 'Coccidioidomycosis, Total'), apparently in different years. Is each pair one condition, so the spellings can be read as one series? Until a maintainer declares it, every spelling is returned as its own series with a note naming the others, and they are never added."
      - "Earlier NNDSS weekly years (before 2022) sit in separate per-table Socrata datasets; not covered by this contract."
