# Output port contract: the index of ID conference abstracts (product id-conference-abstracts). Private tier
# until a maintainer records that its sources' metadata may be published (the open question below); only
# then does it become public. A draft stub: its sources are on unmerged pull requests (#29, #30).
apiVersion: v3.2.0
kind: DataContract
id: id_abstracts_index
name: ID conference abstracts, index
version: 0.1.0
status: draft
domain: research_landscape
description:
  purpose: One index of infectious disease conference abstracts across conferences, so a fellow can see what has
    been presented on a condition, place or year, and follow each abstract's link or DOI to read it.
  usage: Each row is one abstract in one conference year, with its title, authors, link and DOI where it has one.
    The abstract itself is read at its link; this port never holds abstract text.
  limitations: Metadata only, never abstract text (that is the private-tier port id_abstracts_text). Not a
    peer-reviewed literature index; many abstracts are never published in full. Condition, organism and place
    tags are proposed by dictionary matching and are not facts until a maintainer accepts them.
schema:
- name: id_abstracts_index
  physicalName: id_abstracts_index
  physicalType: table
  logicalType: object
  description: One row per abstract, conference and conference year. Rows from different conferences are listed
    side by side, never combined into counts.
  dataGranularityDescription: conference x year x abstract, keyed by abstract_key (DOI where there is one, else
    the conference's own abstract number)
  customProperties:
  - property: totalRows
    value: none
  - property: tableShape
    value: registry
  properties:
  - name: abstract_key
    physicalType: VARCHAR
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: One abstract, once. Its DOI where it has one, else conference:year:abstract number, so an
      abstract found both through its DOI and on the conference's own site is still one row.
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    quality:
    - name: abstract_key_not_null
      description: Every abstract has its key.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
    - name: abstract_key_unique
      description: No abstract appears twice.
      type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
      customProperties:
      - {property: dbtTest, value: unique}
  - name: conference
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: Which conference the abstract was presented at, by the source's own conference code (e.g. idweek,
      shea, apic, icid, croi).
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    quality:
    - name: conference_not_null
      description: Every abstract names the conference it was presented at.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: year
    physicalType: INTEGER
    logicalType: integer
    required: true
    description: The conference year the abstract was presented in.
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_time, grain: year}
    quality:
    - name: year_not_null
      description: Every abstract has its conference year.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: route
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: 'How the record was found: doi (the journal supplement''s DOI metadata from Crossref, OpenAlex and
      Europe PMC) or site (the conference''s own abstract pages, e.g. CROI). It decides which licence and provenance
      apply.'
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    quality:
    - name: route_not_null
      description: Every row says how the record was found.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
    - name: route_accepted_values
      description: How the record was found is doi or site.
      type: library
      metric: invalidValues
      arguments: {validValues: [doi, site]}
      mustBe: 0
      dimension: conformity
      severity: error
      customProperties:
      - {property: dbtTest, value: accepted_values}
  - name: source_dataset
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The catalogued source the row comes from (e.g. idweek_abstracts, croi_abstracts_index), whose
      contract, licence and caveats apply to it.
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    quality:
    - name: source_dataset_not_null
      description: Every row names the catalogued source it came from.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: abstract_number
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: The abstract or poster number the conference gives it, as published; empty where the source
      doesn't show one.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
  - name: title
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The abstract's title as published.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: title_not_null
      description: Every abstract has its title.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: authors
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: Authors' names exactly as the source lists them.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
  - name: doi
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: The abstract's DOI, for abstracts published in a journal supplement; empty for abstracts that
      have none (e.g. CROI).
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: doi_fill_rate
      description: Some rows have a DOI; a column left empty on every row means the matching failed.
        The real fill rate to expect is an open question until rows are seen.
      type: library
      metric: nullValues
      unit: percent
      mustBeLessThan: 100
      dimension: completeness
      severity: warn
      customProperties:
      - {property: dbtTest, value: dbt_utils.not_null_proportion}
  - name: link_url
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: Where to read the abstract, the DOI link or the conference's abstract page.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: link_url_not_null
      description: Every abstract has a link to read it at its source.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: condition_concept_ids
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: Conditions the abstract is about, as MeSH descriptor ids separated by '; ', the same ids the
      surveillance contracts use. Proposed by dictionary matching over the title; not a fact until accepted.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_concept, vocabulary: MeSH, assignment: dictionary_proposed,
              reviewStateColumn: concept_tag_state}
    quality:
    - name: condition_concept_ids_fill_rate
      description: Some rows have a condition tag; a column left empty on every row means the matching failed.
        The real fill rate to expect is an open question until rows are seen.
      type: library
      metric: nullValues
      unit: percent
      mustBeLessThan: 100
      dimension: completeness
      severity: warn
      customProperties:
      - {property: dbtTest, value: dbt_utils.not_null_proportion}
  - name: organism_taxon_ids
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: Organisms the abstract names, as NCBI Taxonomy ids separated by '; '. Proposed by dictionary
      matching; not a fact until accepted.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_concept, vocabulary: NCBI Taxonomy, assignment: dictionary_proposed,
              reviewStateColumn: concept_tag_state}
    quality:
    - name: organism_taxon_ids_fill_rate
      description: Some rows have an organism tag; a column left empty on every row means the matching failed.
        The real fill rate to expect is an open question until rows are seen.
      type: library
      metric: nullValues
      unit: percent
      mustBeLessThan: 100
      dimension: completeness
      severity: warn
      customProperties:
      - {property: dbtTest, value: dbt_utils.not_null_proportion}
  - name: place_keys
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: Places the abstract names, as FIPS codes (US) or ISO3 country codes separated by '; '; empty when
      it names none. Proposed by dictionary matching; not a fact until accepted.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_place, vocabulary: FIPS/ISO3, assignment: dictionary_proposed,
              reviewStateColumn: place_tag_state}
    quality:
    - name: place_keys_fill_rate
      description: Some rows have a place tag; a column left empty on every row means the matching failed.
        The real fill rate to expect is an open question until rows are seen.
      type: library
      metric: nullValues
      unit: percent
      mustBeLessThan: 100
      dimension: completeness
      severity: warn
      customProperties:
      - {property: dbtTest, value: dbt_utils.not_null_proportion}
  - name: concept_tag_state
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: 'One review state for all of the row''s condition and organism tags together: proposed
      (dictionary match, not reviewed), accepted or rejected (by a maintainer). A maintainer accepts or rejects
      them as a set, not tag by tag; only a row whose state is accepted has its tags answered as facts.'
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: concept_tag_state_not_null
      description: Every row records whether its condition and organism tags were reviewed.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
    - name: concept_tag_state_accepted_values
      description: The condition and organism tags' review state is proposed, accepted or rejected.
      type: library
      metric: invalidValues
      arguments: {validValues: [proposed, accepted, rejected]}
      mustBe: 0
      dimension: conformity
      severity: error
      customProperties:
      - {property: dbtTest, value: accepted_values}
  - name: place_tag_state
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: 'Review state of the place tags: proposed, accepted or rejected, as for concept_tag_state.'
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: place_tag_state_not_null
      description: Every row records whether its place tags were reviewed.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
    - name: place_tag_state_accepted_values
      description: The place tags' review state is proposed, accepted or rejected.
      type: library
      metric: invalidValues
      arguments: {validValues: [proposed, accepted, rejected]}
      mustBe: 0
      dimension: conformity
      severity: error
      customProperties:
      - {property: dbtTest, value: accepted_values}
  - name: source_url
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The address the record was read from.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: source_url_not_null
      description: Every row records the address it was read from.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: raw_sha256
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: sha256 of the raw bytes the record was read from, so anyone can check it against the source.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: raw_sha256_not_null
      description: Every row records the fingerprint (sha256) of the file it was read from.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: retrieved_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    required: true
    description: When the record was read from its source (UTC).
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: retrieved_at_not_null
      description: Every row records when it was read from the publisher.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
customProperties:
- property: tier
  value: private
- property: unreliableRule
  value:
    kind: none
    description: 'None: an index of abstracts holds no rates or counts, so no value is marked unreliable.'
- property: fingerprints
  value:
  - {version: 0.1.0, interface: e81f59526f0142309383e42b1247d19aefe937731e0922532751f0d4cedf1a22, docs: f5e8e55b18a46c54a943de5417964c13dca7765d632b0908f70195e455e3c70d}
- property: openQuestions
  value:
  - 'May the index (titles, authors, links, DOIs) be published? The DOI sources record their metadata as from
    Crossref ("free to use") and OpenAlex (CC0) in their licenceNote, but are catalogued redistribution: false
    (PR #29); whether CROI''s metadata may be redistributed is the maintainer''s call (PR #30). Until answered the
    port is not hosted.'
  - 'Fills from PR #29 (idweek_abstracts, shea_abstracts, apic_abstracts, icid_abstracts) and PR #30
    (croi_abstracts_index) once they merge; ESCMID and other conferences join as they are catalogued.'
  - The concept and place dimensions (dim_concept, dim_place, dim_time) come from the silver stage on
    feat/contract-silver; confirm their names when that lands.
  - 'Tier: private until a maintainer records that every source''s licence allows a public copy of titles, authors, links and DOIs (validate refuses a public port with any other licence); then tier public.'
  - 'Tags: the condition, organism and place lists share one review state per row and are separated by ''; ''. A bridge table (one row per abstract and tag, each with its own review state) is a follow-up.'
  - 'Fill rates: the share of rows expected to have a DOI and each kind of tag is set once real rows are seen; until then the warn rules only catch a column left empty on every row.'
