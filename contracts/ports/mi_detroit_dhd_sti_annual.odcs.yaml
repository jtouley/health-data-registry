# Output port contract: mi_detroit_dhd_sti_annual (product michigan-hiv). A draft stub: its source is catalogued
# (read live, never stored); its columns and measures are not declared yet, and nothing is hosted. Every
# number-changing fact is an open question (hard rule 1).
apiVersion: v3.2.0
kind: DataContract
id: mi_detroit_dhd_sti_annual
name: "Detroit Health Department yearly STI figures (Epidemiology Dashboard)"
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "The Detroit Health Department Epidemiology Dashboard's yearly figures for chlamydia and syphilis (catalogued on PR #19 as detroit_dhd_epi_annual), kept as their own series."
  usage: One series of the Michigan HIV product, read on its own with its own counted unit; never added to or merged
    with another port's figures.
  limitations: 'Draft stub. Data kind: unresolved until the HIV charts are read. Measures and their counted unit are declared only from the
    publisher''s own codebook once the source is catalogued.'
schema:
- name: mi_detroit_dhd_sti_annual
  physicalName: mi_detroit_dhd_sti_annual
  physicalType: table
  logicalType: object
  description: One row per place, period and published figure (indicator), as the publisher lays it out (to
    be confirmed).
  customProperties:
  - property: totalRows
    value: none
  - property: tableShape
    value: unresolved
  quality:
  - name: mi_detroit_dhd_sti_annual_one_row_per_place_period_indicator
    description: Each place, period and published figure appears once.
    type: library
    metric: duplicateValues
    arguments: {properties: [place, period, indicator]}
    mustBe: 0
    dimension: uniqueness
    severity: error
    customProperties:
    - {property: dbtTest, value: dbt_utils.unique_combination_of_columns}
  properties:
  - name: place
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The place exactly as the publisher names it. Detroit and Out-Wayne stay separate rows wherever the
      publisher splits them; they are never added together here.
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    quality:
    - name: place_not_null
      description: Every figure names its place.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: place_key
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: The place's FIPS code, from a reviewed mapping of the publisher's place name; empty where the place
      has no FIPS code of its own (e.g. Out-Wayne).
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_place, vocabulary: FIPS/ISO3, assignment: reviewed_mapping}
    quality:
    - name: place_key_fill_rate
      description: Some rows have a place code; a column left empty on every row means the matching failed.
        The real fill rate to expect is an open question until rows are seen.
      type: library
      metric: nullValues
      unit: percent
      mustBeLessThan: 100
      dimension: completeness
      severity: warn
      customProperties:
      - {property: dbtTest, value: dbt_utils.not_null_proportion}
  - name: period
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The time the figure covers, as the publisher states it (e.g. a calendar year).
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_time, grain: as_published}
    quality:
    - name: period_not_null
      description: Every figure states the time it covers.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: indicator
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: Which published figure the row is, by the publisher's own label (e.g. new HIV diagnoses), so two
      figures for the same place and period are never mistaken for one another.
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    quality:
    - name: indicator_not_null
      description: Every figure names what it counts.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: condition_concept_id
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: The condition the figure is about, as a MeSH descriptor id (the id the surveillance contracts
      use), from a reviewed mapping of the publisher's label.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_concept, vocabulary: MeSH, assignment: reviewed_mapping}
    quality:
    - name: condition_concept_id_fill_rate
      description: Some rows have a condition id; a column left empty on every row means the matching failed.
        The real fill rate to expect is an open question until rows are seen.
      type: library
      metric: nullValues
      unit: percent
      mustBeLessThan: 100
      dimension: completeness
      severity: warn
      customProperties:
      - {property: dbtTest, value: dbt_utils.not_null_proportion}
  - name: source_url
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The address the figure was read from.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: source_url_not_null
      description: Every row records the address it was read from.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: raw_sha256
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: sha256 of the raw bytes the figure was read from.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: raw_sha256_not_null
      description: Every row records the fingerprint (sha256) of the file it was read from.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: retrieved_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    required: true
    description: When the figure was read from the publisher (UTC).
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: retrieved_at_not_null
      description: Every row records when it was read from the publisher.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
customProperties:
- property: tier
  value: private
- property: dataKind
  value: 'unresolved: surveillance for the chlamydia and syphilis charts; the HIV charts, not read yet, may hold Ryan White programme data'
- property: countedUnit
  value: 'unresolved: from the publisher''s codebook once catalogued'
- property: unreliableRule
  value:
    kind: unresolved
    description: 'Not read yet for this port. Its source detroit_dhd_epi_annual states no rule for the chlamydia and syphilis yearly charts it read, but the HIV and gonorrhea charts were not read, and other charts on the dashboard show <6 for small counts. Never read as no suppression.'
- property: fingerprints
  value:
  - {version: 0.1.0, interface: 5a6a02db897d4495a72bd25995c9d0f969f28b0a99b2564ae8018c4112a2ea59, docs: 2f6187fcf573e2cda912d375de85a3f5eed0e57c10d3a4535410d7a9514e206c}
- property: openQuestions
  value:
  - 'Reads detroit_dhd_epi_annual, catalogued in PR #19 (merged). Its HIV and gonorrhea yearly charts were not read on 2026-11-24; HIV figures there may include Ryan White programme data and must then be labelled as programme data.'
  - 'Rate denominator, case definitions and geography basis are open questions in that contract; they apply here unchanged.'
  - 'The dashboard shows Detroit and Michigan (Michigan includes Detroit); Out-Wayne is not shown.'
  - 'Suppression: the publisher''s rule for small or unreliable values (e.g. cells shown as <6 or blank) is read from its own notes before any figure is served; until then unreliableRule is unresolved.'
  - 'Period: how each published period (a calendar year, a span such as 2019-2023, a fiscal year) maps to dim_time is declared from the publisher''s notes, e.g. as period_start and period_end; period stays the published text.'
  - 'Fill rates: the share of rows expected to have place_key and condition_concept_id is set once real rows are seen; until then the warn rules only catch a column left empty on every row.'
  - 'Data kind per row: once columns are declared, a data_kind column (surveillance or programme) labels each row, since the HIV charts may mix the two.'
