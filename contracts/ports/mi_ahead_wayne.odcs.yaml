# Output port contract: mi_ahead_wayne (product michigan-hiv). A draft stub: its source is not catalogued yet, so no
# measure is declared and nothing is hosted. Every number-changing fact is an open question (hard rule 1).
apiVersion: v3.2.0
kind: DataContract
id: mi_ahead_wayne
name: "AHEAD: America's HIV Epidemic Analysis Dashboard, Wayne County"
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "AHEAD's indicators for Wayne County, Michigan, each kept as its own series."
  usage: One series of the Michigan HIV product, read on its own with its own counted unit; never added to or merged
    with another port's figures.
  limitations: 'Draft stub. Data kind: unresolved: which AHEAD indicators are surveillance and which are programme data is read from AHEAD''s own definitions. Measures and their counted unit are declared only from the
    publisher''s own codebook once the source is catalogued.'
schema:
- name: mi_ahead_wayne
  physicalName: mi_ahead_wayne
  physicalType: table
  logicalType: object
  description: One row per place, period and published figure (indicator), as the publisher lays it out (to
    be confirmed).
  customProperties:
  - property: totalRows
    value: none
  - property: tableShape
    value: unresolved
  quality:
  - name: mi_ahead_wayne_one_row_per_place_period_indicator
    description: Each place, period and published figure appears once.
    type: library
    metric: duplicateValues
    arguments: {properties: [place, period, indicator]}
    mustBe: 0
    dimension: uniqueness
    severity: error
    customProperties:
    - {property: dbtTest, value: dbt_utils.unique_combination_of_columns}
  properties:
  - name: place
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The place exactly as the publisher names it. Detroit and Out-Wayne stay separate rows wherever the
      publisher splits them; they are never added together here.
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    quality:
    - name: place_not_null
      description: Every figure names its place.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: place_key
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: The place's FIPS code, from a reviewed mapping of the publisher's place name; empty where the place
      has no FIPS code of its own (e.g. Out-Wayne).
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_place, vocabulary: FIPS/ISO3, assignment: reviewed_mapping}
    quality:
    - name: place_key_fill_rate
      description: Some rows have a place code; a column left empty on every row means the matching failed.
        The real fill rate to expect is an open question until rows are seen.
      type: library
      metric: nullValues
      unit: percent
      mustBeLessThan: 100
      dimension: completeness
      severity: warn
      customProperties:
      - {property: dbtTest, value: dbt_utils.not_null_proportion}
  - name: period
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The time the figure covers, as the publisher states it (e.g. a calendar year).
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_time, grain: as_published}
    quality:
    - name: period_not_null
      description: Every figure states the time it covers.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: indicator
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: Which published figure the row is, by the publisher's own label (e.g. new HIV diagnoses), so two
      figures for the same place and period are never mistaken for one another.
    customProperties:
    - property: role
      value: dimension
    - property: tier
      value: public
    quality:
    - name: indicator_not_null
      description: Every figure names what it counts.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: condition_concept_id
    physicalType: VARCHAR
    logicalType: string
    required: false
    description: The condition the figure is about, as a MeSH descriptor id (the id the surveillance contracts
      use), from a reviewed mapping of the publisher's label.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    - property: conformedKey
      value: {dimension: dim_concept, vocabulary: MeSH, assignment: reviewed_mapping}
    quality:
    - name: condition_concept_id_fill_rate
      description: Some rows have a condition id; a column left empty on every row means the matching failed.
        The real fill rate to expect is an open question until rows are seen.
      type: library
      metric: nullValues
      unit: percent
      mustBeLessThan: 100
      dimension: completeness
      severity: warn
      customProperties:
      - {property: dbtTest, value: dbt_utils.not_null_proportion}
  - name: source_url
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The address the figure was read from.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: source_url_not_null
      description: Every row records the address it was read from.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: raw_sha256
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: sha256 of the raw bytes the figure was read from.
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: raw_sha256_not_null
      description: Every row records the fingerprint (sha256) of the file it was read from.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
  - name: retrieved_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    required: true
    description: When the figure was read from the publisher (UTC).
    customProperties:
    - property: role
      value: attribute
    - property: tier
      value: public
    quality:
    - name: retrieved_at_not_null
      description: Every row records when it was read from the publisher.
      type: library
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      customProperties:
      - {property: dbtTest, value: not_null}
customProperties:
- property: tier
  value: private
- property: dataKind
  value: 'unresolved: which AHEAD indicators are surveillance and which are programme data is read from AHEAD''s own definitions'
- property: countedUnit
  value: 'unresolved: from the publisher''s codebook once catalogued'
- property: unreliableRule
  value:
    kind: unresolved
    description: 'Not read yet: whether and how the publisher suppresses or flags small or unreliable values is an open question, so the port stays an unserved stub. Never read as no suppression.'
- property: fingerprints
  value:
  - {version: 0.1.0, interface: 72980736435270399e58385644e81ba2bd3224b291ffdf2a227a1c648d62726e, docs: 4fe0f924bb9154ad4bd299bb2d399d852aec2469f3656c34131b2157f9ce9e95}
- property: openQuestions
  value:
  - 'Not catalogued yet: waits for tasks 78-80 and the AHEAD download.'
  - 'Licence: AHEAD''s terms of reuse are not yet read; until they are, nothing is hosted.'
  - 'countedUnit: each AHEAD indicator''s unit (count, percent, rate) comes from AHEAD''s own definitions.'
  - 'Does AHEAD split Detroit from Out-Wayne? Where it does, they stay separate series.'
  - 'Suppression: the publisher''s rule for small or unreliable values (e.g. cells shown as <6 or blank) is read from its own notes before any figure is served; until then unreliableRule is unresolved.'
  - 'Period: how each published period (a calendar year, a span such as 2019-2023, a fiscal year) maps to dim_time is declared from the publisher''s notes, e.g. as period_start and period_end; period stays the published text.'
  - 'Fill rates: the share of rows expected to have place_key and condition_concept_id is set once real rows are seen; until then the warn rules only catch a column left empty on every row.'
