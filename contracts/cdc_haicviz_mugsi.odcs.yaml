apiVersion: v3.2.0
kind: DataContract
id: cdc_haicviz_mugsi
name: HAICViz - MuGSI
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "Annual case and death rates for carbapenem-resistant Enterobacterales (CRE) and carbapenem-resistant Acinetobacter baumannii (CRAB) from the Multi-site Gram-negative Surveillance Initiative of CDC's Emerging Infections Program, pooled across EIP sites (dataset description, https://data.cdc.gov/api/views/v4tm-h8pe.json; https://www.cdc.gov/healthcare-associated-infections/php/haic-eip/mugsi.html)."
  usage: "Read one organism, topic, view, stratum and year as published, or follow one over the years. Never add rates, never add CRE to CRAB, and never add across age groups, sexes, culture sources or organisms."
  limitations: "EIP sites only, pooled, no state breakdown; data through 2022; the Socrata metadata has no column descriptions or unit, so most meanings below come from the published labels and CDC's MuGSI page."
  authoritativeDefinitions:
    - {type: canonicalUrl, url: "https://data.cdc.gov/d/v4tm-h8pe", description: "Publisher dataset page"}
    - {type: businessDefinition, url: "https://data.cdc.gov/api/views/v4tm-h8pe.json", description: "Socrata metadata (dataset description; columns have no descriptions), read 2026-11-25"}
    - {type: businessDefinition, url: "https://www.cdc.gov/healthcare-associated-infections/php/haic-eip/mugsi.html", description: "CDC's MuGSI page: the organisms, active population- and laboratory-based case finding in EIP sites, incidence as cases per 100,000 persons, read 2026-11-25"}
    - {type: businessDefinition, url: "https://www.cdc.gov/ncezid/dpei/eip/eip-sites.html", description: "EIP site network, linked from the dataset description (not fetched)"}
servers:
  - id: data_cdc_gov
    server: data.cdc.gov
    type: api
    location: https://data.cdc.gov/resource/v4tm-h8pe.json
schema:
  - name: cdc_haicviz_mugsi
    physicalName: cdc_haicviz_mugsi
    physicalType: table
    logicalType: object
    description: "Long table: one published rate for the Emerging Infections Program sites combined (not a state, not the United States) per year x organism x topic x view x stratum."
    dataGranularityDescription: "yearname x organism x topic x viewby x series (the primary key, unique on the full table, 341 rows, 2026-11-25)"
    authoritativeDefinitions:
      - {type: businessDefinition, url: "https://data.cdc.gov/api/views/v4tm-h8pe.json"}
    customProperties:
      - property: totalRows
        value: "series = 'All cases'"
        description: "Rows labelled 'All cases' by CDC (every distinct organism, topic, viewby and series checked on the full table, 341 rows, 2026-11-25): the overall row (viewby 'All cases'), and the 'All cases' row inside the Culture source view and, for CRE, the Organism view. The Age and Sex views have no 'All cases' row. Whether the groups of a view add up to it is not stated; nothing here is ever added."
      - {property: tableShape, value: rate_table}
      - property: idDimensions
        value:
          condition: organism
          caseDefinition: null
          caseStatus: null
          organismResistance: organism
          period: yearname
          provisionalFlag: null
        description: "Two organisms, each a resistance phenotype as CDC names it (CRE, CRAB), in the organism column. The species inside CRE appear in series under viewby 'Organism'. The MuGSI case definition is in CDC's annual reports, not the data. No case status or provisional column."
    properties:
      - name: yearname
        physicalType: BIGINT
        logicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "Surveillance year (2012 to 2022 on 2026-11-25)."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: yearname}
      - name: organism
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "The organism, as CDC abbreviates it: CRE (carbapenem-resistant Enterobacterales) or CRAB (carbapenem-resistant Acinetobacter baumannii)."
        enum: [{value: CRE}, {value: CRAB}]
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: organism}
        quality:
          - id: organism_is_cre_or_crab
            dimension: conformity
            severity: warn
            type: library
            metric: invalidValues
            arguments: {validValues: ["CRE", "CRAB"]}
            mustBe: 0
            description: "Every distinct organism on the full table (341 rows, 2026-11-25) is CRE or CRAB, the two organisms CDC's MuGSI page names for this table. A new one (MuGSI also follows ESBL-producing Enterobacterales) is reported here and in the unmapped-label queue for review rather than stopping the build."
      - name: topic
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        description: "What the figure measures: Case Rates (new cases per population) or Death Rates (deaths among people with the infection, per population)."
        enum: [{value: Case Rates}, {value: Death Rates}]
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: topic}
        quality:
          - id: topic_is_case_or_death_rates
            dimension: conformity
            severity: warn
            type: library
            metric: invalidValues
            arguments: {validValues: ["Case Rates", "Death Rates"]}
            mustBe: 0
            description: "Every distinct topic on the full table (341 rows, 2026-11-25) is 'Case Rates' or 'Death Rates'. Every metric filters on these exact labels, so a relabel is reported here instead of making a metric return nothing."
      - name: viewby
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 4
        description: "Which breakdown the row belongs to: All cases, Age, Sex, Culture source (blood, urine or another site), or Organism (the species inside CRE). Each view covers the same cases again."
        enum: [{value: All cases}, {value: Age}, {value: Sex}, {value: Culture source}, {value: Organism}]
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: viewby}
        quality:
          - id: viewby_labels_known
            dimension: conformity
            severity: warn
            type: library
            metric: invalidValues
            arguments: {validValues: ["All cases", "Age", "Sex", "Culture source", "Organism"]}
            mustBe: 0
            description: "Every distinct viewby on the full table (341 rows, 2026-11-25) is one of these five. The headline metrics filter on viewby 'All cases', so a relabel is reported here."
      - name: series
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 5
        description: "The group the rate is for: All cases, an age group (such as 65-79 years), Female or Male, a culture source (Blood, Urine, Other site or Other sterile site), or a species inside CRE (such as Klebsiella pneumoniae)."
        examples: ["All cases", "80+ years", "Female", "Blood", "Urine", "Klebsiella pneumoniae"]
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: series}
      - name: value
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "The published rate for the row's organism, topic and group, as CDC gives it (cases or deaths per 100,000 population on CDC's MuGSI page; the table itself states no unit). Every row had one on 2026-11-25, and an empty one is never read as zero."
        customProperties:
          - {property: role, value: measure}
          - {property: sourceField, value: value}
          - {property: unit, value: "/100000 (CDC's MuGSI page; not stated in the table)"}
        quality:
          - id: rates_not_negative
            dimension: conformity
            severity: error
            type: sql
            description: "Every topic is a rate (Case Rates, Death Rates), and a rate of cases or deaths is never negative."
            query: "SELECT COUNT(*) FROM {object} WHERE value < 0"
            mustBe: 0
          - id: case_rates_present
            dimension: completeness
            severity: error
            type: sql
            description: "Fill rate for the Case Rates rows that rates_not_negative reads: an all-empty subset passes it, so at least one case rate must carry a value (all 319 did on 2026-11-25)."
            query: "SELECT COUNT(*) FROM {object} WHERE topic = 'Case Rates' AND value IS NOT NULL"
            mustBeGreaterThan: 0
          - id: death_rates_present
            dimension: completeness
            severity: warn
            type: sql
            description: "Fill rate for the Death Rates rows that rates_not_negative reads: at least one death rate carries a value (all 22 did on 2026-11-25)."
            query: "SELECT COUNT(*) FROM {object} WHERE topic = 'Death Rates' AND value IS NOT NULL"
            mustBeGreaterThan: 0
    quality:
      - id: one_row_per_year_and_stratum
        dimension: uniqueness
        severity: error
        type: sql
        description: "Grain: one published rate per year, organism, topic, view and stratum (an exact structural fact of the full table, 341 rows, on 2026-11-25). A repeat would mean two figures for one cell."
        query: "SELECT COUNT(*) FROM (SELECT yearname, organism, topic, viewby, series FROM {object} GROUP BY yearname, organism, topic, viewby, series HAVING COUNT(*) > 1)"
        mustBe: 0
customProperties:
  - {property: licence, value: public-domain-us-federal}
  - {property: licenceSource, value: "No licence field in the Socrata metadata (read 2026-11-25). A CDC work on data.cdc.gov, a US federal work under 17 USC 105. A maintainer confirms the wording (see openQuestions)."}
  - {property: citation, value: "Centers for Disease Control and Prevention, Emerging Infections Program HAIC. HAICViz - MuGSI. https://data.cdc.gov/d/v4tm-h8pe"}
  - {property: refresh, value: annual}
  - property: rawLoad
    value: {mode: snapshot}
    description: "Each refresh stores the complete table as a dated, append-only load. Incremental loading waits for a reviewed row key and the publisher's update field."
  - {property: geographyBasis, value: "the Emerging Infections Program sites that run MuGSI, combined; no state values; which counties, and when they changed, is not in the data (see openQuestions)"}
  - {property: rateDenominator, value: "unresolved: per 100,000 population on CDC's MuGSI page, not stated in the table; which population estimates and which sites each year are not stated (see openQuestions)"}
  - {property: unreliableRule, value: {kind: none, description: "None stated: data.cdc.gov publishes no codebook or small-number rule for these MuGSI figures, and no value is marked unreliable (see openQuestions)."}}
  - property: openQuestions
    value:
      - "Licence: no licence field in the Socrata metadata (2026-11-25); public-domain-us-federal is assumed from its being a CDC work. A maintainer confirms the wording."
      - "Unit and denominator: the table states no unit. CDC's MuGSI page gives incidence in cases per 100,000 persons; is every value here per 100,000 catchment residents, which census estimates are used, and are the rates crude? Assumed crude per 100,000, not confirmed from the table."
      - "Which EIP sites and counties run MuGSI for CRE and for CRAB each year, and when did the catchment change? The CRE case rate jumps from 2.96 (2015) to 7.92 (2016): a change in sites, case definition or method? Must come from the MuGSI reports, not inferred."
      - "Case definition: CRE and CRAB as MuGSI defines them (carbapenem resistance criteria, incident-case window, specimen sources) and the years each applies are in CDC's annual reports, not the data; add as caseDefinitions after a maintainer reads them."
      - "Death Rates: deaths among cases within what window (in hospital, 30 days)? Not stated in the table."
      - "Do the groups of one view add up to its 'All cases' row (age groups, sexes, culture sources, CRE species)? Not stated. totalRows marks the labelled totals and nothing is added."
      - "Data end in 2022 although CDC's MuGSI page reports 2023 (checked 2026-11-25). Coverage after 2022 is unknown until the publisher says whether later years will be added here."
      - "Revision policy: are earlier years revised in later releases (rowsUpdatedAt 2025-09-06)?"
      - "Proposed GBD keys: none. MuGSI counts isolates from several sites (blood, urine, other), so CRE and CRAB span several GBD causes; GBD models Acinetobacter baumannii and the Enterobacterales species as pathogens under several causes. A maintainer decides whether any mapping is meaningful."
