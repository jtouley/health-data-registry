# ODPS data product: the open health data hub on Hugging Face, and the output ports it serves. Each port is one
# catalogued source; its contract is the ODCS file in this folder whose id is the port's contractId. Follows the
# Bitol ODPS v1.1.0.
# tests/test_publish.py checks every port against the catalog and contracts, so the two never drift apart.
apiVersion: v1.1.0
kind: DataProduct
id: health-data-registry-hub
name: Open health data hub
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: >-
    Public, population-level infectious disease data from CDC, WHO and other publishers, each table with its
    source, version, method and reviewed contract, so clinicians, students and epidemiologists can browse,
    preview, download or query it without running anything.
  usage: >-
    Read a hosted source's Parquet file from the Hugging Face dataset (pin a weekly release with
    @release-<run date>), or ask through the health-data-registry MCP server. Listed sources have a card but no
    data files: the MCP server reads them live from the publisher per question and keeps no copy.
  limitations: >-
    Only sources whose licence allows redistribution are hosted (US federal public domain today). Publishers'
    suppression and missing-value codes are kept exactly as published: an empty cell is never silently turned
    into a zero and is never filled in. That includes a publisher's own no-cases code (NNDSS '-'): the count stays
    empty, with its flag and meaning. Contracts are drafts until a maintainer reviews them.
tags: [public-health, infectious-disease, surveillance, open-data, weekly]
authoritativeDefinitions:
  - type: license
    url: https://github.com/jtouley/health-data-registry/blob/main/licenses/README.md
    description: >-
      Each source keeps its publisher's terms (recorded in catalog/<id>.yaml and shipped as LICENSE.md beside its
      data). The code is Apache-2.0.
inputPorts:
  - name: data-cdc-gov
    tags: [cdc, socrata]
    customProperties:
      - property: description
        value: CDC's open data portal (Socrata SODA API), read weekly over HTTPS.
      - property: license
        value: public-domain-us-federal
    authoritativeDefinitions:
      - type: canonicalUrl
        url: https://data.cdc.gov/
        description: CDC open data portal.
  - name: www2-census-gov
    tags: [census, csv]
    customProperties:
      - property: description
        value: Census Bureau population estimates files (CSV over HTTPS), read when a new vintage is released.
      - property: license
        value: public-domain-us-federal
    authoritativeDefinitions:
      - type: canonicalUrl
        url: https://www.census.gov/programs-surveys/popest.html
        description: Census Bureau Population Estimates Program.
  - name: who-gho
    tags: [who, odata]
    customProperties:
      - property: description
        value: WHO Global Health Observatory OData API, read live per request only; never mirrored or stored.
      - property: license
        value: WHO-dataset-terms
    authoritativeDefinitions:
      - type: canonicalUrl
        url: https://www.who.int/data/gho
        description: WHO Global Health Observatory.
  - name: codtableau-detroitmi-gov
    tags: [detroit, tableau]
    customProperties:
      - property: description
        value: City of Detroit Health Department Tableau Server dashboards (guest views, read in a browser) read live per request only; never mirrored or stored.
      - property: license
        value: no-terms-stated
    authoritativeDefinitions:
      - type: canonicalUrl
        url: https://codtableau.detroitmi.gov/t/DHD/
        description: City of Detroit Health Department dashboards.
  - name: mdhhstableau-public-michigan-gov
    tags: [michigan, tableau]
    customProperties:
      - property: description
        value: Michigan Department of Health and Human Services public Tableau dashboards (guest views, read in a browser), read live per request only; never mirrored or stored.
      - property: license
        value: no-terms-stated
    authoritativeDefinitions:
      - type: canonicalUrl
        url: https://mdhhstableau-public.michigan.gov/
        description: MDHHS public dashboards.
outputPorts:
  - name: cdc_haicviz_cdi
    description: HAICViz - CDI (Clostridioides difficile infection, Emerging Infections Program).
    type: tables
    version: 0.1.0
    contractId: cdc_haicviz_cdi
    customProperties:
      - {property: hosted, value: true}
  - name: cdc_haicviz_isa
    description: HAICViz - iSA (invasive Staphylococcus aureus case and death rates, Emerging Infections Program).
    type: tables
    version: 0.1.0
    contractId: cdc_haicviz_isa
    customProperties:
      - {property: hosted, value: true}
  - name: cdc_haicviz_mugsi
    description: HAICViz - MuGSI (carbapenem-resistant Enterobacterales and Acinetobacter baumannii case and death rates, Emerging Infections Program).
    type: tables
    version: 0.1.0
    contractId: cdc_haicviz_mugsi
    customProperties:
      - {property: hosted, value: true}
  - name: cdc_nhsn_ar_hai
    description: NHSN antimicrobial resistance in healthcare-associated infections, 2011-2025.
    type: tables
    version: 0.1.0
    contractId: cdc_nhsn_ar_hai
    customProperties:
      - {property: hosted, value: true}
  - name: cdc_nndss_weekly
    description: NNDSS weekly provisional counts of notifiable infectious diseases.
    type: tables
    version: 0.1.0
    contractId: cdc_nndss_weekly
    customProperties:
      - {property: hosted, value: true}
  - name: cdc_nis_child_coverage
    description: NIS-Child vaccination coverage among children 0-35 months, by vaccine, place and birth year.
    type: tables
    version: 0.1.0
    contractId: cdc_nis_child_coverage
    customProperties:
      - {property: hosted, value: true}
  - name: cdc_respnet
    description: RESP-NET hospitalization rates and clinical data (COVID-NET, FluSurv-NET, RSV-NET).
    type: tables
    version: 0.1.0
    contractId: cdc_respnet
    customProperties:
      - {property: hosted, value: true}
  - name: cdc_nssp_lab_positivity
    description: NSSP weekly commercial laboratory NAAT tests, positives and percent positive for COVID-19, influenza and RSV, by state.
    type: tables
    version: 0.1.0
    contractId: cdc_nssp_lab_positivity
    customProperties:
      - {property: hosted, value: true}
  - name: cdc_nrevss_positivity
    description: NREVSS weekly national percent of laboratory tests positive for COVID-19, influenza and RSV.
    type: tables
    version: 0.1.0
    contractId: cdc_nrevss_positivity
    customProperties:
      - {property: hosted, value: true}
  - name: cdc_schoolvaxview_kindergarten
    description: SchoolVaxView vaccination coverage and exemptions among kindergartners, by state and school year.
    type: tables
    version: 0.1.0
    contractId: cdc_schoolvaxview_kindergarten
    customProperties:
      - {property: hosted, value: true}
  - name: nchs_resp_deaths_pct
    description: NCHS provisional weekly percent of all deaths involving COVID-19, influenza and RSV, by age, sex and race and Hispanic origin, United States.
    type: tables
    version: 0.1.0
    contractId: nchs_resp_deaths_pct
    customProperties:
      - {property: hosted, value: true}
  - name: census_county_pop
    description: Census Bureau county and state resident population estimates, the denominator for rates.
    type: tables
    version: 0.1.0
    contractId: census_county_pop
    customProperties:
      - {property: hosted, value: true}
  - name: who_gho_tb_incidence
    description: WHO estimated tuberculosis incidence. Listed, not hosted (non-commercial terms).
    type: tables
    version: 0.1.0
    contractId: who_gho_tb_incidence
    customProperties:
      - {property: hosted, value: false}
  - name: detroit_dhd_epi_annual
    description: Detroit Health Department Epidemiology Dashboard, annual cases and rates for Detroit and Michigan. Private tier, not hosted (no terms of reuse stated).
    type: tables
    version: 0.1.0
    contractId: detroit_dhd_epi_annual
    customProperties:
      - {property: hosted, value: false}
      - {property: tier, value: private}
  - name: detroit_dhd_resp_ed_weekly
    description: Detroit Health Department Respiratory Virus Dashboard, weekly share of ED visits for COVID-19, influenza and RSV. Private tier, not hosted (no terms of reuse stated).
    type: tables
    version: 0.1.0
    contractId: detroit_dhd_resp_ed_weekly
    customProperties:
      - {property: hosted, value: false}
      - {property: tier, value: private}
  - name: detroit_dhd_covid_archive_daily
    description: Detroit Health Department COVID-19 Archived Dashboard, daily cases by disease date, 2020-2026. Private tier, not hosted (no terms of reuse stated).
    type: tables
    version: 0.1.0
    contractId: detroit_dhd_covid_archive_daily
    customProperties:
      - {property: hosted, value: false}
      - {property: tier, value: private}
  - name: mdhhs_measles_county
    description: MDHHS Measles Tracking Dashboard, measles cases by Michigan county. Private tier, not hosted (no terms of reuse stated).
    type: tables
    version: 0.1.0
    contractId: mdhhs_measles_county
    customProperties:
      - {property: hosted, value: false}
      - {property: tier, value: private}
customProperties:
  - property: hub
    value: One Hugging Face dataset; each source in its own folder (<source>/data/<source>.parquet) with its card.
  - property: releases
    value: Each weekly export is one commit tagged release-<run date>; manifest.json lists every file's sha256.
team:
  name: health-data-registry
  members:
    - username: jtouley
      role: owner
support:
  - channel: issues
    url: https://github.com/jtouley/health-data-registry/issues
    description: Questions, wrong-number reports and dataset requests
