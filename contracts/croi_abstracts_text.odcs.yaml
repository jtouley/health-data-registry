apiVersion: v3.2.0
kind: DataContract
id: croi_abstracts_text
name: CROI conference abstracts (abstract text, private store)
version: 0.1.1
status: draft
domain: research_landscape
description:
  purpose: The text of each CROI abstract, kept only in a private store so find_prior_work can quote a short excerpt
    with CROI's copyright line and the link.
  usage: Short excerpts only, always with 'Abstract text © CROI Foundation' and the page link; never the full text
    in a public answer or artifact.
  limitations: Text as shown on the page; figures and tables are not kept. Purge it with purge-private and the tools
    fall back to links.
  authoritativeDefinitions:
  - type: canonicalUrl
    url: https://www.croiconference.org/search-abstracts/
    description: CROI's searchable abstract database (structure read 2026-11-24)
servers:
- id: croi
  server: www.croiconference.org
  type: https
  location: https://www.croiconference.org/search-abstracts/
  description: 'Server-rendered HTML: a listing of 10 abstracts a page and one page per abstract. Read one request
    per robots.txt crawl delay.'
schema:
- name: croi_abstracts_text
  physicalName: croi_abstracts_text
  physicalType: table
  logicalType: object
  description: One row per abstract and conference year.
  dataGranularityDescription: abstract number x conference year
  quality:
  - id: one_page_per_abstract
    type: sql
    query: SELECT count(*) FROM (SELECT abstract_number, year FROM {object} GROUP BY abstract_number, year HAVING
      count(DISTINCT page_url) > 1)
    mustBe: 0
    description: One CROI page per abstract number and year. The crawler enforces it as it writes (croi_index.py);
      a second page with a number already stored for that year is recorded as a collision in the coverage record
      and never written over the first, and the year stays incomplete, so a collision is reported, never
      overwritten.
  - id: abstract_key_is_unique
    type: library
    metric: duplicateValues
    arguments: {properties: [abstract_number, year]}
    mustBe: 0
    description: Abstract number plus year is unique (the primary key).
  customProperties:
  - property: totalRows
    value: none
  - property: tableShape
    value: registry
  properties:
  - name: abstract_number
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The abstract or electronic poster number CROI gives it, as on the abstract page.
    primaryKey: true
    customProperties:
    - property: role
      value: dimension
  - name: year
    physicalType: INTEGER
    logicalType: integer
    required: true
    description: Conference year the abstract was presented in.
    primaryKey: true
    customProperties:
    - property: role
      value: dimension
  - name: abstract_text
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: The abstract body as shown on its page (Background, Methods, Results, Conclusions), one paragraph
      a line. © CROI Foundation; private store only.
    customProperties:
    - property: role
      value: attribute
  - name: page_url
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: Link to the abstract's page on CROI's site.
    customProperties:
    - property: role
      value: attribute
  - name: retrieved_at
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: Date and time (UTC) this registry read the abstract's page on CROI's site; the
      'accessed' date to cite. Always filled, stored as text such as 2026-11-24T12:00:00+00:00.
    customProperties:
    - property: role
      value: attribute
    quality:
    - id: retrieved_at_filled
      type: sql
      description: Every row has the time its page was read (croi_index writes it on every row).
      query: "SELECT COUNT(*) FROM {object} WHERE retrieved_at IS NULL OR trim(retrieved_at) = ''"
      mustBe: 0
    - id: retrieved_at_format
      type: sql
      description: The crawler writes this time in UTC to the second, as YYYY-MM-DDTHH:MM:SS+00:00
        (croi_index, isoformat with timespec seconds); any other form is a data failure.
      query: "SELECT COUNT(*) FROM {object} WHERE retrieved_at IS NOT NULL AND NOT regexp_full_match(retrieved_at, '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+]00:00')"
      mustBe: 0
  - name: page_sha256
    physicalType: VARCHAR
    logicalType: string
    required: true
    description: SHA-256 of the page as read, for provenance.
    customProperties:
    - property: role
      value: attribute
customProperties:
- property: licence
  value: croi-abstract-text
- property: licenceNote
  value: abstract text © CROI Foundation; personal, non-commercial use; kept in a private store, shown as short
    excerpts with the link
- property: redistribution
  value: false
- property: tier
  value: private
- property: attribution
  value: Abstract text © CROI Foundation; personal, non-commercial use only. Read it in full on CROI's site.
- property: citation
  value: Conference on Retroviruses and Opportunistic Infections (CROI) <year>, abstract <abstract_number>. Abstract
    text © CROI Foundation. <page_url>
- property: refresh
  value: annual
- property: unreliableRule
  value: {kind: none, description: "None: a registry of conference abstracts; it holds no counts or rates."}
- property: openQuestions
  value:
  - The private Hugging Face dataset for this source (<owner>/health-data-registry-private-croi-abstracts-text,
    named as in docs/dev/naming.md) and its read-only Space secret are created by the maintainer; the code never
    creates or uploads it.
  - 'Terms: the CROI terms quoted in the spec (''copy, or print ... for personal, noncommercial use only ... may
    not otherwise reproduce ... without prior written consent''; copyright CROI Foundation) were read during research,
    not re-read here; terms_url points at the home page until the maintainer records the exact terms page.'
  - Two pages can carry the same abstract number in a year (e.g. /abstract/1739-2025-td/ for a themed discussion
    and the poster page). Rows are keyed on abstract number plus year; the first page read is kept, a second is
    recorded as a collision (quality rule one_page_per_abstract) and the year stays incomplete. Confirm whether both
    pages should be kept, and if so how to key them (e.g. adding the page's session kind to the key).
