          - "Not catalogued yet: which AIDSVu files, under which terms of use."
  - name: mi_detroit_dhd_sti_annual
    description: "Detroit Health Department Epidemiology Dashboard yearly STI figures for Detroit and Michigan. Private tier (no terms of reuse stated). Draft stub."
    type: tables
    version: 0.1.0
    contractId: mi_detroit_dhd_sti_annual
    inputContracts:
      - {id: detroit_dhd_epi_annual, version: 0.1.0}
    context:
      constraints:
        - constraint: "Detroit and Out-Wayne stay separate series wherever the publisher splits them; never add them together."
        - constraint: "Michigan includes Detroit: never add the two."
    customProperties:
      - {property: tier, value: private}
      - {property: hosting, value: none}
      - {property: stub, value: true}
      - {property: dataKind, value: surveillance}
      - {property: countedUnit, value: "unresolved: from the publisher's codebook once catalogued"}
      - {property: releaseTag, value: "release-<run date>"}
      - property: sla
        value:
