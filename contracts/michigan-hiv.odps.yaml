        value:
          - "Its source detroit_dhd_epi_annual is catalogued (PR #19, read live, never stored). The port stays a stub until its own columns and measures are declared from that contract, and the dashboard's HIV chart, not read yet, may hold programme data."
customProperties:
  - property: combine
    value: grouped-never-merged
team:
  name: health-data-registry
  members:
    - username: jtouley
      role: owner
support:
