apiVersion: v3.2.0
kind: DataContract
id: fct_cdc_nhanes_id_prevalence
name: Fact - NHANES infectious disease seroprevalence
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "One row per published cell of cdc_nhanes_id_prevalence (HSV-1 and HSV-2 antibody, adults 20-49), every row kept and qualified: the estimate with its standard error and 95% interval as NCHS published them, NCHS's flag with what it means, and whether the row is NCHS's Total."
  usage: "Read one cell with its interval and flag, or follow one infection and subgroup over the survey cycles. Never add percents. Built by transform/models/marts/fct_cdc_nhanes_id_prevalence.sql from int_cdc_nhanes_id_prevalence."
  limitations: "The same limits as the source contract: a national survey sample of adults 20-49, no state values."
schema:
  - name: fct_cdc_nhanes_id_prevalence
    physicalName: fct_cdc_nhanes_id_prevalence
    physicalType: table
    logicalType: object
    description: "One row per published cell of cdc_nhanes_id_prevalence: every row of the latest load, none removed, none added. Grain: infection x time_period x population_group x subgroup x estimate_type, unique on the full table. Each population group covers the same adults again, so never add across groups."
    customProperties:
      - {property: layer, value: marts}
      - {property: totalRows, value: "is_total_row"}
      - {property: tableShape, value: estimate_table}
    properties:
      - name: infection
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "Herpes simplex virus type 1 or type 2 (antibody in tested sera)."
        customProperties: [{property: role, value: dimension}]
      - name: time_period
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "The two-year NHANES survey cycle the estimate is for, from 1999-2000 to 2017-2018."
        customProperties: [{property: role, value: dimension}]
      - name: population_group
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        description: "Total, Age group, Sex, Race and Hispanic origin, or Sex and age group."
        customProperties: [{property: role, value: dimension}]
      - name: subgroup
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 4
        description: "The subgroup within the grouping: 20-49 years for Total, an age band, Female or Male, a race and Hispanic origin group, or a sex and age band such as Female: 20-29 years."
        customProperties: [{property: role, value: dimension}]
      - name: estimate_type
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 5
        description: "The kind of estimate as NCHS names it: Percent of population, crude (the only kind on 2026-11-25). Read it before comparing estimates: another kind would be its own row."
        customProperties: [{property: role, value: dimension}]
      - name: estimate
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "Percent of the group with antibody to the virus, of the kind estimate_type names, as NCHS published it; empty where NCHS flags it not available, never a zero."
        customProperties: [{property: role, value: measure}, {property: unit, value: "%"}]
      - name: standard_error
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "Standard error of the estimate, in percentage points, as published; empty where the estimate is."
        customProperties: [{property: role, value: attribute}, {property: unit, value: "percentage points"}]
      - name: estimate_lci
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "Lower bound of NCHS's 95% confidence interval for the estimate, in percent, as published; empty where the estimate is."
        customProperties: [{property: role, value: measure}, {property: unit, value: "%"}]
      - name: estimate_uci
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "Upper bound of NCHS's 95% confidence interval for the estimate, in percent, as published; empty where the estimate is."
        customProperties: [{property: role, value: measure}, {property: unit, value: "%"}]
      - name: flag
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "NCHS's flag on the estimate, exactly as published; empty when there is none."
        customProperties: [{property: role, value: attribute}]
      - name: estimate_status
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "'published'; 'published, flagged: ' and what NCHS's flag means (such as not meeting NCHS standards of reliability), or that NCHS wrote a flag its footnotes do not list; 'not published: ' and what NCHS's flag means, or that NCHS wrote a flag its footnotes do not list; or 'not published: the publisher's cell is empty' when there is neither an estimate nor a flag."
        customProperties: [{property: role, value: attribute}]
      - name: footnote_id_list
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The ids of NCHS's footnotes for the row, comma-separated, each defined in https://data.cdc.gov/d/iqm3-hbev: the only place the footnotes beyond the flag reach this table."
        customProperties: [{property: role, value: attribute}]
      - name: is_total_row
        physicalType: BOOLEAN
        logicalType: boolean
        required: true
        description: "True for NCHS's Total row (all adults 20-49), which sits beside the groups of the same people; never added to them."
        customProperties: [{property: role, value: attribute}]
      - name: snapshot_id
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The lake load (snapshot id) every value in the row came from (hard rule 8)."
        customProperties: [{property: role, value: attribute}]
      - name: raw_sha256
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order: the exact bytes the publisher sent (hard rule 8)."
        customProperties: [{property: role, value: attribute}]
customProperties:
  - {property: unreliableRule, value: {kind: none, description: "The publisher's own codes and flags are carried on every row (see contracts/cdc_nhanes_id_prevalence.odcs.yaml)."}}
  - property: openQuestions
    value:
      - "Every open question of contracts/cdc_nhanes_id_prevalence.odcs.yaml applies here: this fact only re-keys and qualifies the published cells."
