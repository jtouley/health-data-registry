apiVersion: v3.2.0
kind: DataContract
id: fct_cdc_rsv_adult_coverage
name: "Fact - RSV vaccination coverage and intent among older and high-risk adults (NIS-FRVM)"
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "Every row of the NIS-FRVM adult RSV coverage table (cdc_rsv_adult_coverage) as one fact per age group, place, group, measure, category and week, with the estimate exactly as published (a proportion), CDC's suppression flag as published and a status that says why an estimate is empty."
  usage: "Read one place, group, measure and week as published. Every row is kept, suppressed ones included; nothing is added across places, groups, categories or weeks. The estimate is a proportion (0 to 1) and its half width reads as percentage points: never combine them as they stand. Left out on purpose: vaccine (always RSV) and month_week (the week's name; week_end is the week)."
  limitations: "A telephone survey estimate, self-reported; cumulative within a season and recalculated each week."
  authoritativeDefinitions:
    - {type: businessDefinition, url: "contracts/cdc_rsv_adult_coverage.odcs.yaml", description: "The source dataset's contract, whose descriptions and rules this fact carries"}
schema:
  - name: fct_cdc_rsv_adult_coverage
    physicalName: fct_cdc_rsv_adult_coverage
    physicalType: table
    logicalType: object
    description: "One row per age group, place, demographic group, measure, category and survey week: every row of int_cdc_rsv_adult_coverage, suppressed ones included, none removed, each with value_status."
    customProperties:
      - {property: layer, value: marts}
      - {property: totalRows, value: none}
      - {property: tableShape, value: estimate_table}
    properties:
      - name: age_group
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "75+ years, or 50-74 years (high risk)."
        customProperties: [{property: role, value: dimension}]
      - name: place
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "The place, as CDC names it: 'National' or 'Region 1' to 'Region 10' on 2026-11-25 (the metadata also lists a State level, not yet published)."
        customProperties: [{property: role, value: dimension}]
      - name: place_kind
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The kind of place, as published: National or Region (HHS region); State if CDC publishes state rows."
        customProperties: [{property: role, value: attribute}]
      - name: group_kind
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        description: "The kind of group the estimate is for, as published: Overall, an age breakdown, race and ethnicity, sex, poverty status, health insurance, urbanicity, disability status, sexual orientation or chronic conditions. Overall sits beside the groups and each kind covers all adults again, so groups are never added."
        customProperties: [{property: role, value: dimension}]
      - name: demographic_group
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 4
        description: "The group within that kind, as CDC labels it ('18+ years', 'Female', 'Hispanic')."
        customProperties: [{property: role, value: dimension}]
      - name: measure_kind
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 5
        description: "Up-to-date (coverage) or 4-level vaccination and intent."
        customProperties: [{property: role, value: dimension}]
      - name: category
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 6
        description: "Yes for coverage, or a vaccination and intent level."
        customProperties: [{property: role, value: dimension}]
      - name: week_end
        physicalType: DATE
        logicalType: date
        required: true
        primaryKey: true
        primaryKeyPosition: 7
        description: "The date the survey week ends; the estimate is cumulative through that week, so weeks are never added."
        customProperties: [{property: role, value: dimension}]
      - name: estimate
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "Share of adults in the age group ever vaccinated against RSV (Up-to-date rows), or in the vaccination and intent category, exactly as CDC publishes it: a proportion from 0 to 1 (0.41 is about 41%) although CDC's column is labelled %, never rescaled (open question 'Scale' in the source contract). Empty where CDC suppressed it, never zero."
        customProperties:
          - {property: role, value: measure}
          - {property: unit, value: "proportion of adults (0 to 1) as published; the column is labelled %"}
      - name: ci_half_width_95pct
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "Half the width of the estimate's 95% confidence interval, as published. Its values read as percentage points while the estimate reads as a proportion, so the two are on different scales (open question 'Scale'); never add it to or subtract it from the estimate as they stand."
        customProperties:
          - {property: role, value: attribute}
          - {property: unit, value: "reads as percentage points (open question 'Scale')"}
      - name: unweighted_sample_size
        physicalType: BIGINT
        logicalType: integer
        required: false
        description: "Number of survey respondents behind the estimate, before weighting."
        customProperties: [{property: role, value: attribute}]
      - name: suppression_flag
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "CDC's suppression flag, exactly as published. The column has no description; on 2026-11-25 it was '1' exactly where the estimate was empty and '0' elsewhere (open question in the source contract)."
        customProperties: [{property: role, value: attribute}]
      - name: value_status
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "Whether the estimate is there, and CDC's flag beside it, without giving the flag a meaning: 'published', 'published; CDC flag 1', 'empty; CDC flag 1', 'empty; CDC flag 0' or 'empty; no CDC flag 0 or 1'. Reading flag 1 as suppression waits for a maintainer (open question). It qualifies the row and removes nothing."
        customProperties: [{property: role, value: attribute}]
      - name: _snapshot_id
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The lake snapshot the row was read from (the dataset's LATEST load). Its manifest gives the source address, retrieval time and dataset version that go with every answer built on this row."
        customProperties: [{property: role, value: attribute}]
      - name: _raw_sha256
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order: the exact bytes the publisher sent."
        customProperties: [{property: role, value: attribute}]
customProperties:
  - {property: unreliableRule, value: {kind: none, description: "None of its own: CDC's suppression rule in the source contract applies, and value_status says on each row why an estimate is empty."}}
  - property: openQuestions
    value:
      - "value_status names CDC's suppression_flag code and gives it no meaning: the flag column has no description in the metadata, so whether flag 1 means suppressed (as the footnotes' suppression rule suggests) is the source contract's open question 'Suppression flag', which a maintainer settles when the contract is reviewed; the label changes then."
