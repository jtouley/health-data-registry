apiVersion: v3.2.0
kind: DataContract
id: fct_cdc_haicviz_isa
name: Fact - HAICViz - iSA
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "One row per published cell of cdc_haicviz_isa (invasive Staphylococcus aureus rates and shares of cases), with every row kept and qualified: the figure as CDC published it, whether the cell was published, and whether it is one of CDC's 'All cases' total rows."
  usage: "Read one cell, or follow one topic, view and stratum over the years. Never add rates, and never add a total row to the groups beside it. Built by transform/models/marts/fct_cdc_haicviz_isa.sql from int_cdc_haicviz_isa; the source contract (contracts/cdc_haicviz_isa.odcs.yaml) holds every fact about the numbers."
  limitations: "The same limits as the source contract: EIP sites combined, no state values, and the unit, denominator and case definition are open questions there."
schema:
  - name: fct_cdc_haicviz_isa
    physicalName: fct_cdc_haicviz_isa
    physicalType: table
    logicalType: object
    description: "One row per published cell of cdc_haicviz_isa: every row of the latest load, none removed, none added, each with its published status and total-row flag. Grain: year x topic x view x stratum, unique on the full table (710 rows, 2026-11-25)."
    customProperties:
      - {property: layer, value: marts}
      - {property: totalRows, value: "is_total_row"}
      - {property: tableShape, value: rate_table}
    properties:
      - name: year
        physicalType: BIGINT
        logicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "Surveillance year."
        customProperties: [{property: role, value: dimension}]
      - name: topic
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "What the figure measures, exactly as CDC labels it."
        customProperties: [{property: role, value: dimension}]
      - name: view
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        description: "Which breakdown the row belongs to, exactly as CDC labels it (viewby)."
        customProperties: [{property: role, value: dimension}]
      - name: stratum
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 4
        description: "The group the figure is for, exactly as CDC labels it (series); 'All cases' is CDC's total row."
        customProperties: [{property: role, value: dimension}]
      - name: value
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "The published figure, as CDC sent it, never rescaled; empty where CDC's cell is empty, never a zero."
        customProperties: [{property: role, value: measure}]
      - name: value_status
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "Whether CDC published a figure in this cell: 'published', or 'not published: the publisher's cell is empty'. Every row is kept and qualified, never dropped or filled."
        customProperties: [{property: role, value: attribute}]
      - name: is_total_row
        physicalType: BOOLEAN
        logicalType: boolean
        required: true
        description: "True for CDC's own 'All cases' rows (the contract's totalRows), which sit beside the groups they cover; never added to them."
        customProperties: [{property: role, value: attribute}]
      - name: snapshot_id
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The lake load (snapshot id) every value in the row came from (hard rule 8)."
        customProperties: [{property: role, value: attribute}]
      - name: raw_sha256
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The sha256 of the raw publisher file the row came from (hard rule 8)."
        customProperties: [{property: role, value: attribute}]
customProperties:
  - {property: unreliableRule, value: {kind: none, description: "None stated by the publisher (see contracts/cdc_haicviz_isa.odcs.yaml)."}}
  - property: openQuestions
    value:
      - "Every open question of contracts/cdc_haicviz_isa.odcs.yaml applies here: this fact only re-keys and qualifies the published cells."
