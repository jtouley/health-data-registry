apiVersion: v3.2.0
kind: DataContract
id: fct_cdc_lyme_county
name: Lyme disease cases by county of residence, all three CDC tables, each row qualified
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "One fact table over CDC's three Lyme disease county tables (cdc_lyme_county_1992_2007, cdc_lyme_county_2008_2021, cdc_lyme_county), every published row kept, each labelled with the table and case-definition era it came from and with flags saying when CDC withheld or did not know its state or county."
  usage: "Add frequency within one era only. The eras never form one trend: CDC split the tables where the case definitions changed (1992-2007 confirmed only; probable cases from 2008; laboratory evidence alone in high-incidence states from 2022). The flags qualify a row; nothing is dropped, moved or filled in because of them."
  limitations: "Inherits every open question of the three source contracts. Which state a row with a withheld state and a known county belongs to is not decided here (hard rule 1)."
schema:
  - name: fct_cdc_lyme_county
    physicalName: fct_cdc_lyme_county
    physicalType: table
    logicalType: object
    description: "One row per published count: source table, year, state, county of residence, case status, sex and age group, with flags beside the published values."
    customProperties:
      - {property: layer, value: marts}
      - property: totalRows
        value: none
        description: "None of the three source tables has total rows (their contracts' totalRows is none), and this table only unions them."
      - {property: tableShape, value: frequency_table}
    properties:
      - name: source_id
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "The catalogued source the row was read from: cdc_lyme_county_1992_2007, cdc_lyme_county_2008_2021 or cdc_lyme_county."
        customProperties: [{property: role, value: dimension}]
      - name: case_definition_era
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The span of years CDC published together because the case definitions in it match, as the dataset descriptions give them: 1992-2007, 2008-2021 or 2022 onward. Counts are added within one era only."
        customProperties: [{property: role, value: dimension}]
      - name: year
        physicalType: BIGINT
        logicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "Reporting year."
        customProperties: [{property: role, value: dimension}]
      - name: state
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        description: "State of residence as published: a two-letter postal abbreviation, or 'Suppressed' or 'Unknown'."
        customProperties: [{property: role, value: dimension}]
      - name: fips
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 4
        description: "County of residence as published: a five-digit FIPS code, or 'Suppressed' or 'Unknown' (and three 1992-1993 rows with a state-only value)."
        customProperties: [{property: role, value: dimension}]
      - name: case_status
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 5
        description: "Confirmed or Probable, as published."
        customProperties: [{property: role, value: dimension}]
      - name: sex
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 6
        description: "Female, Male, Unknown or Suppressed, as published."
        customProperties: [{property: role, value: dimension}]
      - name: age_cat_yrs
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 7
        description: "Age group in years, 0-19 or 20+, or Unknown or Suppressed, as published."
        customProperties: [{property: role, value: dimension}]
      - name: frequency
        physicalType: BIGINT
        logicalType: integer
        required: false
        description: "Number of Lyme disease cases in the group, as published; empty stays empty, never zero."
        customProperties: [{property: role, value: measure}, {property: unit, value: cases}]
      - name: state_withheld
        physicalType: BOOLEAN
        logicalType: boolean
        required: true
        description: "True when the state reads 'Suppressed' or 'Unknown': the cases count in the nation but in no state's figure."
        customProperties: [{property: role, value: attribute}]
      - name: county_withheld
        physicalType: BOOLEAN
        logicalType: boolean
        required: true
        description: "True when the county is not a five-digit FIPS code ('Suppressed', 'Unknown' or a state-only value): the cases can't be placed in a county."
        customProperties: [{property: role, value: attribute}]
      - name: _snapshot_id
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The lake snapshot the row was read from; its manifest gives the source address, retrieval time and version."
        customProperties: [{property: role, value: attribute}]
      - name: _raw_sha256
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The sha256 fingerprint of the raw files the row was parsed from."
        customProperties: [{property: role, value: attribute}]
customProperties:
  - {property: unreliableRule, value: {kind: none, description: "None here: the source contracts carry CDC's suppression rule (fewer than 5 records), which withholds labels, not counts."}}
