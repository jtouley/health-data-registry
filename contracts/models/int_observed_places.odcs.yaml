apiVersion: v3.2.0
kind: DataContract
id: int_observed_places
name: Intermediate - places and years each stored source's rows name
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "For each stored source whose coverage block says where its rows name their place (coverage.observed), the places and years that actually appear in its rows, keyed to dim_place."
  usage: "The observed side of the declared-versus-observed reconciliation (flag_coverage_mismatch). Generated by `make contracts`: a place label is matched to dim_place by name (case, edge spaces and dots ignored) at the levels the source reports, or by the contract's conformedDimensions label, or built from state and county FIPS."
  limitations: "A label that names no place in dim_place (a census division, TOTAL, a territory without a key) is left out."
schema:
  - name: int_observed_places
    physicalName: int_observed_places
    physicalType: table
    logicalType: object
    description: "One row per source, place and year that appears in its rows."
    customProperties:
      - {property: layer, value: intermediate}
      - {property: totalRows, value: none}
      - {property: tableShape, value: registry}
    properties:
      - name: dataset_id
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "The catalogued source."
        customProperties: [{property: role, value: dimension}]
      - name: place_key
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "The place's conformed key (dim_place)."
        customProperties: [{property: role, value: dimension}]
      - name: year
        physicalType: BIGINT
        logicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        description: "The year the rows are for."
        customProperties: [{property: role, value: dimension}]
      - name: row_count
        physicalType: BIGINT
        logicalType: integer
        required: true
        description: "How many of the source's rows name this place and year."
        customProperties: [{property: role, value: attribute}]
customProperties:
  - {property: unreliableRule, value: {kind: none, description: "None: declarations about sources, not published numbers."}}
