      # The territories other than Puerto Rico, [name, postal, FIPS]: state-level keys outside the United States (FIPS
      # above 56), not in geo's state list, so a question naming one isn't read as a state until GBD names are confirmed.
      territories:
        - ["American Samoa", "AS", "60"]
        - ["Guam", "GU", "66"]
        - ["Northern Mariana Islands", "MP", "69"]
        - ["U.S. Virgin Islands", "VI", "78"]
      # Only the cities a catalogued source reports apart from its state. Detroit's key names its county (Wayne,
