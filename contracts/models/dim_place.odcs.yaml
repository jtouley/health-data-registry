apiVersion: v3.2.0
kind: DataContract
id: dim_place
name: Places - the one list of conformed place keys
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "Every place a source's coverage or rows can name, under one conformed key: the United States (USA), each state, DC, Puerto Rico and the other territories (US-<state FIPS>), each county (US-<state FIPS><county FIPS>), the cities a catalogued source reports apart from their states (<bigger place's key>/<name>), every other country (its ISO 3166-1 alpha-3 code) and the six WHO regions (WHO-<GHO region code>)."
  usage: "Join a coverage declaration or a source's place to this table on place_key. The fixed places (nation, states, cities, countries, WHO regions) are listed once, in the places property below: the server's geo module reads that same list, and the registry refuses a contract whose coverage names a key that isn't here. Counties come from the Census county population file (census_county_pop), so they exist only where that file lists them. Built by the generated dbt model transform/models/marts/dim_place.sql."
  limitations: "The territories other than Puerto Rico have keys but can't yet be named in a question, and no country has a parent (WHO region membership is not declared; see openQuestions). A county key exists only for a county the latest Census load lists."
  authoritativeDefinitions:
    - {type: businessDefinition, url: "https://www.census.gov/library/reference/code-lists/ansi.html", description: "Census Bureau, ANSI/FIPS codes for states and counties (the state FIPS codes below)"}
    - {type: businessDefinition, url: "https://www.iso.org/iso-3166-country-codes.html", description: "ISO 3166-1 country codes; alpha-3 is the code WHO's Global Health Observatory uses for countries (SpatialDim)"}
    - {type: businessDefinition, url: "https://ghoapi.azureedge.net/api/DIMENSION/REGION/DimensionValues", description: "WHO GHO region codes (AFR, AMR, SEAR, EUR, EMR, WPR)"}
schema:
  - name: dim_place
    physicalName: dim_place
    physicalType: table
    logicalType: object
    description: "One row per place key: the nation, each state, each county the Census file lists, each city reported apart from its state, each country and each WHO region."
    customProperties:
      - {property: layer, value: marts}
      - {property: totalRows, value: none}
      - {property: tableShape, value: registry}
    properties:
      - name: place_key
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "The conformed place key: USA, US-<2-digit state FIPS>, US-<5-digit county FIPS>, <bigger place's key>/<city name>, an ISO 3166-1 alpha-3 country code, or WHO-<region code>."
        customProperties: [{property: role, value: dimension}]
      - name: place_name
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The place's name in plain words; for the nation and the states, also the GBD location name."
        customProperties: [{property: role, value: attribute}]
      - name: place_level
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "What kind of place it is: nation, state (a state, DC or Puerto Rico), county, city, country or who_region."
        customProperties: [{property: role, value: attribute}]
      - name: parent_key
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "The key of the place this one is part of (a county's state, a state's nation, a city's county or state); empty for the nation, a country, a WHO region and Puerto Rico. The United States here is the 50 states and DC (state FIPS 01 to 56), as in CDC's US-residents totals, the Census national population and GBD's United States, so Puerto Rico (FIPS 72) is not part of it."
        customProperties: [{property: role, value: attribute}, {property: mayBeEmpty, value: true}]
      - name: fips
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "The Census FIPS code of a US place (2 digits for a state, 5 for a county, 00 for the nation); empty elsewhere."
        customProperties: [{property: role, value: attribute}, {property: mayBeEmpty, value: true}]
      - name: postal
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "The postal abbreviation of the nation, a state, DC or Puerto Rico; empty elsewhere."
        customProperties: [{property: role, value: attribute}, {property: mayBeEmpty, value: true}]
customProperties:
  - {property: unreliableRule, value: {kind: none, description: "None: a list of places, not published numbers."}}
  - property: places
    description: "The one definition of the fixed place keys. geo.py reads this list (it is no longer written in Python), the registry checks every declared coverage key against it, and make contracts writes it into the dim_place model. States and territories are [name, postal, FIPS]; countries are [ISO 3166-1 alpha-3, ISO short name], without the United States, which is the nation row."
