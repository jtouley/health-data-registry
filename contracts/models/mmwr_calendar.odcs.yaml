apiVersion: v3.2.0
kind: DataContract
id: mmwr_calendar
name: MMWR calendar
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "Every MMWR (epidemiologic) week with the Sunday it starts and the Saturday it ends, so a publisher's MMWR year and week can be read as dates."
  usage: "Join on MMWR year and week. Computed by the dbt model transform/models/reference/mmwr_calendar.sql from CDC's rule; no data file is read."
  limitations: "A publisher may assign a case to an MMWR week by onset, diagnosis, laboratory or report date (CDC's overview), so the week's dates say when the week ran, not which date the case was counted by."
  authoritativeDefinitions:
    - {type: businessDefinition, url: "https://ndc.services.cdc.gov/wp-content/uploads/MMWR_Week_overview.pdf", description: "CDC, MMWR Weeks: business rules for assigning MMWR week (checked 2026-11-25)"}
schema:
  - name: mmwr_calendar
    physicalName: mmwr_calendar
    physicalType: table
    logicalType: object
    description: "One row per MMWR week. CDC's rule: the first day of any MMWR week is Sunday, and MMWR week 1 is the first week of the year that has at least four days in the calendar year, so a year has 52 or 53 weeks."
    customProperties:
      - {property: layer, value: reference}
      - {property: totalRows, value: none}
      - {property: tableShape, value: registry}
    properties:
      - name: mmwr_year
        physicalType: BIGINT
        logicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "MMWR (epidemiologic) year. Its week 1 can start on 29, 30 or 31 December of the calendar year before."
        customProperties: [{property: role, value: dimension}]
      - name: mmwr_week
        physicalType: BIGINT
        logicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "MMWR week within the year, from 1 to 52, or 53 in a 53-week year."
        customProperties: [{property: role, value: dimension}]
      - name: week_start
        physicalType: DATE
        logicalType: date
        required: true
        description: "The Sunday the MMWR week starts."
        customProperties: [{property: role, value: attribute}]
      - name: week_end
        physicalType: DATE
        logicalType: date
        required: true
        description: "The Saturday the MMWR week ends."
        customProperties: [{property: role, value: attribute}]
customProperties:
  - {property: unreliableRule, value: {kind: none, description: "None: a calendar computed from CDC's published rule."}}
  - property: openQuestions
    value:
      - id: q1
        status: open
        changesNumbers: true
        question: "Which years should the calendar cover? It covers the years set by the dbt variables mmwr_first_year and mmwr_last_year (2015 to 2030), which span every catalogued weekly source; a maintainer confirms on review."
