apiVersion: v3.2.0
kind: DataContract
id: detroit_dhd_epi_annual
name: Detroit and Michigan annual cases and rates (Detroit Health Department Epidemiology Dashboard)
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "Annual case counts and rates for Detroit and for Michigan, as the Detroit Health Department's Epidemiology Dashboard charts them, for tuberculosis, chlamydia, hepatitis C and syphilis (primary and secondary, late and late latent, congenital)."
  usage: "Read one condition, place and year; compare Detroit with Michigan side by side; never add rates, and never add Detroit to Michigan. Read live from the city; never stored."
  limitations: "A dashboard, not a dataset: the rate's denominator and the case definitions are not in the data, and the layout can change without notice (the worksheet layout hash stops the load when it does)."
  authoritativeDefinitions:
    - {type: canonicalUrl, url: "https://codtableau.detroitmi.gov/t/DHD/views/EpidemiologyDashboard_17430955327340/MainMenu", description: "Dashboard read (fetched 2026-11-24)"}
    - {type: businessDefinition, url: "https://codtableau.detroitmi.gov/t/DHD/views/EpidemiologyDashboard_17430955327340/NotesResources", description: "The dashboard's Notes/Resources tab (fetched 2026-11-24; its text was not reviewed, see openQuestions)"}
servers:
  - id: detroit_tableau
    server: codtableau.detroitmi.gov
    type: api
    location: https://codtableau.detroitmi.gov/t/DHD/views/EpidemiologyDashboard_17430955327340
    description: "Tableau Server guest views (one per condition), read in a browser; the data come from each view's bootstrapSession answer (adapters/tableau.py)."
schema:
  - name: detroit_dhd_epi_annual
    physicalName: detroit_dhd_epi_annual
    physicalType: table
    logicalType: object
    description: "One row per condition worksheet, place and year."
    dataGranularityDescription: "condition (worksheet) x place (Detroit, Michigan) x calendar year"
    customProperties:
      - property: totalRows
        value: none
        description: "The yearly worksheets have no total row: one row per place and year (12 or 14 rows per worksheet on 2026-11-24)."
      - {property: tableShape, value: rate_table}
      - property: idDimensions
        value:
          condition: worksheet
          caseDefinition: null
          caseStatus: null
          organismResistance: null
          period: year
          provisionalFlag: null
        description: "The worksheet names the condition (TByear, ChlamydiaYear ...). Case definition, case status and provisional status are not published in the data."
    properties:
      - name: view
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The dashboard tab the row was read from (TB, Chlamydia, HepC, Syphilis-C, Syphilis-L, Syphilis-PS); for provenance."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: view}
      - name: worksheet
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The yearly chart the row was read from, which names the condition: TByear (tuberculosis), ChlamydiaYear, HepCyear (hepatitis C), SyphilisPSyear (primary and secondary syphilis), SyphilisLyear (late syphilis), SyphilisCyear (congenital syphilis)."
        enum: [{value: TByear}, {value: ChlamydiaYear}, {value: HepCyear}, {value: SyphilisPSyear}, {value: SyphilisLyear}, {value: SyphilisCyear}]
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: worksheet}
      - name: location_label
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "Which place the figures are for, as the chart's legend names it: 'Detroit Case Rate' (the City of Detroit) or 'Michigan Case Rate' (the whole state, Detroit included)."
        enum: [{value: "Detroit Case Rate"}, {value: "Michigan Case Rate"}]
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: "Location (alias)"}
      - name: year
        physicalType: BIGINT
        logicalType: integer
        required: true
        description: "Calendar year the cases are counted in."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: "YEAR(Year)"}
      - name: cases
        physicalType: BIGINT
        logicalType: integer
        required: false
        description: "Cases of the condition counted for the place in the year, as the chart's tooltip gives them."
        customProperties:
          - {property: role, value: measure}
          - {property: sourceField, value: "SUM(Cases) (alias)"}
          - {property: unit, value: "cases"}
      - name: rate
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "The case rate the chart plots for the place and year. The dashboard does not state its denominator in the data (see openQuestions), so it is shown as published, never recomputed."
        customProperties:
          - {property: role, value: measure}
          - {property: sourceField, value: "SUM(Rate)"}
          - {property: unit, value: "as published (denominator unconfirmed)"}
customProperties:
  - {property: licence, value: no-terms-stated}
  - {property: redistribution, value: false}
  - {property: citation, value: "City of Detroit Health Department. Epidemiology Dashboard. https://codtableau.detroitmi.gov/t/DHD/views/EpidemiologyDashboard_17430955327340/MainMenu"}
  - {property: refresh, value: annual}
  - {property: rateDenominator, value: "unresolved: not stated in the dashboard's data; see openQuestions"}
  - {property: geographyBasis, value: "unresolved: the dashboard does not say whether cases are counted by residence"}
  - {property: unreliableRule, value: {kind: none, description: "None stated for the yearly charts: no value in them is marked suppressed or unreliable. (Other charts on the same dashboard show '<6' for small counts; those charts are not read here.)"}}
  - property: evidence
    value:
      - retrieved_at: "2026-11-24T21:03Z to 21:18Z"
        user_agent: "health-data-registry/0.0.1 (+https://github.com/jtouley/health-data-registry)"
        robots_txt: "404 (none published)"
        layout_sha256: 848988d619fa5bcaba303b0a211b46914647f026793241244723268f30476144
        columns: "Location (cstring), SUM(Cases) (integer), SUM(Rate) (real), YEAR(Year) (integer), ATTR(Location) (cstring), ATTR(Year) (date): the same in every yearly worksheet"
        worksheets:
          - {view: TB, worksheet: TByear, rows: 14, years: "2019-2025", retrieved_at: "2026-11-24T21:15:37Z", raw_sha256: 145a927dfbe3d94202bb047104c8759ee262405c60e7559dcca22ffa3534d348}
          - {view: Chlamydia, worksheet: ChlamydiaYear, rows: 12, years: "2019-2024", retrieved_at: "2026-11-24T21:04:41Z", raw_sha256: a16dea4ad2357fc951a2e3f500050528d2c3d6f05bf0082441f5666613ea1920}
          - {view: HepC, worksheet: HepCyear, rows: 12, years: "2019-2024", retrieved_at: "2026-11-24T21:17:51Z", raw_sha256: 5392216e189427eb6c82f43e88318d0d7ef2b145452ea66f815db14ab46a503b}
          - {view: Syphilis-C, worksheet: SyphilisCyear, rows: 12, years: "2019-2024", retrieved_at: "2026-11-24T21:11:18Z", raw_sha256: ee111c087fcc3b6c44045d4d09c90450097b515781a722fba8b251a10c732c28}
          - {view: Syphilis-L, worksheet: SyphilisLyear, rows: 12, years: "2019-2024", retrieved_at: "2026-11-24T21:18:15Z", raw_sha256: f428ab5ff6ebb2b0446c921d7ea4320b06e8da30230e06d0fd5ff43323a32d99}
          - {view: Syphilis-PS, worksheet: SyphilisPSyear, rows: 12, years: "2019-2024", retrieved_at: "2026-11-24T21:12:31Z", raw_sha256: 402ff1dd9040483b8c437dd4df00a97f3030efe0fca364d812221ed03da309ea}
        not_read: "Gonorrhea (the view opened twice but sent no data), HepB (502 twice), HIV (HIV Line has another layout: Detroit and Michigan diagnosis and death rates as separate columns, 22 rows), COVID and ILI (daily curves, not yearly). The demographic worksheets (age, race, ethnicity, sex) are aggregate; the age charts show '<6' for small counts (AGG(Count Suppressed))."
  - property: openQuestions
    value:
      - "Rate denominator: not in the data. The figures fit per 100,000 population (e.g. TB, Detroit 2024: 44 cases, rate 6.81) and, for congenital syphilis, per 100,000 live births (Detroit 2019: 6 cases, rate 64.2), but that is inferred, not stated. Maintainer to confirm from DHD before any rate is compared with another source."
      - "Population source and year for the rates (Census estimates? which vintage?) are not stated."
      - "Case definitions and status (confirmed only, or confirmed and probable; hepatitis C acute, chronic or both; late syphilis stage names) are not in the data; the Notes/Resources tab was fetched but its text has not been reviewed."
      - "Is a case counted by the person's residence in Detroit, or by the reporting provider? (geographyBasis is unresolved until then.)"
      - "Years: the STI and hepatitis charts end in 2024 and TB in 2025 on 2026-11-24; the dashboard's STI timestamp reads Feb 10, 2026. Is 2024 final?"
      - "Licence: no terms of use are stated. Maintainer to confirm that live, unstored reads with attribution are acceptable."
      - "Place labels: the legend labels 'Detroit Case Rate' and 'Michigan Case Rate' are not place names, so they do not resolve to geo.py places yet; a reviewed label mapping (Detroit Case Rate -> Detroit, Michigan Case Rate -> Michigan) would let get_series key them. Michigan's figures could then align with GBD Michigan; Detroit has no GBD location."
      - "GBD causes: hepatitis C is not mapped (GBD splits acute hepatitis C from cirrhosis and liver cancer due to hepatitis C; which one the dashboard's count matches is not stated)."
      - "Gonorrhea, hepatitis B and HIV yearly charts are on the dashboard but were not read on 2026-11-24 (see evidence); add them after a successful verification read. HIV figures may include Ryan White programme data; if so they must be labelled as programme data."
