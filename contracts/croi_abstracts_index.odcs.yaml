apiVersion: v3.2.0
kind: DataContract
id: croi_abstracts_index
name: CROI conference abstracts (metadata index)
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "Every abstract presented at CROI in each indexed year: its heading, authors, session, links to its page and poster, and our own rule-based tags, for finding prior work."
  usage: "Search by condition, design, data source or place tag, or by words in the heading; read the abstract and poster on CROI's site through the link. A year is indexed only when every abstract CROI's listing counts has been read."
  limitations: "An abstract is not a peer-reviewed paper. No abstract text here (croi_abstracts_text). Tags are word rules, not a reading of the study. Private tier: never published."
  authoritativeDefinitions:
    - {type: canonicalUrl, url: "https://www.croiconference.org/search-abstracts/", description: "CROI's abstract search (read 2026-11-24)"}
servers:
  - id: croiconference_org
    server: www.croiconference.org
    type: custom
    format: html
    location: https://www.croiconference.org/search-abstracts/
    description: "Server-rendered search listing (10 results a page, with its own total) and one page per abstract, crawled by the html_table listing shape at CROI's own pace (at least 120 s between requests), resumable, complete only at the listing's total."
schema:
  - name: croi_abstracts_index
    physicalName: croi_abstracts_index
    physicalType: table
    logicalType: object
    description: "One row per CROI abstract per meeting year."
    dataGranularityDescription: "abstract number x meeting year"
    customProperties:
      - {property: totalRows, value: none, description: "A list of abstracts: no total rows."}
      - {property: tableShape, value: registry}
      - property: idDimensions
        value: {condition: null, caseDefinition: null, caseStatus: null, organismResistance: null, period: [year], provisionalFlag: null}
        description: "Abstracts, not case counts: no condition label, case definition or status. Period is the meeting year."
    quality:
      - id: one_row_per_abstract
        type: sql
        dimension: uniqueness
        severity: error
        description: "The key: one row per abstract number and meeting year (numbers restart each year)."
        query: "SELECT COUNT(*) FROM (SELECT abstract_number, year FROM {object} GROUP BY abstract_number, year HAVING COUNT(*) > 1)"
        mustBe: 0
      - id: one_page_per_abstract
        type: sql
        dimension: uniqueness
        severity: error
        description: "Each abstract page is read once: two rows from one page would be one abstract counted twice."
        query: "SELECT COUNT(*) FROM (SELECT page_url FROM {object} GROUP BY page_url HAVING COUNT(*) > 1)"
        mustBe: 0
    properties:
      - name: abstract_number
        physicalType: VARCHAR
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: "The number CROI gives the abstract or electronic poster in its programme (e.g. 957), from the page's sidebar; numbers restart each meeting, so read it with the year."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: abstract_number}
      - name: year
        physicalType: INTEGER
        logicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: "The year of the CROI meeting where the work was presented, from the listing year the crawl read it under (the page's own link carries the same year, which the crawl checks); not the year it was later published."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: year}
          - {property: mayBeEmpty, value: true}
      - name: heading
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The abstract's heading exactly as CROI prints it: its number, a dash and its title (e.g. '957 – Long-acting cabotegravir ...')."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: heading}
      - name: authors
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "The authors as CROI's page lists them."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: authors}
          - {property: mayBeEmpty, value: true}
      - name: session_title
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "The session the work was presented in, as printed."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: session_title}
          - {property: mayBeEmpty, value: true}
      - name: session_type
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "How the work was presented (e.g. poster, oral), from the page's own class name, as printed."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: session_type}
          - {property: mayBeEmpty, value: true}
      - name: category
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "The topic CROI filed the abstract under, from the page's own class name, as printed."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: category}
          - {property: mayBeEmpty, value: true}
      - name: poster_url
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "The poster PDF's link on CROI's site, when the page has one. Linked only: posters are never fetched or copied."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: poster_url}
          - {property: mayBeEmpty, value: true}
      - name: condition_tags
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Conditions the heading or text names (e.g. 'hiv; tuberculosis'), by our fixed word rules (research_tags.py), never a model; several joined with '; '. A missing tag doesn't mean the condition is absent."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: condition_tags}
          - {property: mayBeEmpty, value: true}
      - name: design_tags
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Study designs the heading or text names, by our fixed word rules; several joined with '; '."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: design_tags}
          - {property: mayBeEmpty, value: true}
      - name: data_source_tags
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Kinds of data the heading or text names, by our fixed word rules; several joined with '; '."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: data_source_tags}
          - {property: mayBeEmpty, value: true}
      - name: geography_tags
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "Countries and regions the heading or text names, by our fixed word rules; several joined with '; '."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: geography_tags}
          - {property: mayBeEmpty, value: true}
      - name: page_url
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The abstract's page on CROI's site: read the abstract and its poster there."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: document_url}
      - name: page_sha256
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "Fingerprint (sha256) of the exact page bytes this row was read from (hard rule 8)."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: document_sha256}
      - name: retrieved_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        required: true
        description: "When the page was read from CROI's site (UTC)."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: document_retrieved_at}
customProperties:
  - {property: tier, value: private}
  - {property: redistribution, value: false}
  - {property: citation, value: "Conference on Retroviruses and Opportunistic Infections (CROI) <year>, abstract <abstract_number>. <page_url>"}
  - {property: refresh, value: annual}
  - {property: geographyBasis, value: "not applicable: abstracts, not counts by place"}
  - {property: unreliableRule, value: {kind: none, description: "Not applicable: no counts or rates."}}
  - property: openQuestions
    value:
      - "Licence of the metadata (titles, authors, sessions): CROI states its abstract text is for personal, non-commercial use and says nothing on the metadata. Private tier until the maintainer confirms; never published."
      - "Late-breaking abstracts and their page suffixes (e.g. -td): included as CROI's listing returns them; maintainer to confirm they belong to the year."
      - "Years: the crawl covers 2022-2026, the five most recent meetings; earlier years (CROI's search goes back to 2014) wait for the maintainer."
