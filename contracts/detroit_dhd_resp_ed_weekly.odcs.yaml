apiVersion: v3.2.0
kind: DataContract
id: detroit_dhd_resp_ed_weekly
name: Share of Detroit emergency department visits for COVID-19, influenza and RSV, by week (Detroit Health Department Respiratory Virus Dashboard)
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "The weekly share of emergency department visits diagnosed as COVID-19, influenza or RSV that the Detroit Health Department's Respiratory Virus Dashboard charts on its Illness tab."
  usage: "Read one diagnosis and week, or follow one diagnosis over the weeks shown; never add shares across diagnoses or weeks. Read live from the city; never stored."
  limitations: "A dashboard, not a dataset: only the most recent weeks are shown, the ED network and the diagnosis definitions are not in the data, and the layout can change without notice (the worksheet layout hash stops the load when it does)."
  authoritativeDefinitions:
    - {type: canonicalUrl, url: "https://codtableau.detroitmi.gov/t/DHD/views/RespiratoryVirusDashboard/Illness", description: "Dashboard view read (fetched 2026-11-24)"}
servers:
  - id: detroit_tableau
    server: codtableau.detroitmi.gov
    type: api
    location: https://codtableau.detroitmi.gov/t/DHD/views/RespiratoryVirusDashboard
    description: "Tableau Server guest view (Illness), read in a browser; the data come from the view's bootstrapSession answer (adapters/tableau.py)."
schema:
  - name: detroit_dhd_resp_ed_weekly
    physicalName: detroit_dhd_resp_ed_weekly
    physicalType: table
    logicalType: object
    description: "One row per diagnosis and week."
    dataGranularityDescription: "diagnosis (COVID-19, influenza, RSV) x week ending date"
    customProperties:
      - property: totalRows
        value: none
        description: "The Diagnoses by Week worksheet has no total row: 21 rows, 3 diagnoses x 7 weeks, on 2026-11-24."
      - {property: tableShape, value: surveillance_series}
      - property: idDimensions
        value:
          condition: diagnosis
          caseDefinition: null
          caseStatus: null
          organismResistance: null
          period: week_ending
          provisionalFlag: null
        description: "The Diagnosis1 field names the condition. How a visit is classed as COVID-19, influenza or RSV (diagnosis codes, chief complaint, a laboratory result) is not in the data."
    properties:
      - name: view
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The dashboard tab the row was read from (Illness); for provenance."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: view}
      - name: worksheet
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The chart the row was read from (Diagnoses by Week); for provenance."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: worksheet}
      - name: diagnosis
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The respiratory illness the emergency department visits were diagnosed with, as the dashboard codes it: COVID (shown as COVID-19), Influenza or RSV."
        enum: [{value: COVID}, {value: Influenza}, {value: RSV}]
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: Diagnosis1}
      - name: week_ending
        physicalType: DATE
        logicalType: date
        required: true
        description: "The last day of the week the visits are counted in (the dashboard's weeks end on a Saturday: 2026-10-03 to 2026-11-14 on 2026-11-24)."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: WeekEnding Date}
      - name: share_of_ed_visits
        physicalType: DOUBLE
        logicalType: number
        required: false
        description: "The share of all emergency department visits in the week that were diagnosed with this illness, exactly as the chart's data carry it: a fraction (e.g. 0.0042), which the chart's axis labels 'Percent of All ED Visits' (so 0.0042 would show as 0.42%). Never recomputed."
        customProperties:
          - {property: role, value: measure}
          - {property: sourceField, value: "SUM(Percent)"}
          - {property: unit, value: "fraction of all ED visits, as published (see openQuestions)"}
customProperties:
  - {property: licence, value: no-terms-stated}
  - {property: redistribution, value: false}
  - {property: citation, value: "City of Detroit Health Department. Respiratory Virus Dashboard, Illness. https://codtableau.detroitmi.gov/t/DHD/views/RespiratoryVirusDashboard/Illness"}
  - {property: refresh, value: weekly}
  - {property: geographyBasis, value: "unresolved: the dashboard does not say whether a visit is placed in Detroit by the patient's residence or the hospital's location"}
  - {property: unreliableRule, value: {kind: none, description: "None stated: the weekly chart marks no value as suppressed or unreliable, and no suppression marker appears in its data."}}
  - property: evidence
    value:
      - retrieved_at: "2026-11-24T21:36:30Z"
        url: https://codtableau.detroitmi.gov/t/DHD/views/RespiratoryVirusDashboard/Illness?:embed=y&:showVizHome=no
        user_agent: "health-data-registry/0.0.1 (+https://github.com/jtouley/health-data-registry)"
        robots_txt: "404 (none published)"
        raw_sha256: 31c4f7e25801a1cb72ea9750f13f179beaa2c10d870b59c6f5d6ab4eeff8edbe
        csv_export: "Illness.csv answered 404 on 2026-11-24, so the bootstrapSession answer is read."
        tabs_seen: ["Illness", "Immunization"]
        worksheets_seen: ["Case Timestamp", "Dash Title", "Diagnoses by Age", "Diagnoses by RaceEth", "Diagnoses by Week", "How To", "Logo"]
        layout_sha256: 7463c1063a0d825a2b6c3b315942436691b2c3c3960bab74f585ae235b6e1124
        read: "Diagnoses by Week: 21 rows (COVID, Influenza, RSV x 7 weeks ending 2026-10-03 to 2026-11-14); columns Y Axis Title (cstring, 'Percent of All ED Visits'), Diagnosis1 (cstring), WeekEnding Date (date), SUM(Percent) (real), ATTR(Diagnosis1), ATTR(WeekEnding Date). Values are fractions below 0.01. Case Timestamp reads 'Nov 14, 2026'. No suppression markers."
        not_read: "Diagnoses by Age (21 rows) and Diagnoses by RaceEth (12 rows) carry SUM(Count) as fractions (each diagnosis's visits split by age band or race and ethnicity), aggregate but not catalogued yet. The Immunization tab was not opened."
  - property: openQuestions
    value:
      - "Unit: the chart's axis says 'Percent of All ED Visits' but the data are fractions (0.0042). Read as a fraction of all ED visits; a maintainer to confirm from DHD that 0.0042 means 0.42% before the value is shown as a percent."
      - "Denominator and network: which emergency departments are counted (all Detroit hospitals, a syndromic surveillance feed such as MSSS?), and is the denominator all ED visits at those hospitals or only visits by Detroit residents? Not stated."
      - "Diagnosis definition: how a visit is classed as COVID-19, influenza or RSV (discharge diagnosis codes, chief complaint, laboratory confirmation) is not in the data. Until confirmed, no case definition or case status is stated for the series."
      - "History: the dashboard shows the latest 7 weeks only. Are earlier weeks published anywhere by DHD? A weekly live read keeps no history (nothing is stored)."
      - "Licence: no terms of use are stated. Maintainer to confirm that live, unstored reads with attribution are acceptable."
      - "GBD alignment: an ED-visit share is not an incidence; COVID-19, influenza and RSV map to GBD causes for keying only, and no comparison with GBD estimates is implied."
