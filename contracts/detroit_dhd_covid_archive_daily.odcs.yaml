apiVersion: v3.2.0
kind: DataContract
id: detroit_dhd_covid_archive_daily
name: Daily COVID-19 cases in Detroit (Detroit Health Department COVID-19 Archived Dashboard)
version: 0.1.0
status: draft
domain: infectious_disease
description:
  purpose: "Daily COVID-19 cases in the City of Detroit, March 2020 to May 2026, as the Detroit Health Department's archived public COVID-19 dashboard charts them on its Timeline Cases tab."
  usage: "Read one day, or add days into weeks, months or years for Detroit; a period with any day shown as '<16' has no total. Read live from the city; never stored."
  limitations: "An archived dashboard, not a dataset: the case definition and the meaning of the disease date are not in the data, and the layout can change without notice (the worksheet layout hash stops the load when it does)."
  authoritativeDefinitions:
    - {type: canonicalUrl, url: "https://codtableau.detroitmi.gov/t/DHD/views/CityofDetroit-PublicCOVIDDashboard/TimelineCasesDashboard", description: "Dashboard view read (fetched 2026-11-24)"}
    - {type: businessDefinition, url: "https://codtableau.detroitmi.gov/t/DHD/views/CityofDetroit-PublicCOVIDDashboard/DashboardNotes", description: "The dashboard's Dashboard Notes tab (not opened; see openQuestions)"}
servers:
  - id: detroit_tableau
    server: codtableau.detroitmi.gov
    type: api
    location: https://codtableau.detroitmi.gov/t/DHD/views/CityofDetroit-PublicCOVIDDashboard
    description: "Tableau Server guest view (TimelineCasesDashboard), read in a browser; the data come from the view's bootstrapSession answer (adapters/tableau.py)."
schema:
  - name: detroit_dhd_covid_archive_daily
    physicalName: detroit_dhd_covid_archive_daily
    physicalType: table
    logicalType: object
    description: "One row per day for the daily case bars (case_status 'Confirmed'), and one per day for the chart's 7-day average line (case_status empty; not read by any metric)."
    dataGranularityDescription: "disease date (day) x chart layer"
    customProperties:
      - property: totalRows
        value: none
        description: "The Epi Curve Cases by Combined worksheet has no total row: 4,480 rows on 2026-11-24, 2,240 days for the bars and 2,240 for the 7-day average line. The dashboard's headline totals are separate worksheets, not read."
      - {property: tableShape, value: surveillance_series}
      - property: idDimensions
        value:
          condition: null
          caseDefinition: null
          caseStatus: case_status
          organismResistance: null
          period: disease_date
          provisionalFlag: null
        description: "Every row is COVID-19, as the dashboard's title says. The bars carry the Case Status label 'Confirmed'; the field behind them is named 'Confirmed & Probable Case Count', so whether probable cases are included is an open question."
    properties:
      - name: view
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The dashboard tab the row was read from (TimelineCasesDashboard); for provenance."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: view}
      - name: worksheet
        physicalType: VARCHAR
        logicalType: string
        required: true
        description: "The chart the row was read from (Epi Curve Cases by Combined); for provenance."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: worksheet}
      - name: disease_date
        physicalType: DATE
        logicalType: date
        required: true
        description: "The day the cases are placed on, which the dashboard calls the disease date (2020-03-01 to 2026-05-23 on 2026-11-24)."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: "Confirmed & Probably Disease Date"}
      - name: case_status
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "The case status label on the daily bars ('Confirmed' on every bar on 2026-11-24); empty on the rows of the 7-day average line."
        customProperties:
          - {property: role, value: dimension}
          - {property: sourceField, value: "Case Status (alias)"}
      - name: cases
        physicalType: BIGINT
        logicalType: integer
        required: false
        description: "COVID-19 cases in Detroit on the day, as the daily bar carries them. Empty where the dashboard shows the day as '<16' (see cases_flag), never the number behind the bar."
        customProperties:
          - {property: role, value: measure}
          - {property: sourceField, value: "AGG(Confirmed & Probable Case Count)"}
          - {property: unit, value: "cases"}
      - name: cases_flag
        physicalType: VARCHAR
        logicalType: string
        required: false
        description: "The dashboard's suppression marker for the day, exactly as shown ('<16'); empty when the day's count is shown."
        customProperties:
          - {property: role, value: attribute}
          - {property: sourceField, value: "AGG(Confirmed & Probable Case Count) flag"}
customProperties:
  - {property: licence, value: no-terms-stated}
  - {property: redistribution, value: false}
  - {property: citation, value: "City of Detroit Health Department. City of Detroit Public COVID-19 Dashboard (archived), Timeline Cases. https://codtableau.detroitmi.gov/t/DHD/views/CityofDetroit-PublicCOVIDDashboard/TimelineCasesDashboard"}
  - {property: refresh, value: irregular}
  - {property: geographyBasis, value: "unresolved: the dashboard does not say whether cases are counted by residence in Detroit"}
  - property: unreliableRule
    value:
      kind: publisher_suppressed
      threshold: 16
      description: "The dashboard's own tooltip shows a day's count as '<16' (the marker as published, on the same mark as the bar); that day's count is read as suppressed and left empty. No codebook text states the rule; the threshold is the published marker."
  - property: evidence
    value:
      - retrieved_at: "2026-11-24T21:21:22Z"
        url: https://codtableau.detroitmi.gov/t/DHD/views/CityofDetroit-PublicCOVIDDashboard/TimelineCasesDashboard?:embed=y&:showVizHome=no
        user_agent: "health-data-registry/0.0.1 (+https://github.com/jtouley/health-data-registry)"
        robots_txt: "404 (none published)"
        raw_sha256: 78a2ac90e69621203f5e17ec2552ee0d5ab17e400a1b2f8373cca28523bce9e5
        csv_export: "TimelineCasesDashboard.csv answered 404 on 2026-11-24, so the bootstrapSession answer is read."
        first_attempt: "An earlier open of the same view (2026-11-24, about 21:19Z) loaded the page but sent no data; the second open, paced, did."
        tabs_seen: ["Timeline Cases Dashboard", "Demographic Cases Dashboard", "Hospital Capacity Dashboard", "ZIP Code Case Dashboard", "Citywide Stats", "Dashboard Notes"]
        layout_sha256: c8f939fbdd5a34cf8794b06c75d540f56173684f25c56047d9f883467cb22c22
        read: "Epi Curve Cases by Combined: 4,480 rows; columns Today Window, Today Window -6, Confirmed & Probably Disease Date (date), Case Status (cstring), AGG(Confirmed & Probable Case Count) (integer), ATTR(Combined Disease Date), AGG(Tooltip Number of Records) (cstring), the order-date reference lines (First Case Date Window, Stay at Home Order, Phase 3, Phase 4, Pause to Save Lives), the 7-day average and its tooltip. 2,240 bar rows, 2020-03-01 to 2026-05-23, all labelled Confirmed. Suppression marker '<16' on 652 of the 2,240 bars' tooltips (on every bar whose number is 16 or less, on none above) and on 593 of the 7-day line's tooltips."
        headline_totals: "Cases (2): AGG(Total Records) 188,357; Cases (probable): 18,031; Deaths (2): 3,855; Deaths (Probable) (2): 232; 23 deaths with no date of death. Not read into this table."
        not_read: "Epi Curve Deaths by Combined (2,158 days, 2020-03-18 to 2026-02-12; 2,121 of them shown as '<16') has its own date field and is not catalogued yet. The Demographic, Hospital Capacity, ZIP Code and Citywide Stats tabs were not opened."
  - property: openQuestions
    value:
      - "Case status: the bars are labelled 'Confirmed' but their field is 'Confirmed & Probable Case Count', and the headline shows probable cases separately (18,031). Do the daily bars count confirmed cases only? Until a maintainer confirms it from DHD, no case status is stated for the series."
      - "Suppression threshold: the tooltip reads '<16' on every day whose number is 16 or less, so the marker covers 16 itself. Is the rule 'fewer than 16' with the marker computed on another count, or 'at most 16'? The read leaves every marked day empty either way."
      - "Disease date: is it the onset date, the specimen collection date, or the earliest of several dates ('Combined Disease Date')? The Dashboard Notes tab was not opened."
      - "Is a case counted by the person's residence in Detroit? (geographyBasis is unresolved until then.)"
      - "Archive: the timestamp reads 'Wednesday, May 27' with data to 2026-05-23. Is the dashboard frozen, and is there a final DHD statement of the archive date?"
      - "Licence: no terms of use are stated. Maintainer to confirm that live, unstored reads with attribution are acceptable."
      - "Deaths: the deaths curve is almost entirely shown as '<16' by day; a weekly or monthly table from DHD would be more useful than reading it."
