# Dependabot version updates: weekly, one grouped PR per ecosystem (security updates stay separate).
# Options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Actions are pinned to full commit SHAs with the tag in a comment; Dependabot bumps both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # Python: pyproject.toml + uv.lock (the uv ecosystem updates the lock file too).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      python-major:
        applies-to: version-updates
        update-types: ["major"]

  # The ClusterFuzzLite build image, pinned by digest in .clusterfuzzlite/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"

  # The fuzz build's hash-pinned dependencies (fuzz/requirements.txt, resolved for the image's Python 3.11).
  # Keep them at uv.lock's versions: regenerate with the command in fuzz/requirements.in after a lock change.
  - package-ecosystem: "pip"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    groups:
      fuzz-deps:
        applies-to: version-updates
        patterns: ["*"]
