# DOI-based conference abstracts (IDWeek, SHEA, APIC, ICID): metadata from Crossref, OpenAlex or Europe PMC,
# which publish the supplements' abstracts by DOI (no site crawl, no crawl delay).
#
# One job per conference (matrix, fail-fast off), each in its own concurrency group. `scripts/crawl_doi.py`
# harvests the conference into $HDR_LAKE/private/<source>/ and names the source's PRIVATE dataset
# (naming.private_dataset, docs/dev/naming.md); the upload step sends only those *.jsonl files there. Nothing
# from this workflow reaches the public release.
#
# scripts/crawl_doi.py arrives with the DOI harvester (branch wip/doi-harvest, PR feat/doi-harvest). Until it is
# on main, every job skips with a notice and harvests nothing; once it merges, the next run harvests.
#
# Secrets: HF_TOKEN (HF_CRAWL_TOKEN, if set, overrides it with a token limited to the private datasets).
name: DOI conference crawl

on:
  schedule:
    # Wednesday 03:41 UTC; off the hour, away from the refresh and the drift check.
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    name: Harvest ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: doi-crawl-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        source: [idweek, shea, apic, icid]
    env:
      HDR_LAKE: ${{ github.workspace }}/lake
      HF_TOKEN: ${{ secrets.HF_CRAWL_TOKEN || secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HDR_PRIVATE_HF_OWNER: ${{ vars.HDR_PRIVATE_HF_OWNER }}
      SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the harvester and the token
        id: gate
        run: |
          if [ ! -f scripts/crawl_doi.py ]; then
            echo "::notice::scripts/crawl_doi.py is not on main yet (it comes with the DOI harvester PR, feat/doi-harvest). Nothing harvested for $SOURCE."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$HF_TOKEN" ]; then
            echo "::notice::No HF_TOKEN secret: the harvest could not be kept, so nothing is harvested for $SOURCE."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install dependencies (locked)
        if: steps.gate.outputs.go == 'true'
        run: uv sync --locked --no-dev

      - name: Harvest ${{ matrix.source }}
        id: harvest
        if: steps.gate.outputs.go == 'true'
        run: uv run --no-sync python scripts/crawl_doi.py "$SOURCE"

      # Only the governed private name is accepted, so a wrong owner or a changed script can't send the
      # rows to a public or unrelated repository.
      - name: Upload to the source's private dataset
        if: steps.gate.outputs.go == 'true'
        env:
          FOLDER: ${{ steps.harvest.outputs.folder }}
          PRIVATE_REPO: ${{ steps.harvest.outputs.private_repo }}
          SOURCE_ID: ${{ steps.harvest.outputs.source }}
          COMPLETE: ${{ steps.harvest.outputs.complete }}
        run: |
          want=$(uv run --no-sync python -m health_data_registry.naming private "$SOURCE_ID") \
            || { echo "::error::$SOURCE_ID is not a catalog source id"; exit 1; }
          if [ "$PRIVATE_REPO" != "$want" ]; then
            echo "::error::the harvest named $PRIVATE_REPO; only $want is allowed (docs/dev/naming.md)"
            exit 1
          fi
          if [ ! -d "$FOLDER" ] || [ -z "$(ls -A "$FOLDER")" ]; then
            echo "::notice::Nothing harvested for $SOURCE_ID; nothing uploaded."
            exit 0
          fi
          uv run --no-sync hf upload "$PRIVATE_REPO" "$FOLDER" . --repo-type dataset --private \
            --include "*.jsonl" --include "**/*.jsonl" --commit-message "DOI harvest ${SOURCE}, run ${GITHUB_RUN_ID}"
          if [ "$COMPLETE" != "true" ]; then
            echo "::notice::$SOURCE_ID: the supplement was not read to the end; the next run continues."
          fi
