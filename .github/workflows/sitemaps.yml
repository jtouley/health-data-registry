# Weekly sitemap snapshots: `health-data-registry sitemaps snapshot` takes this week's copy of each seed sitemap
# (michigan.gov /mdhhs/ and /emergingdiseases/, kentcountymi.gov) and uploads it, with its diff against last
# week, to the PRIVATE dataset <owner>/health-data-registry-ops-sitemaps (named by naming.py). The dataset is
# created private by the command on its first run if it is missing; an existing public one is refused.
#
# Fetcher: headless Chromium (browser_fetch.py, Playwright) with the repo's honest user agent, because
# michigan.gov's edge network (Akamai) refuses plain HTTPS from cloud IPs. browser_fetch.py arrives with the
# Michigan adapters (branch wip/michigan-adapters, PR feat/michigan-tableau); until it is on main this job falls
# back to `--fetcher http` with a notice, and the Michigan seeds are expected to be refused.
#
# A refusal is final. When any seed is not taken (refused or failed), report-blocked opens, or comments on, the
# "Sitemap refresh blocked" issue. Nothing is retried another way, and nothing is written to git: the job has
# a read-only token and never pushes.
#
# Secrets: HF_TOKEN (HF_CRAWL_TOKEN, if set, overrides it with a token limited to the ops dataset).
name: Weekly sitemap snapshots

on:
  schedule:
    # Monday 04:43 UTC; off the hour, away from the refresh, the crawls and the drift check.
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitemaps
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot the seed sitemaps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_CRAWL_TOKEN || secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HDR_PRIVATE_HF_OWNER: ${{ vars.HDR_PRIVATE_HF_OWNER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev

      - name: Choose the fetcher
        id: fetcher
        run: |
          if uv run --no-sync python -c "import health_data_registry.browser_fetch" 2>/dev/null; then
            echo "kind=browser" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The browser fetcher (browser_fetch.py) is not on main yet; it comes with the Michigan adapters PR (feat/michigan-tableau). Using plain HTTPS, which michigan.gov refuses from cloud servers."
            echo "kind=http" >> "$GITHUB_OUTPUT"
          fi

      # The `browser` extra pins Playwright; Chromium comes from Playwright's own download for that version.
      - name: Install Playwright and Chromium
        if: steps.fetcher.outputs.kind == 'browser'
        run: |
          uv sync --locked --no-dev --extra browser
          uv run --no-sync playwright install --with-deps chromium

      - name: Take and upload the snapshots
        env:
          FETCHER: ${{ steps.fetcher.outputs.kind }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "No HF_TOKEN secret: nothing can be uploaded, so nothing was taken." | tee not-taken.txt
            exit 1
          fi
          repo=$(uv run --no-sync python -m health_data_registry.naming ops sitemaps)
          set +e
          uv run --no-sync health-data-registry sitemaps snapshot --repo "$repo" --fetcher "$FETCHER" 2> not-taken.txt
          code=$?
          set -e
          cat not-taken.txt >&2
          exit "$code"

      - name: Keep the reasons for the issue
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitemaps-not-taken
          path: not-taken.txt
          if-no-files-found: ignore
          retention-days: 7

  report-blocked:
    name: Open or update the blocked issue
    needs: snapshot
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the blocked issue
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sitemaps-not-taken
          path: reasons/
      - name: Open or comment on the sitemap-refresh-blocked issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Sitemap refresh blocked"
        run: |
          # The reasons can quote a URL from a publisher's sitemap: shown as a code block, backticks and
          # @ removed, and cut short, so they can't format the issue or mention anyone.
          reasons=$(tr -d '`@' < reasons/not-taken.txt 2>/dev/null | head -c 4000 || true)
          {
            echo "This week's sitemap snapshot did not take every seed: $RUN_URL"
            echo
            echo '```text'
            echo "${reasons:-(no reasons recorded; see the run log)}"
            echo '```'
            echo
            echo "A refusal is not worked around. If a publisher refuses automated access, a maintainer can"
            echo "download the sitemap in their own browser and upload it with"
            echo "health-data-registry sitemaps snapshot --from-file NAME=PATH."
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
