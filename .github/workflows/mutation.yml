name: Mutation

# Mutation tests run nightly on main, not in CI (hard rule 13; the maintainer's decision of 25 Nov 2026 on #122).
# Each run mutates every function changed on main since the last green run (scripts/mutation_nightly.py base),
# in shards of the changed functions (scripts/mutate_changed.py), all starting from mutmut stats taken once, in
# this run, on the commit it mutates. "Mutation result" applies the 70% floor to the total and fails closed: a
# shard whose baseline failed, that left mutants unchecked or a mutant in no shard, or that left no report fails
# the run, and a red run never moves the base, so the next run covers its range again. Survivors open or update
# one issue per originating pull request or commit (label mutation-survivors). A release (v-tag, Space deploy, hub
# publish) waits until the latest run covering its commit is green and no survivor issue is open
# (scripts/mutation_nightly.py gate).
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Mutate what changed since this commit (blank: since the last green run). Only further back."
        required: false
        default: ""

permissions:
  contents: read

# One run at a time, never cancelled: each one's base is the last green run's commit.
concurrency:
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read to find the last green run of this workflow; nothing is written.
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.base.outputs.base }}
      modules: ${{ steps.shards.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The same pinned Python as the shards: the split comes from ast, and each shard refuses a split hash that
      # differs from the one listed here.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Base (the last green run's commit)
        id: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_BASE: ${{ inputs.base }}
        run: uv run --no-project python scripts/mutation_nightly.py base --repo "${REPO}" --input-base "${INPUT_BASE}" --github-output "$GITHUB_OUTPUT"
      - name: Shards of the changed functions
        id: shards
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if ! [[ "${BASE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No base commit, so what changed is unknown. Failing."
            exit 1
          fi
          modules="$(uv run --no-project python scripts/mutate_changed.py --list --base "${BASE}")"
          echo "Shards of the functions changed since ${BASE}: ${modules}"
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"

  # mutmut's map of which tests call which function, over every test, on this run's commit. Every shard starts
  # from it, so mutmut collects stats again only for the tests of the changed functions and changed test files.
  stats:
    name: Mutation stats
    needs: plan
    if: needs.plan.outputs.modules != '[]' && needs.plan.outputs.modules != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Collect mutmut's stats over every test
        run: uv run python scripts/mutate_changed.py --collect-stats .mutmut-cache/stats.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-stats
          path: .mutmut-cache/stats.json
          if-no-files-found: error
          retention-days: 3

  # One job per shard. No per-PR time pressure here, but a hard limit for a hung run.
  shard:
    name: Mutation tests (${{ matrix.module }})
    needs: [plan, stats]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # At most 6 shards at a time, so the run leaves the account's other runners free.
      max-parallel: 6
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      # fetch-depth 0: the shard diffs against the base the plan job chose, to scope to the same functions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutmut-stats
          path: .mutmut-cache/
      # MODULE is a shard id `<module>#<k>of<n>@<split hash>`; it is always quoted. mutmut runs one mutant per core.
      - name: Mutation tests on one shard
        env:
          MODULE: ${{ matrix.module }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          if ! [[ "${BASE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The plan job gave no base, so this shard cannot scope to the changed functions. Failing."
            exit 1
          fi
          uv run python scripts/mutate_changed.py --module "${MODULE}" --base "${BASE}" \
            --stats .mutmut-cache/stats.json --report "mutation-report/${MODULE}.json"
      # Uploaded even when the shard failed, so "Mutation result" shows its counts; a missing report fails there.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-${{ matrix.module }}
          path: mutation-report/
          if-no-files-found: error
          retention-days: 30

  # The run's verdict, and the survivor issues. always(): a cancelled or failed shard still ends the run red.
  result:
    name: Mutation result
    needs: [plan, stats, shard]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issues: write only to open or update survivor issues.
    permissions:
      contents: read
      issues: write
    env:
      MODULES: ${{ needs.plan.outputs.modules }}
      BASE: ${{ needs.plan.outputs.base }}
    steps:
      - name: The plan ran, and every shard left a result
        env:
          PLAN: ${{ needs.plan.result }}
          STATS: ${{ needs.stats.result }}
          SHARD: ${{ needs.shard.result }}
        run: |
          fail() { echo "$1 Failing."; exit 1; }
          [ "${PLAN}" = "success" ] || fail "The plan job ended with '${PLAN}', so nothing was mutated."
          if [ "${MODULES}" = "[]" ]; then
            [ "${STATS}" = "skipped" ] && [ "${SHARD}" = "skipped" ] || fail "No shard was listed, yet a job ran."
            echo "No function changed on main since ${BASE}: nothing to mutate."
            exit 0
          fi
          [ "${STATS}" = "success" ] || fail "The stats job ended with '${STATS}'."
          # A failed shard still left its report; the floor step below decides.
          [ "${SHARD}" = "success" ] || [ "${SHARD}" = "failure" ] || fail "The shards ended with '${SHARD}'."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.MODULES != '[]'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.MODULES != '[]'
        with:
          pattern: mutation-*
          path: mutation-reports/
          merge-multiple: true
      - name: Mutation floor on the total
        if: env.MODULES != '[]'
        env:
          MUTATION_FLOOR: "70"
        run: |
          mkdir -p mutation-reports
          python3 scripts/mutate_changed.py --aggregate mutation-reports --expect "${MODULES}" --floor "${MUTATION_FLOOR}"
      # Survivors go to an issue per originating PR or commit, whether or not the floor passed.
      - name: Survivor issues
        if: always() && env.MODULES != '[]' && hashFiles('mutation-reports/*.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/mutation_nightly.py issues --repo "${REPO}" --reports mutation-reports --base "${BASE}" --run-url "${RUN_URL}"
