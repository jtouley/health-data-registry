name: CI

# What runs where (docs/dev/README.md#ci):
# - pull_request and push to pre-pr/** (the pre-PR gate): only what the change can affect (scripts/ci_impact.py),
#   tests on Python 3.12, and mutation tests on the changed functions. A PR whose tested tree equals a green
#   pre-pr run's reuses that whole verdict (scripts/verdict_reuse.py).
# - merge_group (the merge queue): everything, tests on 3.12 and 3.13 with the coverage floor, and every mutation
#   shard of the PR's changed functions with no time budget, so a shard a PR deferred is mutated before the merge.
# - push to main, nightly and by hand: everything but mutation; main also refreshes the mutmut stats the PR shards
#   start from.
# Every PR job fits the pre-PR budget (ci/budgets.yml: 3 minutes, push to every check done). What cannot fit is
# deferred, by name, to the merge queue, never cut short or skipped: a change of more than 6 shards, a shard with no
# mutmut stats from main, or one that runs past its budget.
# The one required check is "CI result": it passes only when every job the changes job selected passed and every
# other job was skipped for a reason it knows.
on:
  pull_request:
  # pre-pr/** is the pre-PR gate (CLAUDE.md, "How changes land"): a commit goes green there before it reaches a PR.
  push:
    branches: [main, "pre-pr/**"]
  merge_group:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

# Read-only token for every job; no job here writes to the repository.
permissions:
  contents: read

# A newer push to the same PR or pre-pr branch cancels the superseded run, its queued jobs and shards included.
# Every other run (main, a merge-queue entry, nightly) gets a group of its own, keyed by commit and event, so it is
# never cancelled, nor dropped from the queue by a later one.
concurrency:
  group: ci-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/pre-pr/')) && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/pre-pr/') }}

jobs:
  # Seconds: what the change can affect, the mutation shards of its changed functions, and on a PR whether a green
  # pre-pr run already checked this exact tree. Standard library only, so no project install.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read only for the reuse lookup (workflow runs and their jobs); nothing is written.
    permissions:
      contents: read
      actions: read
    outputs:
      reused_run: ${{ steps.reuse.outputs.run_id }}
      full: ${{ steps.impact.outputs.full }}
      tests: ${{ steps.impact.outputs.tests }}
      test_args: ${{ steps.impact.outputs.test_args }}
      dbt: ${{ steps.impact.outputs.dbt }}
      kit: ${{ steps.impact.outputs.kit }}
      pythons: ${{ steps.impact.outputs.pythons }}
      modules: ${{ steps.mutation.outputs.modules }}
      mutation_base: ${{ steps.mutation.outputs.base }}
      mutation_deferred: ${{ steps.mutation.outputs.deferred }}
      merge_base: ${{ steps.impact.outputs.merge_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The same pinned Python as the shards: the mutation split comes from ast, and each shard refuses a split
      # hash that differs from the one listed here.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      # Whole-verdict reuse (#96's rule): main's copy of the lookup, the head SHA from the event payload, the tested
      # commit from this checkout. Any failure or argument mismatch reuses nothing, so everything runs.
      - name: Look for a green pre-pr verdict on this tree
        id: reuse
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          script="scripts/verdict_reuse.py"
          lookup="${RUNNER_TEMP}/verdict_reuse.py"
          errors="${RUNNER_TEMP}/verdict_reuse.err"
          run_id=""
          status=0
          if ! git cat-file -e "origin/${BASE_REF}:${script}" 2> /dev/null; then
            echo "::warning::origin/${BASE_REF} has no ${script}, so no pre-pr verdict is reused and everything runs."
          elif ! tested="$(git rev-parse --verify --quiet 'HEAD^{commit}')"; then
            echo "::warning::The tested commit could not be read, so no pre-pr verdict is reused and everything runs."
          else
            git show "origin/${BASE_REF}:${script}" > "${lookup}"
            echo "Lookup: origin/${BASE_REF}:${script}; tested commit ${tested}"
            run_id="$(uv run --no-project python "${lookup}" --repo "${REPO}" --sha "${HEAD_SHA}" --base "${BASE_REF}" --tested-commit "${tested}" 2> "${errors}")" || status=$?
            cat "${errors}" >&2
            if [ "${status}" -ne 0 ] && grep -qE "unrecognized arguments|arguments are required" "${errors}"; then
              echo "::warning::Argument mismatch: origin/${BASE_REF}:${script} does not accept this workflow's arguments (exit ${status}; its command line changed in a PR not merged yet), so no pre-pr verdict is reused and everything runs."
              run_id=""
            elif [ "${status}" -ne 0 ]; then
              echo "::warning::The pre-pr verdict lookup failed (exit ${status}), so no pre-pr verdict is reused and everything runs."
              run_id=""
            fi
          fi
          if ! [[ "${run_id}" =~ ^[0-9]*$ ]]; then
            echo "Unexpected lookup output; everything runs."
            run_id=""
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
      # A pull request compares with its base branch; a push to pre-pr/** compares with main, the branch its PR will
      # target. Any other event runs everything. Fail if the base was not fetched (fetch-depth 0 above).
      - name: What the change can affect
        id: impact
        if: steps.reuse.outputs.run_id == ''
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ci/fast-ci-probe-base
        run: |
          if [ "${EVENT}" = "pull_request" ] || [[ "${REF}" == refs/heads/pre-pr/* ]]; then
            if ! merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)" || ! [[ "${merge_base}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "No merge base with origin/${BASE_REF}, so what changed is unknown. Failing."
              exit 1
            fi
            uv run --no-project python scripts/ci_impact.py --base "${merge_base}" --github-output "$GITHUB_OUTPUT"
            echo "merge_base=${merge_base}" >> "$GITHUB_OUTPUT"
            echo 'pythons=["3.12"]' >> "$GITHUB_OUTPUT"
          else
            uv run --no-project python scripts/ci_impact.py --full --github-output "$GITHUB_OUTPUT"
            echo "merge_base=" >> "$GITHUB_OUTPUT"
            echo 'pythons=["3.12","3.13"]' >> "$GITHUB_OUTPUT"
          fi
      # Only the functions this change touches (spec: mutation tests on changed functions), compared with the merge
      # base (in the merge queue, the queue's base commit), as shard ids `<module>#<k>of<n>@<split hash>`; the hash
      # covers exactly which functions each shard mutates. On a PR, more than 6 shards (more than one wave at
      # max-parallel) cannot fit the budget: the PR then lists none and names why, and the merge queue runs them.
      # Main and nightly run none: every change reaches main through the queue.
      - name: Mutation shards of the changed functions
        id: mutation
        if: steps.reuse.outputs.run_id == ''
        env:
          EVENT: ${{ github.event_name }}
          MERGE_BASE: ${{ steps.impact.outputs.merge_base }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          base="${MERGE_BASE}"
          if [ "${EVENT}" = "merge_group" ]; then base="${QUEUE_BASE}"; fi
          if [ -z "${base}" ]; then
            echo "modules=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "${base}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The base commit is not a full SHA (${base}). Failing."
            exit 1
          fi
          modules="$(uv run --no-project python scripts/mutate_changed.py --list --base "${base}")"
          echo "Shards of the changed functions since ${base}: ${modules}"
          count="$(python3 -c 'import json, sys; print(len(json.loads(sys.argv[1])))' "${modules}")"
          if [ "${EVENT}" != "merge_group" ] && [ "${count}" -gt 6 ]; then
            echo "deferred=${count} mutation shards are more than one wave (6), so they cannot fit the pre-PR budget; the merge queue mutates them before the merge." >> "$GITHUB_OUTPUT"
            modules="[]"
          fi
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

  # The fast checks in one job, one install: generated files current (docs, transform/), then in parallel every
  # pre-commit hook (ruff, mypy, actionlint and the rest), the Claude Projects kit, and dbt build on the fixtures.
  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.reused_run == ''
    runs-on: ubuntu-latest
    # The pre-PR budget is 2 minutes (ci/budgets.yml); the limit leaves a minute over it for a slow runner.
    timeout-minutes: ${{ needs.changes.outputs.full == 'true' && 10 || 3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.changes.outputs.merge_base != '' && '0' || '1' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      # A budget in ci/budgets.yml may only tighten, unless the change touches that file alone (scripts/ci_budget.py).
      - name: Budgets only tighten
        if: needs.changes.outputs.merge_base != ''
        env:
          MERGE_BASE: ${{ needs.changes.outputs.merge_base }}
        run: python3 scripts/ci_budget.py ratchet --base "${MERGE_BASE}"
      # docs/helpers.md, the template's skills, the plugin and the tool lists (make docs), and the dbt staging
      # models (make contracts), must be exactly what their generators write; an uncommitted output is drift too.
      - name: Generated files are current
        run: |
          make docs
          make contracts
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --porcelain --untracked-files=all
            exit 1
          }
      # In parallel, each with its own log, printed in full; the step fails if any of them failed.
      - name: Hooks, kit and dbt (in parallel)
        env:
          KIT: ${{ needs.changes.outputs.kit }}
          DBT: ${{ needs.changes.outputs.dbt }}
        run: |
          logs="${RUNNER_TEMP}/checks"
          mkdir -p "${logs}"
          declare -A pids
          uv run pre-commit run --all-files --show-diff-on-failure > "${logs}/pre-commit.log" 2>&1 &
          pids[pre-commit]=$!
          if [ "${KIT}" = "true" ]; then
            make kit > "${logs}/kit.log" 2>&1 &
            pids[kit]=$!
          fi
          if [ "${DBT}" = "true" ]; then
            make transform > "${logs}/dbt.log" 2>&1 &
            pids[dbt]=$!
          fi
          failed=""
          for name in "${!pids[@]}"; do
            if wait "${pids[${name}]}"; then result="passed"; else result="FAILED"; failed="${failed} ${name}"; fi
            echo "::group::${name}: ${result}"
            cat "${logs}/${name}.log"
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "Failed:${failed}"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.kit == 'true'
        with:
          name: projects-kit
          path: dist/projects-kit/
          if-no-files-found: error
          retention-days: 30

  # Offline tests, one worker per core (pytest-xdist). A PR runs the test files its change can reach; a full run
  # runs every test, with the coverage floor (a subset cannot meet a floor set for the whole suite).
  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.reused_run == '' && needs.changes.outputs.tests != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.changes.outputs.full == 'true' && 15 || 3 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.changes.outputs.pythons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Tests
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
          TEST_ARGS: ${{ needs.changes.outputs.test_args }}
        run: |
          if [ "${TESTS}" = "all" ]; then
            make test
            exit 0
          fi
          if ! [[ "${TEST_ARGS}" =~ ^tests/[A-Za-z0-9_./\ -]+$ ]]; then
            echo "The test selection is not a list of test files: ${TEST_ARGS}. Failing."
            exit 1
          fi
          read -ra files <<< "${TEST_ARGS}"
          echo "Running ${#files[@]} test files the change can reach (scripts/ci_impact.py)."
          uv run pytest -m "not network" -n auto --dist worksteal "${files[@]}"

  # One job per shard of the changed functions (scripts/mutate_changed.py). Each shard generates its own module's
  # mutants only and starts from main's mutmut stats (job mutation-stats), so mutmut re-collects stats only for
  # the tests of the changed functions and changed test files; without them (a cache miss) it collects stats on
  # the tests that import the module. "CI result" applies the 70% floor to the summed counts and fails closed: a
  # shard whose baseline failed, that left mutants unchecked or a mutant in no shard, or that left no report fails
  # the check. A change too big for 6 shards at once takes longer; it is never cut short or skipped.
  mutation:
    name: Mutation tests (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.reused_run == '' && needs.changes.outputs.modules != '[]' && needs.changes.outputs.modules != ''
    runs-on: ubuntu-latest
    # On a PR, mutmut gets 100 s (--budget) and needs main's stats (--require-stats); past either it reports itself
    # deferred, and the merge queue mutates it. The job limit is the backstop for a hung step. In the merge queue a
    # shard runs to the end, cold stats included.
    timeout-minutes: ${{ github.event_name == 'merge_group' && 20 || 3 }}
    strategy:
      fail-fast: false
      # At most 6 shards of one run at a time: the account has about 20 runners, so one run never takes more than
      # about a third of them, and main's and other PRs' runs still start.
      max-parallel: 6
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      # fetch-depth 0: the shard diffs against the merge base the changes job resolved, to scope to the same
      # functions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Read only: main's stats for the merge base, or else the newest main saved. Only main writes this cache
      # (job mutation-stats); a stale or missing map can only lower the score, never raise it.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .mutmut-cache/stats.json
          key: mutmut-stats-v1-py3.12-${{ needs.changes.outputs.mutation_base }}
          restore-keys: mutmut-stats-v1-py3.12-
      # MODULE is a shard id `<module>#<k>of<n>@<split hash>`; it is always quoted. mutmut runs one mutant per core.
      - name: Mutation tests on one shard
        env:
          EVENT: ${{ github.event_name }}
          MODULE: ${{ matrix.module }}
          MERGE_BASE: ${{ needs.changes.outputs.mutation_base }}
        run: |
          if ! [[ "${MERGE_BASE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The changes job gave no merge base, so this shard cannot scope to the changed functions. Failing."
            exit 1
          fi
          limits=(--require-stats --budget 100)
          if [ "${EVENT}" = "merge_group" ]; then limits=(); fi
          uv run python scripts/mutate_changed.py --module "${MODULE}" --base "${MERGE_BASE}" \
            --stats .mutmut-cache/stats.json "${limits[@]}" --report "mutation-report/${MODULE}.json"
      # Uploaded even when the shard failed, so "CI result" shows its counts; a missing report fails there.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-${{ matrix.module }}
          path: mutation-report/
          if-no-files-found: error
          retention-days: 7

  # On main (and nightly, and by hand): mutmut's map of which tests call which function, over every test, cached
  # for the PR shards above. Not part of "CI result": it gates nothing, and a failure only makes shards start cold.
  mutation-stats:
    name: Mutation stats (main)
    if: startsWith(github.ref, 'refs/heads/pre-pr/ci-fast-ci-probe-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Collect mutmut's stats over every test
        run: uv run python scripts/mutate_changed.py --collect-stats .mutmut-cache/stats.json
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .mutmut-cache/stats.json
          key: mutmut-stats-v1-py3.12-${{ github.sha }}

  # The one required check. always(), not !cancelled(), on purpose: GitHub counts a skipped required check as
  # passing, so a cancelled run must still end this check as a failure. It passes only when the changes job passed,
  # every job it selected passed, every other job was skipped, and the mutation total meets the floor. On a PR
  # whose tested tree equals a green pre-pr run's (changes job), every other job is skipped and this names that run.
  result:
    name: CI result
    needs: [changes, checks, test, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # actions: read only for the CI budget step, which reads this run's job times.
    permissions:
      contents: read
      actions: read
    env:
      REUSED_RUN: ${{ needs.changes.outputs.reused_run }}
      MODULES: ${{ needs.changes.outputs.modules }}
      DEFERRED: ${{ needs.changes.outputs.mutation_deferred }}
    steps:
      - name: Every selected job passed, every other one was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
          MUTATION: ${{ needs.mutation.result }}
          TESTS: ${{ needs.changes.outputs.tests }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          fail() { echo "$1 Failing."; exit 1; }
          [ "${CHANGES}" = "success" ] || fail "The changes job ended with '${CHANGES}', so nothing was selected."
          if [ -n "${REUSED_RUN}" ]; then
            for r in "${CHECKS}" "${TEST}" "${MUTATION}"; do
              [ "${r}" = "skipped" ] || fail "A pre-pr verdict was reused, yet a job ended with '${r}'."
            done
            echo "Reused the green 'CI result' of run ${REUSED_RUN}, which checked this exact tree:"
            echo "${SERVER}/${REPO}/actions/runs/${REUSED_RUN}"
            exit 0
          fi
          [ "${CHECKS}" = "success" ] || fail "Checks ended with '${CHECKS}'."
          if [ "${TESTS}" = "none" ]; then
            [ "${TEST}" = "skipped" ] || fail "No test was selected, yet the tests ended with '${TEST}'."
          else
            [ "${TEST}" = "success" ] || fail "The tests ended with '${TEST}'."
          fi
          if [ -n "${DEFERRED}" ]; then
            echo "Mutation deferred to the merge queue: ${DEFERRED}"
          fi
          if [ "${MODULES}" = "[]" ] || [ -z "${MODULES}" ]; then
            [ "${MUTATION}" = "skipped" ] || fail "No shard was listed, yet the shards ended with '${MUTATION}'."
          else
            # A failed shard still left its report; the floor step below decides.
            [ "${MUTATION}" = "success" ] || [ "${MUTATION}" = "failure" ] || fail "The shards ended with '${MUTATION}'."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.REUSED_RUN == '' && env.MODULES != '[]' && env.MODULES != ''
        with:
          pattern: mutation-*
          path: mutation-reports/
          merge-multiple: true
      # A PR's run accepts a shard that deferred itself (named in the log); the merge queue's never does.
      - name: Mutation floor on the total
        if: env.REUSED_RUN == '' && env.MODULES != '[]' && env.MODULES != ''
        env:
          EVENT: ${{ github.event_name }}
          MUTATION_FLOOR: "70"
        run: |
          mkdir -p mutation-reports
          allow=(--allow-deferred)
          if [ "${EVENT}" = "merge_group" ]; then allow=(); fi
          python3 scripts/mutate_changed.py --aggregate mutation-reports --expect "${MODULES}" --floor "${MUTATION_FLOOR}" "${allow[@]}"
      # Every job of this run against its budget (ci/budgets.yml), slow jobs listed. Runs even when a step above
      # failed, so a slow run is reported either way. Not this job (still running), nor the stats job, which is no
      # part of the verdict.
      - name: CI budget
        if: always() && env.REUSED_RUN == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PROFILE: ${{ needs.changes.outputs.full == 'true' && 'full' || 'pr' }}
        run: python3 scripts/ci_budget.py check --repo "${REPO}" --run-id "${RUN_ID}" --profile "${PROFILE}" --skip "CI result" --skip "Mutation stats (main)"
