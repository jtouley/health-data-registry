name: CI

on:
  pull_request:
  # pre-pr/** is the pre-PR gate (CLAUDE.md, "How changes land"): a commit goes green there before it reaches a PR.
  push:
    branches: [main, "pre-pr/**"]

# Read-only token for every job; no job here writes to the repository.
permissions:
  contents: read

# A newer push to the same PR or pre-pr branch cancels the superseded run. Each push to main gets a group of its
# own (keyed by commit), so a main run is never cancelled, nor dropped from the queue by a later merge.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/pre-pr/')) && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/pre-pr/') }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint and format check
        run: make lint

  pre-commit:
    name: Pre-commit hooks (all files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Same hooks as every local commit, so a commit that skipped them still fails here.
      - name: Run every hook on every file
        run: uv run pre-commit run --all-files --show-diff-on-failure
      # Pinned to the same version as uv.lock (the actionlint hook above), so the two never disagree.
      - name: Lint workflows
        run: uvx --from actionlint-py==1.7.9.24 actionlint

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Type check
        run: make typecheck

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Offline tests only (-m "not network"), with the coverage floor; see the Makefile.
      - name: Tests with coverage
        run: make test

  # The project spec's reference journey (C. auris in Michigan; docs/dev/README.md#smoke-journey) through the
  # built MCP server on a synthetic lake, with the DEV trial questions scored by eval/scorer.py. Offline, and
  # enforced: tests/smoke/conftest.py fails any connection or DNS lookup off the runner. No secret is read.
  smoke:
    name: "Smoke: C. auris journey"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Run the smoke journey
        env:
          HDR_HUB: "off"
          HDR_FETCH_AT_RUN_TIME: "0"
        run: make smoke

  # The dbt project: staging models generated from contracts/ must be exactly what `make contracts` writes,
  # then `dbt build` (models and tests) runs on the synthetic fixtures in tests/fixtures/transform only.
  transform:
    name: Transform (dbt build on fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Generated staging models reproduce from the contracts
        run: |
          make contracts
          git diff --exit-code -- transform/
          # A generated file that was never committed is out of date too.
          test -z "$(git status --porcelain --untracked-files=all -- transform/)" || {
            git status --porcelain --untracked-files=all -- transform/
            exit 1
          }
      - name: dbt build on synthetic fixtures
        run: make transform

  kit:
    name: Claude Projects kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Project instructions, knowledge files and skill zips, built from helpers.py (never committed).
      - name: Build the kit
        run: make kit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: projects-kit
          path: dist/projects-kit/
          if-no-files-found: error
          retention-days: 30

  # Mutation tests run in shards, so a pull request that touches most modules (the first one added about 13,800
  # mutants) finishes; a single job did not within 120 minutes. Each changed module is one shard, or, when its
  # estimated mutants exceed a shard's size, several (`<module>#<k>of<n>`, split by function, and a big function
  # by the last digit of its mutant numbers; see scripts/mutate_changed.py). The last job applies the floor (70%)
  # to the summed counts and fails closed: every mutant not killed (no tests and skipped included) lowers the
  # score, and a shard whose baseline failed, whose run left mutants unchecked, whose module has a mutant no shard
  # covers, or that left no report fails the check, as does a module only some of whose shards were expected. A
  # clean shard with no mutable function has nothing to mutate.
  # They run on pull requests and on pushes to pre-pr/** (the gate must check what the PR will), not on main.
  # Reuse (pull requests only): the pre-PR gate has already mutated the PR's head commit on pre-pr/<branch>, so
  # the list job first asks the Actions API (scripts/mutation_reuse.py, this run's own GITHUB_TOKEN, actions:
  # read) for a completed, successful "Mutation tests (changed modules)" job of this workflow, from a push to a
  # pre-pr/** branch of this repository, for exactly the head SHA in the event payload, on a PR whose base is
  # main. If there is one, it lists no modules, the shards are skipped, and the aggregate passes naming the reused
  # run. A failed, cancelled, still-running or other-SHA run never counts, and an API error means no reuse, so the
  # shards then run as usual. Every other job still runs on the PR, and every required check still reports.
  mutation-list:
    name: Mutation tests (list changed modules)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/pre-pr/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read only for the reuse lookup (workflow runs and their jobs); nothing is written.
    permissions:
      contents: read
      actions: read
    outputs:
      modules: ${{ steps.list.outputs.modules }}
      reused_run: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The same pinned Python as the shards: the split comes from ast, and each shard refuses a split hash that
      # differs from the one listed here. The script needs only the standard library, so no project install.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      # The head SHA and base come from the event payload, never from text a contributor writes; the script
      # checks both and the repository name, and prints a run id only for an exact, green pre-pr match. Like
      # mutate_changed.py, it comes from the PR's own checkout: it adds no trust beyond what a PR's CI already has.
      - name: Look for a green pre-pr mutation verdict on this commit
        id: reuse
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          run_id="$(uv run --no-project python scripts/mutation_reuse.py --repo "${REPO}" --sha "${HEAD_SHA}" --base "${BASE_REF}")"
          if ! [[ "${run_id}" =~ ^[0-9]*$ ]]; then
            echo "Unexpected lookup output; the shards run."
            run_id=""
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
      # Only the modules this change touches (spec: mutation tests on changed functions), as shard ids. The script
      # uses the standard library only (the split reads each module's source with ast) and rejects any name that
      # is not a plain module name or `<module>#<k>of<n>@<split hash>`. A pull request compares with
      # its base branch; a push to pre-pr/** has no base_ref and compares with main, the branch its PR will
      # target. fetch-depth 0 above fetched every branch, so origin/<base> exists; fail if it does not.
      - name: List changed modules
        id: list
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          REUSED_RUN: ${{ steps.reuse.outputs.run_id }}
        run: |
          if [ -n "${REUSED_RUN}" ]; then
            echo "Run ${REUSED_RUN} already mutated this commit on pre-pr/ and passed; no shards here."
            echo "modules=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" > /dev/null; then
            echo "The base branch origin/${BASE_REF} was not fetched, so the changed modules are unknown. Failing."
            exit 1
          fi
          modules="$(uv run --no-project python scripts/mutate_changed.py --list --base "origin/${BASE_REF}")"
          echo "Shards of the changed modules: ${modules}"
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"

  mutation:
    name: Mutation tests (${{ matrix.module }})
    needs: mutation-list
    if: >-
      (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/pre-pr/'))
      && needs.mutation-list.outputs.modules != '[]'
    runs-on: ubuntu-latest
    # A shard holds about 500 estimated mutants (150 for registry.py, whose mutants run most of the suite each):
    # measured 25 Nov 2026 (PR #49), setup took 3.5 to 6.5 minutes and mutants ran at 54 to 145 a minute (13 for
    # registry.py), so a shard needs about 10 to 20 minutes. 40 is twice the slowest expected shard: it stops a
    # hung baseline or stats run (mutmut gives those no timeout of its own) within 40 minutes instead of holding
    # runners. A shard that hits it leaves no report and fails the check; lower its module's target in
    # scripts/mutate_changed.py rather than raising this.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.mutation-list.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      # MODULE is a shard id (a module, or `<module>#<k>of<n>@<split hash>`); it is always quoted, and `#` and `@`
      # are valid in the report's file name and the artifact's name. The shard refuses a split hash that differs
      # from its own split of the source.
      - name: Mutation tests on one shard
        env:
          MODULE: ${{ matrix.module }}
        run: uv run python scripts/mutate_changed.py --module "${MODULE}" --report "mutation-report/${MODULE}.json"
      # Uploaded even when the shard failed, so the aggregate shows its counts; a missing report fails there.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-${{ matrix.module }}
          path: mutation-report/
          if-no-files-found: error
          retention-days: 7

  # Keeps the check name the single job had, so a required status check still points at the verdict.
  # always(), not !cancelled(), on purpose: GitHub counts a skipped required check as passing, so a run
  # cancelled on the head commit must still end this check as a failure. The first step says the run was
  # cancelled; a run superseded by a newer push fails only on its old commit, which no longer gates the merge.
  # On a PR whose head commit already passed on pre-pr/** (see mutation-list), it reports that run instead of a floor.
  mutation-aggregate:
    name: Mutation tests (changed modules)
    needs: [mutation-list, mutation]
    if: ${{ always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/pre-pr/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the list and shard jobs finished
        env:
          LIST_RESULT: ${{ needs.mutation-list.result }}
          SHARDS_RESULT: ${{ needs.mutation.result }}
          MODULES: ${{ needs.mutation-list.outputs.modules }}
        run: |
          if [ "${LIST_RESULT}" = "cancelled" ] || [ "${SHARDS_RESULT}" = "cancelled" ]; then
            echo "The run was cancelled before every shard reported, so there is no verdict. Failing."
            exit 1
          fi
          if [ "${LIST_RESULT}" != "success" ]; then
            echo "Listing the changed modules ended with '${LIST_RESULT}', so nothing was checked. Failing."
            exit 1
          fi
          if [ "${MODULES}" != "[]" ] && [ "${SHARDS_RESULT}" != "success" ] && [ "${SHARDS_RESULT}" != "failure" ]; then
            echo "The mutation shards ended with '${SHARDS_RESULT}'. Failing."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.mutation-list.outputs.modules != '[]'
        with:
          pattern: mutation-*
          path: mutation-reports/
          merge-multiple: true
      # Reuse: the list job found the pre-pr run that mutated this exact head commit and passed (see mutation-list).
      - name: Report the reused pre-pr verdict
        if: needs.mutation-list.outputs.reused_run != ''
        env:
          REUSED_RUN: ${{ needs.mutation-list.outputs.reused_run }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Reused the green 'Mutation tests (changed modules)' verdict of run ${REUSED_RUN} for ${HEAD_SHA}:"
          echo "${SERVER}/${REPO}/actions/runs/${REUSED_RUN}"
      - name: Apply the floor to the total
        if: needs.mutation-list.outputs.reused_run == ''
        env:
          MODULES: ${{ needs.mutation-list.outputs.modules }}
          MUTATION_FLOOR: "70"
        run: |
          mkdir -p mutation-reports
          python3 scripts/mutate_changed.py --aggregate mutation-reports --expect "${MODULES}" --floor "${MUTATION_FLOOR}"
