name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token for every job; no job here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint and format check
        run: make lint

  pre-commit:
    name: Pre-commit hooks (all files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Same hooks as every local commit, so a commit that skipped them still fails here.
      - name: Run every hook on every file
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Lint workflows
        run: uvx --from actionlint-py actionlint

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Type check
        run: make typecheck

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Offline tests only (-m "not network"), with the coverage floor; see the Makefile.
      - name: Tests with coverage
        run: make test

  # The project spec's reference journey (C. auris in Michigan; docs/dev/README.md#smoke-journey) through the
  # built MCP server on a synthetic lake, with the DEV trial questions scored by eval/scorer.py. Offline, and
  # enforced: tests/smoke/conftest.py fails any connection or DNS lookup off the runner. No secret is read.
  smoke:
    name: "Smoke: C. auris journey"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Run the smoke journey
        env:
          HDR_HUB: "off"
          HDR_FETCH_AT_RUN_TIME: "0"
        run: make smoke

  # The dbt project: staging models generated from contracts/ must be exactly what `make contracts` writes,
  # then `dbt build` (models and tests) runs on the synthetic fixtures in tests/fixtures/transform only.
  transform:
    name: Transform (dbt build on fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Generated staging models reproduce from the contracts
        run: |
          make contracts
          git diff --exit-code -- transform/
      - name: dbt build on synthetic fixtures
        run: make transform

  kit:
    name: Claude Projects kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Project instructions, knowledge files and skill zips, built from helpers.py (never committed).
      - name: Build the kit
        run: make kit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: projects-kit
          path: dist/projects-kit/
          if-no-files-found: error
          retention-days: 30

  # Mutation tests run in shards, one job per changed module, so a pull request that touches most modules
  # (the first one added about 13,800 mutants) finishes; a single job did not within 120 minutes. The last job
  # applies the floor (70%) to the summed counts and fails closed: every mutant not killed (no tests and
  # skipped included) lowers the score, and a shard whose baseline failed, whose run left mutants unchecked, or
  # that left no report fails the check. A clean shard with no mutable function has nothing to mutate.
  mutation-list:
    name: Mutation tests (list changed modules)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Only the modules this pull request changes (spec: mutation tests on changed functions). The script
      # uses the standard library only and rejects any name that is not a plain module name.
      - name: List changed modules
        id: list
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          modules="$(python3 scripts/mutate_changed.py --list --base "origin/${BASE_REF}")"
          echo "Changed modules: ${modules}"
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"

  mutation:
    name: Mutation tests (${{ matrix.module }})
    needs: mutation-list
    if: github.event_name == 'pull_request' && needs.mutation-list.outputs.modules != '[]'
    runs-on: ubuntu-latest
    # Measured 25 Nov 2026 on 4 cores: the largest modules are analysis.py (2,022 mutants) and tools.py (1,723);
    # query.py has 1,205 and helpers.py under 700. Setup took about 6 minutes and mutants ran at about 200 a
    # minute, so the largest shard needs about 17 minutes; 60 leaves room for slower runners. A shard that hits
    # the limit leaves no report and fails the check; split the module if that happens.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.mutation-list.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Mutation tests on one module
        env:
          MODULE: ${{ matrix.module }}
        run: uv run python scripts/mutate_changed.py --module "${MODULE}" --report "mutation-report/${MODULE}.json"
      # Uploaded even when the shard failed, so the aggregate shows its counts; a missing report fails there.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-${{ matrix.module }}
          path: mutation-report/
          if-no-files-found: error
          retention-days: 7

  # Keeps the check name the single job had, so a required status check still points at the verdict.
  # always(), not !cancelled(), on purpose: GitHub counts a skipped required check as passing, so a run
  # cancelled on the head commit must still end this check as a failure. The first step says the run was
  # cancelled; a run superseded by a newer push fails only on its old commit, which no longer gates the merge.
  mutation-aggregate:
    name: Mutation tests (changed modules)
    needs: [mutation-list, mutation]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the list and shard jobs finished
        env:
          LIST_RESULT: ${{ needs.mutation-list.result }}
          SHARDS_RESULT: ${{ needs.mutation.result }}
          MODULES: ${{ needs.mutation-list.outputs.modules }}
        run: |
          if [ "${LIST_RESULT}" = "cancelled" ] || [ "${SHARDS_RESULT}" = "cancelled" ]; then
            echo "The run was cancelled before every shard reported, so there is no verdict. Failing."
            exit 1
          fi
          if [ "${LIST_RESULT}" != "success" ]; then
            echo "Listing the changed modules ended with '${LIST_RESULT}', so nothing was checked. Failing."
            exit 1
          fi
          if [ "${MODULES}" != "[]" ] && [ "${SHARDS_RESULT}" != "success" ] && [ "${SHARDS_RESULT}" != "failure" ]; then
            echo "The mutation shards ended with '${SHARDS_RESULT}'. Failing."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.mutation-list.outputs.modules != '[]'
        with:
          pattern: mutation-*
          path: mutation-reports/
          merge-multiple: true
      - name: Apply the floor to the total
        env:
          MODULES: ${{ needs.mutation-list.outputs.modules }}
          MUTATION_FLOOR: "70"
        run: |
          mkdir -p mutation-reports
          python3 scripts/mutate_changed.py --aggregate mutation-reports --expect "${MODULES}" --floor "${MUTATION_FLOOR}"
