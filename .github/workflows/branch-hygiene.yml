# Branch hygiene (issue #67; how it works and how to restore a branch: docs/dev/branch-hygiene.md).
#
#   sweep       daily, live: every branch whose last commit is more than 7 days old, and every wip/* backup whose
#               pull request has merged, gets the annotated tag archive/<branch>/<YYYY-MM-DD> at its head; the
#               tag is checked to resolve to that same commit, and only then is the branch deleted. A tag that
#               can't be created or verified leaves the branch in place and is reported. Branches on the purge
#               list in config/branch_keep.yaml are deleted with no tag. Never touched: the default branch,
#               protected branches, branches with an open pull request (head or base), dependabot/* and the
#               keep list. contents: write on this job only.
#   preview     workflow_dispatch with dry_run: the same decisions, nothing changed; contents: read.
#   report      posts the run's list (archived, purged, not deleted, with the restore command) to the tracking
#               issue: the body is updated in place, and a comment records each run that changed or would
#               change anything. issues: write on this job only.
#   tag-merged  on a merged pull request from this repository: tags its head archive/<branch>/<date>, so the
#               branch GitHub auto-deletes keeps an archive tag. Never deletes. Runs the script from the default
#               branch, never the pull request's copy.
#
# No pull_request_target. Branch names and pull request fields reach the shell only through env, quoted.
name: Branch hygiene

on:
  schedule:
    # Daily 03:41 UTC; off the hour, away from the refresh, the crawls and the drift check.
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: list what would be archived or purged, change nothing"
        type: boolean
        default: false
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: branch-hygiene-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Archive or purge inactive branches
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create archive tags and delete branches
      pull-requests: read # find branches with an open pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - name: Tag, verify, then delete
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run --no-sync python scripts/branch_hygiene.py run --repo "$GITHUB_REPOSITORY"
          --report report.md --changes changes.md --run-url "$RUN_URL"
      - name: Keep the report for the issue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-hygiene-report
          path: |
            report.md
            changes.md
          if-no-files-found: ignore
          retention-days: 30

  preview:
    name: Preview (dry run, nothing changed)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read the branches and their commits
      pull-requests: read # find branches with an open pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - name: List what a live run would do
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run --no-sync python scripts/branch_hygiene.py run --dry-run --repo "$GITHUB_REPOSITORY"
          --report report.md --changes changes.md --run-url "$RUN_URL"
      - name: Keep the report for the issue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-hygiene-report
          path: |
            report.md
            changes.md
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: Update the tracking issue
    needs: [sweep, preview]
    if: >-
      ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (needs.sweep.result != 'skipped' || needs.preview.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # update the tracking issue and comment on it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: branch-hygiene-report
          path: out/
      - name: Update the issue body and record this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Branch hygiene: archived and deleted branches"
        # The report is written by scripts/branch_hygiene.py, which limits branch names to [A-Za-z0-9._/-]
        # and strips backticks, @ and angle brackets from free text, so it can't mention anyone.
        run: |
          if [ -s out/report.md ]; then
            cp out/report.md body.md
          else
            printf 'The branch hygiene run stopped before it wrote a report: %s\nNo branch was deleted after the failure; see the run log.\n' "$RUN_URL" > body.md
          fi
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md)
            number="${url##*/}"
          fi
          if [ -s out/changes.md ]; then
            { echo "Run: $RUN_URL"; echo; cat out/changes.md; } > comment.md
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          elif [ ! -s out/report.md ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          fi

  tag-merged:
    name: Tag the merged branch
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the archive tag
    steps:
      # The default branch's reviewed script, not the pull request's copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - name: Tag the pull request's head
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          uv run --no-sync python scripts/branch_hygiene.py tag-merged --repo "$GITHUB_REPOSITORY"
          --branch="$BRANCH" --sha="$HEAD_SHA" --pr="$PR_NUMBER"
