# Branch hygiene (issue #67; how it works and how to restore a branch: docs/dev/branch-hygiene.md).
# Every decision is made by scripts/branch_hygiene.py, from the GitHub API and config/branch_keep.yaml.
#
#   sweep       daily, live from the first run. Archives CI probe branches, pre-pr/* and wip/* branches whose
#               pull requests are all closed (merged or abandoned), and any branch with no push or commit for 7
#               days; purges the purge list (no tag). At most 25 deletes a run, purges first; the rest wait for the
#               next day, and a rate-limited run stops deleting. Archiving = annotated tag
#               archive/<branch>/<YYYY-MM-DD> at the head, the tag read back and checked against the head, the
#               branch re-read (still at that commit, not protected, no ruleset forbidding deletion, no open pull
#               request using it), then deleted. Any failure keeps the branch and reports it. Never touched: the
#               default branch, protected branches (checked through the API for each branch), open pull
#               requests' heads and bases and their pre-pr/ twins, dependabot/*, the keep list, and anything
#               pushed to or committed to in the last 24 hours.
#   preview     workflow_dispatch with dry_run: the same decisions with a read-only token, to the job summary
#               only; nothing changes, the tracking issue included.
#   report      the sweep's list (archived, purged, not deleted, with restore commands) to the tracking issue:
#               the body is replaced, and a comment records each run that changed anything. The issue is the
#               one this workflow opened (author github-actions[bot]), never one found by title alone.
#   pr-closed   when a pull request from this repository into the default branch closes: tags its head if it
#               merged (GitHub then auto-deletes the branch), and archives its pre-pr/<branch> twin if the
#               twin's head is the pull request's head or an ancestor of it, no other open pull request holds
#               it, and it is more than 24 hours old (a younger twin is left to the sweep).
#
# Every job writes its list to the job summary. Top-level token: no permissions; contents: write only on the
# jobs that tag and delete. No pull_request_target. Event values (branch names, SHAs, PR numbers) reach the
# script only through env, quoted, as --opt="$VAR", and the script checks them (plain branch name, 40-hex SHA).
# The pr-closed job runs the default branch's copy of the script. This workflow file itself, though, is the pull
# request's copy on a pull_request event: a pull request that changes this file can run its own steps with
# contents: write when it closes, so review a change here as if it could delete branches.
name: Branch hygiene

on:
  schedule:
    # Daily 03:41 UTC; off the hour, away from the refresh, the crawls and the drift check.
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: list what would be archived or purged, change nothing"
        type: boolean
        default: false
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  # The read-only preview has its own group, so it never displaces a queued live sweep.
  group: branch-hygiene-${{ github.event.pull_request.number || (inputs.dry_run && 'preview') || 'sweep' }}
  # A running sweep or delete is never cancelled. GitHub keeps one pending run per group: a newer queued run
  # replaces an older one that has not started, and the next day's sweep catches up.
  cancel-in-progress: false

jobs:
  sweep:
    name: Archive or purge finished and inactive branches
    if: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create archive tags and delete branches
      pull-requests: read # find open pull requests, and the pull requests a branch's head belongs to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - name: Tag, verify, then delete
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The script writes its report even when it stops early, so what it already deleted is always listed.
        run: |
          status=0
          uv run --no-sync python scripts/branch_hygiene.py run --repo="$GITHUB_REPOSITORY" \
            --report=report.md --changes=changes.md --run-url="$RUN_URL" || status=$?
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: Keep the report for the issue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-hygiene-report
          path: |
            report.md
            changes.md
          if-no-files-found: ignore
          retention-days: 30

  preview:
    name: Preview (dry run, nothing changed)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # read the branches and their commits
      pull-requests: read # find open pull requests, and the pull requests a branch's head belongs to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - name: List what a live run would do
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --no-sync python scripts/branch_hygiene.py run --dry-run --repo="$GITHUB_REPOSITORY" \
            --report=report.md --changes=changes.md --run-url="$RUN_URL"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the preview report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-hygiene-preview
          path: |
            report.md
            changes.md
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: Update the tracking issue
    # Live sweeps only: a preview stays in its job summary and never touches the issue.
    needs: [sweep]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.sweep.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # update the tracking issue and comment on it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: branch-hygiene-report
          path: out/
      - name: Update the issue body and record this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Branch hygiene: archived and deleted branches"
        # The report comes from scripts/branch_hygiene.py, which limits branch names to [A-Za-z0-9._/-] and
        # strips backticks, @ and angle brackets from free text, so it can't mention anyone.
        # The issue is found through the REST list (not the search index, which lags) and only among issues this
        # workflow opened: anyone can open an issue with the same title on a public repository.
        run: |
          number=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq '.[] | select(.title == env.TITLE and .pull_request == null) | .number' | sort -n | head -n 1)
          if [ -s out/report.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file out/report.md
            else
              url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file out/report.md)
              number="${url##*/}"
            fi
            if [ -s out/changes.md ]; then
              { echo "Run: $RUN_URL"; echo; cat out/changes.md; } > comment.md
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            fi
          else
            # No report at all: say so in a comment and keep the body, which holds the last real report.
            printf 'The branch hygiene run stopped before it wrote a report: %s\nSee the run log and the archive tags.\n' "$RUN_URL" > note.md
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file note.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file note.md
            fi
          fi

  pr-closed:
    name: Tag the merged branch and archive its pre-pr twin
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.base.ref == github.event.repository.default_branch
      && !startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create archive tags and delete the pre-pr twin
      pull-requests: read # check no open pull request still uses the twin
    steps:
      # The default branch's copy of the script. The steps below are this file as the pull request has it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - name: Tag and clean up
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          merged_flag=()
          if [ "$PR_MERGED" = "true" ]; then merged_flag=(--merged); fi
          status=0
          uv run --no-sync python scripts/branch_hygiene.py pr-closed --repo="$GITHUB_REPOSITORY" \
            --branch="$BRANCH" --sha="$HEAD_SHA" --pr="$PR_NUMBER" "${merged_flag[@]}" --report=report.md || status=$?
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
