# Weekly refresh: fetch each public source in its own job, then publish one immutable release to the hub.
#
#   plan     lists the sources whose catalog entry says `hosting: public` (which needs a licence that allows
#            redistribution); every other source is private or read live and is never fetched here
#   fetch    one job per source (matrix, fail-fast off): fresh fetch into an empty lake, uploaded as an
#            artifact; nothing is restored from the Actions cache, so every run starts from the publishers
#   raw      optional: the raw publisher bytes, fetch logs and parsed raw records with their load metadata go
#            to a maintainer-only PRIVATE dataset (vars.HDR_RAW_DATASET), never to the public release
#   transform  dbt builds staging, intermediate and the review queues from this run's raw records and runs every
#            contract rule as a test. It holds no secret and runs outside the hub-publish environment, so
#            third-party code (dbt and its dependencies) never shares a job with the publish token; its only
#            output is dbt's run record (run_results.json, manifest.json), as an artifact.
#   publish  runs only when every fetch job passed: it checks each planned source has a snapshot, merges the
#            per-source lakes, re-checks every contract, runs the release gate on the transform job's run record,
#            then `export-public` publishes a new immutable release-<run date> tag to the hub, and the gate
#            records that exact tag as served. A release is never partial: if any source fails, nothing is
#            published or tagged and report-failure opens an issue instead. Skipped with a notice when no
#            Hugging Face token is set (then nothing is recorded as served); runs only on main.
#            The gate's state (SERVING, builds.jsonl, serving_log.jsonl) is restored from and kept in the
#            private ops dataset <owner>/health-data-registry-ops-release-gate (naming.py), checked private first.
#   report-failure  opens (or comments on) one issue when any job fails on main
#
# Secrets: HF_TOKEN is the one secret. HF_PUBLISH_TOKEN and HF_CRAWL_TOKEN, if ever set, override it for the
# publish and the raw archive (narrower tokens); they are optional. The publish job runs in the GitHub
# environment `hub-publish`, whose deployment rule allows only main (docs/dev/automation.md); its secrets live
# there. The token is set only on the steps that upload.
# Variables: HDR_HF_OWNER owns the public dataset; HDR_PRIVATE_HF_OWNER owns the private raw archive.
#
# Docs: docs/dev/automation.md. Restricted sources (WHO GHO) are never fetched here: they are read live.
name: Weekly refresh

on:
  schedule:
    # Tuesday 06:17 UTC; off the hour, because scheduled runs are delayed under load at :00.
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      source:
        description: "Refresh only this source id (blank: every public source). A single source never publishes."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One refresh at a time; a run never cancels another mid-fetch.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  plan:
    name: List the public sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.list.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - name: List sources from the catalog
        id: list
        env:
          ONLY: ${{ inputs.source }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, re, sys
          from health_data_registry.registry import load_registry

          reg = load_registry()
          public = sorted(ds.id for ds in reg if ds.entry.hosting == "public")
          only = os.environ.get("ONLY", "").strip()
          if only:
              if not re.fullmatch(r"[a-z][a-z0-9_]{1,62}", only) or only not in public:
                  print(f"::error::{only!r} is not a public source; choose one of {', '.join(public)}")
                  sys.exit(1)
              public = [only]
          print("sources:", ", ".join(public))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"sources={json.dumps(public)}\n")
          PY

  fetch:
    name: Fetch ${{ matrix.source }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One fetch per source at a time, across runs as well as within this one.
    concurrency:
      group: refresh-fetch-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    env:
      HDR_LAKE: ${{ github.workspace }}/lake
      SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          # Nothing from another run's cache reaches a published release.
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - name: Fetch the source into a fresh lake
        run: uv run --no-sync health-data-registry fetch "$SOURCE"
      - name: Keep this source's lake for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lake-${{ matrix.source }}
          path: lake/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  raw:
    name: Archive raw bytes (private, optional)
    needs: [plan, fetch]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Is a private raw archive configured?
        id: gate
        env:
          HAS_TOKEN: ${{ (secrets.HF_CRAWL_TOKEN || secrets.HF_TOKEN) && 'true' || 'false' }}
          RAW_DATASET: ${{ vars.HDR_RAW_DATASET }}
        run: |
          if [ -z "$RAW_DATASET" ]; then
            echo "::notice::Raw bytes not archived: set the repository variable HDR_RAW_DATASET to a PRIVATE dataset named <owner>/health-data-registry-ops-raw-archive (docs/dev/naming.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Raw bytes not archived: no HF_TOKEN secret (or HF_CRAWL_TOKEN override)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.go == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        if: steps.gate.outputs.go == 'true'
        run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.go == 'true'
        with:
          pattern: lake-*
          path: lake/
          merge-multiple: true
      - name: Upload raw bytes and fetch logs to the private dataset
        if: steps.gate.outputs.go == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_CRAWL_TOKEN || secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          HDR_PRIVATE_HF_OWNER: ${{ vars.HDR_PRIVATE_HF_OWNER }}
          RAW_DATASET: ${{ vars.HDR_RAW_DATASET }}
        run: |
          # Only the governed name is accepted (naming.py, docs/dev/naming.md). The owner is HDR_PRIVATE_HF_OWNER
          # (default jtouley), never the variable's own owner, so HDR_RAW_DATASET can't point at another account.
          want=$(uv run --no-sync python -m health_data_registry.naming ops raw-archive) \
            || { echo "::error::HDR_PRIVATE_HF_OWNER is not a Hugging Face user or organisation name"; exit 1; }
          if [ "$RAW_DATASET" != "$want" ]; then
            echo "::error::HDR_RAW_DATASET must be $want (docs/dev/naming.md)"
            exit 1
          fi
          # `hf upload --private` is ignored for an existing repo: refuse unless Hugging Face reports it private.
          uv run --no-sync python -m health_data_registry.naming assert-private "$RAW_DATASET"
          # raw/<sha256> is content-addressed, so a file already archived is the same bytes.
          # raw_records/<id>/<snapshot id>.ndjson and .meta.json: the parsed loads and their fetch metadata, which
          # otherwise last only as long as the 7-day lake artifacts.
          uv run --no-sync hf upload "$RAW_DATASET" lake . --repo-type dataset --private \
            --include "raw/*" --include "fetch_log/*" --include "raw_records/*" --exclude "*.tmp" \
            --commit-message "Raw bytes, fetch logs and raw records, run ${GITHUB_RUN_ID}"

  transform:
    name: Transform build (no secrets)
    needs: [plan, fetch]
    if: ${{ success() && github.ref == 'refs/heads/main' && !inputs.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lake-*
          path: lake/
          merge-multiple: true
      # dbt's own exit status is not used: the gate in the publish job reads its run record, and a missing or
      # empty record holds the release.
      - name: dbt build (models, tests and unit tests)
        env:
          HDR_LAKE: ${{ github.workspace }}/lake
          HDR_TRANSFORM_DB: ${{ runner.temp }}/transform.duckdb
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: |
          dbt_status=0
          uv run --no-sync --directory transform dbt build --profiles-dir . --project-dir . || dbt_status=$?
          echo "dbt build exited ${dbt_status}; the release gate decides from its run record."
      - name: Keep dbt's run record for the release gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transform-run
          path: |
            transform/target/run_results.json
            transform/target/manifest.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Check and publish the release
    needs: [plan, fetch, transform]
    # Only a full refresh on main publishes, and only when every fetch passed (success() is explicit so the
    # rule can't be lost by a later edit); a single-source run never does.
    if: ${{ success() && github.ref == 'refs/heads/main' && !inputs.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The environment's deployment rule allows only main, and its secrets are readable only here, so a workflow
    # edited on another branch can't publish; the `if:` above stays as defence in depth.
    environment: hub-publish
    env:
      HDR_LAKE: ${{ github.workspace }}/lake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lake-*
          path: lake/
          merge-multiple: true
      # Data only (two JSON files the gate parses); no code from the transform job runs here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # a missing run record is judged by the gate, which holds the release
        with:
          name: transform-run
          path: transform/target/
      # One run date for staging and publishing, so a run that crosses midnight UTC can't stage one date and tag
      # another.
      - name: Fix the run date
        run: echo "RUN_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Every planned source has a snapshot
        env:
          SOURCES: ${{ needs.plan.outputs.sources }}
        run: |
          missing=$(jq -r '.[]' <<<"$SOURCES" | while read -r id; do
            [ -s "lake/datasets/$id/LATEST" ] || echo "$id"
          done)
          if [ -n "$missing" ]; then
            echo "::error::No snapshot for: $(echo "$missing" | paste -sd, -). Nothing is published or tagged."
            exit 1
          fi
      - name: Cross-check the catalog, contracts and semantic models
        run: uv run --no-sync health-data-registry validate
      - name: Publishers still serve every contract field
        run: uv run --no-sync health-data-registry check-contracts
      # The pre-publish checks include the data: every snapshot has rows, and each data file has exactly the
      # rows its snapshot's manifest records. Any problem stops the run before anything is uploaded.
      - name: Stage the release locally (pre-publish and row-count checks, no upload)
        run: uv run --no-sync health-data-registry export-public --to build/release-preview --run-date "$RUN_DATE"
      # The gate's state outlives the run only in the private ops dataset. A failed restore fails the job, so an
      # empty state never overwrites the real one. With no token there is nothing to restore, and nothing is
      # published or recorded as served either.
      - name: Restore the release gate's state (private ops dataset)
        id: ops
        env:
          HF_TOKEN: ${{ secrets.HF_CRAWL_TOKEN || secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          HDR_PRIVATE_HF_OWNER: ${{ vars.HDR_PRIVATE_HF_OWNER }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::Release gate state not kept: no HF_TOKEN secret (or HF_CRAWL_TOKEN override). Nothing will be published or recorded as served."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ops_repo=$(uv run --no-sync python -m health_data_registry.naming ops release-gate) \
            || { echo "::error::HDR_PRIVATE_HF_OWNER is not a Hugging Face user or organisation name"; exit 1; }
          uv run --no-sync python -m health_data_registry.naming assert-private "$ops_repo"
          uv run --no-sync hf download "$ops_repo" --repo-type dataset --local-dir "$HDR_LAKE/ops" \
            --include SERVING --include "*.jsonl"
          rm -rf "$HDR_LAKE/ops/.cache"
          echo "repo=$ops_repo" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"
      # The release gate, on the transform job's run record: it passes the build only if every model, seed and
      # snapshot built, at least one test ran, nothing was skipped, every check ran and every error-severity test
      # and unit test passed. A held build stops here, so nothing is uploaded and the release already on the hub
      # stays the one served. A pass records the verdict only; "served" is recorded after the upload. The models and
      # tests a build must have come from the contracts, the run record and manifest must be from one dbt run, and
      # the build id is a hash of the inputs (LATEST snapshots, contracts, $GITHUB_SHA), so a rerun on the same
      # inputs gives the same id. --run-date ties the pass to this run's release tag.
      - name: Release gate
        run: uv run --no-sync health-data-registry gate --target transform/target --ops "$HDR_LAKE/ops" --run-date "$RUN_DATE"
      # export-public tags the hub commit release-<run date> (release-<run date>.N for a correction); a tag is
      # never moved or deleted. It runs its own pre-publish checks and uploads nothing if one fails. It writes the
      # tag it created to release-tag only once the upload succeeded.
      - name: Publish the release and tag it on the open data hub
        env:
          HF_TOKEN: ${{ secrets.HF_PUBLISH_TOKEN || secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          HDR_HF_OWNER: ${{ vars.HDR_HF_OWNER }}
        run: |
          hub_repo=$(uv run --no-sync python -m health_data_registry.naming public)
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::Not published: add the HF_TOKEN secret with write access to $hub_repo. The release was staged and checked; nothing is recorded as served."
            exit 0
          fi
          uv run --no-sync health-data-registry export-public --to "hf://datasets/$hub_repo" \
            --run-date "$RUN_DATE" --tag-file "$RUNNER_TEMP/release-tag"
      - name: Record the uploaded release as served
        run: |
          if [ ! -s "$RUNNER_TEMP/release-tag" ]; then
            echo "Nothing was uploaded, so nothing is recorded as served."
            exit 0
          fi
          tag=$(cat "$RUNNER_TEMP/release-tag")
          uv run --no-sync health-data-registry gate --target transform/target --ops "$HDR_LAKE/ops" --confirm "$tag"
      # Runs after a hold too, so the hold is kept in the log; only when the state was restored first.
      - name: Keep the release gate's state (private ops dataset)
        if: ${{ always() && steps.ops.outputs.go == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_CRAWL_TOKEN || secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          HDR_PRIVATE_HF_OWNER: ${{ vars.HDR_PRIVATE_HF_OWNER }}
          OPS_REPO: ${{ steps.ops.outputs.repo }}
        run: |
          uv run --no-sync python -m health_data_registry.naming assert-private "$OPS_REPO"
          if [ -n "$(ls -A "$HDR_LAKE/ops" 2>/dev/null)" ]; then
            uv run --no-sync hf upload "$OPS_REPO" "$HDR_LAKE/ops" . --repo-type dataset --private \
              --include SERVING --include "*.jsonl" --commit-message "Release gate state, run ${GITHUB_RUN_ID}"
          fi
      - name: Keep the manual publish checklist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-checklist
          path: build/release-preview/publish-checklist.md
          if-no-files-found: ignore
          retention-days: 30

  report-failure:
    name: Open or update the failure issue
    needs: [plan, fetch, raw, transform, publish]

    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the failure issue
    steps:
      - name: Open or comment on the refresh-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Weekly refresh failed"
        run: |
          body="The weekly refresh, contract check or publish failed: $RUN_URL

          A source may have changed shape, moved, or be down. Check the run log, then update the
          adapter or contract in a pull request. No release is published or tagged until every source passes."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
