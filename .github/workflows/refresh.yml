# Weekly refresh: fetch every catalogued source, then check each against its contract.
# On failure, opens an issue (or comments on the open one) so a changed source is seen.
name: Weekly refresh

on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and check contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --locked --no-dev

      - name: Refresh every source
        run: uv run --no-sync health-data-registry refresh --all

      - name: Check every source against its contract
        run: uv run --no-sync health-data-registry check-contracts

      # -----------------------------------------------------------------------------------------
      # PUBLISHING TO THE OPEN DATA HUB IS DISABLED until the maintainer:
      #   1. adds the repository secret HF_TOKEN (a fine-grained write token for the dataset only), and
      #   2. sets the repository variable HDR_LAKE to the hub dataset id, e.g. <org>/<dataset-name>.
      # Until HDR_LAKE is set this step is skipped. `export-public` uploads only sources whose catalog
      # licence allows redistribution; WHO and other restricted sources get a card and no data files.
      # It runs the pre-publish checks first and uploads nothing if one fails, then tags the commit
      # release-<run date>. It runs only on main, after the contract check passed. The variable is
      # passed as HUB_REPO, not HDR_LAKE, because HDR_LAKE in the environment names the local lake.
      # -----------------------------------------------------------------------------------------
      - name: Publish the release to the open data hub
        if: vars.HDR_LAKE != '' && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUB_REPO: ${{ vars.HDR_LAKE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HDR_LAKE is set but the HF_TOKEN secret is missing"
            exit 1
          fi
          uv run --no-sync health-data-registry export-public --to "hf://datasets/$HUB_REPO"

      - name: Keep the manual publish checklist
        if: vars.HDR_LAKE != '' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-checklist
          path: build/hub/publish-checklist.md
          if-no-files-found: ignore

  report-failure:
    name: Open or update the failure issue
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the refresh-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Weekly refresh failed"
        run: |
          body="The weekly refresh or contract check failed: $RUN_URL

          A source may have changed shape, moved, or be down. Check the run log, then update the
          adapter or contract in a pull request."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
