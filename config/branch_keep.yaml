# Branch hygiene (.github/workflows/branch-hygiene.yml, scripts/branch_hygiene.py). Reviewed in pull requests:
# a change here changes which branches the workflow may delete. See docs/dev/branch-hygiene.md.
#
# keep:   branches never touched, whatever their age. `name` is an exact branch name or a glob (fnmatch: `*`
#         matches across `/` too). Every entry gives its reason.
# purge:  branches deleted WITHOUT an archive tag, because their content must not stay in the repo. Exact names.
# probes: CI probe branches (globs). Archived after their CI run finishes, and by the daily sweep once they are
#         more than 24 hours old.
#
# Whatever these lists say, never touched: the default branch, protected branches (branch protection or a
# ruleset that restricts deletion, checked through the API), the head or base of an open pull request, the
# pre-pr/<head> twin of an open pull request, and dependabot/*. The daily sweep also leaves any branch pushed to
# or committed to in the last 24 hours.
keep: []

purge:
  - name: claude/mi-sitemap-seeds
    reason: contains sitemap data that must not stay in the repo (issue #67)

probes:
  - name: ci/fast-ci-probe-*
    reason: fast-CI probe
  - name: pre-pr/ci-fast-*probe*
    reason: fast-CI probe on the pre-PR gate
