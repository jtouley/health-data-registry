# CI time budgets, in seconds of running time per job (queue time is not the job's, and is reported apart).
# "pr" is a pull request's or a pre-pr push's run; "full" is the merge queue's, main's and nightly's.
# A job name may end in `*` to cover a matrix (`Mutation tests (*)`). Every job of a run needs a budget.
#
# The "CI budget" step of "CI result" fails a pull request's run when any job ran over its budget, and lists the
# slow jobs. scripts/ci_budget.py reads this file; it is JSON inside, so the check needs only the standard library.
#
# Ratchet: a budget may only tighten. To loosen one, change this file alone, in a pull request of its own, so the
# maintainer sees and approves just that (scripts/ci_budget.py ratchet; run in the Checks job).
{
  "pr": {
    "run": 180,
    "jobs": {
      "Changes": 30,
      "Checks": 120,
      "Tests (Python 3.12)": 150,
      "Mutation tests (*)": 150,
      "CI result": 60
    }
  },
  "full": {
    "run": 1500,
    "jobs": {
      "Changes": 30,
      "Checks": 180,
      "Tests (Python *)": 300,
      "Mutation tests (*)": 1200,
      "Mutation stats (main)": 1500,
      "CI result": 60
    }
  }
}
