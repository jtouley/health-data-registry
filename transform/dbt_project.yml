# The transform project: raw -> staging -> intermediate -> marts, on DuckDB (dbt-duckdb).
# Every input is a raw source or a control-plane export with an ODCS contract; there are no seeds and no data
# files here. Staging and every model's column list are generated from contracts/ by `make contracts`.
name: health_data_registry
version: "0.1.0"
config-version: 2
profile: health_data_registry

# unit_tests/ holds hand-written dbt unit tests (synthetic rows only); models/ is generated or contract-backed.
model-paths: ["models", "unit_tests"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

# Raw records are read from HDR_RAW_RECORDS (default ../lake/raw_records: raw_records/<id>/<snapshot id>.ndjson);
# CI points it at the synthetic fixtures in tests/fixtures/transform/raw_records.

vars:
  # The MMWR years the calendar covers (contracts/models/mmwr_calendar.odcs.yaml).
  mmwr_first_year: 2015
  mmwr_last_year: 2030
  # What the near-zero review queue looks at (contracts/models/flag_near_zero_running_totals.odcs.yaml): never a
  # number in an answer.
  near_zero_ytd_max: 1
  near_zero_prior_year_min: 10

models:
  health_data_registry:
    # The contract's descriptions become DuckDB table and column comments, readable wherever the file goes.
    +persist_docs: {relation: true, columns: true}
    staging:
      +materialized: table
      +schema: staging
    # Intermediate models only add columns beside staging, so they are views: no second copy of every source.
    intermediate:
      +materialized: view
      +schema: intermediate
    reference:
      +materialized: table
      +schema: reference
    # Review queues: each flag_* model lists rows a maintainer should look at and removes nothing.
    flag:
      +materialized: table
      +schema: flag
