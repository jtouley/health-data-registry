# dbt packages, each pinned to an exact version. `dbt deps` (make transform) installs them into dbt_packages/,
# which is never committed; package-lock.yml records the exact versions resolved. Only data tests are used from
# them, wired up in the generated model YAML (transform_gen.py); no package model is built.
packages:
  # Great Expectations-style dbt tests (Apache-2.0), Metaplane's maintained fork of calogica/dbt-expectations,
  # which is no longer supported. Its one dependency, godatadriven/dbt_date, is pinned in package-lock.yml.
  - package: metaplane/dbt_expectations
    version: 0.10.10
