# One local DuckDB file; nothing here is a secret. HDR_TRANSFORM_DB moves it (default: target/transform.duckdb).
# HDR_LAKE is the lake the raw sources are read from (default ../lake, relative to transform/; an absolute path is
# safest). HDR_BUILD_PIN is the build's pin (`health-data-registry pin-build`, relative to transform/ or absolute):
# with it, the dbt_raw plugin reads only the loads the pin names and checks their sha256; without it (a quick local
# run), the full load each dataset's LATEST pointer names.
health_data_registry:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('HDR_TRANSFORM_DB', 'target/transform.duckdb') }}"
      threads: 4
      plugins:
        - module: health_data_registry.dbt_raw
          alias: hdr_raw
          config:
            lake: "{{ env_var('HDR_LAKE', '../lake') }}"
            pin: "{{ env_var('HDR_BUILD_PIN', '') }}"
