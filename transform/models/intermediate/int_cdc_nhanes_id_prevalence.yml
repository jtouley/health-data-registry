# Generated by `make contracts` from contracts/cdc_nhanes_id_prevalence.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_nhanes_id_prevalence
  description: 'Long table: one crude seroprevalence estimate for the United States (NHANES sample, adults 20-49)
    per infection x survey cycle x population group x subgroup, with its interval and NCHS''s flag.'
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
    contract_id: cdc_nhanes_id_prevalence
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_nhanes_id_prevalence_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_one_row_per_cell
      arguments:
        measure_sql: SELECT COUNT(*) FROM (SELECT infection, time_period, population_group, subgroup FROM {object}
          GROUP BY infection, time_period, population_group, subgroup HAVING COUNT(*) > 1)
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: uniqueness
          rule: one_row_per_cell
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: 'Grain: one estimate per infection, survey cycle, group and subgroup (an exact structural fact
            of the full table, 340 rows, on 2026-11-25). A repeat would mean two figures for one cell.'
  - odcs_check:
      name: cdc_nhanes_id_prevalence_total_estimates_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE population_group = 'Total' AND estimate IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: total_estimates_present
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: 'Fill rate for the Total rows the headline series read, which the percent rule also covers: at
            least one is published (all 20 were on 2026-11-25).'
  - odcs_check:
      name: cdc_nhanes_id_prevalence_infections_known
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("infection" IS NULL OR trim(CAST("infection" AS
          VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("infection" IS NULL OR trim(CAST("infection"
          AS VARCHAR)) = '') AND "infection" NOT IN ('Herpes simplex virus type 1', 'Herpes simplex virus type 2'))
          END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: infections_known
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: Every distinct topic on the full table (340 rows, 2026-11-25), each defined in NCHS's footnotes.
            A new infection is reported here and in the unmapped-label queue rather than stopping the build.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_groups_known
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("population_group" IS NULL OR trim(CAST("population_group"
          AS VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("population_group" IS NULL OR trim(CAST("population_group"
          AS VARCHAR)) = '') AND "population_group" NOT IN ('Total', 'Age group', 'Sex', 'Race and Hispanic origin',
          'Sex and age group')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: groups_known
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: Every distinct group on the full table (340 rows, 2026-11-25). The headline series filter on 'Total',
            so a relabel is reported here.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_estimates_are_crude_percents
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("estimate_type" IS NULL OR trim(CAST("estimate_type"
          AS VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("estimate_type" IS NULL OR trim(CAST("estimate_type"
          AS VARCHAR)) = '') AND "estimate_type" NOT IN ('Percent of population, crude')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: estimates_are_crude_percents
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: Every row on the full table (340 rows, 2026-11-25) is a crude percent of the population, the only
            estimate type the metrics and the percent rule read; another type is reported here.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_percents_between_0_and_100
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE estimate < 0 OR estimate > 100 OR estimate_lci < 0 OR estimate_lci
          > 100 OR estimate_uci < 0 OR estimate_uci > 100
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: percents_between_0_and_100
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: The estimate and its 95% confidence bounds are percents of the population (ESTIMATE_TYPE), so
            each lies between 0 and 100.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_interval_brackets_the_estimate
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE estimate_lci > estimate OR estimate > estimate_uci
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: consistency
          rule: interval_brackets_the_estimate
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: ESTIMATE_LCI and ESTIMATE_UCI are the lower and upper bounds of the 95% confidence interval for
            the estimate (column descriptions), so lower <= estimate <= upper wherever all three are published.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_an_estimate_or_a_flag
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE estimate IS NULL AND flag IS NULL
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: consistency
          rule: an_estimate_or_a_flag
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: An empty estimate carries NCHS's flag saying why (- - -, not available, on all 20 empty estimates
            on 2026-11-25); an empty estimate with no flag is a gap with no reason.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_flag_codes_known
      arguments:
        measure_sql: SELECT count(*) FROM {object} WHERE NOT ("flag" IS NULL OR trim(CAST("flag" AS VARCHAR)) =
          '') AND "flag" NOT IN ('*', '- - -', '^', '^^')
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: flag_codes_known
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: The flag codes NCHS's NHANES footnotes define (NA_NHANES06 to 09). Another code is kept as published
            and reported here, never read.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_fill_rate_nesting_label
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("nesting_label" IS NULL
          OR trim(CAST("nesting_label" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_nesting_label
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: 'No row has a value for sex the subgroup is nested in, for the sex-and-age rows only (NESTING_LABEL:
            Female or Male); empty elsewhere.'
  - odcs_check:
      name: cdc_nhanes_id_prevalence_fill_rate_estimate
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("estimate" IS NULL OR trim(CAST("estimate"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_estimate
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: No row has a value for crude percent of the group with antibody to the virus (ESTIMATE), as NCHS
            published it.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_fill_rate_standard_error
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("standard_error" IS NULL
          OR trim(CAST("standard_error" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_standard_error
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: No row has a value for standard error of the estimate (STANDARD_ERROR), in percentage points;
            empty where the estimate is.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_fill_rate_estimate_lci
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("estimate_lci" IS NULL
          OR trim(CAST("estimate_lci" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_estimate_lci
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: No row has a value for lower bound of the 95% confidence interval for the estimate (ESTIMATE_LCI),
            in percent; empty where the estimate is.
  - odcs_check:
      name: cdc_nhanes_id_prevalence_fill_rate_estimate_uci
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("estimate_uci" IS NULL
          OR trim(CAST("estimate_uci" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_estimate_uci
          contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
          checks: No row has a value for upper bound of the 95% confidence interval for the estimate (ESTIMATE_UCI),
            in percent; empty where the estimate is.
  columns:
  - name: infection
    data_type: varchar
    description: 'The infection the antibody is to: Herpes simplex virus type 1 or Herpes simplex virus type 2 (TOPIC).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: topic
      unit: null
      codes: []
      missing_codes: []
  - name: taxonomy
    data_type: varchar
    description: 'NCHS''s subject area for the row: Infectious diseases (TAXONOMY).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: taxonomy
      unit: null
      codes: []
      missing_codes: []
  - name: classification
    data_type: varchar
    description: 'The kind of breakdown (CLASSIFICATION): Total, Demographic Characteristic, or Multiple Characteristics
      (sex and age together).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: classification
      unit: null
      codes: []
      missing_codes: []
  - name: population_group
    data_type: varchar
    description: 'The population grouping (GROUP): Total, Age group, Sex, Race and Hispanic origin, or Sex and age
      group.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: group
      unit: null
      codes: []
      missing_codes: []
  - name: subgroup
    data_type: varchar
    description: 'The subgroup within the grouping (SUBGROUP): 20-49 years for Total, an age band, Female or Male,
      a race and Hispanic origin group, or a sex and age band such as Female: 20-29 years.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: subgroup
      unit: null
      codes: []
      missing_codes: []
  - name: nesting_label
    data_type: varchar
    description: 'Sex the subgroup is nested in, for the sex-and-age rows only (NESTING_LABEL: Female or Male);
      empty elsewhere.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: nesting_label
      unit: null
      codes: []
      missing_codes: []
  - name: estimate_type
    data_type: varchar
    description: 'The kind of estimate (ESTIMATE_TYPE): Percent of population, crude.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: estimate_type
      unit: null
      codes: []
      missing_codes: []
  - name: time_period
    data_type: varchar
    description: The two-year NHANES survey cycle the estimate is for (TIME_PERIOD), from 1999-2000 to 2017-2018.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: time_period
      unit: null
      codes: []
      missing_codes: []
  - name: estimate
    data_type: double
    description: Crude percent of the group with antibody to the virus (ESTIMATE), as NCHS published it. Empty where
      NCHS flags the estimate as not available (- - -), never a zero.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: estimate
      unit: '%'
      codes: []
      missing_codes: []
  - name: standard_error
    data_type: double
    description: Standard error of the estimate (STANDARD_ERROR), in percentage points; empty where the estimate
      is.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: standard_error
      unit: null
      codes: []
      missing_codes: []
  - name: estimate_lci
    data_type: double
    description: Lower bound of the 95% confidence interval for the estimate (ESTIMATE_LCI), in percent; empty where
      the estimate is.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: estimate_lci
      unit: '%'
      codes: []
      missing_codes: []
  - name: estimate_uci
    data_type: double
    description: Upper bound of the 95% confidence interval for the estimate (ESTIMATE_UCI), in percent; empty where
      the estimate is.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: estimate_uci
      unit: '%'
      codes: []
      missing_codes: []
  - name: flag
    data_type: varchar
    description: 'NCHS''s flag on the estimate (FLAG), exactly as published; empty when the estimate carries none.
      Codes (publisher''s codebook): * = the estimate does not meet NCHS standards of reliability (NCHS footnote
      NA_NHANES06); - - - = data are not available (NCHS footnote NA_NHANES07); never a zero; ^ = estimates by race
      and Hispanic origin for August 2021-August 2023 are not shown (NCHS footnote NA_NHANES08); ^^ = 2019-2020
      data are not nationally representative (NCHS footnote NA_NHANES09).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: flag
      unit: null
      codes:
      - '*'
      - '- - -'
      - ^
      - ^^
      missing_codes: []
  - name: footnote_id_list
    data_type: varchar
    description: The ids of NCHS's footnotes for the row, comma-separated (FOOTNOTE_ID_LIST), each defined in https://data.cdc.gov/d/iqm3-hbev.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: footnote_id_list
      unit: null
      codes: []
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: True on the publisher's total and summary rows (the contract's totalRows), which are never added
      to the rows they sum (hard rule 2).
    meta:
      derived_from_contract: true
  - name: flag_meaning
    data_type: varchar
    description: What the publisher's flag code means, quoted from its codebook (the contract's flagCodes); empty
      when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
