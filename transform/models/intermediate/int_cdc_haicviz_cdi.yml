# Generated by `make contracts` from contracts/cdc_haicviz_cdi.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_haicviz_cdi
  description: 'Long table: one value per year x topic x view x grouping x series.'
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_haicviz_cdi.odcs.yaml
    contract_id: cdc_haicviz_cdi
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_haicviz_cdi_fill_rate_value
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("value" IS NULL OR trim(CAST("value"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_value
          contract: contracts/cdc_haicviz_cdi.odcs.yaml
          checks: value is not empty in every row (an all-empty column would pass every value check).
  columns:
  - name: yearname
    data_type: bigint
    description: Surveillance year (2011-2022 in the data on 2026-11-24).
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: yearname
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: topic
    data_type: varchar
    description: 'What the value measures: number of CDI cases, case rate per 100,000 population, or strain type
      (ribotype). Spelling varies by year (''Number of Cases'' to 2021, ''Number of cases'' in 2022).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: topic
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: viewby
    data_type: varchar
    description: 'Which breakdown the row belongs to: Total, Age, Sex, Race or Ribotype. Each view covers the same
      cases.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: viewby
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: grouping
    data_type: varchar
    description: All cases, or split by epidemiologic class into healthcare-associated (HA) and community-associated
      (CA) cases. Spelling varies ('Epi Class' / 'Epi class').
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: grouping
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: series
    data_type: varchar
    description: 'The specific stratum, prefixed by epi class where split: e.g. Total, Healthcare-associated, Community-associated,
      ''All cases - 65+ years'', ''HA - Female'', ''CA - 027'' (ribotype).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: series
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: value
    data_type: double
    description: 'The published number: a case count when topic is number of cases, cases per 100,000 population
      when topic is case rates, unconfirmed for strain type. Published as text; cast to number.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: value
      unit: 'see topic: 1 (cases) or /100000'
      codes: []
      missing_codes: []
  - name: is_total_row
    data_type: boolean
    description: True on the publisher's total and summary rows (the contract's totalRows), which are never added
      to the rows they sum (hard rule 2).
    meta:
      derived_from_contract: true
  - name: condition_key
    data_type: varchar
    description: 'The condition''s key in dim_condition: the source id and the label as published.'
    meta:
      conformed: true
  - name: condition_label
    data_type: varchar
    description: The publisher's condition label, exactly as published.
    meta:
      conformed: true
  - name: condition_case_status
    data_type: varchar
    description: 'Case status (for example confirmed, probable), kept apart from the condition: from the contract.'
    meta:
      conformed: true
  - name: condition_case_subtype
    data_type: varchar
    description: 'Case subtype (for example clinical or screening for C. auris), kept apart from the condition:
      declared per label in the contract; never added to another subtype.'
    meta:
      conformed: true
  - name: place_key
    data_type: varchar
    description: The place's key in dim_place; empty when the contract does not resolve the label.
    meta:
      conformed: true
  - name: place_label
    data_type: varchar
    description: The place as the publisher names it (a renamed area shows its earlier name).
    meta:
      conformed: true
  - name: place_parent_key
    data_type: varchar
    description: For a label that covers only part of a place, the key of the place it is part of; never add the
      part to its parent.
    meta:
      conformed: true
  - name: place_is_partial
    data_type: boolean
    description: True when the publisher's place covers only part of the place it is named after or sits in (for
      example NNDSS New York, which excludes New York City).
    meta:
      conformed: true
  - name: place_note
    data_type: varchar
    description: Which part a partial area covers, or why the place is unresolved, in plain words.
    meta:
      conformed: true
  - name: place_status
    data_type: varchar
    description: resolved, partial_area or unresolved.
    meta:
      conformed: true
  - name: mmwr_year
    data_type: bigint
    description: MMWR year, when the publisher counts by MMWR week.
    meta:
      conformed: true
  - name: mmwr_week
    data_type: bigint
    description: MMWR week (1 to 53), when the publisher counts by MMWR week.
    meta:
      conformed: true
  - name: time_key
    data_type: varchar
    description: 'The period''s key in dim_time: <year>-W<week> for an MMWR week, Y<year> for a year.'
    meta:
      conformed: true
  - name: time_grain
    data_type: varchar
    description: mmwr_week, year or none.
    meta:
      conformed: true
  - name: date_basis
    data_type: varchar
    description: Which date the publisher counts a case by, from the contract (dateBasis).
    meta:
      conformed: true
