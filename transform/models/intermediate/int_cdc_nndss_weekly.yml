  columns:
  - name: states
    data_type: varchar
    description: 'Reporting area: the US total, a census division, a state, New York City, a territory, US territories
      combined, or non-US residents. Cases are counted where the patient usually lives. New York excludes New York
      City (structural check against US RESIDENTS, 2024). Upper case through 2024, title case from 2025 (source:
      live data, https://data.cdc.gov/resource/x9gk-5huc.json).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: states
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: year
    data_type: bigint
    description: MMWR (epidemiological) year of the report. Published as text; cast to integer.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: year
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: week
    data_type: bigint
    description: MMWR week of the report (1-52, or 53 in 53-week years such as 2025).
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: week
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: label
    data_type: varchar
    description: 'Notifiable condition as named in the NNDSS tables (for example Legionellosis, Candida auris, clinical;
      Syphilis, Primary and secondary). Case definitions: https://ndc.services.cdc.gov/.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: label
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: m1
    data_type: bigint
    description: Cases reported for this condition and area in this MMWR week (publisher column 'Current week').
      Empty when the flag column m1_flag holds a code; '-' means no reported cases. Published as text such as '31.0'
      from 2025; cast to integer.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m1
      unit: '1'
      codes: []
      missing_codes: []
  - name: m1_flag
    data_type: varchar
    description: 'Why the current-week count is empty. Codes from the dataset notes: ''-'' no reported cases; U
      unavailable; N not reportable in the jurisdiction; NN not nationally notifiable; NP nationally notifiable
      but not published; NC not calculated. From 2025 the flag is empty when a count is present; through 2024 rows
      with a count also carry ''-'', so a flag explains only an empty count. Kept as published, never turned into
      an empty value.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m1_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
  - name: m2
    data_type: bigint
    description: 'Highest weekly count in the previous 52 weeks for this condition and area, counting only weeks
      when the condition was reportable there (publisher footnote). A maximum: never add it up.'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m2
      unit: '1'
      codes: []
      missing_codes: []
  - name: m2_flag
    data_type: varchar
    description: Flag for the previous 52-week maximum; same codes as m1_flag.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m2_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
  - name: m3
    data_type: bigint
    description: 'Cumulative cases so far in this MMWR year up to and including this week (year to date). Cumulative:
      take the latest week, never sum across weeks. Can be incomplete if the condition was reportable for only part
      of the year (publisher footnote).'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m3
      unit: '1'
      codes: []
      missing_codes: []
  - name: m3_flag
    data_type: varchar
    description: Flag for the current-year year-to-date count; same codes as m1_flag.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m3_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
  - name: m4
    data_type: bigint
    description: Cumulative cases in the previous MMWR year up to the same week, as published in this week's table.
      The codebook doesn't say whether it counts the same thing as that year's own year-to-date (m3); for some conditions
      the two differ widely (see openQuestions), so it is shown beside m3, never in its place.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m4
      unit: '1'
      codes: []
      missing_codes: []
  - name: m4_flag
    data_type: varchar
    description: Flag for the previous-year year-to-date count; same codes as m1_flag.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m4_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
  - name: location1
    data_type: varchar
    description: Name of a single jurisdiction (state, DC, New York City or territory); empty on summary rows.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: location1
      unit: null
      codes: []
      missing_codes: []
  - name: location2
    data_type: varchar
    description: Name of a summary area (TOTAL, US RESIDENTS, US TERRITORIES, NON-US RESIDENTS or a census division);
      empty on single-jurisdiction rows.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: location2
      unit: null
      codes: []
      missing_codes: []
  - name: sort_order
    data_type: varchar
    description: Publisher's row order key (year, week and area position); used only to keep the published table
      order.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: sort_order
      unit: null
      codes: []
      missing_codes: []
  - name: is_total_row
    data_type: boolean
    description: True on the publisher's total and summary rows (the contract's totalRows), which are never added
      to the rows they sum (hard rule 2).
    meta:
      derived_from_contract: true
  - name: states_label
    data_type: varchar
    description: states with a renamed label shown as the earlier label it continues (the contract's renamedLabels),
      so every year of it reads the same.
    meta:
      derived_from_contract: true
  - name: states_partial_note
    data_type: varchar
    description: Why the states label covers only part of the place it is named after (the contract's partialPlaces);
      empty for a whole place.
    meta:
      derived_from_contract: true
  - name: m1_flag_meaning
    data_type: varchar
    description: What the publisher's m1_flag code means, quoted from its codebook (the contract's flagCodes); empty
      when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
  - name: m2_flag_meaning
    data_type: varchar
    description: What the publisher's m2_flag code means, quoted from its codebook (the contract's flagCodes); empty
      when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
  - name: m3_flag_meaning
    data_type: varchar
    description: What the publisher's m3_flag code means, quoted from its codebook (the contract's flagCodes); empty
      when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
  - name: m4_flag_meaning
    data_type: varchar
    description: What the publisher's m4_flag code means, quoted from its codebook (the contract's flagCodes); empty
      when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
  - name: condition_key
    data_type: varchar
    description: 'The condition''s key in dim_condition: the source id and the label as published.'
    meta:
      conformed: true
  - name: condition_label
    data_type: varchar
    description: The publisher's condition label, exactly as published.
    meta:
      conformed: true
  - name: condition_case_status
    data_type: varchar
    description: 'Case status (for example confirmed, probable), kept apart from the condition: from the contract.'
    meta:
      conformed: true
  - name: condition_case_subtype
    data_type: varchar
    description: 'Case subtype (for example clinical or screening for C. auris), kept apart from the condition:
      declared per label in the contract; never added to another subtype.'
    meta:
      conformed: true
  - name: place_key
    data_type: varchar
    description: The place's key in dim_place; empty when the contract does not resolve the label.
    meta:
      conformed: true
  - name: place_label
    data_type: varchar
    description: The place as the publisher names it (a renamed area shows its earlier name).
    meta:
      conformed: true
  - name: place_parent_key
    data_type: varchar
    description: For a label that covers only part of a place, the key of the place it is part of; never add the
      part to its parent.
    meta:
      conformed: true
  - name: place_is_partial
    data_type: boolean
    description: True when the publisher's place covers only part of the place it is named after or sits in (for
      example NNDSS New York, which excludes New York City).
    meta:
      conformed: true
  - name: place_note
    data_type: varchar
    description: Which part a partial area covers, or why the place is unresolved, in plain words.
    meta:
      conformed: true
  - name: place_status
    data_type: varchar
    description: resolved, partial_area or unresolved.
    meta:
      conformed: true
  - name: mmwr_year
    data_type: bigint
    description: MMWR year, when the publisher counts by MMWR week.
    meta:
      conformed: true
  - name: mmwr_week
    data_type: bigint
    description: MMWR week (1 to 53), when the publisher counts by MMWR week.
    meta:
      conformed: true
  - name: time_key
    data_type: varchar
    description: 'The period''s key in dim_time: <year>-W<week> for an MMWR week, Y<year> for a year.'
    meta:
      conformed: true
  - name: time_grain
    data_type: varchar
    description: mmwr_week, year or none.
    meta:
      conformed: true
  - name: date_basis
    data_type: varchar
    description: Which date the publisher counts a case by, from the contract (dateBasis).
    meta:
      conformed: true
