# Generated by `make contracts` from contracts/cdc_nndss_weekly.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_nndss_weekly
  description: One row per reporting area, MMWR year, MMWR week and condition.
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_nndss_weekly.odcs.yaml
    contract_id: cdc_nndss_weekly
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_nndss_weekly_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_nndss_weekly_cauris_labels_present
      arguments:
        measure_sql: SELECT COUNT(DISTINCT label) FROM {object} WHERE label IN ('Candida auris, clinical', 'Candida
          auris, screening')
        condition: measured = 2
      config:
        severity: warn
        meta:
          dimension: coverage
          rule: cauris_labels_present
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: Both C. auris labels the review queue flag_cauris_clinical_screening_swap reads by name are still
            published (they were in the live data on 2026-11-24); if CDC renames one, the queue would go quiet without
            this warning.
  - odcs_check:
      name: cdc_nndss_weekly_m1_flag_codes
      arguments:
        measure_sql: SELECT count(*) FROM {object} WHERE NOT ("m1_flag" IS NULL OR trim(CAST("m1_flag" AS VARCHAR))
          = '') AND "m1_flag" NOT IN ('-', 'U', 'N', 'NN', 'NP', 'NC')
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: m1_flag_codes
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: Flag values are the codes listed in the publisher's dataset notes.
  - odcs_check:
      name: cdc_nndss_weekly_fill_rate_m1
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("m1" IS NULL OR trim(CAST("m1"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_m1
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: No row has a value for cases reported for this condition and area in this MMWR week (publisher
            column 'Current week').
  - odcs_check:
      name: cdc_nndss_weekly_fill_rate_m2
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("m2" IS NULL OR trim(CAST("m2"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_m2
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: No row has a value for highest weekly count in the previous 52 weeks for this condition and area,
            counting only weeks when the condition was reportable there (publisher footnote).
  - odcs_check:
      name: cdc_nndss_weekly_fill_rate_m3
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("m3" IS NULL OR trim(CAST("m3"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_m3
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: No row has a value for cumulative cases so far in this MMWR year up to and including this week
            (year to date).
  - odcs_check:
      name: cdc_nndss_weekly_fill_rate_m4
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("m4" IS NULL OR trim(CAST("m4"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_m4
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: No row has a value for cumulative cases in the previous MMWR year up to the same week, as published
            in this week's table.
  - odcs_check:
      name: cdc_nndss_weekly_fill_rate_location1
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("location1" IS NULL OR
          trim(CAST("location1" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_location1
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: No row has a value for name of a single jurisdiction (state, DC, New York City or territory);
            empty on summary rows.
  - odcs_check:
      name: cdc_nndss_weekly_fill_rate_location2
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("location2" IS NULL OR
          trim(CAST("location2" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_location2
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: No row has a value for name of a summary area (TOTAL, US RESIDENTS, US TERRITORIES, NON-US RESIDENTS
            or a census division); empty on single-jurisdiction rows.
  - odcs_check:
      name: cdc_nndss_weekly_fill_rate_sort_order
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("sort_order" IS NULL OR
          trim(CAST("sort_order" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_sort_order
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          checks: No row has a value for publisher's row order key (year, week and area position); used only to
            keep the published table order.
  columns:
  - name: states
    data_type: varchar
    description: 'Reporting area: the US total, a census division, a state, New York City, a territory, US territories
      combined, or non-US residents. Cases are counted where the patient usually lives. New York excludes New York
      City (structural check against US RESIDENTS, 2024). Upper case through 2024, title case from 2025 (source:
      live data, https://data.cdc.gov/resource/x9gk-5huc.json).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: states
      unit: null
      codes: []
      missing_codes: []
  - name: year
    data_type: bigint
    description: MMWR (epidemiological) year of the report. Published as text; cast to integer.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: year
      unit: null
      codes: []
      missing_codes: []
  - name: week
    data_type: bigint
    description: MMWR week of the report (1-52, or 53 in 53-week years such as 2025).
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: week
      unit: null
      codes: []
      missing_codes: []
  - name: label
    data_type: varchar
    description: 'Notifiable condition as named in the NNDSS tables (for example Legionellosis, Candida auris, clinical;
      Syphilis, Primary and secondary). Case definitions: https://ndc.services.cdc.gov/.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: label
      unit: null
      codes: []
      missing_codes: []
  - name: m1
    data_type: bigint
    description: Cases reported for this condition and area in this MMWR week (publisher column 'Current week').
      Empty when the flag column m1_flag holds a code; '-' means no reported cases. Published as text such as '31.0'
      from 2025; cast to integer.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m1
      unit: '1'
      codes: []
      missing_codes: []
  - name: m1_flag
    data_type: varchar
    description: 'Why the current-week count is empty. Codes from the dataset notes: ''-'' no reported cases; U
      unavailable; N not reportable in the jurisdiction; NN not nationally notifiable; NP nationally notifiable
      but not published; NC not calculated. From 2025 the flag is empty when a count is present; through 2024 rows
      with a count also carry ''-'', so a flag explains only an empty count. Kept as published, never turned into
      an empty value.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m1_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
  - name: m2
    data_type: bigint
    description: 'Highest weekly count in the previous 52 weeks for this condition and area, counting only weeks
      when the condition was reportable there (publisher footnote). A maximum: never add it up.'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m2
      unit: '1'
      codes: []
      missing_codes: []
  - name: m2_flag
    data_type: varchar
    description: Flag for the previous 52-week maximum; same codes as m1_flag.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m2_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
  - name: m3
    data_type: bigint
    description: 'Cumulative cases so far in this MMWR year up to and including this week (year to date). Cumulative:
      take the latest week, never sum across weeks. Can be incomplete if the condition was reportable for only part
      of the year (publisher footnote).'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m3
      unit: '1'
      codes: []
      missing_codes: []
  - name: m3_flag
    data_type: varchar
    description: Flag for the current-year year-to-date count; same codes as m1_flag.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m3_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
  - name: m4
    data_type: bigint
    description: Cumulative cases in the previous MMWR year up to the same week, as published in this week's table.
      The codebook doesn't say whether it counts the same thing as that year's own year-to-date (m3); for some conditions
      the two differ widely (see openQuestions), so it is shown beside m3, never in its place.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m4
      unit: '1'
      codes: []
      missing_codes: []
  - name: m4_flag
    data_type: varchar
    description: Flag for the previous-year year-to-date count; same codes as m1_flag.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m4_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
  - name: location1
    data_type: varchar
    description: Name of a single jurisdiction (state, DC, New York City or territory); empty on summary rows.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: location1
      unit: null
      codes: []
      missing_codes: []
  - name: location2
    data_type: varchar
    description: Name of a summary area (TOTAL, US RESIDENTS, US TERRITORIES, NON-US RESIDENTS or a census division);
      empty on single-jurisdiction rows.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: location2
      unit: null
      codes: []
      missing_codes: []
  - name: sort_order
    data_type: varchar
    description: Publisher's row order key (year, week and area position); used only to keep the published table
      order.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: sort_order
      unit: null
      codes: []
      missing_codes: []
  - name: is_total_row
    data_type: boolean
    description: True on the publisher's total and summary rows (the contract's totalRows), which are never added
      to the rows they sum (hard rule 2).
    meta:
      derived_from_contract: true
  - name: states_key
    data_type: varchar
    description: 'states as a key for matching the same place across years: upper case, edge whitespace and dots
      removed, and a renamed label mapped to the label it continues (the read path''s label key), so ''MINNESOTA''
      in one year and ''Minnesota'' in the next match.'
    meta:
      derived_from_contract: true
  - name: states_label
    data_type: varchar
    description: states with a renamed label shown as the earlier label it continues (the contract's renamedLabels),
      so every year of it reads the same.
    meta:
      derived_from_contract: true
  - name: states_partial_note
    data_type: varchar
    description: Why the states label covers only part of the place it is named after (the contract's partialPlaces);
      empty for a whole place.
    meta:
      derived_from_contract: true
  - name: m1_flag_meaning
    data_type: varchar
    description: What the publisher's m1_flag code means, quoted from its codebook (the contract's flagCodes); empty
      when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
  - name: m2_flag_meaning
    data_type: varchar
    description: What the publisher's m2_flag code means, quoted from its codebook (the contract's flagCodes); empty
      when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
  - name: m3_flag_meaning
    data_type: varchar
    description: What the publisher's m3_flag code means, quoted from its codebook (the contract's flagCodes); empty
      when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
  - name: m4_flag_meaning
    data_type: varchar
    description: What the publisher's m4_flag code means, quoted from its codebook (the contract's flagCodes); empty
      when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
