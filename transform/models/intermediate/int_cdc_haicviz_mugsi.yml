# Generated by `make contracts` from contracts/cdc_haicviz_mugsi.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_haicviz_mugsi
  description: 'Long table: one published rate for the Emerging Infections Program sites combined (not a state,
    not the United States) per year x organism x topic x view x stratum.'
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_haicviz_mugsi.odcs.yaml
    contract_id: cdc_haicviz_mugsi
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_haicviz_mugsi_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_haicviz_mugsi_one_row_per_year_and_stratum
      arguments:
        measure_sql: SELECT COUNT(*) FROM (SELECT yearname, organism, topic, viewby, series FROM {object} GROUP
          BY yearname, organism, topic, viewby, series HAVING COUNT(*) > 1)
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: uniqueness
          rule: one_row_per_year_and_stratum
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: 'Grain: one published rate per year, organism, topic, view and stratum (an exact structural fact
            of the full table, 341 rows, on 2026-11-25). A repeat would mean two figures for one cell.'
  - odcs_check:
      name: cdc_haicviz_mugsi_headline_case_rates_present
      arguments:
        measure_sql: SELECT COUNT(DISTINCT organism) FROM {object} WHERE organism IN ('CRE', 'CRAB') AND topic =
          'Case Rates' AND viewby = 'All cases' AND series = 'All cases' AND value IS NOT NULL
        condition: measured = 2
      config:
        severity: error
        meta:
          dimension: completeness
          rule: headline_case_rates_present
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: Both organisms, CRE and CRAB, have a value in the cell the headline case-rate series reads (topic
            Case Rates, viewby and series both 'All cases') in at least one year (both did in all 11 years on 2026-11-25).
            A relabelled total row would empty the series and turn every total into a group, and the topic-wide
            fill-rate checks would not see it.
  - odcs_check:
      name: cdc_haicviz_mugsi_headline_death_rates_present
      arguments:
        measure_sql: SELECT COUNT(DISTINCT organism) FROM {object} WHERE organism IN ('CRE', 'CRAB') AND topic =
          'Death Rates' AND viewby = 'All cases' AND series = 'All cases' AND value IS NOT NULL
        condition: measured = 2
      config:
        severity: error
        meta:
          dimension: completeness
          rule: headline_death_rates_present
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: Both organisms, CRE and CRAB, have a value in the cell the headline death-rate series reads (topic
            Death Rates, viewby and series both 'All cases') in at least one year (both did in all 11 years on 2026-11-25),
            for the same reason as headline_case_rates_present.
  - odcs_check:
      name: cdc_haicviz_mugsi_one_group_per_label_in_by_group_rates
      arguments:
        measure_sql: SELECT COUNT(*) FROM (SELECT yearname, organism, topic, series FROM {object} WHERE series <>
          'All cases' GROUP BY yearname, organism, topic, series HAVING COUNT(*) > 1)
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: uniqueness
          rule: one_group_per_label_in_by_group_rates
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: Across the views that the by-group metrics read together, no group label other than 'All cases'
            appears twice in one year, organism and topic (none did on 2026-11-25). A label shared by two views
            would make those metrics refuse the question, so it is reported here first.
  - odcs_check:
      name: cdc_haicviz_mugsi_organism_is_cre_or_crab
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("organism" IS NULL OR trim(CAST("organism" AS
          VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("organism" IS NULL OR trim(CAST("organism"
          AS VARCHAR)) = '') AND "organism" NOT IN ('CRE', 'CRAB')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: organism_is_cre_or_crab
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: Every distinct organism on the full table (341 rows, 2026-11-25) is CRE or CRAB, the two organisms
            CDC's MuGSI page names for this table. A new one (MuGSI also follows ESBL-producing Enterobacterales)
            is reported here and in the unmapped-label queue for review rather than stopping the build.
  - odcs_check:
      name: cdc_haicviz_mugsi_topic_is_case_or_death_rates
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("topic" IS NULL OR trim(CAST("topic" AS VARCHAR))
          = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("topic" IS NULL OR trim(CAST("topic" AS VARCHAR))
          = '') AND "topic" NOT IN ('Case Rates', 'Death Rates')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: topic_is_case_or_death_rates
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: Every distinct topic on the full table (341 rows, 2026-11-25) is 'Case Rates' or 'Death Rates'.
            Every metric filters on these exact labels, so a relabel is reported here instead of making a metric
            return nothing.
  - odcs_check:
      name: cdc_haicviz_mugsi_viewby_labels_known
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("viewby" IS NULL OR trim(CAST("viewby" AS VARCHAR))
          = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("viewby" IS NULL OR trim(CAST("viewby" AS VARCHAR))
          = '') AND "viewby" NOT IN ('All cases', 'Age', 'Sex', 'Culture source', 'Organism')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: viewby_labels_known
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: Every distinct viewby on the full table (341 rows, 2026-11-25) is one of these five. The headline
            metrics filter on viewby 'All cases', so a relabel is reported here.
  - odcs_check:
      name: cdc_haicviz_mugsi_rates_not_negative
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE value < 0
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: rates_not_negative
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: Every topic is a rate (Case Rates, Death Rates), and a rate of cases or deaths is never negative.
  - odcs_check:
      name: cdc_haicviz_mugsi_case_rates_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE topic = 'Case Rates' AND value IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: case_rates_present
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: 'Fill rate for the Case Rates rows: an all-empty subset passes rates_not_negative, so at least
            one case rate must carry a value (all 319 did on 2026-11-25).'
  - odcs_check:
      name: cdc_haicviz_mugsi_death_rates_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE topic = 'Death Rates' AND value IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: death_rates_present
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: 'Fill rate for the Death Rates rows: an all-empty subset passes rates_not_negative, so at least
            one death rate must carry a value (all 22 did on 2026-11-25). An error, like case_rates_present, because
            the death rate is a served series.'
  - odcs_check:
      name: cdc_haicviz_mugsi_fill_rate_value
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("value" IS NULL OR trim(CAST("value"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_value
          contract: contracts/cdc_haicviz_mugsi.odcs.yaml
          checks: No row has a value for the published rate for the row's organism, topic and group, as CDC gives
            it (cases or deaths per 100,000 population on CDC's MuGSI page; the table itself states no unit).
  columns:
  - name: yearname
    data_type: bigint
    description: Surveillance year (2012 to 2022 on 2026-11-25).
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: yearname
      unit: null
      codes: []
      missing_codes: []
  - name: organism
    data_type: varchar
    description: 'The organism, as CDC abbreviates it: CRE (carbapenem-resistant Enterobacterales) or CRAB (carbapenem-resistant
      Acinetobacter baumannii).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: organism
      unit: null
      codes: []
      missing_codes: []
  - name: topic
    data_type: varchar
    description: 'What the figure measures: Case Rates (new cases per population) or Death Rates (deaths among people
      with the infection, per population).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: topic
      unit: null
      codes: []
      missing_codes: []
  - name: viewby
    data_type: varchar
    description: 'Which breakdown the row belongs to: All cases, Age, Sex, Culture source (blood, urine or another
      site), or Organism (the species inside CRE). Each view covers the same cases again.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: viewby
      unit: null
      codes: []
      missing_codes: []
  - name: series
    data_type: varchar
    description: 'The group the rate is for: All cases, an age group (such as 65-79 years), Female or Male, a culture
      source (Blood, Urine, Other site or Other sterile site), or a species inside CRE (such as Klebsiella pneumoniae).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: series
      unit: null
      codes: []
      missing_codes: []
  - name: value
    data_type: double
    description: The published rate for the row's organism, topic and group, as CDC gives it (cases or deaths per
      100,000 population on CDC's MuGSI page; the table itself states no unit). Every row had one on 2026-11-25,
      and an empty one is never read as zero.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: value
      unit: /100000 (CDC's MuGSI page; not stated in the table)
      codes: []
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: True on the publisher's total and summary rows (the contract's totalRows), which are never added
      to the rows they sum (hard rule 2).
    meta:
      derived_from_contract: true
