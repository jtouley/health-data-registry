  - odcs_check:
      name: cdc_rsv_adult_coverage_interval_with_every_estimate
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE (estimate IS NULL) <> (ci_half_width_95pct IS NULL)
