# Generated by `make contracts` from contracts/cdc_nis_teen_coverage.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_nis_teen_coverage
  description: One row per vaccine and dose, place, survey year (or pooled survey years) and population group.
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_nis_teen_coverage.odcs.yaml
    contract_id: cdc_nis_teen_coverage
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_nis_teen_coverage_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_nis_teen_coverage_interval_holds_estimate
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE coverage_estimate IS NOT NULL AND ci_95_lower IS NOT NULL
          AND (coverage_estimate < ci_95_lower OR coverage_estimate > ci_95_upper)
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: accuracy
          rule: interval_holds_estimate
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: 'The publisher''s column is ''the 95% confidence interval of the estimate'' (column description),
            so the estimate should lie inside it. A warning, not an error: the codebook does not state the interval
            method, and an interval that does not hold its estimate is a question for CDC, not a reason to drop
            the row.'
  - odcs_check:
      name: cdc_nis_teen_coverage_interval_filled_where_estimate
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE coverage_estimate IS NOT NULL AND (ci_95_lower IS NULL
          OR ci_95_upper IS NULL)
        condition: measured < 10
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: interval_filled_where_estimate
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: Fill rate. Every published estimate should come with its interval. Live data on 2026-11-25 had
            2 rows with an estimate and an empty interval (828 NA estimates, 830 empty intervals); more than a handful
            means the interval column has changed. Why those rows have none is an open question (empty_interval).
  - odcs_check:
      name: cdc_nis_teen_coverage_vaccine_labels
      arguments:
        measure_sql: SELECT count(*) FROM {object} WHERE NOT ("vaccine" IS NULL OR trim(CAST("vaccine" AS VARCHAR))
          = '') AND "vaccine" NOT IN ('≥1 Dose MenACWY', '≥2 Doses Hep A', '≥2 Doses MMR', '≥3 Doses HepB', 'HPV',
          'Tetanus', 'Varicella')
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: vaccine_labels
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: Every vaccine label published on 2026-11-25. A new label is a new series to review (catalog conditions),
            not an error in the data.
  - odcs_check:
      name: cdc_nis_teen_coverage_dimension_type_labels
      arguments:
        measure_sql: SELECT count(*) FROM {object} WHERE NOT ("dimension_type" IS NULL OR trim(CAST("dimension_type"
          AS VARCHAR)) = '') AND "dimension_type" NOT IN ('Age', 'Insurance Coverage', 'Overall', 'Poverty', 'Race
          and Ethnicity', 'Urbanicity')
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: dimension_type_labels
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: The kinds named in the column description (age; overall; insurance coverage, urbanicity, race/ethnicity
            and poverty), as published on 2026-11-25. A new kind is a new group to review.
  - odcs_check:
      name: cdc_nis_teen_coverage_coverage_is_a_percent
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE coverage_estimate < 0 OR coverage_estimate > 100
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: coverage_is_a_percent
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: The column is a percent ('Estimate (%)'), so it lies from 0 to 100.
  - odcs_check:
      name: cdc_nis_teen_coverage_interval_in_order
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE ci_95_lower > ci_95_upper
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: interval_in_order
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: 'Structural: the published text is ''lower to upper'', so the first number is never above the
            second.'
  - odcs_check:
      name: cdc_nis_teen_coverage_fill_rate_dose
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("dose" IS NULL OR trim(CAST("dose"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_dose
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: 'No row has a value for the dose or definition the coverage counts, for vaccines whose name doesn''t
            carry it: e.g.'
  - odcs_check:
      name: cdc_nis_teen_coverage_fill_rate_coverage_estimate
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("coverage_estimate" IS
          NULL OR trim(CAST("coverage_estimate" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_coverage_estimate
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: No row has a value for estimated percent of teens in the group who had the vaccine and dose (a
            weighted survey estimate, column 'Estimate (%)').
  - odcs_check:
      name: cdc_nis_teen_coverage_fill_rate_ci_95_lower
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("ci_95_lower" IS NULL OR
          trim(CAST("ci_95_lower" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_ci_95_lower
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: 'No row has a value for lower end of CDC''s 95% confidence interval for the coverage estimate,
            in percent: the first number of the published text ''a to b'' (column ''95% CI (%)'').'
  - odcs_check:
      name: cdc_nis_teen_coverage_fill_rate_ci_95_upper
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("ci_95_upper" IS NULL OR
          trim(CAST("ci_95_upper" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_ci_95_upper
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: 'No row has a value for upper end of CDC''s 95% confidence interval for the coverage estimate,
            in percent: the second number of the published text ''a to b''.'
  - odcs_check:
      name: cdc_nis_teen_coverage_fill_rate_population_sample_size
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("population_sample_size"
          IS NULL OR trim(CAST("population_sample_size" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_population_sample_size
          contract: contracts/cdc_nis_teen_coverage.odcs.yaml
          checks: No row has a value for number of teens in the survey sample behind the estimate (column 'Sample
            Size'); not the number vaccinated and not a population count.
  columns:
  - name: vaccine
    data_type: varchar
    description: The vaccine the coverage is for, as CDC names it; for some vaccines the dose is part of the name
      (for example '≥1 Dose MenACWY', '≥2 Doses MMR'), for others it is in dose (HPV, Tetanus, Varicella).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: vaccine
      unit: null
      codes: []
      missing_codes: []
  - name: dose
    data_type: varchar
    description: 'The dose or definition the coverage counts, for vaccines whose name doesn''t carry it: e.g. ''≥1
      Dose Tdap'', ''Up-to-Date, Males and Females'' for HPV, ''≥2 Doses or history of disease'' for varicella.
      Empty when the dose is in the vaccine name. What up to date means for each vaccine and year is an open question
      (up_to_date_definition).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dose
      unit: null
      codes: []
      missing_codes: []
  - name: geography_type
    data_type: varchar
    description: 'The kind of place: ''HHS Regions/National'' (the United States and the ten HHS regions) or ''States/Local
      Areas'' (states, DC, territories and selected local areas).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography_type
      unit: null
      codes: []
      missing_codes: []
  - name: geography
    data_type: varchar
    description: 'The place the estimate is for: United States, an HHS region (''Region 1'' to ''Region 10''), a
      state, DC, a territory, or a local area named with its state''s postal code (''IL-City of Chicago'', ''TX-Bexar
      County''); ''Rest of state'' areas are the state without its listed local areas.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography
      unit: null
      codes: []
      missing_codes: []
  - name: year_season
    data_type: varchar
    description: The survey year, or the range of survey years pooled into one estimate ('2018-2022'), as CDC writes
      it (column 'Survey Year').
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: year_season
      unit: null
      codes: []
      missing_codes: []
  - name: dimension_type
    data_type: varchar
    description: 'What the population group is defined by. CDC''s column description: in a single survey year the
      only kind is age; the five-survey-year estimates are given overall and by insurance coverage, urbanicity,
      race and ethnicity, and poverty.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dimension_type
      unit: null
      codes: []
      missing_codes: []
  - name: dimension
    data_type: varchar
    description: The population group within dimension_type, e.g. '13-17 Years' (the survey's whole age range),
      '13-15 Years', 'Any Medicaid', 'Hispanic', 'Below Poverty Level'. Groups overlap, so estimates are never added
      or averaged across them.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dimension
      unit: null
      codes: []
      missing_codes: []
  - name: coverage_estimate
    data_type: double
    description: 'Estimated percent of teens in the group who had the vaccine and dose (a weighted survey estimate,
      column ''Estimate (%)''). CDC''s column description: NA means the estimate is not applicable; it is stored
      as no value, never as zero.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: coverage_estimate
      unit: '%'
      codes: []
      missing_codes:
      - NA
  - name: ci_95_lower
    data_type: double
    description: 'Lower end of CDC''s 95% confidence interval for the coverage estimate, in percent: the first number
      of the published text ''a to b'' (column ''95% CI (%)''). Empty when CDC gives no interval.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: _95_ci
      unit: '%'
      codes: []
      missing_codes: []
      split_part:
        separator: ' to '
        part: 1
        parts: 2
  - name: ci_95_upper
    data_type: double
    description: 'Upper end of CDC''s 95% confidence interval for the coverage estimate, in percent: the second
      number of the published text ''a to b''.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: _95_ci
      unit: '%'
      codes: []
      missing_codes: []
      split_part:
        separator: ' to '
        part: 2
        parts: 2
  - name: population_sample_size
    data_type: bigint
    description: Number of teens in the survey sample behind the estimate (column 'Sample Size'); not the number
      vaccinated and not a population count.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: population_sample_size
      unit: '1'
      codes: []
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: 'Always false: the contract declares that this table has no total rows.'
    meta:
      derived_from_contract: true
