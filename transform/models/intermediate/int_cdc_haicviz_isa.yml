# Generated by `make contracts` from contracts/cdc_haicviz_isa.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_haicviz_isa
  description: 'Long table: one published figure for the Emerging Infections Program sites combined (not a state,
    not the United States) per year x topic x view x stratum.'
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_haicviz_isa.odcs.yaml
    contract_id: cdc_haicviz_isa
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_haicviz_isa_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_haicviz_isa_one_row_per_year_and_stratum
      arguments:
        measure_sql: SELECT COUNT(*) FROM (SELECT yearname, topic, viewby, series FROM {object} GROUP BY yearname,
          topic, viewby, series HAVING COUNT(*) > 1)
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: uniqueness
          rule: one_row_per_year_and_stratum
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: 'Grain: one published figure per year, topic, view and stratum (an exact structural fact of the
            full table, 710 rows, on 2026-11-25). A repeat would mean two figures for one cell.'
  - odcs_check:
      name: cdc_haicviz_isa_headline_case_rate_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE topic = 'Case rates' AND viewby = 'All cases' AND series
          = 'All cases' AND value IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: headline_case_rate_present
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: The cell the headline case-rate series reads (topic Case rates, viewby and series both 'All cases')
            carries a value in at least one year (all 17 years did on 2026-11-25). A relabelled total row would
            empty the series and turn every total into a group, and the topic-wide fill-rate checks would not see
            it.
  - odcs_check:
      name: cdc_haicviz_isa_headline_death_rate_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE topic = 'Death rates' AND viewby = 'All cases' AND series
          = 'All cases' AND value IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: headline_death_rate_present
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: The cell the headline death-rate series reads (topic Death rates, viewby and series both 'All
            cases') carries a value in at least one year (all 17 years did on 2026-11-25), for the same reason as
            headline_case_rate_present.
  - odcs_check:
      name: cdc_haicviz_isa_one_group_per_label_in_by_group_rates
      arguments:
        measure_sql: SELECT COUNT(*) FROM (SELECT yearname, topic, series FROM {object} WHERE viewby IN ('Age',
          'Sex', 'Race', 'Epi class') AND series <> 'All cases' GROUP BY yearname, topic, series HAVING COUNT(*)
          > 1)
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: uniqueness
          rule: one_group_per_label_in_by_group_rates
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: In the Age, Sex, Race and Epi class views that the by-group metrics read together, no group label
            appears twice in one year and topic (none did on 2026-11-25). A label shared by two views would make
            those metrics refuse the question, so it is reported here first.
  - odcs_check:
      name: cdc_haicviz_isa_topic_labels_known
      arguments:
        measure_sql: 'SELECT CASE WHEN count(*) FILTER (WHERE NOT ("topic" IS NULL OR trim(CAST("topic" AS VARCHAR))
          = '''')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("topic" IS NULL OR trim(CAST("topic" AS VARCHAR))
          = '''') AND "topic" NOT IN (''Case rates'', ''Death rates'', ''Syndromes'', ''PFGE type: All cases'',
          ''PFGE type: Community-associated'', ''PFGE type: Healthcare-associated community-onset'', ''PFGE type:
          Hospital-onset'')) END FROM {object}'
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: topic_labels_known
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: Every distinct topic on the full table (710 rows, 2026-11-25) is one of these seven. Every metric
            and the rate rules filter on these exact labels, so a relabel is reported here instead of making a metric
            return nothing.
  - odcs_check:
      name: cdc_haicviz_isa_viewby_labels_known
      arguments:
        measure_sql: 'SELECT CASE WHEN count(*) FILTER (WHERE NOT ("viewby" IS NULL OR trim(CAST("viewby" AS VARCHAR))
          = '''')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("viewby" IS NULL OR trim(CAST("viewby" AS VARCHAR))
          = '''') AND "viewby" NOT IN (''All cases'', ''Age'', ''Sex'', ''Race'', ''Epi class'', ''Dialysis'', ''Syndromes'',
          ''PFGE type: All cases'', ''PFGE type: Community-associated'', ''PFGE type: Healthcare-associated community-onset'',
          ''PFGE type: Hospital-onset'')) END FROM {object}'
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: viewby_labels_known
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: Every distinct viewby on the full table (710 rows, 2026-11-25) is one of these eleven. The headline
            metrics filter on viewby 'All cases' and the by-group metrics on Age, Sex, Race and Epi class, so a
            relabel is reported here instead of making a metric return nothing.
  - odcs_check:
      name: cdc_haicviz_isa_values_not_negative
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE value < 0
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: values_not_negative
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: Every topic is a rate of cases or deaths or a share of cases, and none of these is ever negative.
  - odcs_check:
      name: cdc_haicviz_isa_case_rates_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE topic = 'Case rates' AND value IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: case_rates_present
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: 'Fill rate for the Case rates rows that values_not_negative reads: an all-empty subset passes
            it, so at least one case rate must carry a value (367 of 370 did on 2026-11-25). The headline cell itself
            is checked by headline_case_rate_present.'
  - odcs_check:
      name: cdc_haicviz_isa_death_rates_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE topic = 'Death rates' AND value IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: death_rates_present
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: 'Fill rate for the Death rates rows that values_not_negative reads: at least one death rate carries
            a value (all 85 did on 2026-11-25). An error, like case_rates_present, because the death rate is a served
            series.'
  - odcs_check:
      name: cdc_haicviz_isa_shares_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE topic NOT IN ('Case rates', 'Death rates') AND value IS
          NOT NULL
        condition: measured > 0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: shares_present
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: 'Fill rate for the syndrome and strain-type share rows that values_not_negative also reads: at
            least one share carries a value (231 did on 2026-11-25). A warning only, because no metric reads the
            shares yet.'
  - odcs_check:
      name: cdc_haicviz_isa_fill_rate_value
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("value" IS NULL OR trim(CAST("value"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_value
          contract: contracts/cdc_haicviz_isa.odcs.yaml
          checks: 'No row has a value for the published figure for the row''s topic and group: a rate for Case rates
            and Death rates, or a share of cases (values between 0 and 1 on 2026-11-25; unit not stated) for Syndromes
            and the PFGE topics.'
  columns:
  - name: yearname
    data_type: bigint
    description: Surveillance year (2005 to 2021 on 2026-11-25).
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: yearname
      unit: null
      codes: []
      missing_codes: []
  - name: topic
    data_type: varchar
    description: 'What the figure measures: Case rates or Death rates, Syndromes (share of cases by syndrome), or
      a PFGE type topic (share of cases by strain type, for all cases or one epidemiologic class).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: topic
      unit: null
      codes: []
      missing_codes: []
  - name: viewby
    data_type: varchar
    description: 'Which breakdown the row belongs to: All cases, Age, Sex, Race, Epi class, Dialysis, Syndromes,
      or the PFGE topic again. Each view covers the same cases again.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: viewby
      unit: null
      codes: []
      missing_codes: []
  - name: series
    data_type: varchar
    description: 'The group the figure is for: All cases, an age group (such as 50-64 years), a sex, a race, an
      epidemiologic class (Hospital-onset, Healthcare-associated community-onset, Community-associated), Dialysis,
      a syndrome, or a PFGE strain type (USA 100, USA 300, Other).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: series
      unit: null
      codes: []
      missing_codes: []
  - name: value
    data_type: double
    description: 'The published figure for the row''s topic and group: a rate for Case rates and Death rates, or
      a share of cases (values between 0 and 1 on 2026-11-25; unit not stated) for Syndromes and the PFGE topics.
      Empty in 27 rows on 2026-11-25 (the 1-year age group in 2018, 2020 and 2021, and every PFGE row in 2020 and
      2021), and an empty one is never read as zero.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: value
      unit: 'see topic: a rate (per 100,000 assumed, not stated) or a share of cases'
      codes: []
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: True on the publisher's total and summary rows (the contract's totalRows), which are never added
      to the rows they sum (hard rule 2).
    meta:
      derived_from_contract: true
