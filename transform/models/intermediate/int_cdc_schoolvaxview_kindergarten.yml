  columns:
  - name: vaccine
    data_type: varchar
    description: The vaccine the row is for, as CDC names it, or 'Exemption' for exemption rows (column 'Vaccine/Exemption').
      'MMR (PAC)' is a separate MMR measure whose meaning is an open question (mmr_pac).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: vaccine
      unit: null
      codes: []
      missing_codes: []
  - name: dose
    data_type: varchar
    description: For varicella, the doses counted ('1 Dose (or disease history)', '2 Doses (or disease history)',
      'UTD (or disease history)'); for exemption rows, the exemption type ('Any Exemption', 'Medical Exemption',
      'Non-Medical Exemption'). Empty for MMR, DTaP, polio and hepatitis B, whose doses follow each state's school-entry
      requirement (open question dose_blank).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dose
      unit: null
      codes: []
      missing_codes: []
  - name: geography_type
    data_type: varchar
    description: 'The kind of place: ''National'' (the United States row and the U.S. median) or ''States'' (states,
      DC and territories).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography_type
      unit: null
      codes: []
      missing_codes: []
  - name: geography
    data_type: varchar
    description: 'The place: a state, DC or territory; ''United States''; or ''U.S. Median'', the median of the
      states'' values (a median, never a national estimate).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography
      unit: null
      codes: []
      missing_codes: []
  - name: year_season
    data_type: varchar
    description: The school year, as CDC writes it ('2024-25').
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: year_season
      unit: null
      codes: []
      missing_codes: []
  - name: coverage_estimate
    data_type: double
    description: Percent of kindergartners with the vaccine and dose, or with that exemption, among all children
      enrolled in kindergarten (column 'Estimate (%)'). Empty where CDC published a code instead of a number; the
      code is kept in estimate_as_published.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: coverage_estimate
      unit: '%'
      codes: []
      missing_codes:
      - NA
      - NReq
      - Nreq
      - NR
  - name: estimate_as_published
    data_type: varchar
    description: 'The estimate exactly as CDC published it, number or code: NA (not applicable) and NReq (not required
      by the state for school entry) per CDC''s column description; Nreq and NR are published but not defined. Kept
      so a code is never lost when coverage_estimate is empty.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: coverage_estimate
      unit: null
      codes: []
      missing_codes: []
  - name: population_sample_size
    data_type: bigint
    description: Number of children enrolled in kindergarten in the state for that school year (column 'Population
      Size'); the denominator CDC's description names, not the number surveyed or vaccinated.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: population_sample_size
      unit: '1'
      codes: []
      missing_codes: []
  - name: percent_surveyed
    data_type: double
    description: 'Percent of enrolled kindergartners the state surveyed that year (column ''Percent Surveyed'').
      Footnote * on coverage rows: it may be under 100% but shown as 100%.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_surveyed
      unit: '%'
      codes: []
      missing_codes: []
  - name: foot_notes
    data_type: varchar
    description: CDC's footnote symbols for the row, exactly as published (e.g. '†', '‡. §', '>=. *'). Their meanings
      are in CDC's footnote key (the contract's footnoteKey), which differs between coverage and exemption rows;
      they are not interpreted here.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: foot_notes
      unit: null
      codes: []
      missing_codes: []
  - name: number_of_exemptions
    data_type: bigint
    description: Number of kindergartners with the exemption type (column 'Number of Exemptions'); published only
      on exemption rows. Whether it counts children or vaccine exemptions is an open question (exemption_count);
      footnote § says some states reported exemptions per vaccine.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: number_of_exemptions
      unit: '1'
      codes: []
      missing_codes: []
  - name: survey_type
    data_type: varchar
    description: How the state collected the data that year, as published (e.g. 'Census', 'Stratified 2-stage cluster
      sample', 'Voluntary response', 'Census (public); Voluntary response (private)'). CDC spells the same method
      several ways; it is kept as published.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: survey_type
      unit: null
      codes: []
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: 'Always false: the contract declares that this table has no total rows.'
    meta:
      derived_from_contract: true
