    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dimension_type
      unit: null
      codes: []
      missing_codes: []
  - name: dimension
    data_type: varchar
    description: 'The group within that age group, as published: ''Overall'' or a race and Hispanic origin group
