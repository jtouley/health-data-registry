  data_tests:
  - odcs_check:
      name: cdc_adult_vax_coverage_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_adult_vax_coverage_vaccine_labels
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("vaccine" IS NULL OR trim(CAST("vaccine" AS VARCHAR))
          = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("vaccine" IS NULL OR trim(CAST("vaccine" AS VARCHAR))
          = '') AND "vaccine" NOT IN ('Pneumococcal', 'Tetanus', 'Zoster (Shingles)')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: vaccine_labels
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: Every vaccine label published on 2026-11-25. A new label is a new series to catalogue, and it
            also shows in the flag_unmapped_labels review queue; it is a warning so that queue still builds.
  - odcs_check:
      name: cdc_adult_vax_coverage_geography_types
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("geography_type" IS NULL OR trim(CAST("geography_type"
          AS VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("geography_type" IS NULL OR trim(CAST("geography_type"
          AS VARCHAR)) = '') AND "geography_type" NOT IN ('HHS Regions/National', 'States/Local Areas', 'Counties'))
          END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: geography_types
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: The three kinds of place the column description lists, as published. A new kind is a new breakdown
            to review.
  - odcs_check:
      name: cdc_adult_vax_coverage_survey_year_is_a_year
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE NOT regexp_full_match(year_season, '[0-9]{4}')
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: survey_year_is_a_year
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: The column is the survey year (column description). A pooled period ('2021-2022') would be compared
            as text against single years, so it is reported instead of being read beside them.
  - odcs_check:
      name: cdc_adult_vax_coverage_coverage_is_a_percent
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE coverage_estimate < 0 OR coverage_estimate > 100
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: coverage_is_a_percent
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: The column is a percent ('Estimate (%)'), so it lies from 0 to 100.
  - odcs_check:
      name: cdc_adult_vax_coverage_interval_with_every_number
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE (coverage_estimate IS NULL) <> (nullif(trim(ci_95), '')
          IS NULL)
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: interval_with_every_number
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: The column is the 95% confidence interval of the estimate (column description), so every numeric
            estimate has one, and a symbol has none (as on 2026-11-25).
  - odcs_check:
      name: cdc_adult_vax_coverage_fill_rate_dose
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("dose" IS NULL OR trim(CAST("dose"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_dose
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: 'No row has a value for the kind of tetanus shot counted, as published: ''Td or Tdap'' or ''Tdap''
            (column description: ''The type of Tetanus shot''); an empty text ('''') for pneumococcal and zoster
            rows, as Socrata serves it (a row that left the field out would read as empty, open question ''Dose'').'
  - odcs_check:
      name: cdc_adult_vax_coverage_fill_rate_coverage_estimate
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("coverage_estimate" IS
          NULL OR trim(CAST("coverage_estimate" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_coverage_estimate
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: No row has a value for percent of adults in the place and group vaccinated (column 'Estimate (%)'),
            from the Behavioral Risk Factor Surveillance System.
  - odcs_check:
      name: cdc_adult_vax_coverage_fill_rate_ci_95
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("ci_95" IS NULL OR trim(CAST("ci_95"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_ci_95
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: No row has a value for the estimate's 95% confidence interval, exactly as published ('59.5 to
            71.7', column '95% CI (%)').
  - odcs_check:
      name: cdc_adult_vax_coverage_fill_rate_population_sample_size
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("population_sample_size"
          IS NULL OR trim(CAST("population_sample_size" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_population_sample_size
          contract: contracts/cdc_adult_vax_coverage.odcs.yaml
          checks: No row has a value for number of adults surveyed behind the estimate (column 'Sample Size'); published
            for national, regional and state rows, empty for counties.
  columns:
