      physical_type: VARCHAR
      source_field: vaccine
      unit: null
      codes: []
      missing_codes: []
  - name: dose
    data_type: varchar
    description: 'The kind of tetanus shot counted, as published: ''Td or Tdap'' or ''Tdap'' (column description:
      ''The type of Tetanus shot''); an empty text ('''') for pneumococcal and zoster rows, as Socrata serves it
      (a row that left the field out would read as empty, open question ''Dose'').'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dose
      unit: null
      codes: []
      missing_codes: []
  - name: geography_type
    data_type: varchar
    description: 'The kind of place, as published: ''HHS Regions/National'', ''States/Local Areas'' or ''Counties''
