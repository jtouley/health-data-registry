  - name: coverage_estimate
    data_type: double
    description: Percent of adults in the place and group vaccinated (column 'Estimate (%)'), from the Behavioral
      Risk Factor Surveillance System. Empty where CDC published a symbol instead of a number; the symbol is kept
      in estimate_as_published.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: coverage_estimate
