  - name: geography
    data_type: varchar
    description: 'The place, as CDC names it: ''United States'', ''Region 1'' to ''Region 10'', a state, DC or territory,
      a local area reported apart from its state (''IL-City of Chicago'', ''TX-Rest of state''), or a county by
      its name alone (''Champaign''), which repeats across states; fips tells them apart.'
