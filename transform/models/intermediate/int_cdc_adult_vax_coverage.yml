    description: The survey year, as published (column 'Survey Year'), a four-digit year.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: year_season
      unit: null
      codes: []
      missing_codes: []
  - name: dimension_type
    data_type: varchar
    description: 'The age group the estimate is for, as published: ''>=18 Years'', ''>=65 Years'', ''18-64 Years
      at Increased Risk'', ''>=60 Years'' and others. CDC''s column description calls it the sociodemographic category
