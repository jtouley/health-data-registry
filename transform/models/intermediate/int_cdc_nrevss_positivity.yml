# Generated by `make contracts` from contracts/cdc_nrevss_positivity.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_nrevss_positivity
  description: 'Long table: one national percent of tests positive per week and virus.'
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_nrevss_positivity.odcs.yaml
    contract_id: cdc_nrevss_positivity
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_nrevss_positivity_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_nrevss_positivity.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_nrevss_positivity_week_end_is_a_saturday
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE week_end IS NOT NULL AND dayofweek(week_end) <> 6
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: week_end_is_a_saturday
          contract: contracts/cdc_nrevss_positivity.odcs.yaml
          checks: 'Column description: week_end is the date of Saturday of the MMWR week. Any other weekday is a
            data failure.'
  - odcs_check:
      name: cdc_nrevss_positivity_pathogen_codes
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("pathogen" IS NULL OR trim(CAST("pathogen" AS
          VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("pathogen" IS NULL OR trim(CAST("pathogen"
          AS VARCHAR)) = '') AND "pathogen" NOT IN ('Influenza', 'COVID-19', 'RSV')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: pathogen_codes
          contract: contracts/cdc_nrevss_positivity.odcs.yaml
          checks: 'Column description: pathogen is one of [Influenza, COVID-19, RSV]. A warning, not an error: a
            new or renamed virus must reach the flag_unmapped_labels review queue for a maintainer, as other sources''
            condition labels do, rather than stop the build before that queue runs. The three listed viruses'' percents
            are not made wrong by a new one.'
  - odcs_check:
      name: cdc_nrevss_positivity_every_virus_published
      arguments:
        measure_sql: SELECT COUNT(DISTINCT pathogen) FROM {object} WHERE percent_test_positivity IS NOT NULL AND
          pathogen IN ('Influenza', 'COVID-19', 'RSV')
        condition: measured = 3
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: every_virus_published
          contract: contracts/cdc_nrevss_positivity.odcs.yaml
          checks: 'Fill rate by virus: each of the three viruses the column description lists has at least one week
            with a percent. A virus with none would leave its questions unanswered while every value check still
            passes.'
  - odcs_check:
      name: cdc_nrevss_positivity_percent_between_0_and_100
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE percent_test_positivity < 0 OR percent_test_positivity
          > 100
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: percent_between_0_and_100
          contract: contracts/cdc_nrevss_positivity.odcs.yaml
          checks: 'Dataset description: the percent is (positive tests / total tests) x 100, so it lies between
            0 and 100.'
  - odcs_check:
      name: cdc_nrevss_positivity_some_percents_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE percent_test_positivity IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: some_percents_present
          contract: contracts/cdc_nrevss_positivity.odcs.yaml
          checks: 'Fill rate: an all-empty percent column would pass the range check, so at least one row must carry
            a percent (all 648 did on 2026-11-25). The error-severity version of the generated fill-rate warning
            on this column, so an all-empty column is reported by both and blocks the load.'
  - odcs_check:
      name: cdc_nrevss_positivity_fill_rate_percent_test_positivity
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("percent_test_positivity"
          IS NULL OR trim(CAST("percent_test_positivity" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_percent_test_positivity
          contract: contracts/cdc_nrevss_positivity.odcs.yaml
          checks: 'No row has a value for percent of laboratory tests for the virus that were positive in the week,
            nationally: positive tests divided by all tests, times 100 (dataset description).'
  - dbt_expectations.expect_table_row_count_to_equal_other_table:
      name: cdc_nrevss_positivity_rows_staging_to_intermediate
      arguments:
        compare_model: ref('stg_cdc_nrevss_positivity')
      config:
        severity: error
        meta:
          dimension: consistency
          rule: rows_staging_to_intermediate
          contract: contracts/cdc_nrevss_positivity.odcs.yaml
          check: row_count_matches
          checks: 'The intermediate model has exactly as many rows as staging: it only adds columns beside each
            staging row (an exact structural fact). It guards the generated intermediate model, which today is a
            view with no join, filter or aggregation, so it checks our code, not the publisher''s data; it becomes
            a reconciliation of the data once a mart can change the grain (#131).'
  columns:
  - name: week_end
    data_type: date
    description: 'The Saturday that ends the MMWR week (column description: ''Date of Saturday of the MMWR week'').
      For COVID-19 and RSV, the week the tests were performed (dataset description: laboratories report ''the total
      number of SARS-CoV-2 and RSV tests performed that week''); which date puts an influenza test in a week is
      not stated (see openQuestions).'
    meta:
      logical_type: date
      physical_type: DATE
      source_field: week_end
      unit: null
      codes: []
      missing_codes: []
  - name: pathogen
    data_type: varchar
    description: 'The virus tested for: COVID-19 (SARS-CoV-2, the virus that causes COVID-19), Influenza, or RSV
      (respiratory syncytial virus).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: pathogen
      unit: null
      codes: []
      missing_codes: []
  - name: percent_test_positivity
    data_type: double
    description: 'Percent of laboratory tests for the virus that were positive in the week, nationally: positive
      tests divided by all tests, times 100 (dataset description). Counts tests, not people (dataset description).
      An empty value is kept empty, never read as zero; what CDC means by an empty value is not stated (see openQuestions).'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_test_positivity
      unit: '%'
      codes: []
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: 'Always false: the contract declares that this table has no total rows.'
    meta:
      derived_from_contract: true
