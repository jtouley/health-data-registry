# Generated by `make contracts` from contracts/cdc_heptracker.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_heptracker
  description: 'Long table: one count and one rate per 100,000 per viral hepatitis condition x year x grouping x
    group x cases or deaths, each a number or CDC''s code in its place.'
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_heptracker.odcs.yaml
    contract_id: cdc_heptracker
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_heptracker_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_heptracker_one_row_per_cell
      arguments:
        measure_sql: SELECT COUNT(*) FROM (SELECT condition, year, grouping, stratum, case_or_death FROM {object}
          GROUP BY condition, year, grouping, stratum, case_or_death HAVING COUNT(*) > 1)
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: uniqueness
          rule: one_row_per_cell
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: 'Grain: one count and rate per condition, year, grouping, group and case or death (an exact structural
            fact of the full table, 8,588 rows, on 2026-11-25). A repeat would mean two figures for one cell.'
  - odcs_check:
      name: cdc_heptracker_a_count_or_a_code
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE reported_count IS NULL AND count_flag IS NULL
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: consistency
          rule: a_count_or_a_code
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: Every row carries either a published count or CDC's code in its place, never neither (the Count
            column was filled in every row on 2026-11-25); a row with neither would be a gap with no reason.
  - odcs_check:
      name: cdc_heptracker_conditions_known
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("condition" IS NULL OR trim(CAST("condition" AS
          VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("condition" IS NULL OR trim(CAST("condition"
          AS VARCHAR)) = '') AND "condition" NOT IN ('Hepatitis A', 'Acute Hepatitis B', 'Chronic Hepatitis B',
          'Perinatal Hepatitis B', 'Acute Hepatitis C', 'Chronic Hepatitis C', 'Perinatal Hepatitis C', 'Hepatitis
          B', 'Hepatitis C')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: conditions_known
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: Every distinct condition on the full table (8,588 rows, 2026-11-25). Every series filters on these
            exact names, so a new or renamed condition is reported here and in the unmapped-label queue rather than
            stopping the build.
  - odcs_check:
      name: cdc_heptracker_groupings_known
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("grouping" IS NULL OR trim(CAST("grouping" AS
          VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("grouping" IS NULL OR trim(CAST("grouping"
          AS VARCHAR)) = '') AND "grouping" NOT IN ('Area', 'AgeGroups', 'Sex', 'SexAgeGroups', 'RaceEth', 'HHS',
          'Dialysis patient', 'Household Contact', 'Injection Drug Use', 'International Travel', 'MSM', 'Multi-Sex
          Partners', 'Needlestick', 'Occupational', 'Other Contact', 'Sexual Contact', 'Surgery', 'Transfusion'))
          END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: groupings_known
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: Every distinct grouping on the full table (8,588 rows, 2026-11-25), the categories the column
            description lists. The place series filter on 'Area', so a relabel is reported here.
  - odcs_check:
      name: cdc_heptracker_case_or_death
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("case_or_death" IS NULL OR trim(CAST("case_or_death"
          AS VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("case_or_death" IS NULL OR trim(CAST("case_or_death"
          AS VARCHAR)) = '') AND "case_or_death" NOT IN ('Case', 'Death')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: case_or_death
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: The Type column description names case surveillance or death data, and every distinct value on
            the full table (2026-11-25) is Case or Death. Every metric filters on these, so a relabel is reported
            here.
  - odcs_check:
      name: cdc_heptracker_counts_not_negative
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE reported_count < 0
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: counts_not_negative
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: A count of cases or deaths is never negative.
  - odcs_check:
      name: cdc_heptracker_case_counts_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE case_or_death = 'Case' AND reported_count IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: case_counts_present
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: 'Presence check for the case rows counts_not_negative reads: an all-empty subset passes it, so
            at least one case count must be published (a presence check, not a share; 5,425 of 6,535 were on 2026-11-25).'
  - odcs_check:
      name: cdc_heptracker_death_counts_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE case_or_death = 'Death' AND reported_count IS NOT NULL
        condition: measured > 0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: death_counts_present
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: 'Presence check for the death rows: at least one death count is published (a presence check, not
            a share; 1,848 of 2,053 were on 2026-11-25).'
  - odcs_check:
      name: cdc_heptracker_count_codes_known
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("count_flag" IS NULL OR trim(CAST("count_flag"
          AS VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("count_flag" IS NULL OR trim(CAST("count_flag"
          AS VARCHAR)) = '') AND "count_flag" NOT IN ('—', 'U', 'N', 'S', 'UR')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: count_codes_known
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: 'The codes CDC''s Count column description lists: not reported (—), unavailable (U), not reportable
            (N), suppressed (S) or unreliable (UR). Anything else written in place of a count is kept as published
            and reported here, never read as a number.'
  - odcs_check:
      name: cdc_heptracker_rates_not_negative
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE rate < 0
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: rates_not_negative
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: A rate of cases or deaths per 100,000 is never negative.
  - odcs_check:
      name: cdc_heptracker_national_case_rates_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE case_or_death = 'Case' AND grouping = 'Area' AND stratum
          = 'Total' AND rate IS NOT NULL
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: national_case_rates_present
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: 'Presence check for the nationwide case rates the headline series read: at least one is published
            (a presence check, not a share; every year of the six conditions with rates was on 2026-11-25). An error,
            like case_counts_present: if the Rate field''s format changed, every rate would move to rate_flag and
            only warnings would fire.'
  - odcs_check:
      name: cdc_heptracker_death_rates_present
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE case_or_death = 'Death' AND rate IS NOT NULL
        condition: measured > 0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: death_rates_present
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: 'Presence check for the death rates the death-rate series read: at least one death rate is published
            (a presence check, not a share).'
  - odcs_check:
      name: cdc_heptracker_rate_codes_known
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("rate_flag" IS NULL OR trim(CAST("rate_flag" AS
          VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("rate_flag" IS NULL OR trim(CAST("rate_flag"
          AS VARCHAR)) = '') AND "rate_flag" NOT IN ('—', 'U', 'N', 'S', 'UR')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: rate_codes_known
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: The codes CDC's Count column description lists for case and death data, as written in place of
            a rate (—, U, N and UR on 2026-11-25). Anything else is kept as published and reported here.
  - odcs_check:
      name: cdc_heptracker_fill_rate_reported_count
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("reported_count" IS NULL
          OR trim(CAST("reported_count" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_reported_count
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: No row has a value for number of cases or deaths as CDC published it, its digit grouping removed
            (1,232 reads as 1232).
  - odcs_check:
      name: cdc_heptracker_fill_rate_rate
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("rate" IS NULL OR trim(CAST("rate"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_rate
          contract: contracts/cdc_heptracker.odcs.yaml
          checks: 'No row has a value for cases or deaths per 100,000 population as CDC published it (Rate: ''Rates
            calculated per 100,000 population'').'
  columns:
  - name: condition
    data_type: varchar
    description: 'The viral hepatitis condition as CDC names it (Viral Hepatitis Condition): Hepatitis A, Acute,
      Chronic or Perinatal Hepatitis B or C for cases; Hepatitis A, Hepatitis B or Hepatitis C for deaths.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: event
      unit: null
      codes: []
      missing_codes: []
  - name: year
    data_type: bigint
    description: Year (2011 to 2023 on 2026-11-25; perinatal hepatitis C from 2018).
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: year
      unit: null
      codes: []
      missing_codes: []
  - name: grouping
    data_type: varchar
    description: 'The grouping category (Character): Area (nationwide Total or a state), AgeGroups, Sex, SexAgeGroups,
      RaceEth, HHS region, or a risk exposure such as Injection Drug Use, MSM or Household Contact.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: character
      unit: null
      codes: []
      missing_codes: []
  - name: stratum
    data_type: varchar
    description: 'The value of the grouping (Value): for Area, Total (nationwide) or a state or DC; an age group
      in years; Female or Male; a race and ethnicity group; an HHS region number (1 to 10); or Yes, No or Missing/Unknown
      for a risk exposure.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: value
      unit: null
      codes: []
      missing_codes: []
  - name: case_or_death
    data_type: varchar
    description: 'Case (reported to NNDSS) or Death (from NVSS death certificates) (Type: ''Indicates Whether Case
      Surveillance or Death Data'').'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: type
      unit: null
      codes: []
      missing_codes: []
  - name: reported_count
    data_type: bigint
    description: Number of cases or deaths as CDC published it, its digit grouping removed (1,232 reads as 1232).
      Empty where CDC wrote a code instead (see count_flag), and never a zero.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: count
      unit: cases or deaths
      codes: []
      missing_codes:
      - —
      - U
      - N
      - S
      - UR
  - name: count_flag
    data_type: varchar
    description: 'CDC''s code where it published no count, as written (surrounding spaces trimmed); empty beside
      a published count. Any text in the Count field that isn''t a plain number is kept here, so a new code is reported,
      never lost. Codes (publisher''s codebook): — = not reported (CDC''s column description) and never a zero;
      U = unavailable (CDC''s column description); N = not reportable (CDC''s column description); S = suppressed
      (CDC''s column description); UR = unreliable (CDC''s column description).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: count
      unit: null
      codes:
      - —
      - U
      - N
      - S
      - UR
      missing_codes: []
  - name: rate
    data_type: double
    description: 'Cases or deaths per 100,000 population as CDC published it (Rate: ''Rates calculated per 100,000
      population''). Empty where CDC wrote a code instead (see rate_flag) or gave no rate (risk groups, sex-and-age
      groups, perinatal infection), and never a zero.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: rate
      unit: /100000
      codes: []
      missing_codes:
      - —
      - U
      - N
      - S
      - UR
  - name: rate_flag
    data_type: varchar
    description: 'CDC''s code where it published no rate, as written (surrounding spaces trimmed); empty beside
      a published rate or where the publisher sent no rate at all. Any text in the Rate field that isn''t a plain
      number is kept here, so a new code is reported, never lost. Codes (publisher''s codebook): — = not reported
      (CDC''s Count column description, which the Rate column shares) and never a zero; U = unavailable (CDC''s
      Count column description, which the Rate column shares); N = not reportable (CDC''s Count column description,
      which the Rate column shares); S = suppressed (CDC''s Count column description, which the Rate column shares);
      UR = unreliable (CDC''s Count column description, which the Rate column shares).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: rate
      unit: null
      codes:
      - —
      - U
      - N
      - S
      - UR
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: True on the publisher's total and summary rows (the contract's totalRows), which are never added
      to the rows they sum (hard rule 2).
    meta:
      derived_from_contract: true
  - name: count_flag_meaning
    data_type: varchar
    description: What the publisher's count_flag code means, quoted from its codebook (the contract's flagCodes);
      empty when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
  - name: rate_flag_meaning
    data_type: varchar
    description: What the publisher's rate_flag code means, quoted from its codebook (the contract's flagCodes);
      empty when there is no code or the code is not listed.
    meta:
      derived_from_contract: true
