        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("acs_population" IS NULL
          OR trim(CAST("acs_population" AS VARCHAR)) = '')) / count(*) END FROM {object}
