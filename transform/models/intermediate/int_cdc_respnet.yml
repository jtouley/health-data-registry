# Generated by `make contracts` from contracts/cdc_respnet.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_respnet
  description: 'Long table: one estimate per network x season x date x site x age x race x sex x data type x rate
    type.'
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_respnet.odcs.yaml
    contract_id: cdc_respnet
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_respnet_fill_rate_rate_type
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("rate_type" IS NULL OR
          trim(CAST("rate_type" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_rate_type
          contract: contracts/cdc_respnet.odcs.yaml
          checks: rate_type is not empty in every row (an all-empty column would pass every value check).
  - odcs_check:
      name: cdc_respnet_fill_rate_estimate
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("estimate" IS NULL OR trim(CAST("estimate"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_estimate
          contract: contracts/cdc_respnet.odcs.yaml
          checks: estimate is not empty in every row (an all-empty column would pass every value check).
  columns:
  - name: surveillance_network
    data_type: varchar
    description: 'Which virus surveillance network the estimate comes from: COVID-NET (COVID-19), FluSurv-NET (influenza),
      RSV-NET (RSV), or Combined (the three together).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: surveillance_network
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: season
    data_type: varchar
    description: Respiratory surveillance season, written like 2025-26.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: season
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: date_type
    data_type: varchar
    description: Whether the row is for one week (Week Ending Date) or a whole season (Season). The column label
      also names Year and Month, not observed in the data on 2026-11-24.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: date_type
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: date
    data_type: varchar
    description: Week-ending date as YYYY-MM-DD for weekly rows, or the season (e.g. 2025-26) for season rows. Kept
      as text because it mixes the two.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: date
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: age_category
    data_type: varchar
    description: Age group of hospitalized patients; Overall (rates) or All (clinical rows) for all ages. Labels
      differ between rate rows (e.g. '65+ yr') and clinical rows (e.g. '≥65 years').
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: age_category
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: race
    data_type: varchar
    description: Race and ethnicity group, or All. Labels differ between rate rows (e.g. 'Black, NH') and clinical
      rows (e.g. 'Non-Hispanic Black').
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: race
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: sex
    data_type: varchar
    description: 'Sex of patients: Female, Male or All.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: sex
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: state
    data_type: varchar
    description: RESP-NET surveillance site, named by state (the site's catchment area, not necessarily the whole
      state), or Overall / a network name for all sites combined.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: state
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: data_type
    data_type: varchar
    description: 'What the estimate is: Weekly Rate or Cumulative Rate of hospitalization, or the percent of hospitalized
      patients admitted to ICU, given invasive mechanical ventilation, dying in hospital, or having at least one
      underlying condition.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: data_type
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: estimate_type
    data_type: varchar
    description: 'Unit of the estimate: Rate per 100,000 or Percent.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: estimate_type
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: rate_type
    data_type: varchar
    description: 'For rates: Observed (crude), Age-Adjusted, or Estimated; empty for percent rows (column label:
      ''Observed, estimated, or age-adjusted'').'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: rate_type
      unit: null
      codes: []
      missing_codes: []
  - name: estimate
    data_type: double
    description: 'Point estimate: hospitalizations per 100,000 site catchment population (rates) or percent of hospitalized
      patients (clinical rows); unit given by estimate_type. Published as text; cast to number.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: estimate
      unit: 'see estimate_type: /100000 or %'
      codes: []
      missing_codes: []
  - name: is_total_row
    data_type: boolean
    description: True on the publisher's total and summary rows (the contract's totalRows), which are never added
      to the rows they sum (hard rule 2).
    meta:
      derived_from_contract: true
  - name: state_partial_note
    data_type: varchar
    description: Why the state label covers only part of the place it is named after (the contract's partialPlaces);
      empty for a whole place.
    meta:
      derived_from_contract: true
  - name: condition_key
    data_type: varchar
    description: 'The condition''s key in dim_condition: the source id and the label as published.'
    meta:
      conformed: true
  - name: condition_label
    data_type: varchar
    description: The publisher's condition label, exactly as published.
    meta:
      conformed: true
  - name: condition_case_status
    data_type: varchar
    description: 'Case status (for example confirmed, probable), kept apart from the condition: from the contract.'
    meta:
      conformed: true
  - name: condition_case_subtype
    data_type: varchar
    description: 'Case subtype (for example clinical or screening for C. auris), kept apart from the condition:
      declared per label in the contract; never added to another subtype.'
    meta:
      conformed: true
  - name: place_key
    data_type: varchar
    description: The place's key in dim_place; empty when the contract does not resolve the label.
    meta:
      conformed: true
  - name: place_label
    data_type: varchar
    description: The place as the publisher names it (a renamed area shows its earlier name).
    meta:
      conformed: true
  - name: place_parent_key
    data_type: varchar
    description: For a label that covers only part of a place, the key of the place it is part of; never add the
      part to its parent.
    meta:
      conformed: true
  - name: place_is_partial
    data_type: boolean
    description: True when the publisher's place covers only part of the place it is named after or sits in (for
      example NNDSS New York, which excludes New York City).
    meta:
      conformed: true
  - name: place_note
    data_type: varchar
    description: Which part a partial area covers, or why the place is unresolved, in plain words.
    meta:
      conformed: true
  - name: place_status
    data_type: varchar
    description: resolved, partial_area or unresolved.
    meta:
      conformed: true
  - name: mmwr_year
    data_type: bigint
    description: MMWR year, when the publisher counts by MMWR week.
    meta:
      conformed: true
  - name: mmwr_week
    data_type: bigint
    description: MMWR week (1 to 53), when the publisher counts by MMWR week.
    meta:
      conformed: true
  - name: time_key
    data_type: varchar
    description: 'The period''s key in dim_time: <year>-W<week> for an MMWR week, Y<year> for a year.'
    meta:
      conformed: true
  - name: time_grain
    data_type: varchar
    description: mmwr_week, year or none.
    meta:
      conformed: true
  - name: date_basis
    data_type: varchar
    description: Which date the publisher counts a case by, from the contract (dateBasis).
    meta:
      conformed: true
