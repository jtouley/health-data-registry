# Generated by `make contracts` from contracts/cdc_respnet.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_respnet
  description: 'Long table: one estimate per network x season x date x site x age x race x sex x data type x rate
    type.'
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_respnet.odcs.yaml
    contract_id: cdc_respnet
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_respnet_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_respnet.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_respnet_fill_rate_rate_type
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("rate_type" IS NULL OR
          trim(CAST("rate_type" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_rate_type
          contract: contracts/cdc_respnet.odcs.yaml
          checks: 'No row has a value for for rates: Observed (crude), Age-Adjusted, or Estimated; empty for percent
            rows (column label: ''Observed, estimated, or age-adjusted'').'
  - odcs_check:
      name: cdc_respnet_fill_rate_estimate
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("estimate" IS NULL OR trim(CAST("estimate"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_estimate
          contract: contracts/cdc_respnet.odcs.yaml
          checks: 'No row has a value for point estimate: hospitalizations per 100,000 site catchment population
            (rates) or percent of hospitalized patients (clinical rows); unit given by estimate_type.'
  - dbt_expectations.expect_table_row_count_to_equal_other_table:
      name: cdc_respnet_rows_staging_to_intermediate
      arguments:
        compare_model: ref('stg_cdc_respnet')
      config:
        severity: error
        meta:
          dimension: consistency
          rule: rows_staging_to_intermediate
          contract: contracts/cdc_respnet.odcs.yaml
          check: row_count_matches
          checks: 'The intermediate model has exactly as many rows as staging: it only adds columns beside each
            staging row (an exact structural fact). It guards the generated intermediate model, which today is a
            view with no join, filter or aggregation, so it checks our code, not the publisher''s data; it becomes
            a reconciliation of the data once a mart can change the grain (#131).'
  columns:
  - name: surveillance_network
    data_type: varchar
    description: 'Which virus surveillance network the estimate comes from: COVID-NET (COVID-19), FluSurv-NET (influenza),
      RSV-NET (RSV), or Combined (the three together).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: surveillance_network
      unit: null
      codes: []
      missing_codes: []
  - name: season
    data_type: varchar
    description: Respiratory surveillance season, written like 2025-26.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: season
      unit: null
      codes: []
      missing_codes: []
  - name: date_type
    data_type: varchar
    description: Whether the row is for one week (Week Ending Date) or a whole season (Season). The column label
      also names Year and Month, not observed in the data on 2026-11-24.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: date_type
      unit: null
      codes: []
      missing_codes: []
  - name: date
    data_type: varchar
    description: Week-ending date as YYYY-MM-DD for weekly rows, or the season (e.g. 2025-26) for season rows. Kept
      as text because it mixes the two.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: date
      unit: null
      codes: []
      missing_codes: []
  - name: age_category
    data_type: varchar
    description: Age group of hospitalized patients; Overall (rates) or All (clinical rows) for all ages. Labels
      differ between rate rows (e.g. '65+ yr') and clinical rows (e.g. '≥65 years').
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: age_category
      unit: null
      codes: []
      missing_codes: []
  - name: race
    data_type: varchar
    description: Race and ethnicity group, or All. Labels differ between rate rows (e.g. 'Black, NH') and clinical
      rows (e.g. 'Non-Hispanic Black').
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: race
      unit: null
      codes: []
      missing_codes: []
  - name: sex
    data_type: varchar
    description: 'Sex of patients: Female, Male or All.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: sex
      unit: null
      codes: []
      missing_codes: []
  - name: state
    data_type: varchar
    description: RESP-NET surveillance site, named by state (the site's catchment area, not necessarily the whole
      state), or Overall / a network name for all sites combined.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: state
      unit: null
      codes: []
      missing_codes: []
  - name: data_type
    data_type: varchar
    description: 'What the estimate is: Weekly Rate or Cumulative Rate of hospitalization, or the percent of hospitalized
      patients admitted to ICU, given invasive mechanical ventilation, dying in hospital, or having at least one
      underlying condition.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: data_type
      unit: null
      codes: []
      missing_codes: []
  - name: estimate_type
    data_type: varchar
    description: 'Unit of the estimate: Rate per 100,000 or Percent.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: estimate_type
      unit: null
      codes: []
      missing_codes: []
  - name: rate_type
    data_type: varchar
    description: 'For rates: Observed (crude), Age-Adjusted, or Estimated; empty for percent rows (column label:
      ''Observed, estimated, or age-adjusted'').'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: rate_type
      unit: null
      codes: []
      missing_codes: []
  - name: estimate
    data_type: double
    description: 'Point estimate: hospitalizations per 100,000 site catchment population (rates) or percent of hospitalized
      patients (clinical rows); unit given by estimate_type.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: estimate
      unit: 'see estimate_type: /100000 or %'
      codes: []
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: True on the publisher's total and summary rows (the contract's totalRows), which are never added
      to the rows they sum (hard rule 2).
    meta:
      derived_from_contract: true
  - name: state_key
    data_type: varchar
    description: 'state as a key for matching the same place across years: upper case, edge whitespace and dots
      removed, and a renamed label mapped to the label it continues (the read path''s label key), so ''MINNESOTA''
      in one year and ''Minnesota'' in the next match.'
    meta:
      derived_from_contract: true
  - name: state_partial_note
    data_type: varchar
    description: Why the state label covers only part of the place it is named after (the contract's partialPlaces);
      empty for a whole place.
    meta:
      derived_from_contract: true
