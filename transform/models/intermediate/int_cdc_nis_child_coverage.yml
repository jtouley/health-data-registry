# Generated by `make contracts` from contracts/cdc_nis_child_coverage.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_nis_child_coverage
  description: One row per vaccine and dose, place, birth year (or birth cohort) and age or population group.
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_nis_child_coverage.odcs.yaml
    contract_id: cdc_nis_child_coverage
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_nis_child_coverage_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_nis_child_coverage_interval_filled_where_estimate
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE coverage_estimate IS NOT NULL AND (ci_95 IS NULL OR trim(ci_95)
          = '')
        condition: measured <= 25
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: interval_filled_where_estimate
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: 'Fill rate. Every published estimate should come with its 95% interval (column description: ''The
            95% confidence interval of the estimate of vaccination coverage''). Live data on 2026-11-25 had 25 rows
            with an estimate and no interval (2,114 NA estimates, 2,139 empty intervals), so the bound is those
            25 rows and any new gap is a warning to review. Provisional until a maintainer sets it (open question
            ''Empty interval''); why those rows have none is an open question too.'
  - odcs_check:
      name: cdc_nis_child_coverage_grain_is_unique
      arguments:
        measure_sql: SELECT COUNT(*) FROM (SELECT vaccine FROM {object} GROUP BY vaccine, coalesce(dose, ''), geography,
          year_season, dimension_type, dimension HAVING COUNT(*) > 1)
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: uniqueness
          rule: grain_is_unique
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: 'Structural: one row per vaccine, dose, place, birth year or cohort, and age or group held over
            the whole table on 2026-11-25 (141,052 rows). A repeat would put two estimates in one cell, and every
            series would then decline to answer. A warning, not a declared key: the maintainer confirms the key
            (open question ''Grain''). No dose and an empty dose count as the same.'
  - odcs_check:
      name: cdc_nis_child_coverage_vaccine_labels
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("vaccine" IS NULL OR trim(CAST("vaccine" AS VARCHAR))
          = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("vaccine" IS NULL OR trim(CAST("vaccine" AS VARCHAR))
          = '') AND "vaccine" NOT IN ('Combined 7 Series', 'DTaP', 'Hep A', 'Hep B', 'Hib', 'Influenza', 'PCV',
          'Polio', 'Rotavirus', '≥1 Dose MMR', '≥1 Dose Varicella')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: vaccine_labels
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: Every vaccine label published on 2026-11-25. A new label is a new series to review (catalog conditions),
            not an error in the data.
  - odcs_check:
      name: cdc_nis_child_coverage_geography_type_labels
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("geography_type" IS NULL OR trim(CAST("geography_type"
          AS VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("geography_type" IS NULL OR trim(CAST("geography_type"
          AS VARCHAR)) = '') AND "geography_type" NOT IN ('HHS Regions/National', 'States/Local Areas')) END FROM
          {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: geography_type_labels
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: The two kinds of place listed in the column's enum, as published on 2026-11-25. A new kind is
            a new set of places to review.
  - odcs_check:
      name: cdc_nis_child_coverage_dimension_type_labels
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("dimension_type" IS NULL OR trim(CAST("dimension_type"
          AS VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("dimension_type" IS NULL OR trim(CAST("dimension_type"
          AS VARCHAR)) = '') AND "dimension_type" NOT IN ('Age', 'Insurance Coverage', 'Overall', 'Poverty', 'Race
          and Ethnicity', 'Urbanicity')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: dimension_type_labels
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: The kinds named in the column description (age; overall; insurance coverage, urbanicity, race/ethnicity
            and poverty), as published on 2026-11-25. A new kind is a new group to review.
  - odcs_check:
      name: cdc_nis_child_coverage_coverage_is_a_percent
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE coverage_estimate < 0 OR coverage_estimate > 100
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: coverage_is_a_percent
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: The column is a percent ('Estimate (%)', 'the estimated percent of children vaccinated'), so it
            lies from 0 to 100.
  - odcs_check:
      name: cdc_nis_child_coverage_interval_text_form
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE trim(ci_95) <> '' AND NOT regexp_full_match(ci_95, '[0-9]+([.][0-9]+)?
          to [0-9]+([.][0-9]+)?')
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: interval_text_form
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: 'Structural: every interval published on 2026-11-25 (138,913 rows) is two numbers joined by ''
            to ''. A value in any other form is a change to review before the interval is split into lower and upper
            ends.'
  - odcs_check:
      name: cdc_nis_child_coverage_fill_rate_dose
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("dose" IS NULL OR trim(CAST("dose"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_dose
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: 'No row has a value for the dose or series the coverage counts (column description: the dose of
            vaccine, ≥1 to ≥4).'
  - odcs_check:
      name: cdc_nis_child_coverage_fill_rate_coverage_estimate
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("coverage_estimate" IS
          NULL OR trim(CAST("coverage_estimate" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_coverage_estimate
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: No row has a value for estimated percent of children in the group vaccinated with the vaccine
            and dose by the given age (a weighted survey estimate; column 'Estimate (%)', description 'The estimated
            percent of children vaccinated').
  - odcs_check:
      name: cdc_nis_child_coverage_fill_rate_ci_95
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("ci_95" IS NULL OR trim(CAST("ci_95"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_ci_95
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: 'No row has a value for CDC''s 95% confidence interval for the coverage estimate, in percent,
            exactly as CDC writes it: the lower and upper ends in one text field, ''lower to upper'' (column ''95%
            CI (%)'').'
  - odcs_check:
      name: cdc_nis_child_coverage_fill_rate_population_sample_size
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("population_sample_size"
          IS NULL OR trim(CAST("population_sample_size" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_population_sample_size
          contract: contracts/cdc_nis_child_coverage.odcs.yaml
          checks: No row has a value for number of children in the survey sample behind the estimate (column 'Sample
            Size'); not the number vaccinated and not a population count.
  columns:
  - name: vaccine
    data_type: varchar
    description: 'The vaccine the coverage is for, as CDC names it (column description: ''The name of the vaccine
      for which estimates are calculated''); for MMR and varicella the dose is part of the name (''≥1 Dose MMR'').
      What the Combined 7 Series counts is not yet read from CDC''s codebook (an open question in the contract).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: vaccine
      unit: null
      codes: []
      missing_codes: []
  - name: dose
    data_type: varchar
    description: 'The dose or series the coverage counts (column description: the dose of vaccine, ≥1 to ≥4). Examples
      are ''≥3 Doses'', ''≥4 Doses'', ''Full Series'' or ''Primary Series'' for Hib, and ''≥1 Dose, 3 Day (Birth
      Dose)'' for hepatitis B. No value when the vaccine name carries it (MMR, varicella) or for the Combined 7
      Series, influenza and rotavirus. What each series counts is an open question until the codebook is read.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dose
      unit: null
      codes: []
      missing_codes: []
  - name: geography_type
    data_type: varchar
    description: 'The kind of place: ''HHS Regions/National'' (the United States and the ten HHS regions) or ''States/Local
      Areas'' (states, DC, territories and selected local areas).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography_type
      unit: null
      codes: []
      missing_codes: []
  - name: geography
    data_type: varchar
    description: 'The place the estimate is for: United States, an HHS region (''Region 1'' to ''Region 10''), a
      state, DC, a territory, or a local area named with its state''s postal code (''IL-City of Chicago'', ''TX-Bexar
      County''); ''Rest of state'' areas are the state without its listed local areas.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography
      unit: null
      codes: []
      missing_codes: []
  - name: year_season
    data_type: varchar
    description: 'The birth year, two-year birth cohort or four-year birth cohort of the children (column ''Birth
      Year/Birth Cohort''), as CDC writes it, e.g. ''2021'', ''2020-2021'', ''2016-2019''. Not the year of vaccination:
      CDC''s column description says the newest data are for children born about three years before publication.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: year_season
      unit: null
      codes: []
      missing_codes: []
  - name: dimension_type
    data_type: varchar
    description: 'What the age or population group is defined by. CDC''s column description: estimates are by age
      for every birth year and cohort except the four-year cohort, which is given overall and by insurance coverage,
      urbanicity, race/ethnicity and poverty.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dimension_type
      unit: null
      codes: []
      missing_codes: []
  - name: dimension
    data_type: varchar
    description: 'The age by which the dose was given (e.g. ''24 Months'', ''35 Months'', ''8 Months'' for rotavirus,
      ''0-3 Days'' for the hepatitis B birth dose), or the population group within dimension_type for the four-year
      cohorts (e.g. ''Any Medicaid'', ''Hispanic'', ''<133% FPL''). CDC''s column description: the ages vary by
      vaccine and dose. Ages and groups overlap, so estimates are never added or averaged across them.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dimension
      unit: null
      codes: []
      missing_codes: []
  - name: coverage_estimate
    data_type: double
    description: Estimated percent of children in the group vaccinated with the vaccine and dose by the given age
      (a weighted survey estimate; column 'Estimate (%)', description 'The estimated percent of children vaccinated').
      NA is stored as no value, never as zero; CDC doesn't define NA for this table (an open question in the contract).
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: coverage_estimate
      unit: '%'
      codes: []
      missing_codes:
      - NA
  - name: ci_95
    data_type: varchar
    description: 'CDC''s 95% confidence interval for the coverage estimate, in percent, exactly as CDC writes it:
      the lower and upper ends in one text field, ''lower to upper'' (column ''95% CI (%)''). An example is ''92.2
      to 96.1''. Kept as sent: splitting it into two numbers changes the value, so it waits for a staging extension
      (#172). No value when CDC gives no interval.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: _95_ci
      unit: '%'
      codes: []
      missing_codes: []
  - name: population_sample_size
    data_type: bigint
    description: Number of children in the survey sample behind the estimate (column 'Sample Size'); not the number
      vaccinated and not a population count.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: population_sample_size
      unit: '1'
      codes: []
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: 'Always false: the contract declares that this table has no total rows.'
    meta:
      derived_from_contract: true
