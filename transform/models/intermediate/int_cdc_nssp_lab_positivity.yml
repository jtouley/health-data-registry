# Generated by `make contracts` from contracts/cdc_nssp_lab_positivity.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_nssp_lab_positivity
  description: 'Long table: one row per virus, MMWR week and state, from commercial laboratories.'
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
    contract_id: cdc_nssp_lab_positivity
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_nssp_lab_positivity_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: cdc_nssp_lab_positivity_pathogen_codes
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("pathogen" IS NULL OR trim(CAST("pathogen" AS
          VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("pathogen" IS NULL OR trim(CAST("pathogen"
          AS VARCHAR)) = '') AND "pathogen" NOT IN ('COVID-19', 'Influenza', 'RSV')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: pathogen_codes
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: The dataset description names three viruses (SARS-CoV-2, influenza and RSV), published as these
            three labels on 2026-11-25. A new label is a new virus to catalogue, and it also shows in the flag_unmapped_labels
            review queue; it is a warning so that queue still builds.
  - odcs_check:
      name: cdc_nssp_lab_positivity_every_virus_has_a_percent
      arguments:
        measure_sql: SELECT COUNT(DISTINCT pathogen) FROM {object} WHERE percent_pos IS NOT NULL AND pathogen IN
          ('COVID-19', 'Influenza', 'RSV')
        condition: measured = 3
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: every_virus_has_a_percent
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: 'Fill rate by virus: each of the three viruses has at least one row with a percent. A virus with
            none would leave its questions unanswered while every value check still passes.'
  - odcs_check:
      name: cdc_nssp_lab_positivity_week_is_sunday_to_saturday
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE dayofweek(mmwr_week_end) <> 6 OR date_diff('day', mmwr_week_start,
          mmwr_week_end) <> 6
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: week_is_sunday_to_saturday
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: 'The columns name the start and end of an MMWR week, which runs Sunday to Saturday (CDC''s MMWR
            week, as in the project''s reviewed MMWR calendar): the end is a Saturday six days after the start.'
  - odcs_check:
      name: cdc_nssp_lab_positivity_every_row_is_a_state
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("geography_type" IS NULL OR trim(CAST("geography_type"
          AS VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("geography_type" IS NULL OR trim(CAST("geography_type"
          AS VARCHAR)) = '') AND "geography_type" NOT IN ('state')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: every_row_is_a_state
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: The dataset description says the data are reported at the state level, so every row is a state
            or territory. Another kind of place would be a national or regional row, which this contract does not
            read.
  - odcs_check:
      name: cdc_nssp_lab_positivity_positives_within_tests
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE positive_count > test_count
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: consistency
          rule: positives_within_tests
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: The dataset description divides positive NAATs by all NAATs classified positive or negative, so
            the positives are part of the tests and can't outnumber them.
  - odcs_check:
      name: cdc_nssp_lab_positivity_small_counts_suppressed
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE test_count BETWEEN 1 AND 9 OR positive_count BETWEEN 1
          AND 9
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: small_counts_suppressed
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: 'The dataset description says counts are suppressed when there are fewer than 10 tests or fewer
            than 10 positive tests, and that zeros are not suppressed: a published count from 1 to 9 would mean
            the rule changed.'
  - odcs_check:
      name: cdc_nssp_lab_positivity_percent_between_0_and_100
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE percent_pos < 0 OR percent_pos > 100
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: percent_between_0_and_100
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: The dataset description defines the percent as (positive tests / tests classified positive or
            negative) x 100, so it lies between 0 and 100.
  - odcs_check:
      name: cdc_nssp_lab_positivity_percent_suppressed_with_its_counts
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE percent_pos IS NOT NULL AND (test_count IS NULL OR positive_count
          IS NULL)
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: consistency
          rule: percent_suppressed_with_its_counts
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: The dataset description suppresses the counts and the percent together, so a percent published
            beside a suppressed count would mean the rule changed.
  - odcs_check:
      name: cdc_nssp_lab_positivity_fill_rate_test_count
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("test_count" IS NULL OR
          trim(CAST("test_count" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_test_count
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: 'No row has a value for number of NAAT tests for the virus classified as positive or negative
            that week in the state: the denominator of the percent.'
  - odcs_check:
      name: cdc_nssp_lab_positivity_fill_rate_positive_count
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("positive_count" IS NULL
          OR trim(CAST("positive_count" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_positive_count
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: No row has a value for number of those NAAT tests that were positive (dataset description).
  - odcs_check:
      name: cdc_nssp_lab_positivity_fill_rate_percent_pos
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("percent_pos" IS NULL OR
          trim(CAST("percent_pos" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_percent_pos
          contract: contracts/cdc_nssp_lab_positivity.odcs.yaml
          checks: 'No row has a value for percent of the week''s NAAT tests for the virus in the state that were
            positive: positives divided by tests classified positive or negative, times 100 (dataset description).'
  columns:
  - name: pathogen
    data_type: varchar
    description: 'The virus tested for, as CDC labels it: COVID-19 (SARS-CoV-2), Influenza or RSV (respiratory syncytial
      virus). Each is by NAAT only (dataset description).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: pathogen
      unit: null
      codes: []
      missing_codes: []
  - name: mmwr_week_start
    data_type: date
    description: The Sunday that starts the MMWR week the specimens were collected in (column mmwr_week_start; results
      are aggregated by week of specimen collection, dataset description).
    meta:
      logical_type: date
      physical_type: DATE
      source_field: mmwr_week_start
      unit: null
      codes: []
      missing_codes: []
  - name: mmwr_week_end
    data_type: date
    description: The Saturday that ends the MMWR week the specimens were collected in (column mmwr_week_end).
    meta:
      logical_type: date
      physical_type: DATE
      source_field: mmwr_week_end
      unit: null
      codes: []
      missing_codes: []
  - name: geography_type
    data_type: varchar
    description: 'The kind of place, as published: ''state'' in every row (the dataset description says results
      are reported at the state level).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography_type
      unit: null
      codes: []
      missing_codes: []
  - name: geography_value
    data_type: varchar
    description: 'The state or territory, as its two-letter postal code: the 50 states, DC, Puerto Rico (PR), Guam
      (GU) and the US Virgin Islands (VI). The patient''s ZIP code of residence places the test, or the ordering
      provider''s where that is missing (dataset description).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography_value
      unit: null
      codes: []
      missing_codes: []
  - name: test_count
    data_type: bigint
    description: 'Number of NAAT tests for the virus classified as positive or negative that week in the state:
      the denominator of the percent. Unknown, indeterminate and uninterpretable results are excluded (dataset description).
      Empty where CDC suppressed it.'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: test_count
      unit: tests
      codes: []
      missing_codes: []
  - name: positive_count
    data_type: bigint
    description: Number of those NAAT tests that were positive (dataset description). Empty where CDC suppressed
      it.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: positive_count
      unit: tests
      codes: []
      missing_codes: []
  - name: percent_pos
    data_type: double
    description: 'Percent of the week''s NAAT tests for the virus in the state that were positive: positives divided
      by tests classified positive or negative, times 100 (dataset description). Counts tests, not people. Empty
      where CDC suppressed it or no test was reported, never zero.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_pos
      unit: '%'
      codes: []
      missing_codes: []
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
  - name: is_total_row
    data_type: boolean
    description: 'Always false: the contract declares that this table has no total rows.'
    meta:
      derived_from_contract: true
