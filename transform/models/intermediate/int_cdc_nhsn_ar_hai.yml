        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_isolates_tested
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: No row has a value for number of isolates tested for susceptibility to the antimicrobial, as reported
