          dimension: accuracy
          rule: percent_matches_counts
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: Publisher formula (resistant / tested) x 100; tolerance 0.06 allows rounding to one decimal place.
  - odcs_check:
