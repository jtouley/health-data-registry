# Generated by `make contracts` from contracts/cdc_nhsn_ar_hai.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_cdc_nhsn_ar_hai
  description: One row per year x geography x phenotype x HAI type x age x sex x teaching status x hospital size
    x facility type x procedure x unit type. Each stratifier includes an 'All ...' margin value.
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
    contract_id: cdc_nhsn_ar_hai
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: cdc_nhsn_ar_hai_percent_only_when_20_tested
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE percent_resistant IS NOT NULL AND isolates_tested < 20
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: percent_only_when_20_tested
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: 'Publisher: percent resistant is only calculated when the number tested is at least 20.'
  - odcs_check:
      name: cdc_nhsn_ar_hai_percent_matches_counts
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE percent_resistant IS NOT NULL AND abs(percent_resistant
          - 100.0 * resistant_isolates / isolates_tested) > 0.06
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: accuracy
          rule: percent_matches_counts
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: Publisher formula (resistant / tested) x 100; tolerance 0.06 allows rounding to one decimal place.
  - odcs_check:
      name: cdc_nhsn_ar_hai_fill_rate_isolates_tested
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("isolates_tested" IS NULL
          OR trim(CAST("isolates_tested" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_isolates_tested
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: isolates_tested is not empty in every row (an all-empty column would pass every value check).
  - odcs_check:
      name: cdc_nhsn_ar_hai_fill_rate_resistant_isolates
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("resistant_isolates" IS
          NULL OR trim(CAST("resistant_isolates" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_resistant_isolates
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: resistant_isolates is not empty in every row (an all-empty column would pass every value check).
  - odcs_check:
      name: cdc_nhsn_ar_hai_fill_rate_percent_resistant
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("percent_resistant" IS
          NULL OR trim(CAST("percent_resistant" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_percent_resistant
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: percent_resistant is not empty in every row (an all-empty column would pass every value check).
  - odcs_check:
      name: cdc_nhsn_ar_hai_fill_rate_suppressed
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("suppressed" IS NULL OR
          trim(CAST("suppressed" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_suppressed
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: suppressed is not empty in every row (an all-empty column would pass every value check).
  - odcs_check:
      name: cdc_nhsn_ar_hai_fill_rate_display_tested
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("display_tested" IS NULL
          OR trim(CAST("display_tested" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_display_tested
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: display_tested is not empty in every row (an all-empty column would pass every value check).
  - odcs_check:
      name: cdc_nhsn_ar_hai_fill_rate_lower_confidence_interval
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("lower_confidence_interval"
          IS NULL OR trim(CAST("lower_confidence_interval" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_lower_confidence_interval
          contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
          checks: lower_confidence_interval is not empty in every row (an all-empty column would pass every value
            check).
  - odcs_check:
      name: cdc_nhsn_ar_hai_fill_rate_upper_confidence_interval
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("upper_confidence_interval"
