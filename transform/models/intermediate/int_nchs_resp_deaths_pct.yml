  data_tests:
  - odcs_check:
      name: nchs_resp_deaths_pct_has_rows
      arguments:
        measure_sql: SELECT count(*) FROM {object}
        condition: measured > 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: has_rows
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: This copy of the source has no rows, so there is nothing to answer from.
  - odcs_check:
      name: nchs_resp_deaths_pct_week_ends_on_a_saturday
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE dayofweek(weekending_date) <> 6 OR weekending_date <> end_date
          OR date_diff('day', start_date, end_date) <> 6
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: week_ends_on_a_saturday
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: 'The week is an MMWR week (column ''MMWR week of reporting''), which runs Sunday to Saturday:
            its ending date is a Saturday, the last date of the data period, six days after the first.'
  - odcs_check:
      name: nchs_resp_deaths_pct_national_rows_only
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("state" IS NULL OR trim(CAST("state" AS VARCHAR))
          = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("state" IS NULL OR trim(CAST("state" AS VARCHAR))
          = '') AND "state" NOT IN ('United States')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: national_rows_only
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: The metadata gives the geographic unit of analysis as the nation. A row for a state would be a
            new breakdown this contract does not read.
  - odcs_check:
      name: nchs_resp_deaths_pct_demographic_types
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("demographic_type" IS NULL OR trim(CAST("demographic_type"
          AS VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("demographic_type" IS NULL OR trim(CAST("demographic_type"
          AS VARCHAR)) = '') AND "demographic_type" NOT IN ('Age Group', 'Race/Ethnicity', 'Sex')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: demographic_types
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: The column description lists Age, Race/Ethnicity and Sex; Age is published as 'Age Group'. A new
            kind of group is a new breakdown to review.
  - odcs_check:
      name: nchs_resp_deaths_pct_pathogen_codes
      arguments:
        measure_sql: SELECT CASE WHEN count(*) FILTER (WHERE NOT ("pathogen" IS NULL OR trim(CAST("pathogen" AS
          VARCHAR)) = '')) = 0 THEN NULL ELSE count(*) FILTER (WHERE NOT ("pathogen" IS NULL OR trim(CAST("pathogen"
          AS VARCHAR)) = '') AND "pathogen" NOT IN ('COVID-19', 'Influenza', 'RSV', 'Combined')) END FROM {object}
        condition: measured = 0
        nothing_to_judge: true
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: pathogen_codes
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: The column description lists COVID-19, Flu, RSV and Combined; every row writes Influenza for Flu.
            A new label is a new cause to catalogue, and it also shows in the flag_unmapped_labels review queue;
            it is a warning so that queue still builds.
  - odcs_check:
      name: nchs_resp_deaths_pct_small_counts_suppressed
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE deaths BETWEEN 1 AND 9
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: small_counts_suppressed
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: The suppressed column's description says values based on death counts from 1 to 9 are suppressed,
            so a published count from 1 to 9 would mean the rule changed.
  - odcs_check:
      name: nchs_resp_deaths_pct_deaths_within_all_deaths
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE deaths > total_deaths
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: consistency
          rule: deaths_within_all_deaths
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: The deaths involving a cause are part of the deaths from all causes in the same week and group
            (column descriptions), so they can't outnumber them.
  - odcs_check:
      name: nchs_resp_deaths_pct_percent_between_0_and_100
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE percent_deaths < 0 OR percent_deaths > 100
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: percent_between_0_and_100
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: The column is a percent of all deaths (column description), so it lies between 0 and 100.
  - odcs_check:
      name: nchs_resp_deaths_pct_suppressed_rows_carry_no_value
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE suppressed IS NOT NULL AND (deaths IS NOT NULL OR percent_deaths
          IS NOT NULL)
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: consistency
          rule: suppressed_rows_carry_no_value
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: The column description says that when this field is not empty, deaths and percent_deaths are suppressed,
            so a row with the note and a value would mean the rule changed.
  - odcs_check:
      name: nchs_resp_deaths_pct_fill_rate_deaths
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("deaths" IS NULL OR trim(CAST("deaths"
          AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_deaths
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: No row has a value for number of deaths involving the cause in the week and group (column description);
            empty where NCHS suppressed a count from 1 to 9, never zero.
  - odcs_check:
      name: nchs_resp_deaths_pct_fill_rate_percent_deaths
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("percent_deaths" IS NULL
          OR trim(CAST("percent_deaths" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_percent_deaths
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: No row has a value for percent of all deaths in the week and group that involved the cause (column
            'Percent of deaths due to pathogen'); empty where NCHS suppressed it, or where no death was recorded,
            never zero.
  - odcs_check:
      name: nchs_resp_deaths_pct_fill_rate_provisional
      arguments:
        measure_sql: SELECT CASE WHEN count(*) = 0 THEN 0.0 ELSE count(*) FILTER (WHERE ("provisional" IS NULL OR
          trim(CAST("provisional" AS VARCHAR)) = '')) / count(*) END FROM {object}
        condition: measured < 1.0
      config:
        severity: warn
        meta:
          dimension: completeness
          rule: fill_rate_provisional
          contract: contracts/nchs_resp_deaths_pct.odcs.yaml
          checks: 'No row has a value for NCHS''s provisional mark, as published: ''(provisional)'' on provisional
            rows, empty on the others (column ''Is this data provisional'').'
