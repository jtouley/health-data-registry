version: 2
models:
- name: int_nchs_resp_deaths_pct
  description: 'Long table: one row per week, cause and demographic group, for US residents.'
  config:
    materialized: view
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/nchs_resp_deaths_pct.odcs.yaml
    contract_id: nchs_resp_deaths_pct
    contract_version: 0.1.0
