      physical_type: VARCHAR
      source_field: hsa_counties
      unit: null
      codes: []
      missing_codes: []
  - name: hsa_nci_id
    data_type: varchar
    description: The Health Service Area's code in the National Cancer Institute's SEER list (e.g. 381), or All
