      config:
        severity: error
        meta:
          dimension: conformity
          rule: percents_between_0_and_100
          contract: contracts/cdc_nssp_ed_trajectories.odcs.yaml
          checks: 'Dataset description: each value is the percentage of all emergency department visits in the area
            and week that were for the pathogen, so it lies between 0 and 100. Checked on every observed and smoothed
            percent column.'
  - odcs_check:
      name: cdc_nssp_ed_trajectories_counties_of_one_hsa_share_its_values
      arguments:
        measure_sql: SELECT COUNT(*) FROM (SELECT week_end, hsa_nci_id FROM {object} WHERE trend_source = 'HSA'
          GROUP BY week_end, hsa_nci_id HAVING COUNT(DISTINCT percent_visits_covid) > 1 OR COUNT(DISTINCT percent_visits_influenza)
          > 1 OR COUNT(DISTINCT percent_visits_rsv) > 1 OR COUNT(DISTINCT percent_visits_combined) > 1 OR COUNT(DISTINCT
          ed_trends_covid) > 1 OR COUNT(DISTINCT ed_trends_influenza) > 1 OR COUNT(DISTINCT ed_trends_rsv) > 1)
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: consistency
          rule: counties_of_one_hsa_share_its_values
          contract: contracts/cdc_nssp_ed_trajectories.odcs.yaml
          checks: 'Dataset description: sub-state figures are the Health Service Area''s, ''reported for each county
            in the HSA''. So in one week every county row of one HSA carries the same observed percents and trends;
            a difference means a county''s own figure, which the contract doesn''t describe. (True on the full table
            on 2026-11-25.)'
