          > 100 OR percent_visits_covid < 0 OR percent_visits_covid > 100 OR percent_visits_influenza < 0 OR percent_visits_influenza
          > 100 OR percent_visits_rsv < 0 OR percent_visits_rsv > 100 OR percent_visits_smoothed_combined < 0 OR
          percent_visits_smoothed_combined > 100 OR percent_visits_smoothed_covid < 0 OR percent_visits_smoothed_covid
          > 100 OR percent_visits_smoothed_influenza < 0 OR percent_visits_smoothed_influenza > 100 OR percent_visits_smoothed_rsv
