  - name: ed_trends_covid
    data_type: varchar
    description: 'CDC''s trend for COVID-19 emergency department visits in the week, exactly as written: Increasing,
      Decreasing, No Change, Sparse, Limited Data or Data Unavailable. The dataset description says a week is increasing
      or decreasing when the 95% interval of the smoothed slope excludes zero, stable when it includes zero, and
      sparse when too many weeks are 0% to fit a model.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: ed_trends_covid
      unit: null
