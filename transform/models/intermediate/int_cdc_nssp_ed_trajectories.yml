  columns:
  - name: week_end
    data_type: date
    description: The last day of the week the emergency department visits are counted in (a Saturday; 2022-10-01
      to 2026-11-21 on 2026-11-25).
    meta:
      logical_type: date
      physical_type: DATE
      source_field: week_end
      unit: null
      codes: []
      missing_codes: []
  - name: geography
    data_type: varchar
    description: The state (or District of Columbia) the row belongs to, or United States for the national row.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography
      unit: null
      codes: []
      missing_codes: []
  - name: county
    data_type: varchar
    description: The county the row is reported for, by name without 'County' (e.g. Wayne), or All on the state
      and national rows. A county row carries its Health Service Area's figures, not the county's own.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: county
      unit: null
      codes: []
      missing_codes: []
  - name: fips
    data_type: varchar
    description: 'The county''s FIPS code, as CDC publishes it: a number, so leading zeros are dropped (Autauga
      County, Alabama is 1001, not 01001). State rows carry the state code followed by 000 (Michigan is 26000) and
      the national row carries 0. Kept as text exactly as sent; padding to five digits belongs to a later model.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: fips
      unit: null
      codes: []
      missing_codes: []
  - name: trend_source
    data_type: varchar
    description: 'Which area the row''s figures were computed for: HSA (the county''s Health Service Area), State,
      or United States.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: trend_source
      unit: null
      codes: []
      missing_codes: []
  - name: hsa
    data_type: varchar
    description: The Health Service Area's name (e.g. 'Calhoun (Battle Creek), MI - Barry, MI'), or All on the state
      and national rows. Every county of one Health Service Area has the same figures.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: hsa
      unit: null
      codes: []
      missing_codes: []
  - name: hsa_counties
    data_type: varchar
    description: The counties that make up the Health Service Area, as a comma-separated list (e.g. 'Barry, Calhoun'),
      or All on the state and national rows.
    meta:
