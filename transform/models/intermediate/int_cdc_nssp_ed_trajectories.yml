  - name: percent_visits_combined
    data_type: double
    description: Percent of all emergency department visits in the week that were for COVID-19, influenza or RSV
      combined, as CDC computes it (not the sum of the three virus columns). Empty in more rows than the single-virus
      columns (245,165 of 692,881 rows filled on 2026-11-25; see openQuestions).
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_combined
      unit: '% of all ED visits'
      codes: []
      missing_codes: []
  - name: percent_visits_covid
    data_type: double
    description: Percent of all emergency department visits in the week that were for COVID-19, as observed. Empty
      where CDC has no figure for the area and week.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_covid
