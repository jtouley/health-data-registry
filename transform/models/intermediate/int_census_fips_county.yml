# Generated by `make contracts` from contracts/census_fips_county.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_census_fips_county
  description: One row per county or county equivalent, with its FIPS codes and name as the Census Bureau writes
    them.
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - intermediate
  meta:
    contract: contracts/census_fips_county.odcs.yaml
    contract_id: census_fips_county
    contract_version: 0.1.0
    contract_status: draft
  data_tests:
  - odcs_check:
      name: census_fips_county_county_key_unique
      arguments:
        measure_sql: SELECT COUNT(*) - COUNT(DISTINCT state_fips || county_fips) FROM {object}
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: uniqueness
          rule: county_key_unique
          contract: contracts/census_fips_county.odcs.yaml
          checks: The file layout lists one row per county, sorted by STATEFP then COUNTYFP (structural).
  - odcs_check:
      name: census_fips_county_county_fips_three_digits
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE NOT regexp_full_match(county_fips, '[0-9]{3}')
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: county_fips_three_digits
          contract: contracts/census_fips_county.odcs.yaml
          checks: 'The layout''s example is 041 for Brazos County: a county FIPS code is three digits.'
  - odcs_check:
      name: census_fips_county_class_codes
      arguments:
        measure_sql: SELECT count(*) FROM {object} WHERE NOT ("class_code" IS NULL OR trim(CAST("class_code" AS
          VARCHAR)) = '') AND "class_code" NOT IN ('H1', 'H4', 'H5', 'H6', 'C7')
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: class_codes
          contract: contracts/census_fips_county.odcs.yaml
          checks: The code list defines only these FIPS class codes for counties.
  - odcs_check:
      name: census_fips_county_functional_status_codes
      arguments:
        measure_sql: SELECT count(*) FROM {object} WHERE NOT ("functional_status" IS NULL OR trim(CAST("functional_status"
          AS VARCHAR)) = '') AND "functional_status" NOT IN ('A', 'B', 'C', 'F', 'G', 'N', 'S')
        condition: measured = 0
      config:
        severity: warn
        meta:
          dimension: conformity
          rule: functional_status_codes
          contract: contracts/census_fips_county.odcs.yaml
          checks: The code list defines only these functional status codes.
  columns:
  - name: postal
    data_type: varchar
    description: Two-letter postal abbreviation of the county's state or area.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: STATE
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: state_fips
    data_type: varchar
    description: Two-digit FIPS code of the county's state, as text.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: STATEFP
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: county_fips
    data_type: varchar
    description: Three-digit county FIPS code within the state, as text (for example 163 for Wayne County, Michigan).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: COUNTYFP
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: county_ns
    data_type: varchar
    description: The county's National Standards (GNIS) code, eight digits as text.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: COUNTYNS
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: county_name
    data_type: varchar
    description: County name with its legal or statistical description (for example Wayne County, Orleans Parish,
      Anchorage Municipality); names repeat across states, so read it with the state.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: COUNTYNAME
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: class_code
    data_type: varchar
    description: 'FIPS class code, quoted from the code list: H1 an active county or statistically equivalent entity;
      H4 a legally defined inactive or nonfunctioning county or equivalent; H5 a census area in Alaska; H6 a county
      or equivalent coextensive or consolidated with an incorporated place; C7 an incorporated place independent
      of any county.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: CLASSFP
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: functional_status
    data_type: varchar
    description: 'Functional status of the county''s government, quoted from the code list: A active government;
      B active, partially consolidated with another government; C active, consolidated with another government;
      F a fictitious entity filling the Census hierarchy; G active, subordinate to another government; N nonfunctioning
      legal entity; S a statistical entity.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: FUNCSTAT
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: is_total_row
    data_type: boolean
    description: 'Always false: the contract declares that this table has no total rows.'
    meta:
      derived_from_contract: true
  - name: condition_key
    data_type: varchar
    description: 'The condition''s key in dim_condition: the source id and the label as published.'
    meta:
      conformed: true
  - name: condition_label
    data_type: varchar
    description: The publisher's condition label, exactly as published.
    meta:
      conformed: true
  - name: condition_case_status
    data_type: varchar
    description: 'Case status (for example confirmed, probable), kept apart from the condition: from the contract.'
    meta:
      conformed: true
  - name: condition_case_subtype
    data_type: varchar
    description: 'Case subtype (for example clinical or screening for C. auris), kept apart from the condition:
      declared per label in the contract; never added to another subtype.'
    meta:
      conformed: true
  - name: place_key
    data_type: varchar
    description: The place's key in dim_place; empty when the contract does not resolve the label.
    meta:
      conformed: true
  - name: place_label
    data_type: varchar
    description: The place as the publisher names it (a renamed area shows its earlier name).
    meta:
      conformed: true
  - name: place_parent_key
    data_type: varchar
    description: For a label that covers only part of a place, the key of the place it is part of; never add the
      part to its parent.
    meta:
      conformed: true
  - name: place_is_partial
    data_type: boolean
    description: True when the publisher's place covers only part of the place it is named after or sits in (for
      example NNDSS New York, which excludes New York City).
    meta:
      conformed: true
  - name: place_note
    data_type: varchar
    description: Which part a partial area covers, or why the place is unresolved, in plain words.
    meta:
      conformed: true
  - name: place_status
    data_type: varchar
    description: resolved, partial_area or unresolved.
    meta:
      conformed: true
  - name: mmwr_year
    data_type: bigint
    description: MMWR year, when the publisher counts by MMWR week.
    meta:
      conformed: true
  - name: mmwr_week
    data_type: bigint
    description: MMWR week (1 to 53), when the publisher counts by MMWR week.
    meta:
      conformed: true
  - name: time_key
    data_type: varchar
    description: 'The period''s key in dim_time: <year>-W<week> for an MMWR week, Y<year> for a year.'
    meta:
      conformed: true
  - name: time_grain
    data_type: varchar
    description: mmwr_week, year or none.
    meta:
      conformed: true
  - name: date_basis
    data_type: varchar
    description: Which date the publisher counts a case by, from the contract (dateBasis).
    meta:
      conformed: true
