version: 2
models:
- name: dim_place
  description: One row per place, keyed USA (the nation; a country by its ISO3 code), US-<state FIPS>, US-<state
    FIPS><county FIPS>, or <parent key>/<source or name> for a part of a place.
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - marts
  meta:
