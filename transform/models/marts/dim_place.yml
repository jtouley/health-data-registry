    contract_id: dim_place
    contract_version: 0.1.0
    contract_status: draft
    primary_key: &id001
    - place_key
  constraints:
  - type: primary_key
    columns: *id001
  data_tests:
  - odcs_check:
      name: dim_place_place_key_unique
      arguments:
        measure_sql: SELECT COUNT(*) - COUNT(DISTINCT place_key) FROM {object}
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: uniqueness
          rule: place_key_unique
          contract: contracts/models/dim_place.odcs.yaml
          checks: One row per place key (structural).
  - odcs_check:
      name: dim_place_parent_is_a_place
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE parent_key IS NOT NULL AND parent_key NOT IN (SELECT place_key
          FROM {object})
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: consistency
          rule: parent_is_a_place
          contract: contracts/models/dim_place.odcs.yaml
          checks: Every parent is itself a place here, so a part can always be read with the place it is part of.
  - odcs_check:
      name: dim_place_partial_areas_have_a_parent_and_note
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE is_partial_area AND (parent_key IS NULL OR place_note IS
          NULL)
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: partial_areas_have_a_parent_and_note
          contract: contracts/models/dim_place.odcs.yaml
          checks: A partial area names the place it is part of and says which part.
