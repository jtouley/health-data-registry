# Generated by `make contracts` from contracts/models/dim_condition.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: dim_condition
  description: One row per stored source and published condition label.
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - marts
  meta:
    contract: contracts/models/dim_condition.odcs.yaml
    contract_id: dim_condition
    contract_version: 0.1.0
    contract_status: draft
    primary_key: &id001
    - condition_key
  constraints:
  - type: primary_key
    columns: *id001
  data_tests:
  - odcs_check:
      name: dim_condition_mapped_or_unresolved
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE mapping_state NOT IN ('accepted', 'unresolved') OR (mapping_state
          = 'accepted' AND mesh_id IS NULL AND ncbi_taxon_id IS NULL AND gbd_cause IS NULL) OR (mapping_state =
          'unresolved' AND (mesh_id IS NOT NULL OR ncbi_taxon_id IS NOT NULL OR gbd_cause IS NOT NULL))
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: mapped_or_unresolved
          contract: contracts/models/dim_condition.odcs.yaml
          checks: Every label maps to a concept from an accepted record or says unresolved; an accepted label names
            a concept.
  - odcs_check:
      name: dim_condition_accepted_names_its_review
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE mapping_state = 'accepted' AND (mapping_reviewed_by IS
          NULL OR mapping_reviewed_at IS NULL OR mapping_source IS NULL)
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: accepted_names_its_review
          contract: contracts/models/dim_condition.odcs.yaml
          checks: An accepted mapping carries its reviewer, date and source (hard rule 1).
  columns:
  - name: condition_key
    data_type: varchar
    description: The source id and the label as published, which every fact's condition_key joins to.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: condition_key
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: dataset_id
    data_type: varchar
    description: The source that publishes the label.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dataset_id
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: condition_label
    data_type: varchar
    description: The publisher's condition label, exactly as published.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: condition_label
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: case_status
    data_type: varchar
    description: Case status from the source's contract (for example confirmed and probable), kept apart from the
      condition.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: case_status
      unit: null
      codes: []
      missing_codes: []
  - name: case_subtype
    data_type: varchar
    description: Case subtype declared for the label in the contract (for example clinical or screening for C. auris);
      two subtypes are never added together.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: case_subtype
      unit: null
      codes: []
      missing_codes: []
  - name: is_listed
    data_type: boolean
    description: True when the label is in the catalog's reviewed label list; a false row is also in flag_unmapped_labels.
    meta:
      logical_type: boolean
      physical_type: BOOLEAN
      source_field: is_listed
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: mesh_id
    data_type: varchar
    description: MeSH descriptor id from the accepted crosswalk record; empty when unresolved.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: mesh_id
      unit: null
      codes: []
      missing_codes: []
  - name: ncbi_taxon_id
    data_type: varchar
    description: NCBI Taxonomy id from the accepted crosswalk record; empty when unresolved or when the label names
      no single organism.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: ncbi_taxon_id
      unit: null
      codes: []
      missing_codes: []
  - name: gbd_cause
    data_type: varchar
    description: GBD cause name from the accepted crosswalk record; empty when unresolved.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: gbd_cause
      unit: null
      codes: []
      missing_codes: []
  - name: mapping_state
    data_type: varchar
    description: accepted (a maintainer checked the mapping) or unresolved (no accepted record).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: mapping_state
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: mapping_source
    data_type: varchar
    description: What the accepted mapping was checked against.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: mapping_source
      unit: null
      codes: []
      missing_codes: []
  - name: mapping_reviewed_by
    data_type: varchar
    description: The maintainer who accepted the mapping.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: mapping_reviewed_by
      unit: null
      codes: []
      missing_codes: []
  - name: mapping_reviewed_at
    data_type: date
    description: The date the mapping was accepted.
    meta:
      logical_type: date
      physical_type: DATE
      source_field: mapping_reviewed_at
      unit: null
      codes: []
      missing_codes: []
  - name: open_proposals
    data_type: bigint
    description: How many proposed crosswalk records wait for review for this label; they change nothing.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: open_proposals
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: row_count
    data_type: bigint
    description: How many rows of the source's fact carry the label.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: row_count
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
