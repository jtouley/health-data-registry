# Generated by `make contracts` from contracts/models/fct_cdc_haicviz_isa.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: fct_cdc_haicviz_isa
  description: 'One row per published cell of cdc_haicviz_isa: every row of the latest load, none removed, none
    added, each with its published status and total-row flag. Grain: year x topic x view x stratum, unique on the
    full table (see the source contract for the row count it was checked on).'
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - marts
  meta:
    contract: contracts/models/fct_cdc_haicviz_isa.odcs.yaml
    contract_id: fct_cdc_haicviz_isa
    contract_version: 0.1.0
    contract_status: draft
    primary_key: &id001
    - year
    - topic
    - view
    - stratum
  data_tests:
  - one_row_per_key:
      name: fct_cdc_haicviz_isa_one_row_per_year_topic_view_stratum
      arguments:
        columns: *id001
  columns:
  - name: year
    data_type: bigint
    description: Surveillance year (yearname in the source).
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: yearname
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: topic
    data_type: varchar
    description: 'What the figure measures, exactly as CDC labels it: Case rates or Death rates, Syndromes (share
      of cases by syndrome), or a PFGE type topic (share of cases by strain type, for all cases or one epidemiologic
      class). It says how to read value.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: topic
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: view
    data_type: varchar
    description: Which breakdown the row belongs to, exactly as CDC labels it (viewby in the source).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: viewby
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: stratum
    data_type: varchar
    description: The group the figure is for, exactly as CDC labels it (series in the source); 'All cases' is CDC's
      total row.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: series
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: value
    data_type: double
    description: 'The published figure for the row''s topic and group, as CDC sent it, never rescaled: a rate for
      Case rates and Death rates (the Dialysis row per an unstated population of dialysis patients), or a share
      of cases (values between 0 and 1 on 2026-11-25; unit not stated) for Syndromes and the PFGE topics. Empty
      where CDC''s cell is empty, never a zero.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: value
      unit: 'see topic: a rate (per 100,000 assumed, not stated) or a share of cases'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: fct_cdc_haicviz_isa_value_filled
        config:
          severity: warn
  - name: value_status
    data_type: varchar
    description: 'Whether CDC published a figure in this cell: ''published'', or ''not published: the publisher''s
      cell is empty''. Every row is kept and qualified, never dropped or filled.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: value_status
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: is_total_row
    data_type: boolean
    description: True for CDC's own 'All cases' rows in any view, which sit beside the groups they cover; never
      added to them.
    meta:
      logical_type: boolean
      physical_type: BOOLEAN
      source_field: is_total_row
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: _snapshot_id
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent. A load fetched in several pages carries several.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: _raw_sha256
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
