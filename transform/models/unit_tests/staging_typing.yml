# Hand-written dbt unit tests of the generated staging models' typing: what `dbt build` itself proves about the
# projection in staging.typed_select. The inputs are SQL so they don't need the raw source loaded first. The
# plugin that picks the LATEST load is tested in tests/test_dbt_raw.py.
version: 2
unit_tests:
- name: stg_cdc_nndss_weekly_counts_become_whole_numbers_and_flags_stay_as_published
  model: stg_cdc_nndss_weekly
  given:
  - input: source('raw', 'cdc_nndss_weekly')
    format: sql
    rows: |
      select 'Legionellosis' as "label", cast(null as varchar) as "location1", cast(null as varchar) as "location2", '7.0' as "m1", cast(null as varchar) as "m1_flag", cast(null as varchar) as "m2", cast(null as varchar) as "m2_flag", cast(null as varchar) as "m3", cast(null as varchar) as "m3_flag", cast(null as varchar) as "m4", cast(null as varchar) as "m4_flag", cast(null as varchar) as "sort_order", 'MICHIGAN' as "states", '52' as "week", '2024' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Legionellosis' as "label", cast(null as varchar) as "location1", cast(null as varchar) as "location2", cast(null as varchar) as "m1", '-' as "m1_flag", cast(null as varchar) as "m2", cast(null as varchar) as "m2_flag", cast(null as varchar) as "m3", cast(null as varchar) as "m3_flag", cast(null as varchar) as "m4", cast(null as varchar) as "m4_flag", cast(null as varchar) as "sort_order", 'Ohio' as "states", '53' as "week", '2025' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Legionellosis' as "label", cast(null as varchar) as "location1", cast(null as varchar) as "location2", ' ' as "m1", 'Z' as "m1_flag", cast(null as varchar) as "m2", cast(null as varchar) as "m2_flag", cast(null as varchar) as "m3", cast(null as varchar) as "m3_flag", cast(null as varchar) as "m4", cast(null as varchar) as "m4_flag", cast(null as varchar) as "sort_order", 'Ohio' as "states", '53' as "week", '2025' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
  expect:
    rows:
    - states: MICHIGAN
      year: 2024
      week: 52
      m1: 7
      m1_flag: null
      _snapshot_id: s1
      _raw_sha256: h1
    - states: Ohio
      year: 2025
      week: 53
      m1: null
      m1_flag: '-'
      _snapshot_id: s1
      _raw_sha256: h1
    - states: Ohio
      year: 2025
      week: 53
      m1: null
      m1_flag: Z
      _snapshot_id: s1
      _raw_sha256: h1
- name: stg_cdc_nhsn_ar_hai_suppressed_reads_true_false_or_empty
  model: stg_cdc_nhsn_ar_hai
  given:
  - input: source('raw', 'cdc_nhsn_ar_hai')
    format: sql
    rows: |
      select cast(null as varchar) as "age_category", cast(null as varchar) as "display_tested", cast(null as varchar) as "event_type", cast(null as varchar) as "facility", 'A' as "geography", cast(null as varchar) as "hospital_size", cast(null as varchar) as "isolates_tested", cast(null as varchar) as "location", cast(null as varchar) as "lower_confidence_interval", cast(null as varchar) as "percent_resistant", cast(null as varchar) as "phenotype", cast(null as varchar) as "procedure", cast(null as varchar) as "resistant_isolates", cast(null as varchar) as "sex", cast(null as varchar) as "source", 'true' as "suppressed", cast(null as varchar) as "teaching_hospital", cast(null as varchar) as "upper_confidence_interval", cast(null as varchar) as "year", cast(null as varchar) as "_snapshot_id", cast(null as varchar) as "_raw_sha256"
      union all
      select cast(null as varchar) as "age_category", cast(null as varchar) as "display_tested", cast(null as varchar) as "event_type", cast(null as varchar) as "facility", 'B' as "geography", cast(null as varchar) as "hospital_size", cast(null as varchar) as "isolates_tested", cast(null as varchar) as "location", cast(null as varchar) as "lower_confidence_interval", '25.0' as "percent_resistant", cast(null as varchar) as "phenotype", cast(null as varchar) as "procedure", cast(null as varchar) as "resistant_isolates", cast(null as varchar) as "sex", cast(null as varchar) as "source", 'false' as "suppressed", cast(null as varchar) as "teaching_hospital", cast(null as varchar) as "upper_confidence_interval", cast(null as varchar) as "year", cast(null as varchar) as "_snapshot_id", cast(null as varchar) as "_raw_sha256"
      union all
      select cast(null as varchar) as "age_category", cast(null as varchar) as "display_tested", cast(null as varchar) as "event_type", cast(null as varchar) as "facility", 'C' as "geography", cast(null as varchar) as "hospital_size", cast(null as varchar) as "isolates_tested", cast(null as varchar) as "location", cast(null as varchar) as "lower_confidence_interval", ' ' as "percent_resistant", cast(null as varchar) as "phenotype", cast(null as varchar) as "procedure", cast(null as varchar) as "resistant_isolates", cast(null as varchar) as "sex", cast(null as varchar) as "source", '' as "suppressed", cast(null as varchar) as "teaching_hospital", cast(null as varchar) as "upper_confidence_interval", cast(null as varchar) as "year", cast(null as varchar) as "_snapshot_id", cast(null as varchar) as "_raw_sha256"
  expect:
    rows:
    - geography: A
      suppressed: true
      percent_resistant: null
    - geography: B
      suppressed: false
      percent_resistant: 25.0
    - geography: C
      suppressed: null
      percent_resistant: null
