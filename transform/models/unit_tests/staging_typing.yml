# Hand-written dbt unit tests of the generated staging models' typing: what `dbt build` itself proves about the
# projection in staging.typed_select. The inputs are SQL so they don't need the raw source loaded first. The
# plugin that picks the LATEST load is tested in tests/test_dbt_raw.py. A source added later keeps its own typing
# tests in staging_typing_<dataset id>.yml beside this file, so source pull requests don't edit one shared file; a
# source whose unit tests cover more than staging (its intermediate model or its fact too) keeps all of them in one
# <dataset id>.yml instead.
version: 2
unit_tests:
- name: stg_cdc_nndss_weekly_counts_become_whole_numbers_and_flags_stay_as_published
  model: stg_cdc_nndss_weekly
  given:
  - input: source('raw', 'cdc_nndss_weekly')
    format: sql
    rows: |
      select 'Legionellosis' as "label", cast(null as varchar) as "location1", cast(null as varchar) as "location2", '7.0' as "m1", cast(null as varchar) as "m1_flag", cast(null as varchar) as "m2", cast(null as varchar) as "m2_flag", cast(null as varchar) as "m3", cast(null as varchar) as "m3_flag", cast(null as varchar) as "m4", cast(null as varchar) as "m4_flag", cast(null as varchar) as "sort_order", 'MICHIGAN' as "states", '52' as "week", '2024' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Legionellosis' as "label", cast(null as varchar) as "location1", cast(null as varchar) as "location2", cast(null as varchar) as "m1", '-' as "m1_flag", cast(null as varchar) as "m2", cast(null as varchar) as "m2_flag", cast(null as varchar) as "m3", cast(null as varchar) as "m3_flag", cast(null as varchar) as "m4", cast(null as varchar) as "m4_flag", cast(null as varchar) as "sort_order", 'Ohio' as "states", '53' as "week", '2025' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Legionellosis' as "label", cast(null as varchar) as "location1", cast(null as varchar) as "location2", ' ' as "m1", 'Z' as "m1_flag", cast(null as varchar) as "m2", cast(null as varchar) as "m2_flag", cast(null as varchar) as "m3", cast(null as varchar) as "m3_flag", cast(null as varchar) as "m4", cast(null as varchar) as "m4_flag", cast(null as varchar) as "sort_order", 'Ohio' as "states", '53' as "week", '2025' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
  expect:
    rows:
    - states: MICHIGAN
      year: 2024
      week: 52
      m1: 7
      m1_flag: null
      _snapshot_id: s1
      _raw_sha256: h1
    - states: Ohio
      year: 2025
      week: 53
      m1: null
      m1_flag: '-'
      _snapshot_id: s1
      _raw_sha256: h1
    - states: Ohio
      year: 2025
      week: 53
      m1: null
      m1_flag: Z
      _snapshot_id: s1
      _raw_sha256: h1
- name: stg_cdc_nhsn_ar_hai_suppressed_reads_true_false_or_empty
  model: stg_cdc_nhsn_ar_hai
  given:
  - input: source('raw', 'cdc_nhsn_ar_hai')
    format: sql
    rows: |
      select cast(null as varchar) as "age_category", cast(null as varchar) as "display_tested", cast(null as varchar) as "event_type", cast(null as varchar) as "facility", 'A' as "geography", cast(null as varchar) as "hospital_size", cast(null as varchar) as "isolates_tested", cast(null as varchar) as "location", cast(null as varchar) as "lower_confidence_interval", cast(null as varchar) as "percent_resistant", cast(null as varchar) as "phenotype", cast(null as varchar) as "procedure", cast(null as varchar) as "resistant_isolates", cast(null as varchar) as "sex", cast(null as varchar) as "source", 'true' as "suppressed", cast(null as varchar) as "teaching_hospital", cast(null as varchar) as "upper_confidence_interval", cast(null as varchar) as "year", cast(null as varchar) as "_snapshot_id", cast(null as varchar) as "_raw_sha256"
      union all
      select cast(null as varchar) as "age_category", cast(null as varchar) as "display_tested", cast(null as varchar) as "event_type", cast(null as varchar) as "facility", 'B' as "geography", cast(null as varchar) as "hospital_size", cast(null as varchar) as "isolates_tested", cast(null as varchar) as "location", cast(null as varchar) as "lower_confidence_interval", '25.0' as "percent_resistant", cast(null as varchar) as "phenotype", cast(null as varchar) as "procedure", cast(null as varchar) as "resistant_isolates", cast(null as varchar) as "sex", cast(null as varchar) as "source", 'false' as "suppressed", cast(null as varchar) as "teaching_hospital", cast(null as varchar) as "upper_confidence_interval", cast(null as varchar) as "year", cast(null as varchar) as "_snapshot_id", cast(null as varchar) as "_raw_sha256"
      union all
      select cast(null as varchar) as "age_category", cast(null as varchar) as "display_tested", cast(null as varchar) as "event_type", cast(null as varchar) as "facility", 'C' as "geography", cast(null as varchar) as "hospital_size", cast(null as varchar) as "isolates_tested", cast(null as varchar) as "location", cast(null as varchar) as "lower_confidence_interval", ' ' as "percent_resistant", cast(null as varchar) as "phenotype", cast(null as varchar) as "procedure", cast(null as varchar) as "resistant_isolates", cast(null as varchar) as "sex", cast(null as varchar) as "source", '' as "suppressed", cast(null as varchar) as "teaching_hospital", cast(null as varchar) as "upper_confidence_interval", cast(null as varchar) as "year", cast(null as varchar) as "_snapshot_id", cast(null as varchar) as "_raw_sha256"
  expect:
    rows:
    - geography: A
      suppressed: true
      percent_resistant: null
    - geography: B
      suppressed: false
      percent_resistant: 25.0
    - geography: C
      suppressed: null
      percent_resistant: null
- name: stg_cdc_nis_child_coverage_na_is_no_value_and_the_interval_stays_as_sent
  model: stg_cdc_nis_child_coverage
  given:
  - input: source('raw', 'cdc_nis_child_coverage')
    format: sql
    rows: |
      select '85.0 to 94.0' as "_95_ci", '90.0' as "coverage_estimate", cast(null as varchar) as "dimension", cast(null as varchar) as "dimension_type", cast(null as varchar) as "dose", 'A' as "geography", cast(null as varchar) as "geography_type", '300' as "population_sample_size", cast(null as varchar) as "vaccine", cast(null as varchar) as "year_season", cast(null as varchar) as "_snapshot_id", cast(null as varchar) as "_raw_sha256"
      union all
      select '' as "_95_ci", 'NA' as "coverage_estimate", cast(null as varchar) as "dimension", cast(null as varchar) as "dimension_type", cast(null as varchar) as "dose", 'B' as "geography", cast(null as varchar) as "geography_type", '' as "population_sample_size", cast(null as varchar) as "vaccine", cast(null as varchar) as "year_season", cast(null as varchar) as "_snapshot_id", cast(null as varchar) as "_raw_sha256"
      union all
      select cast(null as varchar) as "_95_ci", ' NA ' as "coverage_estimate", cast(null as varchar) as "dimension", cast(null as varchar) as "dimension_type", cast(null as varchar) as "dose", 'C' as "geography", cast(null as varchar) as "geography_type", '300.0' as "population_sample_size", cast(null as varchar) as "vaccine", cast(null as varchar) as "year_season", cast(null as varchar) as "_snapshot_id", cast(null as varchar) as "_raw_sha256"
  expect:
    rows:
    - geography: A
      coverage_estimate: 90.0
      ci_95: 85.0 to 94.0
      population_sample_size: 300
    - geography: B
      coverage_estimate: null
      ci_95: ''
      population_sample_size: null
    - geography: C
      coverage_estimate: null
      ci_95: null
      population_sample_size: 300
- name: stg_cdc_schoolvaxview_kindergarten_estimate_codes_are_no_value_and_kept_as_sent
  model: stg_cdc_schoolvaxview_kindergarten
  given:
  - input: source('raw', 'cdc_schoolvaxview_kindergarten')
    format: sql
    rows: |
      select 'MMR' as "vaccine", '' as "dose", 'States' as "geography_type", 'A' as "geography", '2024-25' as "year_season", '92.1' as "coverage_estimate", '1000' as "population_sample_size", '100' as "percent_surveyed", cast(null as varchar) as "foot_notes", cast(null as varchar) as "number_of_exemptions", 'Census' as "survey_type", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'MMR' as "vaccine", '' as "dose", 'States' as "geography_type", 'B' as "geography", '2024-25' as "year_season", 'NA' as "coverage_estimate", cast(null as varchar) as "population_sample_size", cast(null as varchar) as "percent_surveyed", cast(null as varchar) as "foot_notes", cast(null as varchar) as "number_of_exemptions", cast(null as varchar) as "survey_type", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Hepatitis B' as "vaccine", '' as "dose", 'States' as "geography_type", 'C' as "geography", '2024-25' as "year_season", ' NReq ' as "coverage_estimate", cast(null as varchar) as "population_sample_size", cast(null as varchar) as "percent_surveyed", cast(null as varchar) as "foot_notes", cast(null as varchar) as "number_of_exemptions", cast(null as varchar) as "survey_type", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Hepatitis B' as "vaccine", '' as "dose", 'States' as "geography_type", 'D' as "geography", '2024-25' as "year_season", 'Nreq' as "coverage_estimate", cast(null as varchar) as "population_sample_size", cast(null as varchar) as "percent_surveyed", cast(null as varchar) as "foot_notes", cast(null as varchar) as "number_of_exemptions", cast(null as varchar) as "survey_type", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'MMR' as "vaccine", '' as "dose", 'States' as "geography_type", 'E' as "geography", '2024-25' as "year_season", 'NR' as "coverage_estimate", cast(null as varchar) as "population_sample_size", cast(null as varchar) as "percent_surveyed", cast(null as varchar) as "foot_notes", cast(null as varchar) as "number_of_exemptions", cast(null as varchar) as "survey_type", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Exemption' as "vaccine", 'Any Exemption' as "dose", 'States' as "geography_type", 'F' as "geography", '2024-25' as "year_season", '6.8' as "coverage_estimate", cast(null as varchar) as "population_sample_size", cast(null as varchar) as "percent_surveyed", cast(null as varchar) as "foot_notes", '7500.0' as "number_of_exemptions", cast(null as varchar) as "survey_type", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
  expect:
    rows:
    - geography: A
      coverage_estimate: 92.1
      estimate_as_published: '92.1'
      population_sample_size: 1000
      percent_surveyed: 100.0
      number_of_exemptions: null
    - geography: B
      coverage_estimate: null
      estimate_as_published: NA
      population_sample_size: null
      percent_surveyed: null
      number_of_exemptions: null
    - geography: C
      coverage_estimate: null
      estimate_as_published: ' NReq '
      population_sample_size: null
      percent_surveyed: null
      number_of_exemptions: null
    - geography: D
      coverage_estimate: null
      estimate_as_published: Nreq
      population_sample_size: null
      percent_surveyed: null
      number_of_exemptions: null
    - geography: E
      coverage_estimate: null
      estimate_as_published: NR
      population_sample_size: null
      percent_surveyed: null
      number_of_exemptions: null
    - geography: F
      coverage_estimate: 6.8
      estimate_as_published: '6.8'
      population_sample_size: null
      percent_surveyed: null
      number_of_exemptions: 7500
