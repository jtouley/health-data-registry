# dbt unit tests for the hand-written review queues, on synthetic rows only (hard rule 5). They run inside
# `dbt build` (make transform, CI's Transform job and the weekly refresh), and the release gate holds a build in
# which one fails. Each covers what a queue gets wrong without it: summary rows (TOTAL) never listed as areas, an
# area matched across the 2024 upper case / 2025 title case change, weeks with neither a count nor a flag, an
# early-year week compared with the same week a year before, and a missing screening row.
version: 2

unit_tests:
  - name: flag_all_dash_areas_needs_every_week_dashed
    model: flag_all_dash_areas
    given:
      - input: ref('int_cdc_nndss_weekly')
        rows:
          # One area across the case change: listed once, under its latest spelling.
          - {states: MINNESOTA, states_key: MINNESOTA, is_total_row: false, year: 2024, week: 1, label: Anthrax, m1: null, m1_flag: "-"}
          - {states: Minnesota, states_key: MINNESOTA, is_total_row: false, year: 2025, week: 1, label: Anthrax, m1: null, m1_flag: "-"}
          # A week with no count and no flag is not '-', so the pair stays out.
          - {states: Idaho, states_key: IDAHO, is_total_row: false, year: 2025, week: 1, label: Anthrax, m1: null, m1_flag: "-"}
          - {states: Idaho, states_key: IDAHO, is_total_row: false, year: 2025, week: 2, label: Anthrax, m1: null, m1_flag: null}
          # A summary row is never a reporting area.
          - {states: TOTAL, states_key: TOTAL, is_total_row: true, year: 2025, week: 1, label: Anthrax, m1: null, m1_flag: "-"}
    expect:
      rows:
        - {states: Minnesota, label: Anthrax, first_year: 2024, last_year: 2025, weeks: 2}

  - name: flag_near_zero_running_totals_compares_the_same_week
    model: flag_near_zero_running_totals
    given:
      - input: ref('int_cdc_nndss_weekly')
        rows:
          # 12 by the end of 2024, nothing by week 53 of 2025: listed (week 53 is set against 2024's week 52).
          - {states: MINNESOTA, states_key: MINNESOTA, is_total_row: false, year: 2024, week: 52, label: "Candida auris, clinical", m3: 12, m3_flag: null}
          - {states: Minnesota, states_key: MINNESOTA, is_total_row: false, year: 2025, week: 53, label: "Candida auris, clinical", m3: null, m3_flag: "-"}
          # January: 0 by week 1 after 2 by week 1 the year before is not near zero after a normal year.
          - {states: GEORGIA, states_key: GEORGIA, is_total_row: false, year: 2024, week: 1, label: "Candida auris, clinical", m3: 2, m3_flag: null}
          - {states: GEORGIA, states_key: GEORGIA, is_total_row: false, year: 2024, week: 52, label: "Candida auris, clinical", m3: 651, m3_flag: null}
          - {states: Georgia, states_key: GEORGIA, is_total_row: false, year: 2025, week: 1, label: "Candida auris, clinical", m3: 0, m3_flag: null}
          # A summary row is never a reporting area.
          - {states: TOTAL, states_key: TOTAL, is_total_row: true, year: 2024, week: 52, label: "Candida auris, clinical", m3: 900, m3_flag: null}
          - {states: TOTAL, states_key: TOTAL, is_total_row: true, year: 2025, week: 53, label: "Candida auris, clinical", m3: null, m3_flag: "-"}
    expect:
      rows:
        - {states: Minnesota, label: "Candida auris, clinical", year: 2025, latest_week: 53, ytd: null, ytd_flag: "-", prior_year_ytd: 12}

  - name: flag_cauris_clinical_screening_swap_lists_reporting_areas_only
    model: flag_cauris_clinical_screening_swap
    given:
      - input: ref('int_cdc_nndss_weekly')
        rows:
          - {states: GEORGIA, states_key: GEORGIA, is_total_row: false, year: 2024, week: 51, label: "Candida auris, clinical", m3: 600}
          - {states: GEORGIA, states_key: GEORGIA, is_total_row: false, year: 2024, week: 52, label: "Candida auris, clinical", m3: 651}
          - {states: GEORGIA, states_key: GEORGIA, is_total_row: false, year: 2024, week: 52, label: "Candida auris, screening", m3: 365}
          - {states: OHIO, states_key: OHIO, is_total_row: false, year: 2024, week: 52, label: "Candida auris, clinical", m3: 10}
          - {states: OHIO, states_key: OHIO, is_total_row: false, year: 2024, week: 52, label: "Candida auris, screening", m3: 40}
          # No screening row at the latest week: listed, screening empty.
          - {states: MINNESOTA, states_key: MINNESOTA, is_total_row: false, year: 2024, week: 52, label: "Candida auris, clinical", m3: 12}
          # The same swap again in a summary row is not another area.
          - {states: TOTAL, states_key: TOTAL, is_total_row: true, year: 2024, week: 52, label: "Candida auris, clinical", m3: 900}
          - {states: TOTAL, states_key: TOTAL, is_total_row: true, year: 2024, week: 52, label: "Candida auris, screening", m3: 10}
    expect:
      rows:
        - {states: GEORGIA, year: 2024, latest_week: 52, clinical_ytd: 651, screening_ytd: 365}
        - {states: MINNESOTA, year: 2024, latest_week: 52, clinical_ytd: 12, screening_ytd: null}
