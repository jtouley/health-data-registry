# Hand-written dbt unit tests for cdc_haicviz_mugsi, one file per source like its siblings' staging tests.
# 1. Staging typing (staging.typed_select): yearname becomes a whole number, a rate stays the number CDC sent (never
#    rescaled), a published zero stays zero, and an empty or absent rate stays empty rather than reading as zero.
#    Inputs are SQL so the raw source needn't be loaded first.
# 2. The total-row rule (contract totalRows, generated into the intermediate model): only CDC's 'All cases' rows are
#    totals, in every view that has one, and a group beside them never is.
version: 2
unit_tests:
- name: stg_cdc_haicviz_mugsi_types_year_and_rate_and_keeps_an_empty_rate_empty
  model: stg_cdc_haicviz_mugsi
  given:
  - input: source('raw', 'cdc_haicviz_mugsi')
    format: sql
    rows: |
      select '2022' as "yearname", 'CRE' as "organism", 'Case Rates' as "topic", 'All cases' as "viewby", 'All cases' as "series", '6.4' as "value", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select '2022' as "yearname", 'CRAB' as "organism", 'Death Rates' as "topic", 'All cases' as "viewby", 'All cases' as "series", '0' as "value", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select '2021' as "yearname", 'CRAB' as "organism", 'Case Rates' as "topic", 'Sex' as "viewby", 'Male' as "series", ' ' as "value", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select '2021' as "yearname", 'CRE' as "organism", 'Case Rates' as "topic", 'Age' as "viewby", '80+ years' as "series", cast(null as varchar) as "value", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
  expect:
    rows:
    - {yearname: 2022, organism: CRE, series: All cases, value: 6.4, _snapshot_id: s1, _raw_sha256: h1}
    - {yearname: 2022, organism: CRAB, series: All cases, value: 0.0, _snapshot_id: s1, _raw_sha256: h1}
    - {yearname: 2021, organism: CRAB, series: Male, value: null, _snapshot_id: s1, _raw_sha256: h1}
    - {yearname: 2021, organism: CRE, series: 80+ years, value: null, _snapshot_id: s1, _raw_sha256: h1}
- name: int_cdc_haicviz_mugsi_flags_only_cdcs_all_cases_rows_as_totals
  model: int_cdc_haicviz_mugsi
  given:
  - input: ref('stg_cdc_haicviz_mugsi')
    rows:
    - {yearname: 2022, organism: CRE, topic: Case Rates, viewby: All cases, series: All cases, value: 6.4}
    - {yearname: 2022, organism: CRE, topic: Case Rates, viewby: Culture source, series: All cases, value: 6.4}
    - {yearname: 2022, organism: CRE, topic: Case Rates, viewby: Culture source, series: Urine, value: 4.1}
    - {yearname: 2022, organism: CRE, topic: Case Rates, viewby: Organism, series: All cases, value: 6.4}
    - {yearname: 2022, organism: CRE, topic: Case Rates, viewby: Organism, series: Klebsiella pneumoniae, value: 3.0}
    - {yearname: 2022, organism: CRAB, topic: Case Rates, viewby: Age, series: 80+ years, value: 9.0}
    - {yearname: 2022, organism: CRAB, topic: Death Rates, viewby: All cases, series: All cases, value: null}
  expect:
    rows:
    - {viewby: All cases, series: All cases, is_total_row: true}
    - {viewby: Culture source, series: All cases, is_total_row: true}
    - {viewby: Culture source, series: Urine, is_total_row: false}
    - {viewby: Organism, series: All cases, is_total_row: true}
    - {viewby: Organism, series: Klebsiella pneumoniae, is_total_row: false}
    - {viewby: Age, series: 80+ years, is_total_row: false}
    - {viewby: All cases, series: All cases, is_total_row: true}
