# Hand-written dbt unit tests of the hand-written mart fct_cdc_lyme_county (transform/models/marts/), which unions
# the three Lyme disease intermediate models. They pin what the mart itself decides:
#   - every row is kept, labelled with its source table and case-definition era;
#   - is_total_row is carried through, so a total row is never lost or silently added (hard rule 2);
#   - state_unplaced is true for anything that isn't a two-letter postal code, a new or differently cased marker
#     included, so a label CDC adds later is never read as a state;
#   - county_unplaced is true for anything that isn't five digits (a lost leading zero or a trailing space
#     included) and for a known county under an unplaced state, so a county's sum is always part of its state's.
# Inputs are dicts: dbt builds the intermediate parents before these tests run.
version: 2
unit_tests:
- name: fct_cdc_lyme_county_keeps_every_row_labels_its_era_and_flags_unplaced_places
  model: fct_cdc_lyme_county
  given:
  - input: ref('int_cdc_lyme_county_1992_2007')
    rows:
    - {year: 1992, state: PA, fips: '42  .', case_status: Confirmed, sex: Unknown, age_cat_yrs: Unknown, frequency: 9, _snapshot_id: s0, _raw_sha256: h0, is_total_row: false}
  - input: ref('int_cdc_lyme_county_2008_2021')
    rows:
    - {year: 2021, state: Suppressed, fips: Suppressed, case_status: Probable, sex: Suppressed, age_cat_yrs: Suppressed, frequency: 3, _snapshot_id: s1, _raw_sha256: h1, is_total_row: false}
    - {year: 2015, state: MN, fips: Unknown, case_status: Confirmed, sex: Male, age_cat_yrs: 20+, frequency: 2, _snapshot_id: s1, _raw_sha256: h1, is_total_row: false}
  - input: ref('int_cdc_lyme_county')
    rows:
    - {year: 2023, state: Unknown, fips: '26005', case_status: Confirmed, sex: Unknown, age_cat_yrs: Unknown, frequency: 4, _snapshot_id: s2, _raw_sha256: h2, is_total_row: false}
    - {year: 2023, state: MI, fips: '26163', case_status: Confirmed, sex: Female, age_cat_yrs: 20+, frequency: null, _snapshot_id: s2, _raw_sha256: h2, is_total_row: false}
  expect:
    rows:
    - {source_id: cdc_lyme_county_1992_2007, case_definition_era: 1992-2007, year: 1992, state: PA, fips: '42  .', frequency: 9, is_total_row: false, state_unplaced: false, county_unplaced: true}
    - {source_id: cdc_lyme_county_2008_2021, case_definition_era: 2008-2021, year: 2021, state: Suppressed, fips: Suppressed, frequency: 3, is_total_row: false, state_unplaced: true, county_unplaced: true}
    - {source_id: cdc_lyme_county_2008_2021, case_definition_era: 2008-2021, year: 2015, state: MN, fips: Unknown, frequency: 2, is_total_row: false, state_unplaced: false, county_unplaced: true}
    - {source_id: cdc_lyme_county, case_definition_era: 2022 onward, year: 2023, state: Unknown, fips: '26005', frequency: 4, is_total_row: false, state_unplaced: true, county_unplaced: true}
    - {source_id: cdc_lyme_county, case_definition_era: 2022 onward, year: 2023, state: MI, fips: '26163', frequency: null, is_total_row: false, state_unplaced: false, county_unplaced: false}
- name: fct_cdc_lyme_county_carries_a_total_row_flag_and_flags_unexpected_labels
  model: fct_cdc_lyme_county
  given:
  - input: ref('int_cdc_lyme_county_1992_2007')
    rows: []
  - input: ref('int_cdc_lyme_county_2008_2021')
    rows:
    # A total row, as a later contract might declare: kept, and still marked, so nobody adds it to its parts.
    - {year: 2015, state: MN, fips: '27003', case_status: Confirmed, sex: Male, age_cat_yrs: 20+, frequency: 40, _snapshot_id: s1, _raw_sha256: h1, is_total_row: true}
    # A FIPS code that lost its leading zero, and one with a trailing space: neither is five digits.
    - {year: 2015, state: CT, fips: '9110', case_status: Confirmed, sex: Male, age_cat_yrs: 20+, frequency: 1, _snapshot_id: s1, _raw_sha256: h1, is_total_row: false}
    - {year: 2015, state: MI, fips: '26005 ', case_status: Confirmed, sex: Male, age_cat_yrs: 20+, frequency: 1, _snapshot_id: s1, _raw_sha256: h1, is_total_row: false}
  - input: ref('int_cdc_lyme_county')
    rows:
    # A marker CDC's Glossary spells in lower case, not in the contracts' lists: never read as a state.
    - {year: 2023, state: suppressed, fips: Suppressed, case_status: Probable, sex: Female, age_cat_yrs: 20+, frequency: 5, _snapshot_id: s2, _raw_sha256: h2, is_total_row: false}
  expect:
    rows:
    - {source_id: cdc_lyme_county_2008_2021, fips: '27003', frequency: 40, is_total_row: true, state_unplaced: false, county_unplaced: false}
    - {source_id: cdc_lyme_county_2008_2021, fips: '9110', frequency: 1, is_total_row: false, state_unplaced: false, county_unplaced: true}
    - {source_id: cdc_lyme_county_2008_2021, fips: '26005 ', frequency: 1, is_total_row: false, state_unplaced: false, county_unplaced: true}
    - {source_id: cdc_lyme_county, fips: Suppressed, frequency: 5, is_total_row: false, state_unplaced: true, county_unplaced: true}
