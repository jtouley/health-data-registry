# Hand-written dbt unit tests for the three Lyme disease sources (cdc_lyme_county, _2008_2021, _1992_2007), one
# file for the three because they share one shape and one fact macro.
# 1. Staging typing (staging.typed_select): year and the case count become whole numbers; a count of 0 stays 0 and
#    an empty count stays empty, never 0; CDC's 'Suppressed' and 'Unknown' labels, in every column, and a FIPS value
#    outside the codebook's five digits ('42  .', seen in the 1992-2007 table) are kept exactly as sent. Raw inputs
#    are SQL, which lists every raw column, as format: sql requires.
# 2. The facts (marts, macros/lyme_county_fact.sql): every row is kept with its value as published; each row gets
#    its era label and the status wording the fact contracts describe, including a label CDC's codebook doesn't
#    list (it reads as a label to review, never as a state or a county); and is_total_row is carried through, so
#    a total row a later contract declares stays marked in the fact.
version: 2
unit_tests:
- name: stg_cdc_lyme_county_types_counts_and_keeps_suppressed_labels_as_sent
  model: stg_cdc_lyme_county
  given:
  - input: source('raw', 'cdc_lyme_county')
    format: sql
    rows: |
      select '20+' as "age_cat_yrs", 'Confirmed' as "case_status", '26163' as "fips", '12' as "frequency", 'Female' as "sex", 'MI' as "state", '2023' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Suppressed' as "age_cat_yrs", 'Probable' as "case_status", 'Suppressed' as "fips", '0' as "frequency", 'Suppressed' as "sex", 'MI' as "state", '2023' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Unknown' as "age_cat_yrs", 'Probable' as "case_status", '26005' as "fips", ' ' as "frequency", 'Unknown' as "sex", 'Unknown' as "state", '2022' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select '0-19' as "age_cat_yrs", 'Confirmed' as "case_status", '09110' as "fips", cast(null as varchar) as "frequency", 'Male' as "sex", 'CT' as "state", '2023' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
  expect:
    rows:
    - {year: 2023, state: MI, fips: '26163', case_status: Confirmed, sex: Female, age_cat_yrs: 20+, frequency: 12, _snapshot_id: s1, _raw_sha256: h1}
    - {year: 2023, state: MI, fips: Suppressed, case_status: Probable, sex: Suppressed, age_cat_yrs: Suppressed, frequency: 0, _snapshot_id: s1, _raw_sha256: h1}
    - {year: 2022, state: Unknown, fips: '26005', case_status: Probable, sex: Unknown, age_cat_yrs: Unknown, frequency: null, _snapshot_id: s1, _raw_sha256: h1}
    - {year: 2023, state: CT, fips: '09110', case_status: Confirmed, sex: Male, age_cat_yrs: 0-19, frequency: null, _snapshot_id: s1, _raw_sha256: h1}
- name: stg_cdc_lyme_county_1992_2007_keeps_a_fips_outside_the_codebook_as_sent
  model: stg_cdc_lyme_county_1992_2007
  given:
  - input: source('raw', 'cdc_lyme_county_1992_2007')
    format: sql
    rows: |
      select 'Unknown' as "age_cat_yrs", 'Confirmed' as "case_status", '42  .' as "fips", '1173' as "frequency", 'Unknown' as "sex", 'PA' as "state", '1992' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select '0-19' as "age_cat_yrs", 'Confirmed' as "case_status", '51059' as "fips", '1' as "frequency", 'Female' as "sex", 'Suppressed' as "state", '2007' as "year", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
  expect:
    rows:
    - {year: 1992, state: PA, fips: '42  .', frequency: 1173}
    - {year: 2007, state: Suppressed, fips: '51059', frequency: 1}
- name: fct_cdc_lyme_county_keeps_every_row_and_says_what_each_place_label_is
  model: fct_cdc_lyme_county
  given:
  - input: ref('int_cdc_lyme_county')
    rows:
    - {year: 2023, state: MI, fips: '26163', case_status: Confirmed, sex: Female, age_cat_yrs: 20+, frequency: 3, _snapshot_id: s2, _raw_sha256: h2, is_total_row: false}
    - {year: 2023, state: MI, fips: '26163', case_status: Probable, sex: Female, age_cat_yrs: 20+, frequency: null, _snapshot_id: s2, _raw_sha256: h2, is_total_row: false}
    - {year: 2023, state: Unknown, fips: '26005', case_status: Confirmed, sex: Unknown, age_cat_yrs: Unknown, frequency: 4, _snapshot_id: s2, _raw_sha256: h2, is_total_row: false}
    - {year: 2023, state: Suppressed, fips: Suppressed, case_status: Probable, sex: Suppressed, age_cat_yrs: Suppressed, frequency: 5, _snapshot_id: s2, _raw_sha256: h2, is_total_row: false}
    - {year: 2023, state: MI, fips: Unknown, case_status: Confirmed, sex: Male, age_cat_yrs: 0-19, frequency: 1, _snapshot_id: s2, _raw_sha256: h2, is_total_row: false}
    - {year: 2022, state: suppressed, fips: '9110', case_status: Confirmed, sex: Male, age_cat_yrs: 0-19, frequency: 2, _snapshot_id: s2, _raw_sha256: h2, is_total_row: false}
    - {year: 2022, state: MI, fips: '26005 ', case_status: Confirmed, sex: Male, age_cat_yrs: 0-19, frequency: 6, _snapshot_id: s2, _raw_sha256: h2, is_total_row: true}
  expect:
    rows:
    - {case_definition_era: 2022 onward, state: MI, fips: '26163', case_status: Confirmed, frequency: 3, value_status: published, state_status: two-letter state postal code, county_status: five-digit county FIPS code, is_total_row: false, _snapshot_id: s2, _raw_sha256: h2}
    - {case_definition_era: 2022 onward, state: MI, fips: '26163', case_status: Probable, frequency: null, value_status: "not published: the publisher's cell is empty", state_status: two-letter state postal code, county_status: five-digit county FIPS code, is_total_row: false, _snapshot_id: s2, _raw_sha256: h2}
    - {case_definition_era: 2022 onward, state: Unknown, fips: '26005', case_status: Confirmed, frequency: 4, value_status: published, state_status: not reported (Unknown), county_status: five-digit county FIPS code, is_total_row: false, _snapshot_id: s2, _raw_sha256: h2}
    - {case_definition_era: 2022 onward, state: Suppressed, fips: Suppressed, case_status: Probable, frequency: 5, value_status: published, state_status: suppressed by CDC (fewer than 5 records share the group), county_status: suppressed by CDC (fewer than 5 records share the group), is_total_row: false, _snapshot_id: s2, _raw_sha256: h2}
    - {case_definition_era: 2022 onward, state: MI, fips: Unknown, case_status: Confirmed, frequency: 1, value_status: published, state_status: two-letter state postal code, county_status: not reported (Unknown), is_total_row: false, _snapshot_id: s2, _raw_sha256: h2}
    - {case_definition_era: 2022 onward, state: suppressed, fips: '9110', case_status: Confirmed, frequency: 2, value_status: published, state_status: "not a two-letter state postal code or a CDC marker: a label to review", county_status: "not a five-digit county FIPS code or a CDC marker: a label to review", is_total_row: false, _snapshot_id: s2, _raw_sha256: h2}
    - {case_definition_era: 2022 onward, state: MI, fips: '26005 ', case_status: Confirmed, frequency: 6, value_status: published, state_status: two-letter state postal code, county_status: "not a five-digit county FIPS code or a CDC marker: a label to review", is_total_row: true, _snapshot_id: s2, _raw_sha256: h2}
- name: fct_cdc_lyme_county_1992_2007_labels_its_era_and_keeps_a_fips_outside_the_codebook
  model: fct_cdc_lyme_county_1992_2007
  given:
  - input: ref('int_cdc_lyme_county_1992_2007')
    rows:
    - {year: 1992, state: PA, fips: '42  .', case_status: Confirmed, sex: Unknown, age_cat_yrs: Unknown, frequency: 9, _snapshot_id: s0, _raw_sha256: h0, is_total_row: false}
  expect:
    rows:
    - {case_definition_era: 1992-2007, year: 1992, state: PA, fips: '42  .', frequency: 9, state_status: two-letter state postal code, county_status: "not a five-digit county FIPS code or a CDC marker: a label to review"}
- name: fct_cdc_lyme_county_2008_2021_labels_its_era
  model: fct_cdc_lyme_county_2008_2021
  given:
  - input: ref('int_cdc_lyme_county_2008_2021')
    rows:
    - {year: 2021, state: Suppressed, fips: Suppressed, case_status: Probable, sex: Suppressed, age_cat_yrs: Suppressed, frequency: 3, _snapshot_id: s1, _raw_sha256: h1, is_total_row: false}
  expect:
    rows:
    - {case_definition_era: 2008-2021, year: 2021, fips: Suppressed, frequency: 3, state_status: suppressed by CDC (fewer than 5 records share the group), county_status: suppressed by CDC (fewer than 5 records share the group)}
