# Hand-written dbt unit tests for cdc_nhanes_id_prevalence, one file per source like its siblings' staging tests.
# 1. Staging (staging.typed_select): the estimate and its 95% bounds stay the numbers NCHS sent, and NCHS's flag
#    stays as published; an estimate NCHS flags not available ('- - -') is empty, never zero. Inputs are SQL so the
#    raw source needn't be loaded first.
# 2. Intermediate: only NCHS's Total row is a total, and each flag gets its meaning from the NCHS footnotes.
# 3. The fact (marts): every row is kept; a flagged estimate says so in words, and a missing one says why.
version: 2
unit_tests:
- name: stg_cdc_nhanes_id_prevalence_keeps_the_estimate_interval_and_flag_as_published
  model: stg_cdc_nhanes_id_prevalence
  given:
  - input: source('raw', 'cdc_nhanes_id_prevalence')
    format: sql
    rows: |
      select 'Herpes simplex virus type 2' as "topic", 'Infectious diseases' as "taxonomy", 'Total' as "classification", 'Total' as "group", '20-49 years' as "subgroup", cast(null as varchar) as "nesting_label", 'Percent of population, crude' as "estimate_type", '2017-2018' as "time_period", '14.6' as "estimate", '1.2' as "standard_error", '12.4' as "estimate_lci", '17.1' as "estimate_uci", cast(null as varchar) as "flag", 'FN' as "footnote_id_list", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Herpes simplex virus type 2' as "topic", 'Infectious diseases' as "taxonomy", 'Multiple Characteristics' as "classification", 'Sex and age group' as "group", 'Male: 20-29 years' as "subgroup", 'Male' as "nesting_label", 'Percent of population, crude' as "estimate_type", '1999-2000' as "time_period", '6.2' as "estimate", '2.3' as "standard_error", '2.2' as "estimate_lci", '13' as "estimate_uci", '*' as "flag", 'FN' as "footnote_id_list", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'Herpes simplex virus type 1' as "topic", 'Infectious diseases' as "taxonomy", 'Demographic Characteristic' as "classification", 'Race and Hispanic origin' as "group", 'Asian only, non-Hispanic' as "subgroup", cast(null as varchar) as "nesting_label", 'Percent of population, crude' as "estimate_type", '1999-2000' as "time_period", cast(null as varchar) as "estimate", cast(null as varchar) as "standard_error", cast(null as varchar) as "estimate_lci", cast(null as varchar) as "estimate_uci", '- - -' as "flag", 'FN' as "footnote_id_list", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
  expect:
    rows:
    - {subgroup: 20-49 years, time_period: 2017-2018, estimate: 14.6, estimate_lci: 12.4, estimate_uci: 17.1, flag: null, _snapshot_id: s1, _raw_sha256: h1}
    - {subgroup: "Male: 20-29 years", time_period: 1999-2000, estimate: 6.2, estimate_lci: 2.2, estimate_uci: 13.0, flag: "*", _snapshot_id: s1, _raw_sha256: h1}
    - {subgroup: "Asian only, non-Hispanic", time_period: 1999-2000, estimate: null, estimate_lci: null, estimate_uci: null, flag: "- - -", _snapshot_id: s1, _raw_sha256: h1}
- name: int_cdc_nhanes_id_prevalence_flags_only_the_total_row_and_explains_each_flag
  model: int_cdc_nhanes_id_prevalence
  given:
  - input: ref('stg_cdc_nhanes_id_prevalence')
    rows:
    - {infection: Herpes simplex virus type 2, population_group: Total, subgroup: 20-49 years, time_period: 2017-2018, estimate: 14.6, flag: null}
    - {infection: Herpes simplex virus type 2, population_group: Sex and age group, subgroup: "Male: 20-29 years", time_period: 1999-2000, estimate: 6.2, flag: "*"}
    - {infection: Herpes simplex virus type 1, population_group: Race and Hispanic origin, subgroup: "Asian only, non-Hispanic", time_period: 1999-2000, estimate: null, flag: "- - -"}
  expect:
    rows:
    - {subgroup: 20-49 years, is_total_row: true, flag_meaning: null}
    - {subgroup: "Male: 20-29 years", is_total_row: false, flag_meaning: "the estimate does not meet NCHS standards of reliability (NCHS footnote NA_NHANES06)"}
    - {subgroup: "Asian only, non-Hispanic", is_total_row: false, flag_meaning: "data are not available (NCHS footnote NA_NHANES07); never a zero"}
- name: fct_cdc_nhanes_id_prevalence_keeps_every_row_and_qualifies_flagged_estimates
  model: fct_cdc_nhanes_id_prevalence
  given:
  - input: ref('int_cdc_nhanes_id_prevalence')
    rows:
    - {infection: Herpes simplex virus type 2, population_group: Total, subgroup: 20-49 years, time_period: 2017-2018, estimate: 14.6, flag: null, flag_meaning: null, is_total_row: true, _snapshot_id: s1, _raw_sha256: h1}
    - {infection: Herpes simplex virus type 2, population_group: Sex and age group, subgroup: "Male: 20-29 years", time_period: 1999-2000, estimate: 6.2, flag: "*", flag_meaning: "the estimate does not meet NCHS standards of reliability (NCHS footnote NA_NHANES06)", is_total_row: false, _snapshot_id: s1, _raw_sha256: h1}
    - {infection: Herpes simplex virus type 1, population_group: Race and Hispanic origin, subgroup: "Asian only, non-Hispanic", time_period: 1999-2000, estimate: null, flag: "- - -", flag_meaning: "data are not available (NCHS footnote NA_NHANES07); never a zero", is_total_row: false, _snapshot_id: s1, _raw_sha256: h1}
    - {infection: Herpes simplex virus type 1, population_group: Sex, subgroup: Female, time_period: 2001-2002, estimate: 60.0, flag: "~", flag_meaning: null, is_total_row: false, _snapshot_id: s1, _raw_sha256: h1}
  expect:
    rows:
    - {subgroup: 20-49 years, estimate: 14.6, estimate_status: published, is_total_row: true}
    - {subgroup: "Male: 20-29 years", estimate: 6.2, estimate_status: "published, flagged: the estimate does not meet NCHS standards of reliability (NCHS footnote NA_NHANES06)", is_total_row: false}
    - {subgroup: "Asian only, non-Hispanic", estimate: null, estimate_status: "not published: data are not available (NCHS footnote NA_NHANES07); never a zero", is_total_row: false}
    - {subgroup: Female, estimate: 60.0, estimate_status: "published, flagged: NCHS wrote '~', a flag its footnotes do not list", is_total_row: false}
