# Hand-written dbt unit test of the generated stg_cdc_nis_teen_coverage typing (staging.typed_select): NA is no
# value and never zero, padded or not; an empty estimate is no value; CDC's interval text comes back under its
# new name exactly as sent, empty or absent alike; a whole sample size written '400.0' is 400. The input is SQL
# so the raw source needn't be loaded first.
version: 2
unit_tests:
- name: stg_cdc_nis_teen_coverage_na_is_no_value_and_the_interval_stays_as_sent
  model: stg_cdc_nis_teen_coverage
  given:
  - input: source('raw', 'cdc_nis_teen_coverage')
    format: sql
    rows: |
      select '≥1 Dose MenACWY' as "vaccine", '' as "dose", 'States/Local Areas' as "geography_type", 'Toy State' as "geography", '2024' as "year_season", 'Age' as "dimension_type", '13-17 Years' as "dimension", '73.2' as "coverage_estimate", '68.1 to 77.7' as "_95_ci", '400.0' as "population_sample_size", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'HPV' as "vaccine", 'Up-to-Date, Males and Females' as "dose", 'States/Local Areas' as "geography_type", 'Toy State' as "geography", '2023' as "year_season", 'Age' as "dimension_type", '13-15 Years' as "dimension", ' NA ' as "coverage_estimate", '' as "_95_ci", '' as "population_sample_size", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
      union all
      select 'HPV' as "vaccine", 'Up-to-Date, Males and Females' as "dose", 'States/Local Areas' as "geography_type", 'Toy State' as "geography", '2022' as "year_season", 'Age' as "dimension_type", '13-17 Years' as "dimension", '' as "coverage_estimate", cast(null as varchar) as "_95_ci", cast(null as varchar) as "population_sample_size", 's1' as "_snapshot_id", 'h1' as "_raw_sha256"
  expect:
    rows:
    - vaccine: "≥1 Dose MenACWY"
      year_season: "2024"
      coverage_estimate: 73.2
      ci_95: "68.1 to 77.7"
      population_sample_size: 400
    - vaccine: HPV
      year_season: "2023"
      coverage_estimate: null
      ci_95: ""
      population_sample_size: null
    - vaccine: HPV
      year_season: "2022"
      coverage_estimate: null
      ci_95: null
      population_sample_size: null
