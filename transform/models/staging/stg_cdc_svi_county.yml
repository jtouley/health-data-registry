# Generated by `make contracts` from contracts/cdc_svi_county.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: stg_cdc_svi_county
  description: One row per US county or county equivalent (50 states and DC), with its SVI 2022 percentile ranks
    and ACS population estimate.
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - staging
  meta:
    contract: contracts/cdc_svi_county.odcs.yaml
    contract_id: cdc_svi_county
    contract_version: 0.1.0
    contract_status: draft
    primary_key: &id001
    - county_fips
  data_tests:
  - one_row_per_key:
      name: stg_cdc_svi_county_one_row_per_county_fips
      arguments:
        columns: *id001
  columns:
  - name: county_fips
    data_type: varchar
    description: 'Five-digit county FIPS code, as text so the leading zero stays: the two-digit state code followed
      by the three-digit county code (documentation: ''To identify a unique county, you must include the state FIPS
      along with the county FIPS''). The key to join a county''s infectious-disease rate.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: STCNTY
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: fips
    data_type: varchar
    description: The file's FIPS column. The data dictionary describes it as the tract-level identifier; in this
      county file it holds the county's five-digit FIPS, the same as county_fips in every row (checked 2026-11-27).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: FIPS
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: state_fips
    data_type: varchar
    description: Two-digit state FIPS code, as text (for example 26 for Michigan).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: ST
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: state_name
    data_type: varchar
    description: State name as published (for example Michigan, District of Columbia).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: STATE
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: state_abbr
    data_type: varchar
    description: Two-letter state postal abbreviation (for example MI).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: ST_ABBR
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: county_name
    data_type: varchar
    description: 'County name with its type as published (for example Wayne County, Orleans Parish, Capitol Planning
      Region). Names repeat across states: use the FIPS code, or the name with its state.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: COUNTY
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: location
    data_type: varchar
    description: The county and state in words, as published (for example 'Autauga County, Alabama').
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: LOCATION
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: acs_population
    data_type: bigint
    description: 'Total population, American Community Survey 2018-2022 five-year estimate (E_TOTPOP). Shown so
      a reader can see how many people a county''s ranks describe. Never a denominator here: rates use the Census
      Bureau''s July 1 estimates (census_county_pop). -999 (not available) is kept as no value, never zero.'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: E_TOTPOP
      unit: persons
      codes: []
      missing_codes:
      - '-999'
    data_tests:
    - not_all_empty:
        name: stg_cdc_svi_county_acs_population_filled
        config:
          severity: warn
  - name: acs_population_moe
    data_type: bigint
    description: 'Margin of error of the ACS population estimate at 90% confidence (M_TOTPOP; documentation: the
      estimate minus and plus the MOE gives the 90% interval). It reads 0 in 3,019 of the 3,144 counties (2026-11-27);
      the documentation does not say why (see openQuestions).'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: M_TOTPOP
      unit: persons
      codes: []
      missing_codes:
      - '-999'
    data_tests:
    - not_all_empty:
        name: stg_cdc_svi_county_acs_population_moe_filled
        config:
          severity: warn
  - name: rank_socioeconomic
    data_type: double
    description: 'Theme 1, socioeconomic status: the county''s percentile rank among all US counties (RPL_THEME1),
      0 to 1, higher is more vulnerable. Built from poverty below 150%, unemployment, housing cost burden, no high
      school diploma and no health insurance. A position, not an amount: never added.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: RPL_THEME1
      unit: percentile rank (0-1)
      codes: []
      missing_codes:
      - '-999'
    data_tests:
    - not_all_empty:
        name: stg_cdc_svi_county_rank_socioeconomic_filled
        config:
          severity: warn
  - name: rank_household_characteristics
    data_type: double
    description: 'Theme 2, household characteristics: percentile rank among all US counties (RPL_THEME2), 0 to 1,
      higher is more vulnerable. Built from age 65 and older, age 17 and younger, disability, single-parent households
      and limited English. A position, not an amount: never added.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: RPL_THEME2
      unit: percentile rank (0-1)
      codes: []
      missing_codes:
      - '-999'
    data_tests:
    - not_all_empty:
        name: stg_cdc_svi_county_rank_household_characteristics_filled
        config:
          severity: warn
  - name: rank_racial_ethnic_minority
    data_type: double
    description: 'Theme 3, racial and ethnic minority status: percentile rank among all US counties (RPL_THEME3),
      0 to 1, higher is more vulnerable. Built from the share of people who are a racial or ethnic minority. A position,
      not an amount: never added.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: RPL_THEME3
      unit: percentile rank (0-1)
      codes: []
      missing_codes:
      - '-999'
    data_tests:
    - not_all_empty:
        name: stg_cdc_svi_county_rank_racial_ethnic_minority_filled
        config:
          severity: warn
  - name: rank_housing_transportation
    data_type: double
    description: 'Theme 4, housing type and transportation: percentile rank among all US counties (RPL_THEME4),
      0 to 1, higher is more vulnerable. Built from multi-unit structures, mobile homes, crowding, no vehicle and
      group quarters. A position, not an amount: never added.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: RPL_THEME4
      unit: percentile rank (0-1)
      codes: []
      missing_codes:
      - '-999'
    data_tests:
    - not_all_empty:
        name: stg_cdc_svi_county_rank_housing_transportation_filled
        config:
          severity: warn
  - name: rank_overall
    data_type: double
    description: 'Overall SVI: the county''s percentile rank among all US counties on the sum of its four theme
      sums (RPL_THEMES), 0 to 1, higher is more vulnerable. The summary rank the publisher names. A position, not
      an amount: never added.'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: RPL_THEMES
      unit: percentile rank (0-1)
      codes: []
      missing_codes:
      - '-999'
    data_tests:
    - not_all_empty:
        name: stg_cdc_svi_county_rank_overall_filled
        config:
          severity: warn
  - name: flags_total
    data_type: bigint
    description: 'How many of the 16 SVI variables put the county at or above the 90th percentile (F_TOTAL; documentation:
      ''the overall flag value ... the number of all variable flags''). 0 to 16; a count of flags, not of people.'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: F_TOTAL
      unit: null
      codes: []
      missing_codes:
      - '-999'
    data_tests:
    - not_all_empty:
        name: stg_cdc_svi_county_flags_total_filled
        config:
          severity: warn
  - name: document_url
    data_type: varchar
    description: 'Added by the adapter, not by CDC: the address of the file this row was read from.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: document_url
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: document_sha256
    data_type: varchar
    description: 'Added by the adapter, not by CDC: the sha256 fingerprint of the file''s raw bytes, as kept in
      the lake''s raw store.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: document_sha256
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: document_retrieved_at
    data_type: timestamp
    description: 'Added by the adapter, not by CDC: when the file was fetched (UTC).'
    meta:
      logical_type: timestamp
      physical_type: TIMESTAMP
      source_field: document_retrieved_at
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
    constraints:
    - type: not_null
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
    constraints:
    - type: not_null
