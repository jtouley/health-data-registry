      codes: []
      missing_codes: []
  - name: reviewer
    data_type: varchar
    description: The maintainer who accepted or rejected the record; empty while it is proposed.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: reviewer
      unit: null
      codes: []
      missing_codes: []
  - name: reviewed_at
    data_type: date
    description: The date the maintainer accepted or rejected the record; empty while it is proposed.
    meta:
      logical_type: date
