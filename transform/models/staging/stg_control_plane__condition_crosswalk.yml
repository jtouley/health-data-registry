# Generated by `make contracts` from contracts/control_plane/condition_crosswalk.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: stg_control_plane__condition_crosswalk
  description: 'One row per crosswalk record: one publisher label, the concept it is mapped to, and the record''s
    review state.'
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - staging
    - control_plane
  meta:
    contract: contracts/control_plane/condition_crosswalk.odcs.yaml
    contract_id: condition_crosswalk
    contract_version: 0.1.0
    contract_status: draft
    primary_key: &id001
    - record_id
  constraints:
  - type: primary_key
    columns: *id001
  data_tests:
  - odcs_check:
      name: stg_control_plane__condition_crosswalk_reviewed_records_name_their_review
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE state IN ('accepted', 'rejected') AND (reviewer IS NULL
          OR reviewed_at IS NULL OR source IS NULL)
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: reviewed_records_name_their_review
          contract: contracts/control_plane/condition_crosswalk.odcs.yaml
          checks: An accepted or rejected record names its reviewer, its date and its source (hard rule 1).
  - odcs_check:
      name: stg_control_plane__condition_crosswalk_proposed_records_have_no_reviewer
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE state = 'proposed' AND (reviewer IS NOT NULL OR reviewed_at
          IS NOT NULL)
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: consistency
          rule: proposed_records_have_no_reviewer
          contract: contracts/control_plane/condition_crosswalk.odcs.yaml
          checks: A proposed record has not been reviewed, so it names no reviewer and no review date.
  - odcs_check:
      name: stg_control_plane__condition_crosswalk_accepted_records_name_a_concept
      arguments:
        measure_sql: SELECT COUNT(*) FROM {object} WHERE state = 'accepted' AND synonym IS NULL AND mesh_id IS NULL
          AND ncbi_taxon_id IS NULL AND gbd_cause IS NULL
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: completeness
          rule: accepted_records_name_a_concept
          contract: contracts/control_plane/condition_crosswalk.odcs.yaml
          checks: An accepted mapping gives at least one concept id or the GBD cause; a synonym record is a way
            of asking, not a concept.
  - odcs_check:
      name: stg_control_plane__condition_crosswalk_state_values
      arguments:
        measure_sql: SELECT count(*) FROM {object} WHERE NOT ("state" IS NULL OR trim(CAST("state" AS VARCHAR))
          = '') AND "state" NOT IN ('proposed', 'accepted', 'rejected')
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: state_values
          contract: contracts/control_plane/condition_crosswalk.odcs.yaml
          checks: A record is proposed, accepted or rejected; nothing else.
  - odcs_check:
      name: stg_control_plane__condition_crosswalk_proposed_by_values
      arguments:
        measure_sql: SELECT count(*) FROM {object} WHERE NOT ("proposed_by" IS NULL OR trim(CAST("proposed_by" AS
          VARCHAR)) = '') AND "proposed_by" NOT IN ('string_match', 'dev_eval_synonym', 'maintainer')
        condition: measured = 0
      config:
        severity: error
        meta:
          dimension: conformity
          rule: proposed_by_values
          contract: contracts/control_plane/condition_crosswalk.odcs.yaml
          checks: Only these writers exist; no model output is ever a record (hard rule 9).
  columns:
  - name: record_id
    data_type: varchar
    description: The control plane's id for this record.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: record_id
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: dataset
    data_type: varchar
    description: The catalogued source whose label this is (a catalog id, for example cdc_nndss_weekly).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: dataset
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: label
    data_type: varchar
    description: The publisher's condition label, exactly as published.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: label
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: state
    data_type: varchar
    description: 'Review state: proposed (nobody has checked it; changes nothing), accepted (a maintainer checked
      it against the named source) or rejected (a maintainer checked it and it is wrong).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: state
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: mesh_id
    data_type: varchar
    description: MeSH descriptor unique id of the concept (for example D007877 for Legionellosis).
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: mesh_id
      unit: null
      codes: []
      missing_codes: []
  - name: ncbi_taxon_id
    data_type: varchar
    description: NCBI Taxonomy id of the organism, for a label that names one (for example 445 for Legionella).
    meta:
      logical_type: string
      physical_type: VARCHAR
