# Generated by `make contracts` from contracts/cdc_nssp_ed_trajectories.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: stg_cdc_nssp_ed_trajectories
  description: 'Wide table: one row per week and place (the United States, a state, or a county carrying its Health
    Service Area''s values), with one column per virus for each measure.'
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - staging
  meta:
    contract: contracts/cdc_nssp_ed_trajectories.odcs.yaml
    contract_id: cdc_nssp_ed_trajectories
    contract_version: 0.1.0
    contract_status: draft
    primary_key: &id001
    - week_end
    - fips
  data_tests:
  - one_row_per_key:
      name: stg_cdc_nssp_ed_trajectories_one_row_per_week_end_fips
      arguments:
        columns: *id001
  columns:
  - name: week_end
    data_type: date
    description: The last day of the week the emergency department visits are counted in (a Saturday; 2022-10-01
      to 2026-11-21 on 2026-11-25).
    meta:
      logical_type: date
      physical_type: DATE
      source_field: week_end
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: geography
    data_type: varchar
    description: The state (or District of Columbia) the row belongs to, or United States for the national row.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: geography
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: county
    data_type: varchar
    description: The county the row is reported for, by name without 'County', such as Wayne, or All on the state
      and national rows. A county row carries its Health Service Area's figures, not the county's own.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: county
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: fips
    data_type: varchar
    description: 'The county''s FIPS code, as CDC publishes it: a number, so leading zeros are dropped (Autauga
      County, Alabama is 1001, not 01001). State rows carry the state code followed by 000 (Michigan is 26000) and
      the national row carries 0. Kept as text exactly as sent; padding to five digits belongs to a later model.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: fips
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: trend_source
    data_type: varchar
    description: 'Which area the row''s figures were computed for: HSA (the county''s Health Service Area), State,
      or United States.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: trend_source
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: hsa
    data_type: varchar
    description: The Health Service Area's name, such as 'Calhoun (Battle Creek), MI - Barry, MI', or All on the
      state and national rows. Every county of one Health Service Area has the same figures.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: hsa
      unit: null
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_hsa_filled
        config:
          severity: warn
  - name: hsa_counties
    data_type: varchar
    description: The counties that make up the Health Service Area, as a comma-separated list such as 'Barry, Calhoun',
      or All on the state and national rows.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: hsa_counties
      unit: null
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_hsa_counties_filled
        config:
          severity: warn
  - name: hsa_nci_id
    data_type: varchar
    description: The Health Service Area's code in the National Cancer Institute's SEER list, such as 381, or All
      on the state and national rows.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: hsa_nci_id
      unit: null
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_hsa_nci_id_filled
        config:
          severity: warn
  - name: percent_visits_combined
    data_type: double
    description: 'Percent of all emergency department visits in the week that were for COVID-19, influenza or RSV
      combined: CDC''s published combined figure. How CDC builds it is in the NSSP Companion Guide, not in the data
      (see openQuestions); it is never computed here by adding the three virus columns. Empty in more rows than
      the single-virus columns (245,165 of 692,881 rows filled on 2026-11-25; see openQuestions).'
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_combined
      unit: '% of all ED visits'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_percent_visits_combined_filled
        config:
          severity: warn
  - name: percent_visits_covid
    data_type: double
    description: Percent of all emergency department visits in the week that were for COVID-19, as observed. Empty
      where CDC has no figure for the area and week.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_covid
      unit: '% of all ED visits'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_percent_visits_covid_filled
        config:
          severity: warn
  - name: percent_visits_influenza
    data_type: double
    description: Percent of all emergency department visits in the week that were for influenza, as observed. Empty
      where CDC has no figure for the area and week.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_influenza
      unit: '% of all ED visits'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_percent_visits_influenza_filled
        config:
          severity: warn
  - name: percent_visits_rsv
    data_type: double
    description: Percent of all emergency department visits in the week that were for RSV, as observed. Empty where
      CDC has no figure for the area and week.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_rsv
      unit: '% of all ED visits'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_percent_visits_rsv_filled
        config:
          severity: warn
  - name: percent_visits_smoothed_combined
    data_type: double
    description: The smoothed percent of emergency department visits for COVID-19, influenza and RSV combined. What
      the smoothing averages over is not in the data (see openQuestions). Published under the field name percent_visits_smoothed;
      CDC's column label is percent_visits_smoothed_combined.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_smoothed
      unit: '% of all ED visits'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_percent_visits_smoothed_combined_filled
        config:
          severity: warn
  - name: percent_visits_smoothed_covid
    data_type: double
    description: The smoothed percent of emergency department visits for COVID-19. What the smoothing averages over
      is not in the data (see openQuestions).
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_smoothed_covid
      unit: '% of all ED visits'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_percent_visits_smoothed_covid_filled
        config:
          severity: warn
  - name: percent_visits_smoothed_influenza
    data_type: double
    description: The smoothed percent of emergency department visits for influenza. What the smoothing averages
      over is not in the data (see openQuestions). Published under the field name percent_visits_smoothed_1; CDC's
      column label is percent_visits_smoothed_influenza.
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_smoothed_1
      unit: '% of all ED visits'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_percent_visits_smoothed_influenza_filled
        config:
          severity: warn
  - name: percent_visits_smoothed_rsv
    data_type: double
    description: The smoothed percent of emergency department visits for RSV. What the smoothing averages over is
      not in the data (see openQuestions).
    meta:
      logical_type: number
      physical_type: DOUBLE
      source_field: percent_visits_smoothed_rsv
      unit: '% of all ED visits'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_percent_visits_smoothed_rsv_filled
        config:
          severity: warn
  - name: ed_trends_covid
    data_type: varchar
    description: 'CDC''s trend for COVID-19 emergency department visits in the week, exactly as written: Increasing,
      Decreasing, No Change, Sparse, Limited Data or Data Unavailable, or empty (see openQuestions). For Health
      Service Area (county) rows, the dataset description says a week is increasing or decreasing when the 95% interval
      of the smoothed slope excludes zero, stable (written No Change) when it includes zero, and sparse when too
      many weeks are 0% to fit a model. How the state and national trends are set is not stated (see openQuestions).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: ed_trends_covid
      unit: null
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nssp_ed_trajectories_ed_trends_covid_filled
        config:
          severity: warn
  - name: ed_trends_influenza
    data_type: varchar
    description: CDC's trend for influenza emergency department visits in the week, exactly as written (same categories
