  - name: ed_covid_level
    data_type: varchar
    description: 'CDC''s activity level for COVID-19 emergency department visits, exactly as written: Very Low,
      Low, Moderate, High, Very High, Limited Data or Data Unavailable. The cut-points are CDC''s and are not in
      the data; they are never worked out here.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: ed_covid_level
      unit: null
