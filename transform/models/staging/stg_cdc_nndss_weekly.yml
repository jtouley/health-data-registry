# Generated by `make contracts` from contracts/cdc_nndss_weekly.odcs.yaml. Do not edit: change the contract and regenerate.
version: 2
models:
- name: stg_cdc_nndss_weekly
  description: One row per reporting area, MMWR year, MMWR week and condition.
  config:
    materialized: table
    contract:
      enforced: true
    tags:
    - staging
  meta:
    contract: contracts/cdc_nndss_weekly.odcs.yaml
    contract_id: cdc_nndss_weekly
    contract_version: 0.1.0
    contract_status: draft
    primary_key: []
  data_tests:
  - dbt_expectations.expect_table_row_count_to_equal_other_table:
      name: cdc_nndss_weekly_rows_raw_to_staging
      arguments:
        compare_model: source('raw', 'cdc_nndss_weekly')
      config:
        severity: error
        meta:
          dimension: consistency
          rule: rows_raw_to_staging
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          check: row_count_matches
          checks: 'Staging has exactly as many rows as the raw load it types: staging drops and adds no row (an
            exact structural fact of the generated staging model).'
  - dbt_expectations.expect_row_values_to_have_recent_data:
      name: cdc_nndss_weekly_load_within_refresh
      arguments:
        column_name: try_strptime(left(_snapshot_id, 16), '%Y%m%dT%H%M%SZ')
        datepart: day
        interval: 7
      config:
        severity: warn
        meta:
          dimension: timeliness
          rule: load_within_refresh
          contract: contracts/cdc_nndss_weekly.odcs.yaml
          check: load_within_sla
          checks: The latest load is no older than the weekly cadence in slaProperties frequency. It times our copy,
            not the publisher's last update, which is not stored yet (see openQuestions); a warning, never a hold.
  columns:
  - name: states
    data_type: varchar
    description: 'Reporting area: the US total, a census division, a state, New York City, a territory, US territories
      combined, or non-US residents. Cases are counted where the patient usually lives. New York excludes New York
      City (structural check against US RESIDENTS, 2024). Upper case through 2024, title case from 2025 (source:
      live data, https://data.cdc.gov/resource/x9gk-5huc.json).'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: states
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: year
    data_type: bigint
    description: MMWR (epidemiological) year of the report.
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: year
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
  - name: week
    data_type: bigint
    description: MMWR week of the report (1-52, or 53 in 53-week years such as 2025).
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: week
      unit: null
      codes: []
      missing_codes: []
    constraints:
    - type: not_null
    data_tests:
    - dbt_expectations.expect_column_values_to_be_between:
        name: cdc_nndss_weekly_week_in_range
        arguments:
          min_value: 1
          max_value: 53
          row_condition: '"week" is not null'
        config:
          severity: error
          meta:
            dimension: conformity
            rule: week_in_range
            contract: contracts/cdc_nndss_weekly.odcs.yaml
            check: values_between
            checks: The codebook gives the MMWR week as 1-52, or 53 in 53-week years (the column description).
  - name: label
    data_type: varchar
    description: 'Notifiable condition as named in the NNDSS tables (for example Legionellosis, Candida auris, clinical;
      Syphilis, Primary and secondary). Case definitions: https://ndc.services.cdc.gov/. Not new cases of disease,
      so a rate per 100,000 people from them is labelled screening detections, not incidence: ''Candida auris, screening''
      counts people found to carry C. auris on screening swabs (colonisation), not new cases of disease in the population.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: label
      unit: null
      codes: []
      missing_codes: []
      not_incidence:
        Candida auris, screening: people found to carry C. auris on screening swabs (colonisation), not new cases
          of disease in the population
    constraints:
    - type: not_null
  - name: m1
    data_type: bigint
    description: 'Cases reported for this condition and area in this MMWR week (publisher column ''Current week'').
      Empty only where the flag column m1_flag holds a code; a count flagged ''-'' (no reported cases) means not
      reported (maintainer''s declaration, see noCasesCode): it has no number and is never counted as 0.'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m1
      unit: '1'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_m1_filled
        config:
          severity: warn
  - name: m1_flag
    data_type: varchar
    description: 'Why the current-week count is empty. Codes from the dataset notes: ''-'' no reported cases; U
      unavailable; N not reportable in the jurisdiction; NN not nationally notifiable; NP nationally notifiable
      but not published; NC not calculated. From 2025 the flag is empty when a count is present; through 2024 rows
      with a count also carry ''-'', so a flag explains only an empty count. Kept as published, never turned into
      an empty value. Codes (publisher''s codebook): - = no reported cases; U = unavailable; N = not reportable
      in this jurisdiction; NN = not nationally notifiable; NP = nationally notifiable but not published; NC = not
      calculated.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m1_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_m1_flag_filled
        config:
          severity: warn
    - accepted_values:
        name: stg_cdc_nndss_weekly_m1_flag_codes
        arguments:
          values:
          - '-'
          - U
          - N
          - NN
          - NP
          - NC
        config:
          severity: warn
          where: nullif(trim(m1_flag), '') is not null
  - name: m2
    data_type: bigint
    description: 'Highest weekly count in the previous 52 weeks for this condition and area, counting only weeks
      when the condition was reportable there (publisher footnote). A maximum: never add it up.'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m2
      unit: '1'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_m2_filled
        config:
          severity: warn
  - name: m2_flag
    data_type: varchar
    description: 'Why the previous 52-week maximum (m2) is empty: the publisher''s flag code. Codes (publisher''s
      codebook): - = no reported cases; U = unavailable; N = not reportable in this jurisdiction; NN = not nationally
      notifiable; NP = nationally notifiable but not published; NC = not calculated.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m2_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_m2_flag_filled
        config:
          severity: warn
    - accepted_values:
        name: stg_cdc_nndss_weekly_m2_flag_codes
        arguments:
          values:
          - '-'
          - U
          - N
          - NN
          - NP
          - NC
        config:
          severity: warn
          where: nullif(trim(m2_flag), '') is not null
  - name: m3
    data_type: bigint
    description: 'Cumulative cases so far in this MMWR year up to and including this week (year to date). Cumulative:
      take the latest week, never sum across weeks. Can be incomplete if the condition was reportable for only part
      of the year (publisher footnote). Empty only where the flag column m3_flag holds a code; a count flagged ''-''
      (no reported cases) means not reported (maintainer''s declaration, see noCasesCode): it has no number and
      is never counted as 0.'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m3
      unit: '1'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_m3_filled
        config:
          severity: warn
  - name: m3_flag
    data_type: varchar
    description: 'Why the current-year year-to-date count (m3) is empty: the publisher''s flag code. Codes (publisher''s
      codebook): - = no reported cases; U = unavailable; N = not reportable in this jurisdiction; NN = not nationally
      notifiable; NP = nationally notifiable but not published; NC = not calculated.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m3_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_m3_flag_filled
        config:
          severity: warn
    - accepted_values:
        name: stg_cdc_nndss_weekly_m3_flag_codes
        arguments:
          values:
          - '-'
          - U
          - N
          - NN
          - NP
          - NC
        config:
          severity: warn
          where: nullif(trim(m3_flag), '') is not null
  - name: m4
    data_type: bigint
    description: 'Cumulative cases in the previous MMWR year up to the same week, as published in this week''s table.
      The codebook doesn''t say whether it counts the same thing as that year''s own year-to-date (m3); for some
      conditions the two differ widely (see openQuestions), so it is shown beside m3, never in its place. Empty
      only where the flag column m4_flag holds a code; a count flagged ''-'' (no reported cases) means not reported
      (maintainer''s declaration, see noCasesCode): it has no number and is never counted as 0.'
    meta:
      logical_type: integer
      physical_type: BIGINT
      source_field: m4
      unit: '1'
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_m4_filled
        config:
          severity: warn
  - name: m4_flag
    data_type: varchar
    description: 'Why the previous-year year-to-date count (m4) is empty: the publisher''s flag code. Codes (publisher''s
      codebook): - = no reported cases; U = unavailable; N = not reportable in this jurisdiction; NN = not nationally
      notifiable; NP = nationally notifiable but not published; NC = not calculated.'
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: m4_flag
      unit: null
      codes:
      - '-'
      - U
      - N
      - NN
      - NP
      - NC
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_m4_flag_filled
        config:
          severity: warn
    - accepted_values:
        name: stg_cdc_nndss_weekly_m4_flag_codes
        arguments:
          values:
          - '-'
          - U
          - N
          - NN
          - NP
          - NC
        config:
          severity: warn
          where: nullif(trim(m4_flag), '') is not null
  - name: location1
    data_type: varchar
    description: Name of a single jurisdiction (state, DC, New York City or territory); empty on summary rows.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: location1
      unit: null
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_location1_filled
        config:
          severity: warn
  - name: location2
    data_type: varchar
    description: Name of a summary area (TOTAL, US RESIDENTS, US TERRITORIES, NON-US RESIDENTS or a census division);
      empty on single-jurisdiction rows.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: location2
      unit: null
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_location2_filled
        config:
          severity: warn
  - name: sort_order
    data_type: varchar
    description: Publisher's row order key (year, week and area position); used only to keep the published table
      order.
    meta:
      logical_type: string
      physical_type: VARCHAR
      source_field: sort_order
      unit: null
      codes: []
      missing_codes: []
    data_tests:
    - not_all_empty:
        name: stg_cdc_nndss_weekly_sort_order_filled
        config:
          severity: warn
  - name: _snapshot_id
    data_type: varchar
    description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the source
      address, retrieval time and dataset version that go with every answer built on this row.
    constraints:
    - type: not_null
  - name: _raw_sha256
    data_type: varchar
    description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
      the exact bytes the publisher sent.'
    constraints:
    - type: not_null
