  - name: census_county_pop
    description: 'Raw records of County and state resident population estimates, July 1, 2020-2025 (Census Vintage
      2025, CO-EST2025-ALLDATA) as the adapter hands them on, every value as text: the publisher''s own fields,
      or for a wide table the adapter''s structural reshaping of them (see the staging model). Only the full load
      the dataset''s LATEST pointer names is read.'
    meta:
      raw_contract_version: 0.1.0
      contract: contracts/census_county_pop.odcs.yaml
      load: snapshot
      load_key: []
      updated_field: null
      plugin: hdr_raw
      source_fields:
      - COUNTY
      - CTYNAME
      - DIVISION
      - POPESTIMATE
      - REGION
      - STATE
      - STNAME
      - SUMLEV
      - YEAR
    columns:
    - name: COUNTY
      data_type: varchar
      description: Publisher field COUNTY, as text; read into county_fips (Three-digit county FIPS code within the
        state, as text; 000 on state rows.)
    - name: CTYNAME
      data_type: varchar
      description: Publisher field CTYNAME, as text; read into county_name (County name with its type (for example
        Wayne County, Orleans Parish, Capitol Planning Region); on state rows it repeats the state name. County
        names repeat across states, so use it only together with the state.)
    - name: DIVISION
      data_type: varchar
      description: Publisher field DIVISION, as text; read into division (Census division code, 1 New England to
        9 Pacific (publisher key).)
    - name: POPESTIMATE
      data_type: varchar
      description: 'Publisher field POPESTIMATE, as text; read into population (Estimated resident population on
        July 1 of the year (publisher column POPESTIMATE<year>), in persons. A count: add counties within a state
        or states within the nation, but never a state row to its own counties.)'
    - name: REGION
      data_type: varchar
      description: 'Publisher field REGION, as text; read into region (Census region code: 1 Northeast, 2 Midwest,
        3 South, 4 West (publisher key).)'
    - name: STATE
      data_type: varchar
      description: Publisher field STATE, as text; read into state_fips (Two-digit state FIPS code, as text (for
        example 26 for Michigan).)
    - name: STNAME
      data_type: varchar
      description: Publisher field STNAME, as text; read into state_name (State name as the Census Bureau writes
        it (for example Michigan, District of Columbia).)
    - name: SUMLEV
      data_type: varchar
      description: 'Publisher field SUMLEV, as text; read into sumlev (Geographic level of the row: 040 a state
        (or DC), 050 a county or county equivalent (publisher''s SUMLEV key). Kept as text so the leading zero stays.)'
    - name: YEAR
      data_type: varchar
      description: Publisher field YEAR, as text; read into year (Reference year of the estimate (population on
        July 1 of this year). Taken from the column name POPESTIMATE<year> by the structural pivot; 2020 to 2025.)
