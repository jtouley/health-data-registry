        published beside its state''s own row and never added to it (how they overlap is open question ''Places'');
        ''United States''; or ''U.S. Median'', a median as CDC labels it, never a national estimate (what it is
        a median over is open question ''National row''). No territory was published on 2026-11-25.)'
    - name: geography_type
      data_type: varchar
      description: 'Publisher field geography_type, as text; read into geography_type (The kind of place: ''National''
        (the United States row and the U.S. Median row) or ''States'' (each state, DC, and the cities or parts of
