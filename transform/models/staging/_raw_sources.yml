# Generated by `make contracts` from contracts/. Do not edit: change the contract and regenerate.
version: 2
sources:
- name: raw
  description: Parsed publisher records in the lake (raw_records/<id>/<snapshot id>.ndjson), resolved to the dataset's
    LATEST full load by the dbt_raw plugin (profiles.yml).
  schema: raw
  tables:
  - name: cdc_haicviz_cdi
    description: 'Raw records of HAICViz - CDI as the adapter hands them on, every value as text: the publisher''s
      own fields, or for a wide table the adapter''s structural reshaping of them (see the staging model). Only
      the full load the dataset''s LATEST pointer names is read.'
    meta:
      raw_contract_version: 0.1.0
      contract: contracts/cdc_haicviz_cdi.odcs.yaml
      load: snapshot
      load_key: []
      updated_field: null
      plugin: hdr_raw
      source_fields:
      - grouping
      - series
      - topic
      - value
      - viewby
      - yearname
    columns:
    - name: grouping
      data_type: varchar
      description: Publisher field grouping, as text; read into grouping (All cases, or split by epidemiologic class
        into healthcare-associated (HA) and community-associated (CA) cases. Spelling varies ('Epi Class' / 'Epi
        class').)
    - name: series
      data_type: varchar
      description: 'Publisher field series, as text; read into series (The specific stratum, prefixed by epi class
        where split: e.g. Total, Healthcare-associated, Community-associated, ''All cases - 65+ years'', ''HA -
        Female'', ''CA - 027'' (ribotype).)'
    - name: topic
      data_type: varchar
      description: 'Publisher field topic, as text; read into topic (What the value measures: number of CDI cases,
        case rate per 100,000 population, or strain type (ribotype). Spelling varies by year (''Number of Cases''
        to 2021, ''Number of cases'' in 2022).)'
    - name: value
      data_type: varchar
      description: 'Publisher field value, as text; read into value (The published number: a case count when topic
        is number of cases, cases per 100,000 population when topic is case rates, unconfirmed for strain type.)'
    - name: viewby
      data_type: varchar
      description: 'Publisher field viewby, as text; read into viewby (Which breakdown the row belongs to: Total,
        Age, Sex, Race or Ribotype. Each view covers the same cases.)'
    - name: yearname
      data_type: varchar
      description: Publisher field yearname, as text; read into yearname (Surveillance year (2011-2022 in the data
        on 2026-11-24).)
    - name: _snapshot_id
      data_type: varchar
      description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the
        source address, retrieval time and dataset version that go with every answer built on this row.
    - name: _raw_sha256
      data_type: varchar
      description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
        the exact bytes the publisher sent.'
  - name: cdc_haicviz_isa
    description: 'Raw records of HAICViz - iSA as the adapter hands them on, every value as text: the publisher''s
      own fields, or for a wide table the adapter''s structural reshaping of them (see the staging model). Only
      the full load the dataset''s LATEST pointer names is read.'
    meta:
      raw_contract_version: 0.1.0
      contract: contracts/cdc_haicviz_isa.odcs.yaml
      load: snapshot
      load_key: []
      updated_field: null
      plugin: hdr_raw
      source_fields:
      - series
      - topic
      - value
      - viewby
      - yearname
    columns:
    - name: series
      data_type: varchar
      description: 'Publisher field series, as text; read into series (The group the figure is for: All cases, an
        age group (such as 50-64 years), a sex, a race, an epidemiologic class (Hospital-onset, Healthcare-associated
        community-onset, Community-associated), Dialysis, a syndrome, or a PFGE strain type (USA 100, USA 300, Other).)'
    - name: topic
      data_type: varchar
      description: 'Publisher field topic, as text; read into topic (What the figure measures: Case rates or Death
        rates, Syndromes (share of cases by syndrome), or a PFGE type topic (share of cases by strain type, for
        all cases or one epidemiologic class).)'
    - name: value
      data_type: varchar
      description: 'Publisher field value, as text; read into value (The published figure for the row''s topic and
        group: a rate for Case rates and Death rates, or a share of cases (values between 0 and 1 on 2026-11-25;
        unit not stated) for Syndromes and the PFGE topics. Empty in 27 rows on 2026-11-25 (the 1-year age group
        in 2018, 2020 and 2021, and every PFGE row in 2020 and 2021), and an empty one is never read as zero.)'
    - name: viewby
      data_type: varchar
      description: 'Publisher field viewby, as text; read into viewby (Which breakdown the row belongs to: All cases,
        Age, Sex, Race, Epi class, Dialysis, Syndromes, or the PFGE topic again. Each view covers the same cases
        again.)'
    - name: yearname
      data_type: varchar
      description: Publisher field yearname, as text; read into yearname (Surveillance year (2005 to 2021 on 2026-11-25).)
    - name: _snapshot_id
      data_type: varchar
      description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the
        source address, retrieval time and dataset version that go with every answer built on this row.
    - name: _raw_sha256
      data_type: varchar
      description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
        the exact bytes the publisher sent.'
  - name: cdc_haicviz_mugsi
    description: 'Raw records of HAICViz - MuGSI as the adapter hands them on, every value as text: the publisher''s
      own fields, or for a wide table the adapter''s structural reshaping of them (see the staging model). Only
      the full load the dataset''s LATEST pointer names is read.'
    meta:
      raw_contract_version: 0.1.0
      contract: contracts/cdc_haicviz_mugsi.odcs.yaml
      load: snapshot
      load_key: []
      updated_field: null
      plugin: hdr_raw
      source_fields:
      - organism
      - series
      - topic
      - value
      - viewby
      - yearname
    columns:
    - name: organism
      data_type: varchar
      description: 'Publisher field organism, as text; read into organism (The organism, as CDC abbreviates it:
        CRE (carbapenem-resistant Enterobacterales) or CRAB (carbapenem-resistant Acinetobacter baumannii).)'
    - name: series
      data_type: varchar
      description: 'Publisher field series, as text; read into series (The group the rate is for: All cases, an
        age group (such as 65-79 years), Female or Male, a culture source (Blood, Urine, Other site or Other sterile
        site), or a species inside CRE (such as Klebsiella pneumoniae).)'
    - name: topic
      data_type: varchar
      description: 'Publisher field topic, as text; read into topic (What the figure measures: Case Rates (new cases
        per population) or Death Rates (deaths among people with the infection, per population).)'
    - name: value
      data_type: varchar
      description: Publisher field value, as text; read into value (The published rate for the row's organism, topic
        and group, as CDC gives it (cases or deaths per 100,000 population on CDC's MuGSI page; the table itself
        states no unit). Every row had one on 2026-11-25, and an empty one is never read as zero.)
    - name: viewby
      data_type: varchar
      description: 'Publisher field viewby, as text; read into viewby (Which breakdown the row belongs to: All cases,
        Age, Sex, Culture source (blood, urine or another site), or Organism (the species inside CRE). Each view
        covers the same cases again.)'
    - name: yearname
      data_type: varchar
      description: Publisher field yearname, as text; read into yearname (Surveillance year (2012 to 2022 on 2026-11-25).)
    - name: _snapshot_id
      data_type: varchar
      description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the
        source address, retrieval time and dataset version that go with every answer built on this row.
    - name: _raw_sha256
      data_type: varchar
      description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
        the exact bytes the publisher sent.'
  - name: cdc_heptracker
    description: 'Raw records of HepTracker Dashboard as the adapter hands them on, every value as text: the publisher''s
      own fields, or for a wide table the adapter''s structural reshaping of them (see the staging model). Only
      the full load the dataset''s LATEST pointer names is read.'
    meta:
      raw_contract_version: 0.1.0
      contract: contracts/cdc_heptracker.odcs.yaml
      load: snapshot
      load_key: []
      updated_field: null
      plugin: hdr_raw
      source_fields:
      - character
      - count
      - event
      - rate
      - type
      - value
      - year
    columns:
    - name: character
      data_type: varchar
      description: 'Publisher field character, as text; read into grouping (The grouping category (Character): Area
        (nationwide Total or a state), AgeGroups, Sex, SexAgeGroups, RaceEth, HHS region, or a risk exposure such
        as Injection Drug Use, MSM or Household Contact.)'
    - name: count
      data_type: varchar
      description: Publisher field count, as text; read into reported_count (Number of cases or deaths as CDC published
        it, its digit grouping removed (1,232 reads as 1232). Empty where CDC wrote a code instead (see count_flag),
        and never a zero.); count_flag (CDC's code where it published no count, as written (surrounding spaces trimmed);
        empty beside a published count. Any text in the Count field that isn't a plain number is kept here, so a
        new code is reported, never lost.)
    - name: event
      data_type: varchar
      description: 'Publisher field event, as text; read into condition (The viral hepatitis condition as CDC names
        it (Viral Hepatitis Condition): Hepatitis A, Acute, Chronic or Perinatal Hepatitis B or C for cases; Hepatitis
        A, Hepatitis B or Hepatitis C for deaths.)'
    - name: rate
      data_type: varchar
      description: 'Publisher field rate, as text; read into rate (Cases or deaths per 100,000 population as CDC
        published it (Rate: ''Rates calculated per 100,000 population''). Empty where CDC wrote a code instead (see
        rate_flag) or gave no rate (risk groups, sex-and-age groups, perinatal infection), and never a zero.); rate_flag
        (CDC''s code where it published no rate, as written (surrounding spaces trimmed); empty beside a published
        rate or where the publisher sent no rate at all. Any text in the Rate field that isn''t a plain number is
        kept here, so a new code is reported, never lost.)'
    - name: type
      data_type: varchar
      description: 'Publisher field type, as text; read into case_or_death (Case (reported to NNDSS) or Death (from
        NVSS death certificates) (Type: ''Indicates Whether Case Surveillance or Death Data'').)'
    - name: value
      data_type: varchar
      description: 'Publisher field value, as text; read into stratum (The value of the grouping (Value): for Area,
        Total (nationwide) or a state or DC; an age group in years; Female or Male; a race and ethnicity group;
        an HHS region number (1 to 10); or Yes, No or Missing/Unknown for a risk exposure.)'
    - name: year
      data_type: varchar
      description: Publisher field year, as text; read into year (Year (2011 to 2023 on 2026-11-25; perinatal hepatitis
        C from 2018).)
    - name: _snapshot_id
      data_type: varchar
      description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the
        source address, retrieval time and dataset version that go with every answer built on this row.
    - name: _raw_sha256
      data_type: varchar
      description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
        the exact bytes the publisher sent.'
  - name: cdc_nhanes_id_prevalence
    description: 'Raw records of DQS NHANES Select Infectious Diseases Prevalence Estimates as the adapter hands
      them on, every value as text: the publisher''s own fields, or for a wide table the adapter''s structural reshaping
      of them (see the staging model). Only the full load the dataset''s LATEST pointer names is read.'
    meta:
      raw_contract_version: 0.1.0
      contract: contracts/cdc_nhanes_id_prevalence.odcs.yaml
      load: snapshot
      load_key: []
      updated_field: null
      plugin: hdr_raw
      source_fields:
      - classification
      - estimate
      - estimate_lci
      - estimate_type
      - estimate_uci
      - flag
      - footnote_id_list
      - group
      - nesting_label
      - standard_error
      - subgroup
      - taxonomy
      - time_period
      - topic
    columns:
    - name: classification
      data_type: varchar
      description: 'Publisher field classification, as text; read into classification (The kind of breakdown (CLASSIFICATION):
        Total, Demographic Characteristic, or Multiple Characteristics (sex and age together).)'
    - name: estimate
      data_type: varchar
      description: Publisher field estimate, as text; read into estimate (Crude percent of the group with antibody
        to the virus (ESTIMATE), as NCHS published it. Empty where NCHS flags the estimate as not available (- -
        -), never a zero.)
    - name: estimate_lci
      data_type: varchar
      description: Publisher field estimate_lci, as text; read into estimate_lci (Lower bound of the 95% confidence
        interval for the estimate (ESTIMATE_LCI), in percent; empty where the estimate is.)
    - name: estimate_type
      data_type: varchar
      description: 'Publisher field estimate_type, as text; read into estimate_type (The kind of estimate (ESTIMATE_TYPE):
        Percent of population, crude. Part of the key, so a second kind of estimate for the same cell (an age-adjusted
        percent, say) is its own row, reported by estimates_are_crude_percents, never a repeated key.)'
    - name: estimate_uci
      data_type: varchar
      description: Publisher field estimate_uci, as text; read into estimate_uci (Upper bound of the 95% confidence
        interval for the estimate (ESTIMATE_UCI), in percent; empty where the estimate is.)
    - name: flag
      data_type: varchar
      description: Publisher field flag, as text; read into flag (NCHS's flag on the estimate (FLAG), exactly as
        published; empty when the estimate carries none.)
    - name: footnote_id_list
      data_type: varchar
      description: Publisher field footnote_id_list, as text; read into footnote_id_list (The ids of NCHS's footnotes
        for the row, comma-separated (FOOTNOTE_ID_LIST), each defined in https://data.cdc.gov/d/iqm3-hbev.)
    - name: group
      data_type: varchar
      description: 'Publisher field group, as text; read into population_group (The population grouping (GROUP):
        Total, Age group, Sex, Race and Hispanic origin, or Sex and age group.)'
    - name: nesting_label
      data_type: varchar
      description: 'Publisher field nesting_label, as text; read into nesting_label (Sex the subgroup is nested
        in, for the sex-and-age rows only (NESTING_LABEL: Female or Male); empty elsewhere.)'
    - name: standard_error
      data_type: varchar
      description: Publisher field standard_error, as text; read into standard_error (Standard error of the estimate
        (STANDARD_ERROR), in percentage points; empty where the estimate is.)
    - name: subgroup
      data_type: varchar
      description: 'Publisher field subgroup, as text; read into subgroup (The subgroup within the grouping (SUBGROUP):
        20-49 years for Total, an age band, Female or Male, a race and Hispanic origin group, or a sex and age band
        such as Female: 20-29 years.)'
    - name: taxonomy
      data_type: varchar
      description: 'Publisher field taxonomy, as text; read into taxonomy (NCHS''s subject area for the row: Infectious
        diseases (TAXONOMY).)'
    - name: time_period
      data_type: varchar
      description: Publisher field time_period, as text; read into time_period (The two-year NHANES survey cycle
        the estimate is for (TIME_PERIOD), from 1999-2000 to 2017-2018.)
    - name: topic
      data_type: varchar
      description: 'Publisher field topic, as text; read into infection (The infection the antibody is to: Herpes
        simplex virus type 1 or Herpes simplex virus type 2 (TOPIC).)'
    - name: _snapshot_id
      data_type: varchar
      description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the
        source address, retrieval time and dataset version that go with every answer built on this row.
    - name: _raw_sha256
      data_type: varchar
      description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
        the exact bytes the publisher sent.'
  - name: cdc_nhsn_ar_hai
    description: 'Raw records of National Healthcare Safety Network - Antimicrobial Resistance (2011-2025) as the
      adapter hands them on, every value as text: the publisher''s own fields, or for a wide table the adapter''s
      structural reshaping of them (see the staging model). Only the full load the dataset''s LATEST pointer names
      is read.'
    meta:
      raw_contract_version: 0.1.0
      contract: contracts/cdc_nhsn_ar_hai.odcs.yaml
      load: snapshot
      load_key: []
      updated_field: null
      plugin: hdr_raw
      source_fields:
      - age_category
      - display_tested
      - event_type
      - facility
      - geography
      - hospital_size
      - isolates_tested
      - location
      - lower_confidence_interval
      - percent_resistant
      - phenotype
      - procedure
      - resistant_isolates
      - sex
      - source
      - suppressed
      - teaching_hospital
      - upper_confidence_interval
      - year
    columns:
    - name: age_category
      data_type: varchar
      description: Publisher field age_category, as text; read into age_category (Adults (18 and over) or pediatrics
        (under 18), by age at the infection date (CLABSI, CAUTI) or the procedure date (SSI); or all ages.)
    - name: display_tested
      data_type: varchar
      description: Publisher field display_tested, as text; read into display_tested (Publisher's indicator of whether
        data are sufficient to display; empty in every row observed.)
    - name: event_type
      data_type: varchar
      description: 'Publisher field event_type, as text; read into event_type (Type of healthcare-associated infection
        the isolate came from: central line-associated bloodstream infection (CLABSI), catheter-associated urinary
        tract infection (CAUTI), surgical site infection (SSI), or all three combined.)'
    - name: facility
      data_type: varchar
      description: 'Publisher field facility, as text; read into facility (Facility type: acute care hospital, inpatient
        rehabilitation facility or long-term acute care hospital; or all.)'
    - name: geography
      data_type: varchar
      description: Publisher field geography, as text; read into geography (United States, one of the nine census
        divisions, or a state (50 states, DC and Puerto Rico). Small territories are not shown as states but are
        in national figures; Puerto Rico is excluded from regions (column description).)
    - name: hospital_size
      data_type: varchar
      description: Publisher field hospital_size, as text; read into hospital_size (Large (200 or more beds) or
        small (under 200 beds) facility; only for general acute care hospitals; or all.)
    - name: isolates_tested
      data_type: varchar
      description: Publisher field isolates_tested, as text; read into isolates_tested (Number of isolates tested
        for susceptibility to the antimicrobial, as reported to NHSN (column description).)
    - name: location
      data_type: varchar
      description: 'Publisher field location, as text; read into location (Hospital unit type: ICU, neonatal ICU,
        oncology unit or other unit (ward, step-down, mixed acuity); or all units.)'
    - name: lower_confidence_interval
      data_type: varchar
      description: Publisher field lower_confidence_interval, as text; read into lower_confidence_interval (Lower
        bound of the 95% mid-P exact confidence interval around percent resistant; only when percent resistant is
        calculated (column descriptions for geography and this field).)
    - name: percent_resistant
      data_type: varchar
      description: 'Publisher field percent_resistant, as text; read into percent_resistant (Percent of tested isolates
        that were resistant: resistant / tested x 100; calculated only when at least 20 isolates were tested (column
        description).)'
    - name: phenotype
      data_type: varchar
      description: 'Publisher field phenotype, as text; read into phenotype (Organism and resistance pattern, e.g.
        methicillin-resistant Staphylococcus aureus or carbapenem-resistant Enterobacterales. Definitions: https://arpsp.cdc.gov/resources/AR_PhenotypeDefinitions_NOV2026.pdf.)'
    - name: procedure
      data_type: varchar
      description: Publisher field procedure, as text; read into procedure (NHSN inpatient surgical procedure type
        (SSI only), or all procedures.)
    - name: resistant_isolates
      data_type: varchar
      description: Publisher field resistant_isolates, as text; read into resistant_isolates (Number of tested isolates
        that were resistant (for some phenotypes, non-susceptible); shown only when at least 20 isolates were tested
        (column description).)
    - name: sex
      data_type: varchar
      description: Publisher field sex, as text; read into sex (Patient sex (male or female) or both sexes combined.)
    - name: source
      data_type: varchar
      description: 'Publisher field source, as text; read into source (Geographic level of the row: national, region
        (census division) or state.)'
    - name: suppressed
      data_type: varchar
      description: Publisher field suppressed, as text; read into suppressed (Publisher's suppression indicator
        ('If data should be suppressed or not'). Observed values are false or empty; rows where it is empty carry
        no counts.)
    - name: teaching_hospital
      data_type: varchar
      description: Publisher field teaching_hospital, as text; read into teaching_hospital (Whether the hospital
        trains medical students and residents; only available for general acute care hospitals; or all.)
    - name: upper_confidence_interval
      data_type: varchar
      description: Publisher field upper_confidence_interval, as text; read into upper_confidence_interval (Upper
        bound of the 95% mid-P exact confidence interval around percent resistant.)
    - name: year
      data_type: varchar
      description: Publisher field year, as text; read into year (Calendar year for which number resistant, number
        tested and pooled percent resistant are calculated (column description, https://data.cdc.gov/api/views/7wz3-n6um.json).)
    - name: _snapshot_id
      data_type: varchar
      description: The lake snapshot this row was read from (the dataset's LATEST load). Its manifest gives the
        source address, retrieval time and dataset version that go with every answer built on this row.
    - name: _raw_sha256
      data_type: varchar
      description: 'The sha256 fingerprint of each raw file the row was parsed from, space-separated in fetch order:
        the exact bytes the publisher sent.'
  - name: cdc_nndss_weekly
    description: 'Raw records of NNDSS Weekly Data as the adapter hands them on, every value as text: the publisher''s
      own fields, or for a wide table the adapter''s structural reshaping of them (see the staging model). Only
      the full load the dataset''s LATEST pointer names is read.'
    meta:
      raw_contract_version: 0.1.1
      contract: contracts/cdc_nndss_weekly.odcs.yaml
      load: snapshot
      load_key: []
      updated_field: null
      plugin: hdr_raw
      source_fields:
      - label
      - location1
      - location2
      - m1
      - m1_flag
      - m2
      - m2_flag
      - m3
      - m3_flag
      - m4
      - m4_flag
      - sort_order
      - states
      - week
      - year
    columns:
    - name: label
      data_type: varchar
      description: 'Publisher field label, as text; read into label (Notifiable condition as named in the NNDSS
        tables (for example Legionellosis, Candida auris, clinical; Syphilis, Primary and secondary). Case definitions:
        https://ndc.services.cdc.gov/.)'
    - name: location1
      data_type: varchar
      description: Publisher field location1, as text; read into location1 (Name of a single jurisdiction (state,
        DC, New York City or territory); empty on summary rows.)
    - name: location2
      data_type: varchar
      description: Publisher field location2, as text; read into location2 (Name of a summary area (TOTAL, US RESIDENTS,
        US TERRITORIES, NON-US RESIDENTS or a census division); empty on single-jurisdiction rows.)
    - name: m1
      data_type: varchar
      description: 'Publisher field m1, as text; read into m1 (Cases reported for this condition and area in this
        MMWR week (publisher column ''Current week''). Empty only where the flag column m1_flag holds a code; a
        count flagged ''-'' (no reported cases) means not reported (maintainer''s declaration, see noCasesCode):
        it has no number and is never counted as 0.)'
    - name: m1_flag
      data_type: varchar
      description: 'Publisher field m1_flag, as text; read into m1_flag (Why the current-week count is empty. Codes
        from the dataset notes: ''-'' no reported cases; U unavailable; N not reportable in the jurisdiction; NN
        not nationally notifiable; NP nationally notifiable but not published; NC not calculated. From 2025 the
        flag is empty when a count is present; through 2024 rows with a count also carry ''-'', so a flag explains
        only an empty count. Kept as published, never turned into an empty value.)'
    - name: m2
      data_type: varchar
      description: 'Publisher field m2, as text; read into m2 (Highest weekly count in the previous 52 weeks for
        this condition and area, counting only weeks when the condition was reportable there (publisher footnote).
        A maximum: never add it up.)'
    - name: m2_flag
      data_type: varchar
      description: 'Publisher field m2_flag, as text; read into m2_flag (Why the previous 52-week maximum (m2) is
        empty: the publisher''s flag code.)'
    - name: m3
      data_type: varchar
      description: 'Publisher field m3, as text; read into m3 (Cumulative cases so far in this MMWR year up to and
        including this week (year to date). Cumulative: take the latest week, never sum across weeks. Can be incomplete
        if the condition was reportable for only part of the year (publisher footnote). Empty only where the flag
        column m3_flag holds a code; a count flagged ''-'' (no reported cases) means not reported (maintainer''s
        declaration, see noCasesCode): it has no number and is never counted as 0.)'
    - name: m3_flag
      data_type: varchar
      description: 'Publisher field m3_flag, as text; read into m3_flag (Why the current-year year-to-date count
        (m3) is empty: the publisher''s flag code.)'
    - name: m4
      data_type: varchar
      description: 'Publisher field m4, as text; read into m4 (Cumulative cases in the previous MMWR year up to
        the same week, as published in this week''s table. The codebook doesn''t say whether it counts the same
        thing as that year''s own year-to-date (m3); for some conditions the two differ widely (see openQuestions),
        so it is shown beside m3, never in its place. Empty only where the flag column m4_flag holds a code; a count
        flagged ''-'' (no reported cases) means not reported (maintainer''s declaration, see noCasesCode): it has
        no number and is never counted as 0.)'
    - name: m4_flag
      data_type: varchar
      description: 'Publisher field m4_flag, as text; read into m4_flag (Why the previous-year year-to-date count
        (m4) is empty: the publisher''s flag code.)'
    - name: sort_order
      data_type: varchar
      description: Publisher field sort_order, as text; read into sort_order (Publisher's row order key (year, week
        and area position); used only to keep the published table order.)
    - name: states
      data_type: varchar
      description: 'Publisher field states, as text; read into states (Reporting area: the US total, a census division,
