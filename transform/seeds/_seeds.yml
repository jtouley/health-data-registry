version: 2

# Small reference code lists from standards bodies, not data snapshots (hard rule 5). Owner decisions never
# live here. A seed changes only through a reviewed PR that cites its source.
seeds:
  - name: fips_states
    description: >-
      US states, the District of Columbia and the territories with their two-digit FIPS state code and postal
      abbreviation, as listed by the Census Bureau.
    meta:
      source: https://www.census.gov/library/reference/code-lists/ansi.html
      review_status: draft
    config:
      column_types: {state_fips: varchar, usps: varchar, state_name: varchar}
    columns:
      - name: state_fips
        description: Two-digit FIPS state code, kept as text so the leading zero stays.
        data_tests: [unique, not_null]
      - name: usps
        description: Two-letter postal abbreviation.
        data_tests: [unique, not_null]
      - name: state_name
        description: The state or territory's name as the Census Bureau writes it.
        data_tests: [unique, not_null]

  - name: mmwr_calendar
    description: >-
      MMWR weeks, generated by `make contracts` from CDC's rule: weeks run Sunday to Saturday, and week 1 is the
      first week with at least four days in the calendar year, so some years have 53 weeks.
    meta:
      source: "unresolved: a maintainer cites CDC's page defining the MMWR week on review"
      generated_by: src/health_data_registry/transform_gen.py
    config:
      column_types: {mmwr_year: integer, mmwr_week: integer, week_start: date, week_end: date}
    columns:
      - name: mmwr_year
        description: MMWR (epidemiological) year.
        data_tests: [not_null]
      - name: mmwr_week
        description: MMWR week within the year, 1 to 52 or 53.
        data_tests: [not_null]
      - name: week_start
        description: The Sunday the week starts.
        data_tests: [unique, not_null]
      - name: week_end
        description: The Saturday the week ends.
        data_tests: [unique, not_null]
