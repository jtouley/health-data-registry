# Install once: `make hooks` (uv run pre-commit install). Run on everything: `uv run pre-commit run --all-files`.
# Every commit goes through these hooks; `--no-verify` is never used.
# No Black: ruff-format is Black-compatible, and running both would make them fight over formatting.
# Sealed blind-question sets stay byte-for-byte as sealed (their hash is checked).
exclude: ^eval/sealed/
# Plain `pre-commit install` then sets up both hook types, the same as `make hooks`.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored Bitol schemas stay byte for byte as published (product.py checks their sha256).
      - id: trailing-whitespace
        exclude: ^src/health_data_registry/schemas/
      - id: end-of-file-fixer
        exclude: ^src/health_data_registry/schemas/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files # data belongs in the Hugging Face dataset, not git
        args: [--maxkb=500]
      - id: detect-private-key

  # Same version as uv.lock, so the hook, `make lint` and CI agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Workflow lint, with shellcheck on every `run:` block (catches SC2015 and friends before CI does). Both
      # tools come from the locked dev environment: actionlint-py and shellcheck-py are pinned by version and
      # sha256 in uv.lock, so nothing is downloaded outside the lockfile. `uv run` puts the environment's
      # shellcheck on PATH, wherever uv keeps it (a worktree, Windows, UV_PROJECT_ENVIRONMENT).
      - id: actionlint
        name: actionlint (uv run, pinned in uv.lock)
        entry: uv run --frozen actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      # actionlint silently skips its shell checks when it cannot find shellcheck, so this hook fails instead.
      - id: shellcheck-present
        name: shellcheck available for actionlint (uv sync installs it)
        entry: uv run --frozen shellcheck --version
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      # Runs in the project's locked environment (uv.lock) with the strict settings in pyproject.toml.
      - id: mypy
        name: mypy (strict, uv run)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # The pre-PR gate at push time (scripts/pre_push_gate.py): a push to a PR branch (feat/, fix/, ci/, docs/,
      # transform/) needs a completed, all-green CI run for that exact commit on pre-pr/**; a push to pre-pr/**
      # runs ruff, mypy and the changed modules' tests first. Fast feedback only: the PR-branch ruleset on GitHub
      # is the rule that counts.
      - id: pre-push-gate
        name: pre-PR gate (green pre-pr commit before a PR branch; fast checks before pre-pr/)
        entry: uv run --frozen python scripts/pre_push_gate.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      # Data belongs in the lake or the Hugging Face dataset, never in git.
      - id: forbid-data-files
        name: forbid lake/, mutants/, sitemaps/, *.parquet, *.duckdb, *.xml.gz
        entry: data files and generated output must not be committed (lake/, mutants/, sitemaps/, *.parquet, *.duckdb, *.xml.gz)
        language: fail
        files: (^|/)(lake|mutants|sitemaps)/|\.(parquet|duckdb|xml\.gz)$
