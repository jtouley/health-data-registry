dataset: detroit_dhd_epi_annual
version: 0.1.0
dimensions:
  - {name: condition, column: worksheet, type: categorical, description: "The condition, by the code of the dashboard's yearly chart: TByear = tuberculosis; ChlamydiaYear = chlamydia; HepCyear = hepatitis C (acute, chronic or both is not stated); SyphilisPSyear = primary and secondary syphilis; SyphilisLyear = late syphilis; SyphilisCyear = congenital syphilis. Each is a different condition, so their counts are never added together."}
  - {name: place, column: location_label, type: categorical, description: "Detroit or Michigan, as the chart's legend names them ('Detroit Case Rate', 'Michigan Case Rate'). Michigan's figures include Detroit's, so the two are never added together."}
  - {name: year, column: year, type: time, description: "The calendar year (January to December) the chart's x-axis places the cases in, as the dashboard labels it; not an MMWR year. Whether a case is placed by its report, diagnosis or onset date is not stated."}
measures:
  - {name: cases, column: cases, kind: count, unit: "cases", description: "Cases counted in the year."}
  - {name: case_rate, column: rate, kind: rate, unit: "as published (denominator unconfirmed)", description: "The case rate the dashboard plots."}
metrics:
  - name: annual_cases
    description: "Cases of one condition in a year for one place; Detroit and Michigan are never added together (Michigan includes Detroit), and conditions are never added together. A year whose count the dashboard shows suppressed has no total."
    measure: cases
    aggregation: sum
    exclude_total_rows: false
    filters: []
    # Each answer row holds one place and one condition (a filter to one value, or grouped by it); the compiler
    # refuses a sum across places (Detroit is inside Michigan) or across conditions.
    single_value_of: [place, condition]
  - name: annual_case_rate
    description: "The dashboard's case rate for one place and year, read as published and never added up."
    measure: case_rate
    aggregation: none
    exclude_total_rows: false
    filters: []
series:
  - {condition: TByear, label: "Tuberculosis cases (Detroit Health Department)", metric: annual_cases, measure: cases, filters: {condition: TByear}, location_dimension: place, time_dimension: year}
  - {condition: TByear, label: "Tuberculosis case rate (Detroit Health Department)", metric: annual_case_rate, measure: rate, filters: {condition: TByear}, location_dimension: place, time_dimension: year}
  - {condition: ChlamydiaYear, label: "Chlamydia cases (Detroit Health Department)", metric: annual_cases, measure: cases, filters: {condition: ChlamydiaYear}, location_dimension: place, time_dimension: year}
  - {condition: ChlamydiaYear, label: "Chlamydia case rate (Detroit Health Department)", metric: annual_case_rate, measure: rate, filters: {condition: ChlamydiaYear}, location_dimension: place, time_dimension: year}
  - {condition: HepCyear, label: "Hepatitis C cases (Detroit Health Department)", metric: annual_cases, measure: cases, filters: {condition: HepCyear}, location_dimension: place, time_dimension: year}
  - {condition: HepCyear, label: "Hepatitis C case rate (Detroit Health Department)", metric: annual_case_rate, measure: rate, filters: {condition: HepCyear}, location_dimension: place, time_dimension: year}
  - {condition: SyphilisPSyear, label: "Primary and secondary syphilis cases (Detroit Health Department)", metric: annual_cases, measure: cases, filters: {condition: SyphilisPSyear}, location_dimension: place, time_dimension: year}
  - {condition: SyphilisPSyear, label: "Primary and secondary syphilis case rate (Detroit Health Department)", metric: annual_case_rate, measure: rate, filters: {condition: SyphilisPSyear}, location_dimension: place, time_dimension: year}
  - {condition: SyphilisLyear, label: "Late syphilis cases (Detroit Health Department)", metric: annual_cases, measure: cases, filters: {condition: SyphilisLyear}, location_dimension: place, time_dimension: year}
  - {condition: SyphilisLyear, label: "Late syphilis case rate (Detroit Health Department)", metric: annual_case_rate, measure: rate, filters: {condition: SyphilisLyear}, location_dimension: place, time_dimension: year}
  - {condition: SyphilisCyear, label: "Congenital syphilis cases (Detroit Health Department)", metric: annual_cases, measure: cases, filters: {condition: SyphilisCyear}, location_dimension: place, time_dimension: year}
  - {condition: SyphilisCyear, label: "Congenital syphilis case rate (Detroit Health Department)", metric: annual_case_rate, measure: rate, filters: {condition: SyphilisCyear}, location_dimension: place, time_dimension: year}
