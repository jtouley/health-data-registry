dataset: cdc_lyme_county
# 0.1.0: first draft. Every row is one group of cases (no total rows), so counts add up across counties, states,
# case status, sex and age group. Nothing here is a rate: rates are computed by get_rate with the Census denominator.
version: 0.1.0
dimensions:
  - {name: year, column: year, type: time, non_additive: false, description: "Reporting year."}
  - {name: state, column: state, type: categorical, non_additive: false, description: "State of residence (postal code), or Suppressed or Unknown."}
  - {name: county_fips, column: fips, type: categorical, non_additive: false, description: "County of residence (five-digit FIPS), or Suppressed or Unknown."}
  - {name: case_status, column: case_status, type: categorical, non_additive: false, description: "Confirmed or Probable; separate cases, so they add up to all reported cases."}
  - {name: sex, column: sex, type: categorical, non_additive: false, description: "Female, Male, Unknown or Suppressed."}
  - {name: age_group, column: age_cat_yrs, type: categorical, non_additive: false, description: "0-19 or 20+ years, Unknown or Suppressed."}
measures:
  - {name: lyme_cases, column: frequency, kind: count, unit: "cases", description: "Lyme disease cases reported to NNDSS, as counted by CDC."}
metrics:
  - name: lyme_cases_all
    description: "Lyme disease cases, confirmed and probable, added across the rows asked for (counties, sexes and age groups)."
    measure: lyme_cases
    aggregation: sum
    exclude_total_rows: true
    filters: []
  - name: lyme_cases_confirmed
    description: "Confirmed Lyme disease cases only, added across the rows asked for."
    measure: lyme_cases
    aggregation: sum
    exclude_total_rows: true
    filters: ["case_status = 'Confirmed'"]
series:
  - condition: "Lyme disease"
    label: "Lyme disease cases, confirmed and probable (2022 onward case definition)"
    metric: lyme_cases_all
    measure: cases
    location_dimension: state
    time_dimension: year
    case_status: "confirmed and probable, added"
    case_definition: "CSTE Lyme disease surveillance case definition in force from 2022 (high-incidence states report on laboratory evidence alone); not comparable with 2021 or earlier"
  - condition: "Lyme disease"
    label: "Lyme disease cases, confirmed only (2022 onward case definition)"
    metric: lyme_cases_confirmed
    measure: cases
    location_dimension: state
    time_dimension: year
    case_status: "confirmed"
    case_definition: "CSTE Lyme disease surveillance case definition in force from 2022 (high-incidence states report on laboratory evidence alone); not comparable with 2021 or earlier"
  - condition: "Lyme disease"
    label: "Lyme disease cases, confirmed and probable, all reported cases in the United States (2022 onward case definition)"
    metric: lyme_cases_all
    measure: cases
    place_coverage: "United States: every reported case, including those whose state or county CDC suppressed or did not know"
    time_dimension: year
    case_status: "confirmed and probable, added"
    case_definition: "CSTE Lyme disease surveillance case definition in force from 2022 (high-incidence states report on laboratory evidence alone); not comparable with 2021 or earlier"
