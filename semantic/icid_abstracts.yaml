dataset: icid_abstracts
version: 0.1.0
dimensions:
- name: doi
  column: doi
  type: categorical
  description: The abstract's DOI.
- name: year
  column: year
  type: time
  description: Conference year.
- name: abstract_tier
  column: abstract_tier
  type: categorical
  description: Whether the abstract's text may be public, private or only linked.
- name: condition
  column: condition_tags
  type: categorical
  description: Conditions named, by our word rules.
- name: design
  column: design_tags
  type: categorical
  description: Study designs named, by our word rules.
- name: data_source
  column: data_source_tags
  type: categorical
  description: Kinds of data named, by our word rules.
- name: geography
  column: geography_tags
  type: categorical
  description: Countries and regions named, by our word rules.
measures: []
metrics: []
series: []
