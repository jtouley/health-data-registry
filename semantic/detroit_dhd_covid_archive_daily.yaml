dataset: detroit_dhd_covid_archive_daily
version: 0.1.0
dimensions:
  - {name: case_status, column: case_status, type: categorical, description: "The case status label on the daily bars ('Confirmed'); empty on the 7-day average line."}
  - {name: disease_date, column: disease_date, type: time, description: "The day the dashboard places the cases on (its disease date)."}
measures:
  - {name: cases, column: cases, kind: count, unit: "cases", description: "COVID-19 cases in Detroit on the day; empty where the dashboard shows '<16'."}
metrics:
  - name: daily_covid19_cases
    description: "COVID-19 cases in Detroit, added up over the days asked for; a period with any day shown as '<16' has no total."
    measure: cases
    aggregation: sum
    exclude_total_rows: false
    # The daily bars only: the chart's 7-day average rows have no case status and are never added.
    filters: ["case_status = 'Confirmed'"]
series:
  - condition: covid19
    label: "COVID-19 cases in Detroit by disease date (Detroit Health Department, archived dashboard)"
    metric: daily_covid19_cases
    measure: cases
    place_coverage: "City of Detroit (as the Detroit Health Department reports it)"
    time_dimension: disease_date
