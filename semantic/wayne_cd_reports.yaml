dataset: wayne_cd_reports
version: 0.1.0
# period_kind, year and first_year are set by the report column: reported_cases is read at one report and one
# column (single_value_of), so these take one value in any sum and are declared additive (non_additive: false);
# report and period_column, whose values overlap, carry non_additive: true.
dimensions:
  - {name: report, column: report_url, type: categorical, non_additive: true, non_additive_reason: "reports overlap: the same quarter is printed in several reports", description: "The report the count is printed in (its link). Reports overlap, so one report is read at a time."}
  - {name: period_column, column: period_label, type: categorical, non_additive: true, non_additive_reason: "a report's columns overlap: quarters, the year to date, the year and the multi-year total count the same cases", description: "The report column as printed, e.g. 'Q2_2026', 'YTD 2026', '2024', '2021- 2025 Total'."}
  - {name: period_kind, column: period_kind, type: categorical, non_additive: false, description: "What the column counts: one quarter, the year to date through the report's quarter, a calendar year, a multi-year total, or the multi-year average."}
  - {name: year, column: calendar_year, type: time, non_additive: false, description: "The one calendar year a quarter, year-to-date or year column counts. Multi-year totals and averages have none, so a year filter never returns them."}
  - {name: first_year, column: period_year, type: categorical, non_additive: false, description: "The first year a column covers: its own year, or 2021 for a 2021-2025 total or average."}
  - {name: disease_group, column: disease_group, type: categorical, non_additive: false, description: "The report's disease group, e.g. Foodborne, STI, Vaccine Preventable."}
  - {name: disease, column: disease, type: categorical, non_additive: false, description: "The condition as printed in the report."}
measures:
  - {name: cases, column: cases, kind: count, unit: "cases", description: "Confirmed and probable cases reported to MDSS in the column's period, for the area the report states; empty where the report prints '*' (1 to 5 cases)."}
  - {name: average_cases, column: average, kind: estimate, unit: "cases per year", description: "The 5-year report's own average cases per year, as printed; never added up."}
metrics:
  - name: reported_cases
    description: "Cases in one report column, for the area that report states, added across diseases only. The compiler requires one report and one column, so overlapping reports and columns are never added; a disease printed '*' leaves its group with no total. The multi-year average column holds averages, not counts, so it is never read here (see multi_year_average_cases)."
    measure: cases
    aggregation: sum
    exclude_total_rows: true
    single_value_of: [report, period_column]
    filters: ["period_kind <> 'multi_year_average'"]
  - name: multi_year_average_cases
    description: "The 5-year report's printed average cases per year for one disease; read as printed, never added."
    measure: average_cases
    aggregation: none
    exclude_total_rows: false
    filters: ["period_kind = 'multi_year_average'"]
    uncertainty: none
    # Structural: the contract has no interval column for the average.
    uncertainty_reason: "The 5-year report prints the average with no range."
