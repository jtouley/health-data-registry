dataset: cdc_nndss_weekly
version: 0.1.0
dimensions:
  - {name: reporting_area, column: states, type: categorical, description: "State, New York City, territory, census division or US summary area where the cases were reported (by residence)."}
  - {name: mmwr_year, column: year, type: time, description: "MMWR (epidemiological) year."}
  - {name: mmwr_week, column: week, type: time, description: "MMWR week within the year (1-52 or 53)."}
  - {name: condition, column: label, type: categorical, description: "Nationally notifiable condition, e.g. Legionellosis or Candida auris, clinical."}
measures:
  - {name: cases_this_week, column: m1, kind: count, unit: "cases", description: "Cases reported in the MMWR week."}
  - {name: max_weekly_cases_prior_52_weeks, column: m2, kind: count, unit: "cases", description: "Highest weekly count in the previous 52 weeks; a maximum, not addable."}
  - {name: cases_year_to_date, column: m3, kind: count, unit: "cases", description: "Cumulative cases in the MMWR year up to the week."}
  - {name: cases_prior_year_to_date, column: m4, kind: count, unit: "cases", description: "Cumulative cases in the previous MMWR year up to the same week."}
metrics:
  - name: weekly_cases
    description: "Number of cases of a notifiable condition reported in a given week, added across the chosen places and weeks."
    measure: cases_this_week
    aggregation: sum
    exclude_total_rows: true
    filters: []
  - name: year_to_date_cases
    description: "Cases so far this year as of one MMWR week (filter to a single week, normally the latest; added across places only)."
    measure: cases_year_to_date
    aggregation: sum
    exclude_total_rows: true
    filters: []
  - name: prior_year_to_date_cases
    description: "Cases in the previous year up to the same week, as revised in the current week's table (filter to a single week)."
    measure: cases_prior_year_to_date
    aggregation: sum
    exclude_total_rows: true
    filters: []
  - name: us_resident_year_to_date_cases
    description: "National year-to-date cases among US residents, read from the published US RESIDENTS row (excludes territories and non-US residents)."
    measure: cases_year_to_date
    aggregation: sum
    exclude_total_rows: false
    filters: ["upper(states) IN ('US RESIDENTS', 'U.S. RESIDENTS')"]
  - name: annual_cases
    description: "Cases in an MMWR year: the year-to-date count at the year's last published week, replaced by next year's restated prior-year count once that table reaches week 52. Weekly counts are not added up because late reports are added to the running total, not to the week."
    measure: cases_year_to_date
    aggregation: cumulative_latest
    order_by: mmwr_week
    restated_by: {measure: cases_prior_year_to_date, complete_at: 52}
    exclude_total_rows: true
    filters: []
  - name: us_resident_annual_cases
    description: "Annual cases among US residents from the published US RESIDENTS row, read the same way as annual_cases."
    measure: cases_year_to_date
    aggregation: cumulative_latest
    order_by: mmwr_week
    restated_by: {measure: cases_prior_year_to_date, complete_at: 52}
    exclude_total_rows: false
    filters: ["upper(states) IN ('US RESIDENTS', 'U.S. RESIDENTS')"]
  - name: us_resident_weekly_cases
    description: "Cases among US residents reported in a given week, read from the published US RESIDENTS row and added across weeks."
    measure: cases_this_week
    aggregation: sum
    exclude_total_rows: false
    filters: ["upper(states) IN ('US RESIDENTS', 'U.S. RESIDENTS')"]
  - name: max_weekly_cases_prior_52_weeks
    description: "Highest weekly case count in the previous 52 weeks for one place and condition, as published; never added up."
    measure: max_weekly_cases_prior_52_weeks
    aggregation: none
    exclude_total_rows: false
    filters: []
series:
  - condition: "Candida auris, clinical"
    label: "C. auris (clinical cases)"
    metric: annual_cases
    measure: cases
    filters: {condition: "Candida auris, clinical"}
    location_dimension: reporting_area
    time_dimension: mmwr_year
    case_status: "as published (NNDSS does not split confirmed and probable here)"
  - condition: "Candida auris, clinical"
    label: "C. auris (clinical cases)"
    metric: us_resident_annual_cases
    measure: cases
    filters: {condition: "Candida auris, clinical"}
    location_dimension: reporting_area
    time_dimension: mmwr_year
    case_status: "as published (NNDSS does not split confirmed and probable here)"
  - condition: "Candida auris, screening"
    label: "C. auris (screening, colonisation)"
    metric: annual_cases
    measure: cases
    filters: {condition: "Candida auris, screening"}
    location_dimension: reporting_area
