dataset: cdc_nis_teen_coverage
version: 0.1.0
# Every metric reads one published survey estimate (aggregation none): nothing is added up.
# The pooled 2018-2022 estimates overlap the single survey years, so the period is non-additive too.
dimensions:
  - {name: vaccine, column: vaccine, type: categorical, non_additive: true, non_additive_reason: "each is a different vaccine, and coverage percentages are never added", description: "The vaccine, as CDC names it; some names carry the dose (e.g. '≥1 Dose MenACWY')."}
  - {name: dose, column: dose, type: categorical, non_additive: true, non_additive_reason: "dose levels overlap (teens with 3 doses also have 1), and up to date is a different measure", description: "Dose or definition counted, e.g. '≥1 Dose Tdap' or 'Up-to-Date, Males and Females'; empty when the vaccine name carries it."}
  - {name: place_type, column: geography_type, type: categorical, non_additive: true, non_additive_reason: "national and regional estimates include the states", description: "HHS Regions/National or States/Local Areas."}
  - {name: place, column: geography, type: categorical, non_additive: true, non_additive_reason: "the United States and HHS regions include the states, and cities and counties sit inside their states", description: "United States, HHS region, state, territory or selected local area (e.g. IL-City of Chicago)."}
  - {name: survey_year, column: year_season, type: time, non_additive: true, non_additive_reason: "the pooled five-year estimates (2018-2022) include the single survey years beside them", description: "Survey year, or pooled survey years such as 2018-2022."}
  - {name: group_type, column: dimension_type, type: categorical, non_additive: true, non_additive_reason: "each kind of group splits the same teens a different way", description: "What the population group is defined by: age, overall, insurance, poverty, race and ethnicity, or urbanicity."}
  - {name: group, column: dimension, type: categorical, non_additive: true, non_additive_reason: "groups overlap, e.g. 13-17 years contains 13-15 years, and percentages are never added", description: "The population group, e.g. 13-17 Years (all teens surveyed), 13-15 Years, Any Medicaid."}
measures:
  - {name: coverage, column: coverage_estimate, kind: percent, unit: "%", description: "Estimated percent of teens vaccinated (survey estimate)."}
metrics:
  - name: vaccination_coverage
    description: "Estimated percent of teens aged 13-17 vaccinated, for one vaccine and dose, place, survey year and population group. CDC's 95% confidence interval is in ci_95, as published. Pin the group; percentages are never added."
    measure: coverage
    aggregation: none
    exclude_total_rows: false
    filters: []
    # CDC's interval is one text field ('60.3 to 68.3'), kept as sent in ci_95. Splitting it changes the value, so
    # it waits for a staging extension (#172); then this names lower and upper bounds.
    uncertainty: none
    uncertainty_reason: "CDC publishes the 95% confidence interval as one text field (for example '60.3 to 68.3'), kept exactly as sent in the ci_95 column. It is not split into lower and upper numbers yet, so it isn't shown here: ask query_sql for ci_95 beside the estimate, or see describe_dataset."
# Single-year series read the '13-17 Years' age row, the survey's whole age range (open question overall_row).
series:
  - condition: "HPV"
    label: "HPV vaccination up to date, teens 13-17 (both sexes)"
    metric: vaccination_coverage
    measure: percent
    filters: {vaccine: "HPV", dose: "Up-to-Date, Males and Females", group_type: "Age", group: "13-17 Years"}
    location_dimension: place
    time_dimension: survey_year
  - condition: "HPV"
    label: "HPV vaccination, at least one dose, teens 13-17 (both sexes)"
    metric: vaccination_coverage
    measure: percent
    filters: {vaccine: "HPV", dose: "≥1 Dose, Males and Females", group_type: "Age", group: "13-17 Years"}
    location_dimension: place
    time_dimension: survey_year
  - condition: "≥1 Dose MenACWY"
    label: "MenACWY, at least one dose, teens 13-17"
    metric: vaccination_coverage
    measure: percent
    filters: {vaccine: "≥1 Dose MenACWY", group_type: "Age", group: "13-17 Years"}
    location_dimension: place
    time_dimension: survey_year
  - condition: "Tetanus"
    label: "Tdap, at least one dose, teens 13-17"
    metric: vaccination_coverage
    measure: percent
    filters: {vaccine: "Tetanus", dose: "≥1 Dose Tdap", group_type: "Age", group: "13-17 Years"}
    location_dimension: place
    time_dimension: survey_year
  - condition: "Varicella"
    label: "Varicella, two doses or history of disease, teens 13-17"
    metric: vaccination_coverage
    measure: percent
    filters: {vaccine: "Varicella", dose: "≥2 Doses or history of disease", group_type: "Age", group: "13-17 Years"}
    location_dimension: place
    time_dimension: survey_year
  - condition: "≥2 Doses MMR"
    label: "MMR, at least two doses, teens 13-17"
    metric: vaccination_coverage
    measure: percent
    filters: {vaccine: "≥2 Doses MMR", group_type: "Age", group: "13-17 Years"}
    location_dimension: place
    time_dimension: survey_year
# Any vaccine label: the same metric and age row as the named series, the vaccine pinned to the asked label.
# Doses are not pinned, so each dose is its own row; nothing is added across them.
generic_series:
  - metric: vaccination_coverage
    measure: percent
    filters: {group_type: "Age", group: "13-17 Years"}
    location_dimension: place
    time_dimension: survey_year
