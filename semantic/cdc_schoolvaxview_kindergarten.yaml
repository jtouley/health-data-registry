dataset: cdc_schoolvaxview_kindergarten
version: 0.1.0
# Every metric reads one published percent or count (aggregation none): nothing is added up. School years are
# separate periods (non_additive: false); each other dimension says why it can't be added.
dimensions:
  - {name: vaccine, column: vaccine, type: categorical, non_additive: true, non_additive_reason: "each is a different vaccine, or exemptions, and percentages are never added", description: "The vaccine, or Exemption for exemption rows."}
  - {name: dose, column: dose, type: categorical, non_additive: true, non_additive_reason: "dose levels overlap, and any exemption includes medical and non-medical exemptions", description: "Varicella dose, exemption type (Any, Medical, Non-Medical), or MMR (PAC) on MMR (PAC) rows; empty for MMR, DTaP, polio and hepatitis B."}
  - {name: place_type, column: geography_type, type: categorical, non_additive: true, non_additive_reason: "the national rows sit beside the states", description: "National or States."}
  - {name: place, column: geography, type: categorical, non_additive: true, non_additive_reason: "United States and the U.S. median sit beside the states, a median is never added, and cities that report separately (NY-City of New York, NY-Rest of state, TX-City of Houston) sit beside their states", description: "State, DC, a city or part of a state that reports separately, United States, or U.S. Median."}
  - {name: school_year, column: year_season, type: time, non_additive: false, description: "School year, e.g. 2024-25."}
measures:
  - {name: percent_of_kindergartners, column: coverage_estimate, kind: percent, unit: "%", description: "Percent of enrolled kindergartners with the vaccine, or with the exemption."}
  - {name: exemptions, column: number_of_exemptions, kind: count, unit: "exemptions", description: "Number of vaccine exemptions among kindergartners, as CDC labels it (exemption rows only)."}
metrics:
  - name: kindergarten_coverage
    description: "Percent of kindergartners vaccinated, for one vaccine and dose, place and school year, as the state reported it to CDC."
    measure: percent_of_kindergartners
    aggregation: none
    exclude_total_rows: false
    filters: ["vaccine <> 'Exemption'"]
    uncertainty: none
    # Structural: the contract has no interval column; whether CDC publishes one elsewhere is an open question there.
    uncertainty_reason: "CDC publishes no confidence interval for kindergarten coverage; many states count every child, and for states that survey a sample the sampling error is not published here."
  - name: exemption_percent
    description: "Percent of kindergartners with an exemption of one type (any, medical, non-medical), for one place and school year, as the state reported it to CDC."
    measure: percent_of_kindergartners
    aggregation: none
    exclude_total_rows: false
    filters: ["vaccine = 'Exemption'"]
    uncertainty: none
    uncertainty_reason: "CDC publishes no confidence interval for exemption percentages."
  - name: exemptions_reported
    description: "Number of kindergarten exemptions of one type the state reported for a school year, as published; never added across types, states or years."
    measure: exemptions
    aggregation: none
    exclude_total_rows: false
    filters: ["vaccine = 'Exemption'"]
series:
  - condition: "MMR"
    label: "Kindergarten MMR coverage"
    metric: kindergarten_coverage
    measure: percent
    filters: {vaccine: "MMR"}
    location_dimension: place
    time_dimension: school_year
  - condition: "DTP, DTaP, or DT"
    label: "Kindergarten DTaP coverage"
    metric: kindergarten_coverage
    measure: percent
    filters: {vaccine: "DTP, DTaP, or DT"}
    location_dimension: place
    time_dimension: school_year
  - condition: "Varicella"
    label: "Kindergarten varicella coverage, two doses (or disease history)"
    metric: kindergarten_coverage
    measure: percent
    filters: {vaccine: "Varicella", dose: "2 Doses (or disease history)"}
    location_dimension: place
    time_dimension: school_year
  - condition: "Exemption"
    label: "Kindergartners with any exemption"
    metric: exemption_percent
    measure: percent
    filters: {vaccine: "Exemption", dose: "Any Exemption"}
    location_dimension: place
    time_dimension: school_year
  - condition: "Exemption"
    label: "Kindergartners with a non-medical exemption"
    metric: exemption_percent
    measure: percent
    filters: {vaccine: "Exemption", dose: "Non-Medical Exemption"}
    location_dimension: place
    time_dimension: school_year
# Any vaccine label: kindergarten coverage, the vaccine pinned to the asked label; each dose is its own row.
# Exemption rows read through their named series (exemption_percent): kindergarten_coverage excludes them.
generic_series:
  - metric: kindergarten_coverage
    measure: percent
    location_dimension: place
    time_dimension: school_year
