dataset: mdhhs_measles_county
version: 0.1.0
dimensions:
  - {name: county, column: county, type: categorical, description: "Michigan county the cases are assigned to."}
  - {name: case_indicator, column: case_indicator, type: categorical, description: "The map's key: outbreak-associated, other reported, or no reported cases."}
measures:
  - {name: measles_cases, column: total_cases, kind: count, unit: "cases", description: "Measles cases reported in the county."}
  - {name: outbreak_measles_cases, column: outbreak_cases, kind: count, unit: "cases", description: "Outbreak-associated measles cases in the county (a subset of the reported cases)."}
metrics:
  - name: measles_cases_reported
    description: "Measles cases MDHHS reports, added up over the counties asked for."
    measure: measles_cases
    aggregation: sum
    exclude_total_rows: false
    filters: []
  - name: outbreak_measles_cases_reported
    description: "Outbreak-associated measles cases MDHHS reports, added up over the counties asked for; never added to measles_cases_reported."
    measure: outbreak_measles_cases
    aggregation: sum
    exclude_total_rows: false
    filters: []
# No series yet: the dashboard's data carry no period, so there is no time dimension (see openQuestions).
series: []
